<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Update Password - Gentle Acct Store</title>


<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
  crossorigin
>


<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  background:#f5f8fc;

  color:#071f40;

  font-family:'Poppins',sans-serif;
}


/* =========================
   HEADER
========================= */

header{
  height:68px;

  background:white;

  border-bottom:1px solid #e4e9f0;
}

.nav{
  width:100%;
  max-width:1100px;

  height:100%;

  margin:auto;

  padding:0 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;

  gap:9px;

  text-decoration:none;

  color:#071f40;

  font-size:16px;

  font-weight:800;
}

.logo-box{
  width:37px;
  height:37px;

  border-radius:11px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#0b2d5c;

  color:white;

  font-size:17px;

  font-weight:800;
}

.logo span{
  color:#0b2d5c;
}

.back{
  display:flex;
  align-items:center;

  gap:7px;

  padding:8px 12px;

  border-radius:9px;

  background:#edf3fa;

  color:#0b2d5c;

  text-decoration:none;

  font-size:11px;

  font-weight:700;
}


/* =========================
   PAGE
========================= */

.page{
  min-height:calc(100vh - 68px);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px 15px 45px;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:430px;

  background:white;

  border:1px solid #e2e8f0;

  border-radius:22px;

  padding:31px 21px;

  box-shadow:
    0 15px 40px rgba(7,31,64,.08);
}


/* =========================
   TITLE
========================= */

.title{
  text-align:center;
}

.icon{
  width:58px;
  height:58px;

  margin:0 auto 16px;

  border-radius:17px;

  background:#edf3fa;

  color:#0b2d5c;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
}

.title h1{
  color:#071f40;

  font-size:24px;

  line-height:1.25;
}

.title p{
  color:#778196;

  font-size:12px;

  line-height:1.6;

  margin-top:8px;
}


/* =========================
   FORM
========================= */

form{
  margin-top:25px;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;

  color:#243650;

  font-size:11px;

  font-weight:700;

  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;

  left:13px;
  top:50%;

  transform:translateY(-50%);

  color:#8491a3;

  font-size:13px;
}

input{
  width:100%;

  height:49px;

  border:1px solid #dce3ed;

  border-radius:11px;

  outline:none;

  padding:0 42px 0 39px;

  background:#fbfcfe;

  color:#172033;

  font-family:'Poppins',sans-serif;

  font-size:12px;
}

input:focus{
  border-color:#0b2d5c;

  background:white;

  box-shadow:
    0 0 0 3px rgba(11,45,92,.07);
}

input::placeholder{
  color:#9aa4b3;
}


/* =========================
   SHOW PASSWORD
========================= */

.password-toggle{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  border:none;

  background:transparent;

  color:#7f8b9c;

  cursor:pointer;

  font-size:13px;
}


/* =========================
   PASSWORD RULE
========================= */

.password-rules{
  margin-top:6px;

  color:#8a95a6;

  font-size:9px;
}


/* =========================
   BUTTON
========================= */

.update-btn{
  width:100%;

  height:49px;

  margin-top:4px;

  border:none;

  border-radius:11px;

  background:#0b2d5c;

  color:white;

  font-family:'Poppins',sans-serif;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 9px 20px rgba(11,45,92,.16);
}

.update-btn:active{
  transform:scale(.98);
}

.update-btn:disabled{
  opacity:.65;

  cursor:not-allowed;
}


/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:11px;

  font-size:10px;

  line-height:1.6;

  text-align:center;
}

.message.success{
  display:block;

  background:#eaf8f0;

  border:1px solid #ccebd9;

  color:#168447;
}

.message.error{
  display:block;

  background:#fff0f0;

  border:1px solid #ffd5d5;

  color:#c62828;
}


/* =========================
   LOGIN LINK
========================= */

.back-login{
  display:block;

  text-align:center;

  margin-top:20px;

  color:#0b2d5c;

  text-decoration:none;

  font-size:11px;

  font-weight:700;
}


/* =========================
   SECURITY NOTE
========================= */

.note{
  display:flex;

  align-items:flex-start;

  gap:8px;

  margin-top:21px;

  padding:12px;

  border-radius:11px;

  background:#f5f8fc;

  border:1px solid #e2e8f0;

  color:#7b8595;

  font-size:9px;

  line-height:1.6;
}

.note i{
  color:#0b2d5c;

  margin-top:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:450px){

  .logo{
    font-size:14px;
  }

  .logo-box{
    width:35px;
    height:35px;
  }

  .card{
    padding:29px 18px;
  }

  .title h1{
    font-size:23px;
  }

}

</style>

</head>


<body>


<header>

<nav class="nav">


<a
  href="index.html"
  class="logo"
>

  <div class="logo-box">
    G
  </div>

  Gentle <span>Acct</span> Store

</a>


<a
  href="login.html"
  class="back"
>

  <i class="fa-solid fa-arrow-left"></i>

  Sign In

</a>


</nav>

</header>


<main class="page">


<div class="card">


<div class="title">


<div class="icon">

  <i class="fa-solid fa-lock"></i>

</div>


<h1>
  Create New Password
</h1>


<p>
  Choose a new password for your Gentle Acct Store account.
</p>


</div>


<form id="updateForm">


<div class="field">


<label for="password">
  New Password
</label>


<div class="input-wrap">


<i
  class="fa-solid fa-lock input-icon"
></i>


<input
  id="password"
  type="password"
  placeholder="Enter new password"
  autocomplete="new-password"
  minlength="6"
  required
>


<button
  type="button"
  id="passwordToggle"
  class="password-toggle"
>

  <i
    id="passwordIcon"
    class="fa-solid fa-eye"
  ></i>

</button>


</div>


<div class="password-rules">
  Use at least 6 characters.
</div>


</div>


<div class="field">


<label for="confirmPassword">
  Confirm New Password
</label>


<div class="input-wrap">


<i
  class="fa-solid fa-shield-halved input-icon"
></i>


<input
  id="confirmPassword"
  type="password"
  placeholder="Confirm new password"
  autocomplete="new-password"
  minlength="6"
  required
>


<button
  type="button"
  id="confirmToggle"
  class="password-toggle"
>

  <i
    id="confirmIcon"
    class="fa-solid fa-eye"
  ></i>

</button>


</div>

</div>


<button
  type="submit"
  class="update-btn"
  id="updateBtn"
>

  <i class="fa-solid fa-key"></i>

  &nbsp; Update Password

</button>


<div
  id="message"
  class="message"
></div>


</form>


<a
  href="login.html"
  class="back-login"
>

  <i class="fa-solid fa-arrow-left"></i>

  &nbsp; Back to Sign In

</a>


<div class="note">

  <i class="fa-solid fa-shield-halved"></i>

  <span>
    Your new password is securely handled by Firebase Authentication.
  </span>

</div>


</div>

</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "updateForm"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const confirmInput =
  document.getElementById(
    "confirmPassword"
  );


const updateBtn =
  document.getElementById(
    "updateBtn"
  );


const message =
  document.getElementById(
    "message"
  );


const passwordToggle =
  document.getElementById(
    "passwordToggle"
  );


const confirmToggle =
  document.getElementById(
    "confirmToggle"
  );


const passwordIcon =
  document.getElementById(
    "passwordIcon"
  );


const confirmIcon =
  document.getElementById(
    "confirmIcon"
  );


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(
  text,
  type
){

  message.innerHTML =
    text;

  message.className =
    "message " + type;

}


/* =========================
   PASSWORD TOGGLE
========================= */

passwordToggle.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      passwordIcon.className =
        "fa-solid fa-eye-slash";

    }else{

      passwordInput.type =
        "password";

      passwordIcon.className =
        "fa-solid fa-eye";

    }

  }
);


/* =========================
   CONFIRM PASSWORD TOGGLE
========================= */

confirmToggle.addEventListener(
  "click",
  function(){

    if(
      confirmInput.type ===
      "password"
    ){

      confirmInput.type =
        "text";

      confirmIcon.className =
        "fa-solid fa-eye-slash";

    }else{

      confirmInput.type =
        "password";

      confirmIcon.className =
        "fa-solid fa-eye";

    }

  }
);


/* =========================
   RESET LINK
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const mode =
  params.get("mode");


const oobCode =
  params.get("oobCode");


/* =========================
   CHECK RESET LINK
========================= */

if(
  mode !== "resetPassword" ||
  !oobCode
){

  showMessage(
    '<i class="fa-solid fa-circle-exclamation"></i> ' +
    'This password reset link is invalid or incomplete. Please request a new reset link.',
    "error"
  );

  updateBtn.disabled =
    true;

}


/* =========================
   UPDATE PASSWORD
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const password =
      passwordInput.value;


    const confirmPassword =
      confirmInput.value;


    if(
      !oobCode
    ){

      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'Please request a new password reset link.',
        "error"
      );

      return;

    }


    if(
      password.length < 6
    ){

      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'Your password must be at least 6 characters.',
        "error"
      );

      return;

    }


    if(
      password !== confirmPassword
    ){

      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'The passwords do not match.',
        "error"
      );

      return;

    }


    try{

      updateBtn.disabled =
        true;


      updateBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';


      /* =========================
         VERIFY RESET CODE
      ========================= */

      await firebaseAuth
        .verifyPasswordResetCode(
          oobCode
        );


      /* =========================
         SET NEW PASSWORD
      ========================= */

      await firebaseAuth
        .confirmPasswordReset(
          oobCode,
          password
        );


      showMessage(
        '<i class="fa-solid fa-circle-check"></i> ' +
        'Your password has been updated successfully. You can now sign in with your new password.',
        "success"
      );


      form.reset();


      setTimeout(
        function(){

          window.location.replace(
            "login.html"
          );

        },
        2500
      );


    }catch(error){

      console.error(
        "UPDATE PASSWORD ERROR:",
        error
      );


      let errorMessage =
        "We could not update your password. Please request a new reset link.";


      if(
        error.code ===
        "auth/expired-action-code"
      ){

        errorMessage =
          "This reset link has expired. Please request a new one.";

      }

      else if(
        error.code ===
        "auth/invalid-action-code"
      ){

        errorMessage =
          "This reset link is invalid or has already been used.";

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        errorMessage =
          "Your new password is too weak.";

      }


      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        errorMessage,
        "error"
      );


      updateBtn.disabled =
        false;


      updateBtn.innerHTML =
        '<i class="fa-solid fa-key"></i> &nbsp; Update Password';

    }

  }
);

</script>


</body>

</html>
