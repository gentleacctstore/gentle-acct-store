<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Update Password | Gentle Acct Store</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f5f9ff;
  color: #10213b;
  min-height: 100vh;
}

a {
  text-decoration: none;
}

header {
  height: 70px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid #e5ebf4;
}

.nav {
  max-width: 1100px;
  height: 100%;
  margin: auto;
  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;

  color: #10213b;
  font-size: 17px;
  font-weight: 800;
}

.logo-box {
  width: 38px;
  height: 38px;

  border-radius: 11px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(135deg,#0757d5,#1780ff);
  color: white;

  font-weight: 900;
  font-size: 18px;
}

.logo span {
  color: #1264e8;
}

.back {
  display: flex;
  align-items: center;
  gap: 7px;

  color: #1264e8;
  background: #f1f6ff;

  padding: 9px 13px;
  border-radius: 9px;

  font-size: 12px;
  font-weight: 800;
}

.page {
  min-height: calc(100vh - 70px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 35px 16px 45px;
}

.card {
  width: 100%;
  max-width: 450px;

  background: white;

  border: 1px solid #e1e8f2;
  border-radius: 22px;

  padding: 34px 24px;

  box-shadow: 0 18px 50px rgba(20,50,90,.08);
}

.title {
  text-align: center;
}

.icon {
  width: 58px;
  height: 58px;

  margin: 0 auto 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #eaf3ff;
  color: #1264e8;

  border-radius: 17px;

  font-size: 22px;
}

.title h1 {
  font-size: 27px;
  color: #0b1d35;
}

.title p {
  color: #718096;
  font-size: 13px;

  line-height: 1.7;

  margin-top: 9px;
}

form {
  margin-top: 28px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;

  color: #243650;

  font-size: 12px;
  font-weight: 800;

  margin-bottom: 7px;
}

.input-wrap {
  position: relative;
}

.input-icon {
  position: absolute;

  left: 14px;
  top: 50%;

  transform: translateY(-50%);

  color: #7f91aa;
}

input {
  width: 100%;
  height: 50px;

  border: 1px solid #dbe4ef;
  border-radius: 11px;

  outline: none;

  padding: 0 14px 0 40px;

  font-size: 14px;

  color: #10213b;

  background: #fbfdff;
}

input:focus {
  border-color: #1264e8;

  background: white;

  box-shadow:
    0 0 0 3px rgba(18,100,232,.08);
}

input::placeholder {
  color: #9aa7b8;
}

.update-btn {
  width: 100%;
  height: 50px;

  margin-top: 5px;

  border: 0;
  border-radius: 11px;

  background: linear-gradient(
    135deg,
    #0757d5,
    #1264e8
  );

  color: white;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 10px 22px rgba(18,100,232,.18);
}

.update-btn:disabled {
  opacity: .7;
  cursor: wait;
}

.message {
  display: none;

  margin-top: 15px;

  padding: 13px;

  border-radius: 11px;

  font-size: 12px;

  line-height: 1.6;

  text-align: center;
}

.message.success {
  display: block;

  background: #effaf3;

  border: 1px solid #ccebd7;

  color: #237a43;
}

.message.error {
  display: block;

  background: #fff0f0;

  border: 1px solid #f3d1d1;

  color: #c53030;
}

.password-rules {
  margin-top: 6px;

  color: #718096;

  font-size: 10px;

  line-height: 1.5;
}

.back-login {
  display: block;

  text-align: center;

  margin-top: 23px;

  color: #1264e8;

  font-size: 12px;

  font-weight: 800;
}

.note {
  display: flex;

  gap: 8px;

  margin-top: 24px;

  padding: 13px;

  border-radius: 11px;

  background: #f5f9ff;

  border: 1px solid #e1ebfa;

  color: #718096;

  font-size: 10px;

  line-height: 1.6;
}

.note i {
  color: #1264e8;
  margin-top: 2px;
}

@media (max-width:450px) {

  .logo {
    font-size: 15px;
  }

  .logo-box {
    width: 35px;
    height: 35px;
  }

  .card {
    padding: 30px 19px;
  }

  .title h1 {
    font-size: 25px;
  }

}

</style>

</head>

<body>

<header>

<nav class="nav">

<a href="index.html" class="logo">

<div class="logo-box">
G
</div>

Gentle <span>Acct</span> Store

</a>

<a href="login.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

Sign In

</a>

</nav>

</header>


<main class="page">

<div class="card">

<div class="title">

<div class="icon">

<i class="fa-solid fa-lock"></i>

</div>

<h1>
Create New Password
</h1>

<p>
Choose a new password for your Gentle Acct Store account.
</p>

</div>


<form id="updateForm">

<div class="field">

<label for="password">
New Password
</label>

<div class="input-wrap">

<i class="fa-solid fa-lock input-icon"></i>

<input
  id="password"
  type="password"
  placeholder="Enter new password"
  autocomplete="new-password"
  minlength="6"
  required
>

</div>

<div class="password-rules">
Use at least 6 characters.
</div>

</div>


<div class="field">

<label for="confirmPassword">
Confirm New Password
</label>

<div class="input-wrap">

<i class="fa-solid fa-shield-halved input-icon"></i>

<input
  id="confirmPassword"
  type="password"
  placeholder="Confirm new password"
  autocomplete="new-password"
  minlength="6"
  required
>

</div>

</div>


<button
  type="submit"
  class="update-btn"
  id="updateBtn"
>

<i class="fa-solid fa-key"></i>

Update Password

</button>


<div
  id="message"
  class="message"
></div>

</form>


<a
  href="login.html"
  class="back-login"
>

<i class="fa-solid fa-arrow-left"></i>

Back to Sign In

</a>


<div class="note">

<i class="fa-solid fa-shield-halved"></i>

<span>
Your new password is securely handled by Supabase Authentication.
</span>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const form =
  document.getElementById("updateForm");

const passwordInput =
  document.getElementById("password");

const confirmInput =
  document.getElementById("confirmPassword");

const updateBtn =
  document.getElementById("updateBtn");

const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.className =
    "message " + type;

  message.innerHTML = text;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const password =
      passwordInput.value;

    const confirmPassword =
      confirmInput.value;


    message.style.display =
      "none";


    if(password.length < 6) {

      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'Your password must be at least 6 characters.',
        "error"
      );

      return;

    }


    if(password !== confirmPassword) {

      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'The passwords do not match.',
        "error"
      );

      return;

    }


    updateBtn.disabled = true;

    updateBtn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.updateUser({

          password: password

        });


      if(error) {

        throw error;

      }


      showMessage(
        '<i class="fa-solid fa-circle-check"></i> ' +
        'Your password has been updated successfully. You can now sign in with your new password.',
        "success"
      );


      form.reset();


      setTimeout(
        function() {

          window.location.replace(
            "login.html"
          );

        },
        2500
      );


    } catch(error) {

      console.error(error);


      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'We could not update your password. Please request a new reset link and try again.',
        "error"
      );


      updateBtn.disabled = false;

      updateBtn.innerHTML =
        '<i class="fa-solid fa-key"></i> Update Password';

    }

  }
);

</script>

</body>
</html>
