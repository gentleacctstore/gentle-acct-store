<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#0b2d5c"
>

<title>Delete Product - Gentle Acct Store</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
>

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>

<style>

:root{

--blue:#0b2d5c;
--blue-dark:#071f40;
--blue-light:#eaf2fb;
--blue-soft:#f5f8fc;

--white:#ffffff;

--text:#172033;
--muted:#748093;

--danger:#dc2626;
--danger-dark:#b91c1c;
--danger-bg:#fff1f1;

--success:#15803d;
--success-bg:#edf8f1;

--border:#e1e8f0;

--shadow:
0 15px 45px rgba(11,45,92,.09);

}

*{

box-sizing:border-box;

margin:0;

padding:0;

}

body{

font-family:"Poppins",sans-serif;

background:#f5f8fc;

color:var(--text);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:18px;

}

.container{

width:100%;

max-width:560px;

}

.card{

background:var(--white);

border:1px solid var(--border);

border-radius:24px;

padding:34px 28px;

box-shadow:var(--shadow);

text-align:center;

}

.icon{

width:78px;

height:78px;

border-radius:22px;

background:var(--danger-bg);

color:var(--danger);

display:flex;

align-items:center;

justify-content:center;

margin:0 auto 22px;

font-size:28px;

}

h1{

font-size:27px;

font-weight:800;

color:var(--blue-dark);

margin-bottom:9px;

}

.subtitle{

font-size:11px;

line-height:1.7;

color:var(--muted);

margin-bottom:20px;

}

.product-name{

background:var(--blue-light);

color:var(--blue);

border-radius:13px;

padding:14px;

font-size:15px;

font-weight:800;

margin-bottom:12px;

word-break:break-word;

}

.status{

border-radius:12px;

padding:11px;

font-size:9px;

font-weight:700;

margin-bottom:16px;

line-height:1.6;

}

.status.loading{

background:var(--blue-light);

color:var(--blue);

}

.status.success{

background:var(--success-bg);

color:var(--success);

border:1px solid #ccebd9;

}

.status.error{

background:var(--danger-bg);

color:var(--danger);

border:1px solid #f2d2d2;

}

.delete-btn{

width:100%;

border:none;

background:var(--danger);

color:white;

padding:13px;

border-radius:12px;

font-size:11px;

font-weight:800;

display:flex;

align-items:center;

justify-content:center;

gap:7px;

cursor:pointer;

margin-bottom:9px;

transition:.2s;

}

.delete-btn:hover{

background:var(--danger-dark);

}

.delete-btn:active{

transform:scale(.98);

}

.delete-btn:disabled{

opacity:.55;

cursor:not-allowed;

}

.cancel-btn{

width:100%;

border:none;

background:var(--blue-light);

color:var(--blue);

padding:13px;

border-radius:12px;

font-size:11px;

font-weight:800;

cursor:pointer;

transition:.2s;

}

.cancel-btn:hover{

background:#dce9f7;

}

.cancel-btn:active{

transform:scale(.98);

}

.warning{

display:flex;

align-items:flex-start;

gap:8px;

text-align:left;

background:#fff8e8;

border:1px solid #f0dfad;

color:#8a6200;

border-radius:12px;

padding:11px;

font-size:8px;

line-height:1.6;

margin-bottom:16px;

}

.warning i{

margin-top:2px;

}

@media(max-width:480px){

body{

padding:12px;

}

.card{

padding:29px 19px;

border-radius:21px;

}

.icon{

width:70px;

height:70px;

border-radius:19px;

font-size:25px;

margin-bottom:19px;

}

h1{

font-size:24px;

}

.subtitle{

font-size:10px;

}

.product-name{

font-size:14px;

}

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="icon">

<i class="fa-solid fa-trash"></i>

</div>


<h1>
Delete Product?
</h1>


<p class="subtitle">

Are you sure you want to delete this product?
The product and all of its inventory will be permanently removed.

</p>


<div
id="productName"
class="product-name"
>

Loading product...

</div>


<div class="warning">

<i class="fa-solid fa-triangle-exclamation"></i>

<span>
This action cannot be undone. Make sure you really want to remove this product before continuing.
</span>

</div>


<div
id="status"
class="status loading"
>

<i class="fa-solid fa-spinner fa-spin"></i>

Checking admin authorization...

</div>


<button
id="deleteButton"
class="delete-btn"
type="button"
disabled
>

<i class="fa-solid fa-trash"></i>

Delete Product

</button>


<button
id="cancelButton"
class="cancel-btn"
type="button"
>

<i class="fa-solid fa-arrow-left"></i>

Cancel

</button>


</div>

</div>


<script>

/* =========================
ADMIN
========================= */

const ADMIN_UID =
"UoEjCy99gbQKkGob59vGi3CunZi1";


/* =========================
PRODUCT ID
========================= */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


/* =========================
VARIABLES
========================= */

let adminAuthorized = false;

let productRef = null;


/* =========================
ELEMENTS
========================= */

const productName =
document.getElementById(
"productName"
);

const statusBox =
document.getElementById(
"status"
);

const deleteButton =
document.getElementById(
"deleteButton"
);

const cancelButton =
document.getElementById(
"cancelButton"
);


/* =========================
STATUS
========================= */

function setStatus(
message,
type
){

statusBox.className =
"status " + type;

statusBox.innerHTML =
message;

}


/* =========================
AUTH CHECK
========================= */

firebaseAuth.onAuthStateChanged(
async function(user){

if(!user){

setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> Please log in as admin first.',
"error"
);

deleteButton.disabled = true;

return;

}


if(
user.uid !== ADMIN_UID
){

setStatus(
'<i class="fa-solid fa-shield-halved"></i> You are not authorized to delete this product.',
"error"
);

deleteButton.disabled = true;

return;

}


if(
!user.emailVerified
){

setStatus(
'<i class="fa-solid fa-envelope"></i> Please verify the admin email before continuing.',
"error"
);

deleteButton.disabled = true;

return;

}


adminAuthorized = true;


setStatus(
'<i class="fa-solid fa-circle-check"></i> Admin authorization confirmed.',
"success"
);


await loadProduct();

}
);


/* =========================
LOAD PRODUCT
========================= */

async function loadProduct(){

if(!productId){

productName.textContent =
"No product selected.";

setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> Product ID is missing.',
"error"
);

deleteButton.disabled = true;

return;

}


try{

productRef =
firebaseDB
.collection("products")
.doc(productId);


const snapshot =
await productRef.get();


if(!snapshot.exists){

productName.textContent =
"Product not found";

setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> This product no longer exists.',
"error"
);

deleteButton.disabled = true;

return;

}


const data =
snapshot.data();


productName.textContent =
data.name ||
"Unnamed Product";


deleteButton.disabled = false;


}catch(error){

console.error(
"LOAD PRODUCT ERROR:",
error
);

productName.textContent =
"Unable to load product";

setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> Could not load product: ' +
escapeHTML(
error.message
),
"error"
);

deleteButton.disabled = true;

}

}


/* =========================
DELETE PRODUCT
========================= */

async function performDelete(){

if(!adminAuthorized){

setStatus(
'<i class="fa-solid fa-shield-halved"></i> You are not authorized to delete this product.',
"error"
);

return;

}


if(!productRef){

setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> Product is not loaded yet.',
"error"
);

return;

}


deleteButton.disabled = true;

cancelButton.disabled = true;

deleteButton.innerHTML = `

<i class="fa-solid fa-spinner fa-spin"></i>

Deleting...

`;


try{


/* =========================
REMOVE INVENTORY
========================= */

setStatus(
'<i class="fa-solid fa-spinner fa-spin"></i> Removing inventory...',
"loading"
);


const inventorySnapshot =
await productRef
.collection("inventory")
.get();


const inventoryDocs =
inventorySnapshot.docs;


for(
let i = 0;
i < inventoryDocs.length;
i += 400
){

const batch =
firebaseDB.batch();


const chunk =
inventoryDocs.slice(
i,
i + 400
);


chunk.forEach(
function(doc){

batch.delete(
doc.ref
);

}
);


await batch.commit();

}


/* =========================
REMOVE PRODUCT
========================= */

setStatus(
'<i class="fa-solid fa-spinner fa-spin"></i> Removing product...',
"loading"
);


await productRef.delete();


/* =========================
SUCCESS
========================= */

productName.textContent =
"Product Deleted";


setStatus(
'<i class="fa-solid fa-circle-check"></i> Product deleted successfully.',
"success"
);


deleteButton.innerHTML = `

<i class="fa-solid fa-check"></i>

Deleted

`;


/* =========================
REDIRECT
========================= */

setTimeout(
function(){

window.location.replace(
"admin.html"
);

},
1000
);


}catch(error){

console.error(
"DELETE ERROR:",
error
);


deleteButton.disabled = false;

cancelButton.disabled = false;

deleteButton.innerHTML = `

<i class="fa-solid fa-trash"></i>

Delete Product

`;


setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> Delete failed.<br><br>' +
escapeHTML(
error.code ||
"Unknown error"
) +
"<br>" +
escapeHTML(
error.message ||
"Please try again."
),
"error"
);

}

}


/* =========================
DELETE BUTTON
========================= */

deleteButton.addEventListener(
"click",
performDelete
);


/* =========================
CANCEL
========================= */

cancelButton.addEventListener(
"click",
function(){

window.location.replace(
"admin.html"
);

}
);


/* =========================
ESCAPE HTML
========================= */

function escapeHTML(
value
){

return String(
value || ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}

</script>


</body>

</html>
