<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Delete Product - Gentle Acct Store</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
>

<link
rel="preconnect"
href="https://fonts.googleapis.com"
crossorigin
>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

:root{

--blue:#0b2d5c;
--blue-dark:#071f40;
--blue-light:#eaf2fb;

--white:#ffffff;

--text:#172033;
--muted:#7a8498;

--danger:#d6362c;
--danger-dark:#b52b23;
--danger-bg:#fff1f1;

--success:#16803c;
--success-bg:#edf9f0;

--border:#dfe7f1;

}

*{

box-sizing:border-box;

margin:0;

padding:0;

}

body{

font-family:"Poppins",sans-serif;

background:#f6f8fc;

color:var(--text);

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}

.container{

width:100%;

max-width:760px;

}

.card{

background:var(--white);

border:1px solid var(--border);

border-radius:28px;

padding:55px 42px;

box-shadow:
0 15px 45px rgba(11,45,92,.08);

text-align:center;

}

.icon{

width:140px;

height:140px;

border-radius:50%;

background:var(--danger-bg);

color:var(--danger);

display:flex;

align-items:center;

justify-content:center;

margin:0 auto 40px;

font-size:52px;

}

h1{

font-size:39px;

font-weight:800;

color:var(--blue-dark);

margin-bottom:20px;

}

.subtitle{

font-size:17px;

line-height:1.7;

color:var(--muted);

margin-bottom:32px;

}

.product-name{

background:var(--blue-light);

color:var(--blue);

border-radius:17px;

padding:18px;

font-size:21px;

font-weight:800;

margin-bottom:18px;

word-break:break-word;

}

.status{

border-radius:16px;

padding:17px;

font-size:15px;

font-weight:700;

margin-bottom:24px;

line-height:1.5;

}

.status.loading{

background:var(--blue-light);

color:var(--blue);

}

.status.success{

background:var(--success-bg);

color:var(--success);

}

.status.error{

background:var(--danger-bg);

border:2px solid #f1cccc;

color:var(--danger);

}

.delete-btn{

width:100%;

border:none;

background:var(--danger);

color:white;

padding:20px;

border-radius:17px;

font-size:18px;

font-weight:800;

display:flex;

align-items:center;

justify-content:center;

gap:9px;

cursor:pointer;

margin-bottom:18px;

}

.delete-btn:active{

transform:scale(.98);

}

.delete-btn:disabled{

opacity:.55;

cursor:not-allowed;

}

.cancel-btn{

width:100%;

border:none;

background:var(--blue-light);

color:var(--blue);

padding:20px;

border-radius:17px;

font-size:18px;

font-weight:800;

cursor:pointer;

}

.cancel-btn:active{

transform:scale(.98);

}

@media(max-width:600px){

.card{

padding:50px 25px;

border-radius:25px;

}

.icon{

width:120px;

height:120px;

font-size:45px;

margin-bottom:35px;

}

h1{

font-size:30px;

}

.subtitle{

font-size:15px;

}

.product-name{

font-size:18px;

}

.delete-btn,
.cancel-btn{

font-size:15px;

padding:18px;

}

}

</style>

</head>

<body>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>


<div class="container">

<div class="card">


<div class="icon">

<i class="fa-solid fa-trash"></i>

</div>


<h1>
Delete Product?
</h1>


<p class="subtitle">

Are you sure you want to delete this product?
This will also remove its inventory.

</p>


<div
id="productName"
class="product-name"
>

Loading product...

</div>


<div
id="status"
class="status loading"
>

<i class="fa-solid fa-spinner fa-spin"></i>

Checking admin authorization...

</div>


<button
id="deleteButton"
class="delete-btn"
type="button"
disabled
>

<i class="fa-solid fa-trash"></i>

Delete Product

</button>


<button
id="cancelButton"
class="cancel-btn"
type="button"
>

<i class="fa-solid fa-arrow-left"></i>

Cancel

</button>


</div>

</div>


<script>

/* ==========================================
   ADMIN
========================================== */

const ADMIN_UID =
"UoEjCy99gbQKkGob59vGi3CunZi1";


/* ==========================================
   PRODUCT ID
========================================== */

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");


/* ==========================================
   VARIABLES
========================================== */

let adminAuthorized=false;

let productRef=null;


/* ==========================================
   ELEMENTS
========================================== */

const productName =
document.getElementById(
"productName"
);

const statusBox =
document.getElementById(
"status"
);

const deleteButton =
document.getElementById(
"deleteButton"
);

const cancelButton =
document.getElementById(
"cancelButton"
);


/* ==========================================
   STATUS
========================================== */

function setStatus(
message,
type
){

statusBox.className =
"status " + type;

statusBox.innerHTML =
message;

}


/* ==========================================
   AUTH
========================================== */

firebaseAuth.onAuthStateChanged(
async function(user){

if(!user){

setStatus(
'<i class="fa-solid fa-circle-exclamation"></i> Please login as admin first.',
"error"
);

deleteButton.disabled=true;

return;

}


console.log(
"Logged in UID:",
user.uid
);

console.log(
"Required UID:",
ADMIN_UID
);


if(
user.uid !== ADMIN_UID
){

setStatus(
" You are not authorized to delete this product.",
"error"
);

deleteButton.disabled=true;

return;

}


adminAuthorized=true;

setStatus(
'<i class="fa-solid fa-circle-check"></i> Admin authorization confirmed.',
"success"
);


await loadProduct();

});


/* ==========================================
   LOAD PRODUCT
========================================== */

async function loadProduct(){

if(!productId){

productName.textContent =
"No product selected.";

setStatus(
"Product ID is missing.",
"error"
);

deleteButton.disabled=true;

return;

}


try{

productRef =
firebaseDB
.collection("products")
.doc(productId);


const snapshot =
await productRef.get();


if(!snapshot.exists){

productName.textContent =
"Product not found";

setStatus(
" This product no longer exists.",
"error"
);

deleteButton.disabled=true;

return;

}


const data =
snapshot.data();


productName.textContent =
data.name || "Unnamed Product";


deleteButton.disabled=false;


}catch(error){

console.error(
"LOAD PRODUCT ERROR:",
error
);

productName.textContent =
"Unable to load product";

setStatus(
"Could not load product: " +
error.message,
"error"
);

deleteButton.disabled=true;

}

}


/* ==========================================
   DELETE
========================================== */

async function performDelete(){

if(!adminAuthorized){

setStatus(
"You are not authorized to delete this product.",
"error"
);

return;

}


if(!productRef){

setStatus(
"Product is not loaded yet.",
"error"
);

return;

}


deleteButton.disabled=true;

deleteButton.innerHTML = `

<i class="fa-solid fa-spinner fa-spin"></i>

Deleting...

`;


cancelButton.disabled=true;


try{

/* DELETE INVENTORY */

setStatus(
'<i class="fa-solid fa-spinner fa-spin"></i> Removing inventory...',
"loading"
);


const inventorySnapshot =
await productRef
.collection("inventory")
.get();


const inventoryDocs =
inventorySnapshot.docs;


for(
let i=0;
i<inventoryDocs.length;
i+=400
){

const batch =
firebaseDB.batch();


const chunk =
inventoryDocs.slice(
i,
i+400
);


chunk.forEach(
function(doc){

batch.delete(
doc.ref
);

});


await batch.commit();

}


/* DELETE PRODUCT */

setStatus(
'<i class="fa-solid fa-spinner fa-spin"></i> Removing product...',
"loading"
);


await productRef.delete();


/* SUCCESS */

setStatus(
'<i class="fa-solid fa-circle-check"></i> Product deleted successfully.',
"success"
);


productName.textContent =
"Product Deleted";


deleteButton.innerHTML = `

<i class="fa-solid fa-check"></i>

Deleted

`;


/* GO BACK */

setTimeout(
function(){

window.location.href =
"admin.html";

},
1000
);


}catch(error){

console.error(
"DELETE ERROR:",
error
);


deleteButton.disabled=false;

cancelButton.disabled=false;

deleteButton.innerHTML = `

<i class="fa-solid fa-trash"></i>

Delete Product

`;


setStatus(
"Delete failed.<br><br>" +
(error.code || "Unknown error") +
"<br>" +
(error.message || ""),
"error"
);

}

}


/* ==========================================
   BUTTON EVENTS
========================================== */

deleteButton.addEventListener(
"click",
performDelete
);


cancelButton.addEventListener(
"click",
function(){

window.location.href =
"admin.html";

});

</script>


</body>

</html>
