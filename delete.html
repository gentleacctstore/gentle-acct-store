<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Delete Product</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f8ff;
      color: #172033;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .icon {
      width: 65px;
      height: 65px;
      background: #fff0f0;
      color: #d63030;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 28px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #707a8b;
      line-height: 1.5;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 11px;
      margin-top: 15px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .delete {
      background: #d63030;
      color: white;
    }

    .cancel {
      background: #eaf2ff;
      color: #1261e8;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="icon">
      🗑
    </div>

    <h2>Delete Product?</h2>

    <p>
      Are you sure you want to delete this product?
      This action cannot be undone.
    </p>

    <button
      class="delete"
      onclick="deleteNow()">

      Delete Product

    </button>

    <button
      class="cancel"
      onclick="goBack()">

      Cancel

    </button>

  </div>


  <script>

    function deleteNow() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const id =
        params.get("id");


      if (!id) {

        alert(
          "Product ID was not found."
        );

        return;

      }


      let products =
        JSON.parse(
          localStorage.getItem(
            "gentleProducts"
          )
        ) || [];


      products =
        products.filter(
          function(product) {

            return String(product.id)
              !== String(id);

          }
        );


      localStorage.setItem(
        "gentleProducts",
        JSON.stringify(products)
      );


      window.location.href =
        "admin.html";

    }


    function goBack() {

      window.location.href =
        "admin.html";

    }

  </script>

</body>
</html>
