<title>Profile - Gentle Acct Store</title>

<script>
(function(){
  try {
    const t = localStorage.getItem("gentle-acct-store-theme");
    if(t === "dark") document.documentElement.classList.add("dark-mode");
    if(t === "blue") document.documentElement.classList.add("blue-mode");
  } catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--g:#E87535;--g2:#C85D27;--pale:#FFF0E7;--canvas:#FFFCFA;--ink:#282B30;--muted:#858B95;--line:#F0E5DE;--card:#fff;--danger:#C83A43;--shadow:0 12px 32px rgba(80,48,28,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--canvas);color:var(--ink);font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(232,117,53,.28);outline-offset:3px}
.header{height:62px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 680px)/2));position:sticky;top:0;z-index:30;backdrop-filter:blur(18px)}
.header-title{font-size:17px;font-weight:800;letter-spacing:-.04em}
.header-icon{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--pale);color:var(--g);display:grid;place-items:center;font-size:14px}
.container{width:100%;max-width:680px;margin:auto;padding:22px 16px 30px}
.profile-hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(130deg,#25292F 0%,#343940 62%,#E87535 160%);padding:25px;color:#fff;box-shadow:0 18px 40px rgba(54,43,35,.16);margin-bottom:19px}
.profile-hero:before,.profile-hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%;pointer-events:none}
.profile-hero:before{width:260px;height:260px;right:-120px;top:-145px}
.profile-hero:after{width:170px;height:170px;right:45px;bottom:-130px}
.hero-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#FFD7C0;font-weight:800;margin-bottom:18px}
.hero-user{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.avatar{width:68px;height:68px;flex:0 0 68px;border-radius:22px;background:#fff;color:var(--g);display:grid;place-items:center;font-size:27px;font-weight:850;box-shadow:0 8px 20px rgba(0,0,0,.13)}
.profile-info{min-width:0}
.profile-name{font-size:21px;font-weight:800;letter-spacing:-.045em;overflow-wrap:anywhere;margin-bottom:5px}
.profile-email{font-size:12px;color:#F6DED1;overflow-wrap:anywhere}
.verified{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);border-radius:999px;font-size:10px;font-weight:700}
.hero-foot{position:relative;z-index:1;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:space-between;gap:10px;color:#F6DED1;font-size:11px}
.hero-foot strong{color:#fff;font-size:11px}
.profile-section{margin:20px 0}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 2px 11px}
.section-heading h2{font-size:15px;font-weight:800;letter-spacing:-.035em}
.section-heading span{font-size:10px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick-card{min-height:108px;background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px 10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;box-shadow:var(--shadow);color:var(--ink)}
.quick-card .quick-icon{width:38px;height:38px;border-radius:13px;background:var(--pale);color:var(--g);display:grid;place-items:center;font-size:15px}
.quick-card strong{font-size:11px;font-weight:800}.quick-card small{font-size:9px;color:var(--muted);margin-top:3px}
.settings-card{background:var(--card);border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:var(--shadow)}
.setting-row{display:flex;align-items:center;gap:12px;padding:15px;border-top:1px solid var(--line);min-height:68px}
.setting-row:first-child{border-top:0}
.setting-icon{width:39px;height:39px;border-radius:13px;background:var(--pale);color:var(--g);display:grid;place-items:center;flex:0 0 39px}
.setting-copy{flex:1;min-width:0}.setting-copy strong{display:block;font-size:12px;font-weight:800}.setting-copy span{display:block;color:var(--muted);font-size:10px;line-height:1.5;margin-top:4px}
.setting-arrow{color:#9AA69D;font-size:11px}
.theme-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:14px}
.theme-option{border:1.5px solid var(--line);border-radius:15px;background:#fff;padding:9px 7px;display:flex;align-items:center;gap:7px;justify-content:center;color:var(--ink);font-size:11px;font-weight:750;min-height:44px}
.theme-option.selected{border-color:var(--g);background:var(--pale);color:var(--g)}
.theme-preview{display:none}.theme-check{font-size:11px}
.theme-help{padding:0 15px 14px;color:var(--muted);font-size:10px;line-height:1.6}
.theme-notice{display:none;margin:0 14px 14px;padding:10px 12px;border-radius:12px;background:var(--pale);color:var(--g);font-size:11px;font-weight:700}
.theme-notice.show{display:block}
.security-pill{margin-left:auto;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:800;white-space:nowrap}
.security-pill.good{background:#EAF7EF;color:#18723A}.security-pill.warning{background:#FFF5E6;color:#A16207}
.logout-button{width:100%;height:50px;border:1px solid #F2D8DA;background:#FFF1F2;color:var(--danger);border-radius:15px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:20px}
.logout-button:disabled{opacity:.6;cursor:not-allowed}
.version{text-align:center;color:#9AA69D;font-size:10px;margin:18px 0 2px}
.modal{position:fixed;inset:0;background:rgba(10,25,15,.58);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:12px}
.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:480px;border-radius:23px;padding:20px;box-shadow:0 -10px 35px rgba(0,0,0,.15);animation:modalUp .2s ease;max-height:90vh;overflow-y:auto}
@keyframes modalUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.modal-header h2{font-size:17px;font-weight:800}
.close-button{width:36px;height:36px;border:0;border-radius:12px;background:var(--pale);color:var(--g);display:grid;place-items:center}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.password-wrap{position:relative}
.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#F8FBF8;padding:0 45px 0 13px;font-size:16px;outline:none;color:var(--ink)}
.field input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(232,117,53,.10)}
.toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#718078;font-size:14px;padding:6px}
.modal-status{display:none;padding:11px;border-radius:12px;font-size:11px;font-weight:700;line-height:1.6;margin-bottom:13px}.modal-status.show{display:block}.modal-status.error{background:#FFF1F2;color:#B4232D}.modal-status.success{background:#EAF7EF;color:#18723A}
.save-button{width:100%;border:0;background:var(--g);color:white;height:49px;border-radius:13px;font-size:12px;font-weight:800}.save-button:disabled{opacity:.6;cursor:not-allowed}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:50;backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#929D95;font-size:10px;font-weight:650;min-width:52px}.nav-item i{font-size:17px}.nav-item.active,.nav-item:hover{color:var(--g)}
.loading{text-align:center;padding:45px 18px;color:var(--muted)}.loading i{display:block;font-size:23px;color:var(--g);margin-bottom:12px}.loading p{font-size:12px}
html.dark-mode,html.dark-mode body{background:#0D1710;color:#F4F2F0}
html.dark-mode .header,html.dark-mode .bottom-nav{background:rgba(28,30,34,.97);border-color:#3B3E43}
html.dark-mode .header-title{color:#F4F2F0}
html.dark-mode .settings-card,html.dark-mode .quick-card,html.dark-mode .theme-option{background:#1D2228;border-color:#3A4149;color:#F4F2F0}
html.dark-mode .setting-row{border-color:#3A4149}html.dark-mode .setting-copy span,html.dark-mode .section-heading span,html.dark-mode .theme-help{color:#AAB0B8}
html.dark-mode .setting-icon,html.dark-mode .quick-icon,html.dark-mode .theme-option.selected{background:#4B2C20;color:#FFC29E}
html.dark-mode .logout-button{background:#351D2A;border-color:#653040;color:#FDA4AF}
html.dark-mode .modal-box{background:#1D2228;color:#F4F2F0;border:1px solid #3A4149}
html.dark-mode .modal-header h2,html.dark-mode .field label{color:#F4F2F0}
html.dark-mode .field input{background:#14181D;border-color:#454C55;color:#fff}
html.dark-mode .close-button{background:#3B3E43;color:#FFB98F}
html.dark-mode .nav-item{color:#AAB0B8}html.dark-mode .nav-item.active{color:#FFB98F}
@media(min-width:600px){.modal{align-items:center}.container{padding-top:30px}.profile-hero{padding:30px}.quick-card{min-height:118px}}
@media(max-width:370px){.container{padding:16px 11px 25px}.profile-hero{padding:19px}.profile-name{font-size:18px}.quick-grid{gap:7px}.quick-card{padding:12px 8px}.quick-card strong{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<body>
<header class="header">
  <div class="header-title">My Profile</div>
  <button id="backButton" class="header-icon" type="button" aria-label="Back to dashboard">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
</header>

<main class="container" id="pageContent">
  <div class="loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Loading your profile...</p>
  </div>
</main>

<div id="passwordModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="passwordTitle">Change Password</h2>
      <button id="closePasswordButton" class="close-button" type="button" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="modalStatus" class="modal-status" role="status" aria-live="polite"></div>

    <div class="field">
      <label for="currentPassword">Current Password</label>
      <div class="password-wrap">
        <input id="currentPassword" type="password" placeholder="Enter current password" autocomplete="current-password">
        <button class="toggle-password" type="button" data-password="currentPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>

    <div class="field">
      <label for="newPassword">New Password</label>
      <div class="password-wrap">
        <input id="newPassword" type="password" placeholder="At least 6 characters" autocomplete="new-password">
        <button class="toggle-password" type="button" data-password="newPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-wrap">
        <input id="confirmPassword" type="password" placeholder="Enter new password again" autocomplete="new-password">
        <button class="toggle-password" type="button" data-password="confirmPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>

    <button id="savePasswordButton" class="save-button" type="button">Change Password</button>
  </div>
</div>

<nav class="bottom-nav" aria-label="Main navigation">
  <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="dashboard.html#products" class="nav-item"><i class="fa-solid fa-box"></i><span>Products</span></a>
  <a href="orders.html" class="nav-item"><i class="fa-solid fa-receipt"></i><span>Orders</span></a>
  <a href="fund.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Fund</span></a>
  <a href="profile.html" class="nav-item active" aria-current="page"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script>
"use strict";

let currentUser = null;

const pageContent = document.getElementById("pageContent");
const passwordModal = document.getElementById("passwordModal");
const modalStatus = document.getElementById("modalStatus");
const savePasswordButton = document.getElementById("savePasswordButton");

const THEME_KEY = "gentle-acct-store-theme";
let activeThemeUserKey = null;
let selectedTheme = "light";

function getUserThemeKey(user){
  return "gentle-acct-store-theme-user-" + user.uid;
}

function readTheme(key){
  try{return localStorage.getItem(key);}
  catch(e){return null;}
}

function writeTheme(key,value){
  try{localStorage.setItem(key,value);}
  catch(e){console.warn("Could not save theme preference.",e);}
}

function applyTheme(theme){
  selectedTheme = ["light","dark","green"].includes(theme) ? theme : "light";

  const root = document.documentElement;

  root.classList.toggle("dark-mode",selectedTheme === "dark");
  root.classList.toggle("green-mode",selectedTheme === "green");
  root.classList.remove("blue-mode");

  if(document.body){
    document.body.classList.toggle("dark-mode",selectedTheme === "dark");
    document.body.classList.toggle("green-mode",selectedTheme === "green");
    document.body.classList.remove("blue-mode");
  }

  const meta = document.querySelector('meta[name="theme-color"]');

  if(meta){
    meta.setAttribute(
      "content",
      selectedTheme === "dark" ? "#0B1510" : "#C9232C"
    );
  }

  document.querySelectorAll(".theme-option").forEach(function(button){
    const isSelected = button.dataset.theme === selectedTheme;

    button.classList.toggle("selected",isSelected);
    button.setAttribute("aria-pressed",String(isSelected));

    const check = button.querySelector(".theme-check");

    if(check){
      check.style.visibility = isSelected ? "visible" : "hidden";
    }
  });
}

function loadUserTheme(user){
  activeThemeUserKey = getUserThemeKey(user);

  let theme = readTheme(activeThemeUserKey);

  if(!["light","dark","green"].includes(theme)){
    const oldTheme = readTheme(THEME_KEY);

    theme = oldTheme === "dark" ? "dark" : "light";

    writeTheme(activeThemeUserKey,theme);
  }

  selectedTheme = theme;
  applyTheme(theme);

  writeTheme(THEME_KEY,theme === "dark" ? "dark" : "light");
}

function chooseTheme(theme){
  if(!currentUser)return;
  if(!["light","dark","green"].includes(theme))return;

  selectedTheme = theme;

  writeTheme(getUserThemeKey(currentUser),theme);
  writeTheme(THEME_KEY,theme === "dark" ? "dark" : "light");

  applyTheme(theme);

  const notice = document.getElementById("themeNotice");

  if(notice){
    notice.textContent = "Your appearance preference has been saved.";
    notice.classList.add("show");

    clearTimeout(window.themeNoticeTimer);

    window.themeNoticeTimer = setTimeout(function(){
      notice.classList.remove("show");
    },2200);
  }
}

window.addEventListener("storage",function(event){
  if(event.key === THEME_KEY || event.key === activeThemeUserKey){
    if(currentUser){
      const saved = readTheme(activeThemeUserKey);

      if(["light","dark","green"].includes(saved)){
        selectedTheme = saved;
        applyTheme(saved);
      }else{
        applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
      }
    }else{
      applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
    }
  }
});

function syncCurrentUserTheme(){
  if(currentUser && activeThemeUserKey){
    const saved = readTheme(activeThemeUserKey);

    if(["light","dark","green"].includes(saved)){
      applyTheme(saved);
    }else{
      applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
    }
  }else{
    applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
  }
}

window.addEventListener("pageshow",syncCurrentUserTheme);

document.addEventListener("visibilitychange",function(){
  if(!document.hidden)syncCurrentUserTheme();
});

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

firebaseAuth.onAuthStateChanged(function(user){
  if(!user){
    window.location.replace("login.html");
    return;
  }

  currentUser = user;
  loadUserTheme(user);
  renderProfile(user);
});

function renderProfile(user){
  const displayName = user.displayName ||
    (user.email ? user.email.split("@")[0] : "Customer");

  const firstLetter = displayName.charAt(0).toUpperCase();

  pageContent.innerHTML = `
    <section class="profile-hero">
      <div class="hero-kicker">Gentle Acct Store · Account centre</div>
      <div class="hero-user">
        <div class="avatar">${escapeHTML(firstLetter)}</div>
        <div class="profile-info">
          <div class="profile-name">${escapeHTML(displayName)}</div>
          <div class="profile-email">${escapeHTML(user.email || "")}</div>
          <div class="verified">
            <i class="fa-solid ${user.emailVerified ? "fa-circle-check" : "fa-circle-exclamation"}"></i>
            ${user.emailVerified ? "Verified account" : "Email not verified"}
          </div>
        </div>
      </div>
      <div class="hero-foot"><span>Account status</span><strong>${user.emailVerified ? "Active & verified" : "Active"}</strong></div>
    </section>

    <section class="profile-section">
      <div class="section-heading"><h2>Quick access</h2><span>Your essentials</span></div>
      <div class="quick-grid">
        <button id="ordersButton" class="quick-card" type="button">
          <span class="quick-icon"><i class="fa-solid fa-receipt"></i></span>
          <span><strong>My orders</strong><small>Purchase history</small></span>
        </button>
        <button id="walletButton" class="quick-card" type="button">
          <span class="quick-icon"><i class="fa-solid fa-wallet"></i></span>
          <span><strong>My wallet</strong><small>Balance &amp; funding</small></span>
        </button>
        <button id="changePasswordButton" class="quick-card" type="button">
          <span class="quick-icon"><i class="fa-solid fa-lock"></i></span>
          <span><strong>Password</strong><small>Update security</small></span>
        </button>
      </div>
    </section>

    <section class="profile-section">
      <div class="section-heading"><h2>Personalise your space</h2><span>Saved on this device</span></div>
      <div class="settings-card">
        <div class="setting-row">
          <div class="setting-icon"><i class="fa-solid fa-palette"></i></div>
          <div class="setting-copy"><strong>Appearance</strong><span>Choose the look that feels right for you</span></div>
        </div>
        <div class="theme-options">
          <button type="button" class="theme-option" data-theme="light" aria-pressed="false">
            <i class="fa-regular fa-sun"></i><span>Light</span><i class="fa-solid fa-circle-check theme-check" style="visibility:hidden"></i>
          </button>
          <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">
            <i class="fa-solid fa-moon"></i><span>Dark</span><i class="fa-solid fa-circle-check theme-check" style="visibility:hidden"></i>
          </button>
          <button type="button" class="theme-option" data-theme="green" aria-pressed="false">
            <i class="fa-solid fa-sun"></i><span>Orange</span><i class="fa-solid fa-circle-check theme-check" style="visibility:hidden"></i>
          </button>
        </div>
        <p class="theme-help">Your appearance preference is saved for this signed-in account in this browser.</p>
        <div id="themeNotice" class="theme-notice" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="profile-section">
      <div class="section-heading"><h2>Security overview</h2><span>Firebase protected</span></div>
      <div class="settings-card">
        <div class="setting-row">
          <div class="setting-icon"><i class="fa-solid fa-shield-halved"></i></div>
          <div class="setting-copy"><strong>Email verification</strong><span>${user.emailVerified ? "Your email address has been verified." : "Verify your email to strengthen account security."}</span></div>
          <span class="security-pill ${user.emailVerified ? "good" : "warning"}">${user.emailVerified ? "Verified" : "Pending"}</span>
        </div>
        <div class="setting-row">
          <div class="setting-icon"><i class="fa-solid fa-key"></i></div>
          <div class="setting-copy"><strong>Password protection</strong><span>Change your password whenever you need to.</span></div>
          <i class="fa-solid fa-chevron-right setting-arrow"></i>
        </div>
      </div>
    </section>

    <button id="logoutButton" class="logout-button" type="button">
      <i class="fa-solid fa-right-from-bracket"></i><span>Sign out of account</span>
    </button>
    <div class="version">GENTLE ACCT STORE · CUSTOMER ACCOUNT</div>
  `;

  document.querySelectorAll(".theme-option").forEach(function(button){
    button.addEventListener("click",function(){
      chooseTheme(button.dataset.theme);
    });
  });

  applyTheme(selectedTheme);

  document.getElementById("changePasswordButton")
    .addEventListener("click",openPasswordModal);

  document.getElementById("ordersButton")
    .addEventListener("click",function(){
      window.location.href="orders.html";
    });

  document.getElementById("walletButton")
    .addEventListener("click",function(){
      window.location.href="fund.html";
    });

  document.getElementById("logoutButton")
    .addEventListener("click",logoutUser);
}

async function logoutUser(){
  const button = document.getElementById("logoutButton");

  if(button){
    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Logging out...</span>';
  }

  try{
    await firebaseAuth.signOut();
    window.location.replace("login.html");
  }catch(error){
    console.error("LOGOUT ERROR:",error);

    if(button){
      button.disabled = false;
      button.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span>';
    }

    alert("Logout failed. Please try again.");
  }
}

function openPasswordModal(){
  passwordModal.classList.add("show");

  document.getElementById("currentPassword").value="";
  document.getElementById("newPassword").value="";
  document.getElementById("confirmPassword").value="";

  clearModalStatus();
  document.getElementById("currentPassword").focus();
}

function closePasswordModal(){
  passwordModal.classList.remove("show");
}

function showModalStatus(text,type){
  modalStatus.className="modal-status show "+type;
  modalStatus.textContent=text;
}

function clearModalStatus(){
  modalStatus.className="modal-status";
  modalStatus.textContent="";
}

async function changePassword(){
  if(!currentUser || !currentUser.email){
    showModalStatus("Please sign in again before changing your password.","error");
    return;
  }

  const currentPassword=document.getElementById("currentPassword").value;
  const newPassword=document.getElementById("newPassword").value;
  const confirmPassword=document.getElementById("confirmPassword").value;

  if(!currentPassword){
    showModalStatus("Please enter your current password.","error");
    return;
  }

  if(newPassword.length<6){
    showModalStatus("Your new password must be at least 6 characters.","error");
    return;
  }

  if(newPassword!==confirmPassword){
    showModalStatus("Your new passwords do not match.","error");
    return;
  }

  if(newPassword===currentPassword){
    showModalStatus("Your new password must be different.","error");
    return;
  }

  try{
    savePasswordButton.disabled=true;
    savePasswordButton.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Changing...';

    const credential=firebase.auth.EmailAuthProvider.credential(
      currentUser.email,
      currentPassword
    );

    await currentUser.reauthenticateWithCredential(credential);
    await currentUser.updatePassword(newPassword);

    showModalStatus("Password changed successfully.","success");

    document.getElementById("currentPassword").value="";
    document.getElementById("newPassword").value="";
    document.getElementById("confirmPassword").value="";

    setTimeout(closePasswordModal,1200);
  }catch(error){
    console.error("PASSWORD ERROR:",error);

    let message="Could not change your password. Please try again.";

    if(error.code==="auth/wrong-password" || error.code==="auth/invalid-credential"){
      message="Your current password is incorrect.";
    }else if(error.code==="auth/too-many-requests"){
      message="Too many attempts. Please try again later.";
    }else if(error.code==="auth/weak-password"){
      message="Your new password is too weak.";
    }else if(error.code==="auth/requires-recent-login"){
      message="Please sign in again, then change your password.";
    }else if(error.code==="auth/network-request-failed"){
      message="Network error. Check your internet connection and try again.";
    }

    showModalStatus(message,"error");
  }finally{
    savePasswordButton.disabled=false;
    savePasswordButton.textContent="Change Password";
  }
}

document.querySelectorAll(".toggle-password").forEach(function(button){
  button.addEventListener("click",function(){
    const input=document.getElementById(button.dataset.password);
    const icon=button.querySelector("i");
    const showing=input.type==="password";

    input.type=showing?"text":"password";
    icon.className=showing?"fa-solid fa-eye-slash":"fa-solid fa-eye";
    button.setAttribute("aria-label",showing?"Hide password":"Show password");
  });
});

document.getElementById("backButton").addEventListener("click",function(){
  window.location.href="dashboard.html";
});

document.getElementById("closePasswordButton")
  .addEventListener("click",closePasswordModal);

savePasswordButton.addEventListener("click",changePassword);

passwordModal.addEventListener("click",function(event){
  if(event.target===passwordModal)closePasswordModal();
});

document.addEventListener("keydown",function(event){
  if(event.key==="Escape" && passwordModal.classList.contains("show")){
    closePasswordModal();
  }
});
</script>
</body>
</html>
