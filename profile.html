<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile | Gentle Acct Store</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #172033;
      min-height: 100vh;
    }

    header {
      height: 68px;
      background: white;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #e5eaf2;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 11px;
      background: #eaf2ff;
      color: #1261e8;
      font-size: 16px;
      cursor: pointer;
    }

    header h2 {
      font-size: 19px;
      font-weight: 800;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 22px 16px 45px;
    }

    .profile-card {
      background: white;
      border: 1px solid #e1e7f0;
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(23,32,51,.04);
    }

    .avatar {
      width: 78px;
      height: 78px;
      margin: 0 auto 13px;
      border-radius: 50%;
      background: #eaf2ff;
      color: #1261e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      border: 5px solid #f5f8ff;
    }

    .profile-card h1 {
      font-size: 21px;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .email {
      color: #7b8494;
      font-size: 13px;
    }

    .wallet-card {
      background: linear-gradient(135deg, #1261e8, #0757d5);
      color: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(18,97,232,.20);
    }

    .wallet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wallet-label {
      font-size: 13px;
      opacity: .85;
      margin-bottom: 5px;
    }

    .wallet-title {
      font-size: 15px;
      font-weight: 700;
    }

    .wallet-icon {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,.16);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .balance {
      font-size: 30px;
      font-weight: 800;
      margin-top: 15px;
      letter-spacing: .2px;
    }

    .fund-button {
      width: 100%;
      margin-top: 17px;
      border: none;
      background: white;
      color: #1261e8;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .fund-button i {
      margin-right: 5px;
    }

    .section-title {
      font-size: 13px;
      color: #7b8494;
      font-weight: 700;
      margin: 5px 4px 9px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .menu {
      background: white;
      border: 1px solid #e1e7f0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(23,32,51,.04);
    }

    .menu-item {
      width: 100%;
      border: none;
      background: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      border-bottom: 1px solid #edf0f5;
      color: #172033;
      font-size: 14px;
      cursor: pointer;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item:active {
      background: #f7faff;
    }

    .menu-icon {
      width: 40px;
      height: 40px;
      background: #eaf2ff;
      color: #1261e8;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-text {
      flex: 1;
    }

    .menu-text strong {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .menu-text small {
      color: #8992a2;
      font-size: 11px;
    }

    .arrow {
      color: #a1a9b7;
      font-size: 12px;
    }

    .logout {
      color: #d63030;
    }

    .logout .menu-icon {
      background: #fff0f0;
      color: #d63030;
    }

    .logout .menu-text small {
      color: #b97878;
    }

    .footer-note {
      text-align: center;
      color: #9aa2b0;
      font-size: 11px;
      margin-top: 25px;
    }

    /* =========================
       CHANGE PASSWORD MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 55, .55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 800;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #f1f4f8;
      color: #6f7887;
      cursor: pointer;
      font-size: 15px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #5f6878;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 45px 13px 13px;
      border: 1px solid #dce2eb;
      border-radius: 11px;
      outline: none;
      font-size: 14px;
      background: #fbfcfe;
    }

    .input-wrap input:focus {
      border-color: #1261e8;
      background: white;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #7c8696;
      cursor: pointer;
    }

    .password-help {
      color: #8992a2;
      font-size: 11px;
      line-height: 1.5;
      margin: 4px 0 15px;
    }

    .password-message {
      display: none;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .password-message.error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }

    .password-message.success {
      display: block;
      background: #effbf3;
      color: #198754;
    }

    .change-btn {
      width: 100%;
      border: none;
      background: #1261e8;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .change-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 13px;
      color: #1261e8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>

  <button
    class="back"
    onclick="goDashboard()">

    <i class="fa-solid fa-arrow-left"></i>

  </button>

  <h2>My Profile</h2>

</header>


<div class="container">

  <div class="profile-card">

    <div class="avatar">
      <i class="fa-solid fa-user"></i>
    </div>

    <h1 id="userName">
      User
    </h1>

    <p
      class="email"
      id="userEmail">
    </p>

  </div>


  <div class="wallet-card">

    <div class="wallet-top">

      <div>

        <div class="wallet-label">
          Your Wallet
        </div>

        <div class="wallet-title">
          Available Balance
        </div>

      </div>

      <div class="wallet-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>

    </div>

    <div
      class="balance"
      id="balance">
      ₦0.00
    </div>

    <button
      class="fund-button"
      onclick="fundWallet()">

      <i class="fa-solid fa-plus"></i>
      Add Funds

    </button>

  </div>


  <div class="section-title">
    Account
  </div>

  <div class="menu">

    <button
      class="menu-item"
      onclick="viewOrders()">

      <div class="menu-icon">
        <i class="fa-solid fa-receipt"></i>
      </div>

      <div class="menu-text">

        <strong>
          My Orders
        </strong>

        <small>
          View your purchase history
        </small>

      </div>

      <i class="fa-solid fa-chevron-right arrow"></i>

    </button>


    <button
      class="menu-item"
      onclick="fundWallet()">

      <div class="menu-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>

      <div class="menu-text">

        <strong>
          Fund Wallet
        </strong>

        <small>
          Add money to your wallet
        </small>

      </div>

      <i class="fa-solid fa-chevron-right arrow"></i>

    </button>


    <button
      class="menu-item"
      onclick="openPasswordModal()">

      <div class="menu-icon">
        <i class="fa-solid fa-lock"></i>
      </div>

      <div class="menu-text">

        <strong>
          Change Password
        </strong>

        <small>
          Update your account password
        </small>

      </div>

      <i class="fa-solid fa-chevron-right arrow"></i>

    </button>


    <button
      class="menu-item logout"
      onclick="logout()">

      <div class="menu-icon">
        <i class="fa-solid fa-right-from-bracket"></i>
      </div>

      <div class="menu-text">

        <strong>
          Logout
        </strong>

        <small>
          Sign out of your account
        </small>

      </div>

      <i class="fa-solid fa-chevron-right arrow"></i>

    </button>

  </div>


  <div class="footer-note">
    Gentle Acct Store
  </div>

</div>


<!-- =========================
     CHANGE PASSWORD MODAL
========================= -->

<div
  class="modal"
  id="passwordModal">

  <div class="modal-card">

    <div class="modal-header">

      <h3>
        Change Password
      </h3>

      <button
        class="close-btn"
        onclick="closePasswordModal()">

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>


    <div
      class="password-message"
      id="passwordMessage">
    </div>


    <div class="input-group">

      <label>
        Current Password
      </label>

      <div class="input-wrap">

        <input
          type="password"
          id="currentPassword"
          placeholder="Enter current password"
          autocomplete="current-password">

        <button
          class="toggle-password"
          type="button"
          onclick="togglePassword('currentPassword', this)">

          <i class="fa-solid fa-eye"></i>

        </button>

      </div>

    </div>


    <div class="input-group">

      <label>
        New Password
      </label>

      <div class="input-wrap">

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          autocomplete="new-password">

        <button
          class="toggle-password"
          type="button"
          onclick="togglePassword('newPassword', this)">

          <i class="fa-solid fa-eye"></i>

        </button>

      </div>

    </div>


    <div class="input-group">

      <label>
        Confirm New Password
      </label>

      <div class="input-wrap">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          autocomplete="new-password">

        <button
          class="toggle-password"
          type="button"
          onclick="togglePassword('confirmPassword', this)">

          <i class="fa-solid fa-eye"></i>

        </button>

      </div>

    </div>


    <div class="password-help">
      Your new password must be at least 6 characters long.
    </div>


    <button
      class="change-btn"
      id="changePasswordButton"
      onclick="changePassword()">

      Change Password

    </button>


    <a
      href="forgot-password.html"
      class="forgot-link">

      Forgot your password?

    </a>

  </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   SESSION PROTECTION
========================= */

let firebaseUser = null;


firebaseAuth.onAuthStateChanged(function(user) {

  if (!user || !user.emailVerified) {

    localStorage.removeItem("gentleLoggedIn");
    localStorage.removeItem("gentleCurrentUserId");
    localStorage.removeItem("gentleCheckoutProduct");

    window.location.replace("login.html");

    return;
  }


  firebaseUser = user;


  /*
    Keep compatibility with the
    existing Gentle Acct Store pages.
  */

  localStorage.setItem(
    "gentleLoggedIn",
    "true"
  );


  localStorage.setItem(
    "gentleCurrentUserId",
    user.uid
  );


  const savedUser =
    localStorage.getItem("gentleUser");


  let localUser = {};


  if (savedUser) {

    try {

      localUser =
        JSON.parse(savedUser);

    } catch (error) {

      localUser = {};

    }

  }


  localUser.id = user.uid;
  localUser.email = user.email || "";
  localUser.name =
    user.displayName ||
    localUser.name ||
    "User";


  localStorage.setItem(
    "gentleUser",
    JSON.stringify(localUser)
  );


  document
    .getElementById("userName")
    .textContent =
    localUser.name;


  document
    .getElementById("userEmail")
    .textContent =
    user.email || "";


  updateBalance();

});


/* =========================
   WALLET BALANCE
========================= */

function updateBalance() {

  const balance =
    Number(
      localStorage.getItem(
        "gentleBalance"
      )
    ) || 0;


  document
    .getElementById("balance")
    .textContent =
    "₦" +
    balance.toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2
      }
    );

}


/* =========================
   REFRESH
========================= */

window.addEventListener(
  "pageshow",
  function() {

    updateBalance();

  }
);


/* =========================
   NAVIGATION
========================= */

function goDashboard() {

  window.location.href =
    "dashboard.html";

}


function fundWallet() {

  window.location.href =
    "fund.html";

}


function viewOrders() {

  window.location.href =
    "orders.html";

}


/* =========================
   CHANGE PASSWORD
========================= */

function openPasswordModal() {

  const modal =
    document.getElementById(
      "passwordModal"
    );


  document
    .getElementById("passwordMessage")
    .className =
    "password-message";


  document
    .getElementById("passwordMessage")
    .textContent = "";


  document
    .getElementById("currentPassword")
    .value = "";


  document
    .getElementById("newPassword")
    .value = "";


  document
    .getElementById("confirmPassword")
    .value = "";


  modal.classList.add("show");

}


function closePasswordModal() {

  document
    .getElementById("passwordModal")
    .classList.remove("show");

}


function showPasswordMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "passwordMessage"
    );


  box.textContent =
    message;


  box.className =
    "password-message " +
    type;

}


/* =========================
   PASSWORD VISIBILITY
========================= */

function togglePassword(
  inputId,
  button
) {

  const input =
    document.getElementById(
      inputId
    );


  if (input.type === "password") {

    input.type = "text";

    button.innerHTML =
      '<i class="fa-solid fa-eye-slash"></i>';

  } else {

    input.type = "password";

    button.innerHTML =
      '<i class="fa-solid fa-eye"></i>';

  }

}


/* =========================
   CHANGE PASSWORD WITH FIREBASE
========================= */

async function changePassword() {

  if (!firebaseUser) {

    showPasswordMessage(
      "Your session has expired. Please log in again.",
      "error"
    );

    return;

  }


  const currentPassword =
    document
      .getElementById("currentPassword")
      .value
      .trim();


  const newPassword =
    document
      .getElementById("newPassword")
      .value;


  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;


  if (!currentPassword) {

    showPasswordMessage(
      "Enter your current password.",
      "error"
    );

    return;

  }


  if (!newPassword) {

    showPasswordMessage(
      "Enter your new password.",
      "error"
    );

    return;

  }


  if (newPassword.length < 6) {

    showPasswordMessage(
      "Your new password must be at least 6 characters long.",
      "error"
    );

    return;

  }


  if (newPassword !== confirmPassword) {

    showPasswordMessage(
      "The new passwords do not match.",
      "error"
    );

    return;

  }


  if (currentPassword === newPassword) {

    showPasswordMessage(
      "Your new password must be different from your current password.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "changePasswordButton"
    );


  button.disabled = true;

  button.textContent =
    "Changing Password...";


  try {

    /*
      Firebase requires recent
      authentication before changing
      a sensitive credential.

      We re-authenticate using the
      current password first.
    */

    const credential =
      firebase.auth.EmailAuthProvider
        .credential(
          firebaseUser.email,
          currentPassword
        );


    await firebaseUser.reauthenticateWithCredential(
      credential
    );


    await firebaseUser.updatePassword(
      newPassword
    );


    showPasswordMessage(
      "Password changed successfully.",
      "success"
    );


    document
      .getElementById("currentPassword")
      .value = "";


    document
      .getElementById("newPassword")
      .value = "";


    document
      .getElementById("confirmPassword")
      .value = "";


    button.textContent =
      "Password Changed";


    setTimeout(function() {

      closePasswordModal();

      button.disabled = false;

      button.textContent =
        "Change Password";

    }, 1500);


  } catch (error) {

    console.error(error);


    let message =
      "Unable to change your password. Please try again.";


    if (
      error.code ===
      "auth/wrong-password"
    ) {

      message =
        "Your current password is incorrect.";

    }


    if (
      error.code ===
      "auth/invalid-credential"
    ) {

      message =
        "Your current password is incorrect.";

    }


    if (
      error.code ===
      "auth/weak-password"
    ) {

      message =
        "Your new password is too weak.";

    }


    if (
      error.code ===
      "auth/requires-recent-login"
    ) {

      message =
        "Please log in again before changing your password.";

    }


    if (
      error.code ===
      "auth/too-many-requests"
    ) {

      message =
        "Too many attempts. Please wait and try again later.";

    }


    showPasswordMessage(
      message,
      "error"
    );


    button.disabled = false;

    button.textContent =
      "Change Password";

  }

}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document
  .getElementById("passwordModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closePasswordModal();

      }

    }
  );


/* =========================
   SECURE LOGOUT
========================= */

async function logout() {

  try {

    await firebaseAuth.signOut();

  } catch (error) {

    console.error(error);

  }


  localStorage.removeItem(
    "gentleLoggedIn"
  );


  localStorage.removeItem(
    "gentleCurrentUserId"
  );


  localStorage.removeItem(
    "gentleCheckoutProduct"
  );


  window.location.replace(
    "login.html"
  );

}

</script>

</body>
</html>
