<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#071f40"
>

<meta
  name="description"
  content="Manage your Gentle Acct Store profile, orders, wallet and account security."
>

<title>Profile - Gentle Acct Store</title>


<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

:root{

  --blue:#0b3b72;
  --blue-dark:#071f40;
  --blue-main:#0b2d5c;

  --blue-light:#edf4fc;
  --blue-soft:#f5f8fc;

  --white:#ffffff;

  --text:#172033;
  --muted:#778399;

  --border:#e2e8f0;

  --danger:#dc2626;
  --danger-bg:#fff1f1;

  --success:#16803c;
  --success-bg:#edf9f0;

  --shadow:
    0 9px 28px rgba(7,31,64,.07);

}


*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}


html{

  scroll-behavior:smooth;

}


body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at top right,
      rgba(31,105,194,.08),
      transparent 30%
    ),
    #f6f8fc;

  color:var(--text);

  font-family:'Poppins',sans-serif;

  padding-bottom:90px;

}


button,
input{

  font-family:inherit;

}


button{

  cursor:pointer;

}


a{

  text-decoration:none;

  color:inherit;

}


/* ==========================================
   HEADER
========================================== */

.header{

  height:70px;

  background:rgba(255,255,255,.95);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 17px;

  position:sticky;

  top:0;

  z-index:30;

  backdrop-filter:blur(14px);

  -webkit-backdrop-filter:blur(14px);

}


.header-title{

  font-size:17px;

  font-weight:800;

  color:var(--blue-dark);

  letter-spacing:-.3px;

}


.header-icon{

  width:39px;

  height:39px;

  border:none;

  border-radius:11px;

  background:var(--blue-light);

  color:var(--blue);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:14px;

  transition:.2s ease;

}


.header-icon:hover{

  background:#e1ebf7;

  transform:translateY(-1px);

}


/* ==========================================
   CONTAINER
========================================== */

.container{

  width:100%;

  max-width:600px;

  margin:auto;

  padding:20px 15px 35px;

}


/* ==========================================
   PROFILE CARD
========================================== */

.profile-card{

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #0d3c78,
      #071f40
    );

  color:var(--white);

  border-radius:23px;

  padding:25px 20px;

  box-shadow:
    0 15px 34px rgba(7,31,64,.18);

  margin-bottom:15px;

}


.profile-card::after{

  content:"";

  position:absolute;

  width:170px;

  height:170px;

  border-radius:50%;

  right:-70px;

  top:-75px;

  background:rgba(255,255,255,.07);

}


.profile-card::before{

  content:"";

  position:absolute;

  width:120px;

  height:120px;

  border-radius:50%;

  right:45px;

  bottom:-80px;

  background:rgba(255,255,255,.04);

}


.profile-top{

  position:relative;

  z-index:2;

  display:flex;

  align-items:center;

  gap:14px;

}


.avatar{

  width:65px;

  height:65px;

  border-radius:20px;

  background:var(--white);

  color:var(--blue);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:25px;

  font-weight:800;

  flex-shrink:0;

  box-shadow:
    0 7px 18px rgba(0,0,0,.10);

}


.profile-info{

  min-width:0;

}


.profile-name{

  font-size:18px;

  font-weight:800;

  margin-bottom:4px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.profile-email{

  font-size:10px;

  opacity:.82;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.verified{

  display:inline-flex;

  align-items:center;

  gap:5px;

  font-size:9px;

  font-weight:700;

  margin-top:8px;

  background:rgba(255,255,255,.14);

  border:1px solid rgba(255,255,255,.08);

  padding:5px 8px;

  border-radius:8px;

}


/* ==========================================
   SECTION
========================================== */

.section{

  background:var(--white);

  border:1px solid var(--border);

  border-radius:20px;

  box-shadow:var(--shadow);

  margin-bottom:15px;

  overflow:hidden;

}


.section-title{

  padding:17px 17px 12px;

  font-size:13px;

  font-weight:800;

  color:var(--blue-dark);

}


/* ==========================================
   MENU
========================================== */

.menu-item{

  width:100%;

  background:var(--white);

  border:none;

  border-top:1px solid #edf1f5;

  padding:15px 17px;

  display:flex;

  align-items:center;

  gap:13px;

  text-align:left;

  transition:.2s ease;

}


.menu-item:hover{

  background:#fbfcfe;

}


.menu-item:active{

  background:#f4f7fb;

}


.menu-icon{

  width:40px;

  height:40px;

  border-radius:12px;

  background:var(--blue-light);

  color:var(--blue);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:14px;

  flex-shrink:0;

}


.menu-content{

  flex:1;

  min-width:0;

}


.menu-content strong{

  display:block;

  font-size:12px;

  font-weight:700;

  color:var(--blue-dark);

  margin-bottom:2px;

}


.menu-content span{

  display:block;

  font-size:9px;

  color:var(--muted);

  line-height:1.5;

}


.menu-arrow{

  color:#9aa5b5;

  font-size:10px;

}


/* ==========================================
   SECURITY ROW
========================================== */

.security-row{

  width:100%;

  background:white;

  border-top:1px solid #edf1f5;

  padding:15px 17px;

  display:flex;

  align-items:center;

  gap:13px;

}


.security-status{

  margin-left:auto;

  display:flex;

  align-items:center;

  gap:5px;

  font-size:9px;

  font-weight:700;

}


.security-status i{

  font-size:8px;

}


.security-status.verified{

  margin-top:0;

  background:transparent;

  border:none;

  padding:0;

}


/* ==========================================
   LOGOUT
========================================== */

.logout-button{

  width:100%;

  border:1px solid #ffdcdc;

  background:var(--danger-bg);

  color:var(--danger);

  padding:16px;

  border-radius:14px;

  font-size:12px;

  font-weight:800;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  margin-top:5px;

  transition:.2s ease;

}


.logout-button:hover{

  background:#ffe7e7;

}


.logout-button:active{

  transform:scale(.98);

}


.logout-button:disabled{

  opacity:.6;

  cursor:not-allowed;

}


/* ==========================================
   VERSION
========================================== */

.version{

  text-align:center;

  color:#a0aaba;

  font-size:9px;

  margin-top:20px;

}


/* ==========================================
   MODAL
========================================== */

.modal{

  position:fixed;

  inset:0;

  background:rgba(7,31,64,.60);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:100;

  padding:15px;

}


.modal.show{

  display:flex;

}


.modal-box{

  background:var(--white);

  width:100%;

  max-width:600px;

  border-radius:23px;

  padding:21px;

  box-shadow:
    0 -10px 40px rgba(0,0,0,.15);

  animation:
    modalUp .22s ease;

}


@keyframes modalUp{

  from{

    transform:translateY(20px);

    opacity:0;

  }

  to{

    transform:translateY(0);

    opacity:1;

  }

}


.modal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;

}


.modal-header h2{

  font-size:17px;

  font-weight:800;

  color:var(--blue-dark);

}


.close-button{

  width:35px;

  height:35px;

  border:none;

  border-radius:50%;

  background:#f1f3f6;

  color:#555;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:.2s ease;

}


.close-button:hover{

  background:#e7ebf0;

}


/* ==========================================
   MODAL FORM
========================================== */

.field{

  margin-bottom:15px;

}


.field label{

  display:block;

  font-size:10px;

  font-weight:700;

  color:var(--blue-dark);

  margin-bottom:7px;

}


.password-wrap{

  position:relative;

}


.field input{

  width:100%;

  height:47px;

  border:1px solid #dce3ed;

  border-radius:11px;

  background:#fbfcfe;

  padding:0 43px 0 13px;

  font-size:12px;

  outline:none;

  color:var(--text);

  transition:.2s ease;

}


.field input:focus{

  border-color:var(--blue);

  background:var(--white);

  box-shadow:
    0 0 0 3px rgba(11,45,92,.06);

}


.toggle-password{

  position:absolute;

  right:12px;

  top:50%;

  transform:translateY(-50%);

  border:none;

  background:transparent;

  color:#7b8798;

  font-size:13px;

  padding:4px;

}


.modal-status{

  display:none;

  padding:11px;

  border-radius:10px;

  font-size:10px;

  font-weight:700;

  line-height:1.5;

  margin-bottom:13px;

}


.modal-status.show{

  display:block;

}


.modal-status.error{

  background:var(--danger-bg);

  color:var(--danger);

}


.modal-status.success{

  background:var(--success-bg);

  color:var(--success);

}


.save-button{

  width:100%;

  border:none;

  background:
    linear-gradient(
      135deg,
      #0d3c78,
      #071f40
    );

  color:var(--white);

  height:47px;

  border-radius:11px;

  font-size:12px;

  font-weight:800;

  box-shadow:
    0 9px 20px rgba(7,31,64,.15);

}


.save-button:disabled{

  opacity:.6;

  cursor:not-allowed;

}


/* ==========================================
   BOTTOM NAV
========================================== */

.bottom-nav{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  height:72px;

  background:rgba(255,255,255,.97);

  border-top:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-around;

  z-index:50;

  backdrop-filter:blur(14px);

  -webkit-backdrop-filter:blur(14px);

}


.nav-item{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:4px;

  color:#8994a6;

  font-size:9px;

  font-weight:600;

  min-width:55px;

  transition:.2s ease;

}


.nav-item i{

  font-size:17px;

}


.nav-item.active{

  color:var(--blue);

}


.nav-item:hover{

  color:var(--blue);

}


/* ==========================================
   LOADING
========================================== */

.loading{

  text-align:center;

  padding:45px 20px;

  color:var(--muted);

}


.loading i{

  font-size:25px;

  color:var(--blue);

  margin-bottom:12px;

}


.loading p{

  font-size:11px;

}


/* ==========================================
   DESKTOP
========================================== */

@media(min-width:600px){

  .modal{

    align-items:center;

  }


  .modal-box{

    border-radius:23px;

  }

}

</style>

</head>


<body>


<!-- ==========================================
     FIREBASE
========================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>


<!-- ==========================================
     HEADER
========================================== -->

<header class="header">

<div class="header-title">
Profile
</div>


<button
  id="backButton"
  class="header-icon"
  type="button"
  aria-label="Back to dashboard"
>

<i class="fa-solid fa-arrow-left"></i>

</button>

</header>


<!-- ==========================================
     MAIN
========================================== -->

<main
  class="container"
  id="pageContent"
>

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

<p>
Loading your profile...
</p>

</div>

</main>


<!-- ==========================================
     CHANGE PASSWORD MODAL
========================================== -->

<div
  id="passwordModal"
  class="modal"
>

<div class="modal-box">


<div class="modal-header">

<h2>
Change Password
</h2>


<button
  id="closePasswordButton"
  class="close-button"
  type="button"
  aria-label="Close"
>

<i class="fa-solid fa-xmark"></i>

</button>

</div>


<div
  id="modalStatus"
  class="modal-status"
></div>


<div class="field">

<label for="currentPassword">
Current Password
</label>


<div class="password-wrap">

<input
  id="currentPassword"
  type="password"
  placeholder="Enter current password"
  autocomplete="current-password"
>


<button
  class="toggle-password"
  type="button"
  data-password="currentPassword"
  aria-label="Show current password"
>

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>


<div class="field">

<label for="newPassword">
New Password
</label>


<div class="password-wrap">

<input
  id="newPassword"
  type="password"
  placeholder="Enter new password"
  autocomplete="new-password"
>


<button
  class="toggle-password"
  type="button"
  data-password="newPassword"
  aria-label="Show new password"
>

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>


<div class="field">

<label for="confirmPassword">
Confirm New Password
</label>


<div class="password-wrap">

<input
  id="confirmPassword"
  type="password"
  placeholder="Confirm new password"
  autocomplete="new-password"
>


<button
  class="toggle-password"
  type="button"
  data-password="confirmPassword"
  aria-label="Show confirmation password"
>

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>


<button
  id="savePasswordButton"
  class="save-button"
  type="button"
>

Change Password

</button>


</div>

</div>


<!-- ==========================================
     BOTTOM NAV
========================================== -->

<nav class="bottom-nav">


<a
  href="dashboard.html"
  class="nav-item"
>

<i class="fa-solid fa-house"></i>

<span>
Home
</span>

</a>


<a
  href="dashboard.html#products"
  class="nav-item"
>

<i class="fa-solid fa-box"></i>

<span>
Products
</span>

</a>


<a
  href="orders.html"
  class="nav-item"
>

<i class="fa-solid fa-receipt"></i>

<span>
Orders
</span>

</a>


<a
  href="fund.html"
  class="nav-item"
>

<i class="fa-solid fa-wallet"></i>

<span>
Fund
</span>

</a>


<a
  href="profile.html"
  class="nav-item active"
>

<i class="fa-solid fa-user"></i>

<span>
Profile
</span>

</a>


</nav>


<script>

/* ==========================================
   USER
========================================== */

let currentUser = null;


/* ==========================================
   ELEMENTS
========================================== */

const pageContent =
document.getElementById(
  "pageContent"
);


const passwordModal =
document.getElementById(
  "passwordModal"
);


const logoutButtonId =
"logoutButton";


/* ==========================================
   AUTH
========================================== */

firebaseAuth.onAuthStateChanged(
function(user){

  if(!user){

    window.location.replace(
      "login.html"
    );

    return;

  }


  currentUser = user;

  renderProfile(user);

});


/* ==========================================
   RENDER PROFILE
========================================== */

function renderProfile(user){

  const displayName =
    user.displayName ||
    (
      user.email
      ? user.email.split("@")[0]
      : "Customer"
    );


  const firstLetter =
    displayName
      .charAt(0)
      .toUpperCase();


  pageContent.innerHTML = `

    <div class="profile-card">

      <div class="profile-top">

        <div class="avatar">

          ${escapeHTML(firstLetter)}

        </div>


        <div class="profile-info">

          <div class="profile-name">

            ${escapeHTML(displayName)}

          </div>


          <div class="profile-email">

            ${escapeHTML(user.email || "")}

          </div>


          <div class="verified">

            <i class="fa-solid ${
              user.emailVerified
              ? "fa-circle-check"
              : "fa-circle-exclamation"
            }"></i>

            ${
              user.emailVerified
              ? "Email verified"
              : "Email not verified"
            }

          </div>

        </div>

      </div>

    </div>


    <div class="section">

      <div class="section-title">

        Account

      </div>


      <button
        id="changePasswordButton"
        class="menu-item"
        type="button"
      >

        <div class="menu-icon">

          <i class="fa-solid fa-lock"></i>

        </div>


        <div class="menu-content">

          <strong>
            Change Password
          </strong>

          <span>
            Update your account password securely
          </span>

        </div>


        <div class="menu-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </button>


      <button
        id="ordersButton"
        class="menu-item"
        type="button"
      >

        <div class="menu-icon">

          <i class="fa-solid fa-receipt"></i>

        </div>


        <div class="menu-content">

          <strong>
            My Orders
          </strong>

          <span>
            View your purchased products
          </span>

        </div>


        <div class="menu-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </button>


      <button
        id="walletButton"
        class="menu-item"
        type="button"
      >

        <div class="menu-icon">

          <i class="fa-solid fa-wallet"></i>

        </div>


        <div class="menu-content">

          <strong>
            Wallet
          </strong>

          <span>
            View your wallet and add funds
          </span>

        </div>


        <div class="menu-arrow">

          <i class="fa-solid fa-chevron-right"></i>

        </div>

      </button>

    </div>


    <div class="section">

      <div class="section-title">

        Security

      </div>


      <div class="security-row">

        <div class="menu-icon">

          <i class="fa-solid fa-shield-halved"></i>

        </div>


        <div class="menu-content">

          <strong>
            Account Security
          </strong>

          <span>
            Your account is protected by Firebase Authentication
          </span>

        </div>


        <div class="security-status">

          ${
            user.emailVerified
            ? `
              <i class="fa-solid fa-circle-check"></i>
              Verified
            `
            : `
              <i class="fa-solid fa-circle-exclamation"></i>
              Unverified
            `
          }

        </div>

      </div>

    </div>


    <button
      id="${logoutButtonId}"
      class="logout-button"
      type="button"
    >

      <i class="fa-solid fa-right-from-bracket"></i>

      <span>
        Log Out
      </span>

    </button>


    <div class="version">

      Gentle Acct Store

    </div>

  `;


  /* ==========================================
     BUTTON EVENTS
  ========================================== */

  document
    .getElementById(
      "changePasswordButton"
    )
    .addEventListener(
      "click",
      openPasswordModal
    );


  document
    .getElementById(
      "ordersButton"
    )
    .addEventListener(
      "click",
      function(){

        window.location.href =
          "orders.html";

      }
    );


  document
    .getElementById(
      "walletButton"
    )
    .addEventListener(
      "click",
      function(){

        window.location.href =
          "fund.html";

      }
    );


  document
    .getElementById(
      logoutButtonId
    )
    .addEventListener(
      "click",
      logoutUser
    );

}


/* ==========================================
   LOGOUT
========================================== */

async function logoutUser(){

  const button =
    document.getElementById(
      logoutButtonId
    );


  if(button){

    button.disabled = true;

    button.innerHTML = `

      <i class="fa-solid fa-spinner fa-spin"></i>

      <span>
        Logging out...
      </span>

    `;

  }


  try{

    await firebaseAuth.signOut();


    const sessionKeys = [

      "currentUser",

      "firebaseUser",

      "user",

      "userSession",

      "loggedInUser",

      "gentleUser",

      "gentleAcctUser"

    ];


    sessionKeys.forEach(
      function(key){

        try{

          localStorage.removeItem(
            key
          );

        }catch(error){

          console.log(error);

        }

      }
    );


window.location.replace(
  "login.html"
);

  }catch(error){

    console.error(
      "LOGOUT ERROR:",
      error
    );


    if(button){

      button.disabled = false;

      button.innerHTML = `

        <i class="fa-solid fa-right-from-bracket"></i>

        <span>
          Log Out
        </span>

      `;

    }


    alert(
      "Logout failed. Please try again."
    );

  }

}


/* ==========================================
   CHANGE PASSWORD
========================================== */

function openPasswordModal(){

  passwordModal.classList.add(
    "show"
  );


  document
    .getElementById(
      "currentPassword"
    )
    .value = "";


  document
    .getElementById(
      "newPassword"
    )
    .value = "";


  document
    .getElementById(
      "confirmPassword"
    )
    .value = "";


  clearModalStatus();

}


function closePasswordModal(){

  passwordModal.classList.remove(
    "show"
  );

}


function showModalStatus(
  message,
  type
){

  const box =
    document.getElementById(
      "modalStatus"
    );


  box.className =
    "modal-status show " +
    type;


  box.textContent =
    message;

}


function clearModalStatus(){

  const box =
    document.getElementById(
      "modalStatus"
    );


  box.className =
    "modal-status";


  box.textContent = "";

}


async function changePassword(){

  if(!currentUser){

    return;

  }


  const currentPassword =
    document
      .getElementById(
        "currentPassword"
      )
      .value;


  const newPassword =
    document
      .getElementById(
        "newPassword"
      )
      .value;


  const confirmPassword =
    document
      .getElementById(
        "confirmPassword"
      )
      .value;


  if(!currentPassword){

    showModalStatus(
      "Please enter your current password.",
      "error"
    );

    return;

  }


  if(newPassword.length < 6){

    showModalStatus(
      "Your new password must be at least 6 characters.",
      "error"
    );

    return;

  }


  if(newPassword !== confirmPassword){

    showModalStatus(
      "Your new passwords do not match.",
      "error"
    );

    return;

  }


  if(newPassword === currentPassword){

    showModalStatus(
      "Your new password must be different.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "savePasswordButton"
    );


  try{

    button.disabled = true;

    button.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Changing...';


    const credential =
      firebase.auth.EmailAuthProvider
        .credential(
          currentUser.email,
          currentPassword
        );


    await currentUser
      .reauthenticateWithCredential(
        credential
      );


    await currentUser.updatePassword(
      newPassword
    );


    showModalStatus(
      "Password changed successfully.",
      "success"
    );


    document
      .getElementById(
        "currentPassword"
      )
      .value = "";


    document
      .getElementById(
        "newPassword"
      )
      .value = "";


    document
      .getElementById(
        "confirmPassword"
      )
      .value = "";


    setTimeout(
      closePasswordModal,
      1200
    );


  }catch(error){

    console.error(
      "PASSWORD ERROR:",
      error
    );


    let message =
      "Could not change your password.";


    if(
      error.code ===
      "auth/wrong-password" ||
      error.code ===
      "auth/invalid-credential"
    ){

      message =
        "Your current password is incorrect.";

    }


    if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
        "Too many attempts. Please try again later.";

    }


    if(
      error.code ===
      "auth/weak-password"
    ){

      message =
        "Your new password is too weak.";

    }


    showModalStatus(
      message,
      "error"
    );


  }finally{

    button.disabled = false;

    button.innerHTML =
      "Change Password";

  }

}


/* ==========================================
   PASSWORD VISIBILITY
========================================== */

document
  .querySelectorAll(
    ".toggle-password"
  )
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          const input =
            document.getElementById(
              button.dataset.password
            );


          const icon =
            button.querySelector(
              "i"
            );


          if(
            input.type ===
            "password"
          ){

            input.type =
              "text";

            icon.className =
              "fa-solid fa-eye-slash";

            button.setAttribute(
              "aria-label",
              "Hide password"
            );

          }else{

            input.type =
              "password";

            icon.className =
              "fa-solid fa-eye";

            button.setAttribute(
              "aria-label",
              "Show password"
            );

          }

        }
      );

    }
  );


/* ==========================================
   BACK BUTTON
========================================== */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "dashboard.html";

    }
  );


/* ==========================================
   CLOSE MODAL
========================================== */

document
  .getElementById(
    "closePasswordButton"
  )
  .addEventListener(
    "click",
    closePasswordModal
  );


passwordModal
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        passwordModal
      ){

        closePasswordModal();

      }

    }
  );


/* ==========================================
   SAVE PASSWORD
========================================== */

document
  .getElementById(
    "savePasswordButton"
  )
  .addEventListener(
    "click",
    changePassword
  );


/* ==========================================
   HTML SAFETY
========================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
