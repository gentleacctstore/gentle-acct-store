
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563EB">
<meta name="description" content="Manage your Gentle Acct Store profile, orders, wallet, security and appearance.">
<title>Profile - Gentle Acct Store</title>

<script>
(function(){
  try {
    const t = localStorage.getItem("gentle-acct-store-theme");
    if(t === "dark") document.documentElement.classList.add("dark-mode");
  } catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<style>
:root{
  --blue:#2563EB;
  --blue-dark:#1D4ED8;
  --blue-light:#EFF6FF;
  --blue-soft:#F8FAFC;
  --white:#FFFFFF;
  --text:#172033;
  --muted:#748093;
  --border:#E2E8F0;
  --danger:#DC2626;
  --danger-bg:#FFF1F1;
  --success:#15803D;
  --success-bg:#EDF8F1;
  --shadow:0 8px 25px rgba(37,99,235,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:radial-gradient(circle at top right,rgba(37,99,235,.07),transparent 32%),var(--blue-soft);
  color:var(--text);
  font-family:"Poppins",sans-serif;
  padding-bottom:88px;
  transition:background .2s,color .2s;
}
button,input{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{
  outline:3px solid rgba(37,99,235,.3);outline-offset:3px;
}
.header{
  min-height:65px;background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 17px;position:sticky;top:0;
  z-index:30;backdrop-filter:blur(14px);
}
.header-title{font-size:17px;font-weight:800;color:var(--text)}
.header-icon{
  width:40px;height:40px;border:0;border-radius:12px;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.container{width:100%;max-width:600px;margin:auto;padding:20px 15px 35px}
.profile-card{
  position:relative;overflow:hidden;background:linear-gradient(135deg,#2563EB,#1D4ED8);
  color:white;border-radius:22px;padding:25px 20px;
  box-shadow:0 13px 30px rgba(37,99,235,.2);margin-bottom:16px;
}
.profile-card:before,.profile-card:after{
  content:"";position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.08);
}
.profile-card:before{width:180px;height:180px;right:-75px;top:-95px}
.profile-card:after{width:125px;height:125px;right:55px;bottom:-95px}
.profile-top{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.avatar{
  width:65px;height:65px;border-radius:19px;background:white;color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:25px;
  font-weight:800;flex-shrink:0;box-shadow:0 7px 18px rgba(0,0,0,.1);
}
.profile-info{min-width:0}
.profile-name{font-size:18px;font-weight:800;margin-bottom:4px;overflow-wrap:anywhere}
.profile-email{font-size:10px;opacity:.9;overflow-wrap:anywhere}
.verified{
  display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;
  margin-top:9px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.16);padding:6px 9px;border-radius:8px;
}
.section{
  background:white;border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
}
.section-title{padding:17px 17px 12px;font-size:13px;font-weight:800;color:var(--text)}
.menu-item{
  width:100%;background:white;border:0;border-top:1px solid #EDF1F5;
  padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;
  transition:background .2s;color:inherit;
}
.menu-item:hover{background:#F8FAFC}
.menu-item:active{background:var(--blue-light)}
.menu-icon{
  width:41px;height:41px;border-radius:12px;background:var(--blue-light);
  color:var(--blue);display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.menu-content{flex:1;min-width:0}
.menu-content strong{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px}
.menu-content span{display:block;font-size:10px;color:var(--muted);line-height:1.5}
.menu-arrow{color:#9AA5B5;font-size:10px}
.security-row{
  background:white;border-top:1px solid #EDF1F5;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.security-status{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;white-space:nowrap}
.security-status.good{color:var(--success)}
.security-status.warning{color:#A16207}
.logout-button{
  width:100%;border:1px solid #FFDCDC;background:var(--danger-bg);color:var(--danger);
  padding:15px;border-radius:13px;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:9px;margin-top:5px;
}
.logout-button:disabled{opacity:.6;cursor:not-allowed}
.version{text-align:center;color:#9AA5B5;font-size:9px;margin-top:20px}

/* APPEARANCE OPTIONS */
.theme-options{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;padding:5px 15px 17px;
}
.theme-option{
  border:2px solid var(--border);border-radius:14px;background:#fff;
  padding:12px 5px;display:flex;flex-direction:column;align-items:center;
  gap:9px;color:var(--text);font-size:11px;font-weight:700;
  transition:border-color .2s,transform .2s;min-width:0;
}
.theme-option:active{transform:scale(.97)}
.theme-option.selected{border-color:var(--blue);background:var(--blue-light)}
.theme-preview{
  width:100%;height:65px;border-radius:9px;padding:8px;
  display:flex;gap:5px;align-items:flex-start;border:1px solid #E2E8F0;
}
.preview-sidebar{width:20%;height:100%;border-radius:4px;background:#DBEAFE}
.preview-lines{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:3px}
.preview-lines i{height:5px;border-radius:5px;background:#CBD5E1;width:85%}
.preview-lines i:last-child{width:55%}
.theme-preview.dark-preview{background:#0B1120;border-color:#334155}
.dark-preview .preview-sidebar{background:#1D2D49}
.dark-preview .preview-lines i{background:#475569}
.theme-preview.blue-preview{background:#EFF6FF;border-color:#BFDBFE}
.blue-preview .preview-sidebar{background:#2563EB}
.blue-preview .preview-lines i{background:#93C5FD}
.theme-check{color:var(--blue);font-size:12px}
.theme-help{padding:0 17px 16px;color:var(--muted);font-size:10px;line-height:1.7}
.theme-notice{display:none;margin:0 15px 15px;padding:10px;border-radius:10px;background:var(--success-bg);color:var(--success);font-size:10px;font-weight:700}
.theme-notice.show{display:block}

/* PASSWORD MODAL */
.modal{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  display:none;align-items:flex-end;justify-content:center;z-index:100;padding:14px;
}
.modal.show{display:flex}
.modal-box{
  background:white;width:100%;max-width:500px;border-radius:22px;padding:21px;
  box-shadow:0 -10px 40px rgba(0,0,0,.15);animation:modalUp .2s ease;
  max-height:90vh;overflow-y:auto;
}
@keyframes modalUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-header h2{font-size:17px;font-weight:800;color:var(--text)}
.close-button{
  width:36px;height:36px;border:0;border-radius:50%;background:#F1F5F9;
  color:#475569;display:flex;align-items:center;justify-content:center;
}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;color:#334155;margin-bottom:7px}
.password-wrap{position:relative}
.field input{
  width:100%;height:47px;border:1px solid #DCE3ED;border-radius:11px;
  background:#FBFCFE;padding:0 44px 0 13px;font-size:12px;outline:none;color:var(--text);
}
.field input:focus{border-color:var(--blue);background:white;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.toggle-password{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:#7B8798;font-size:13px;padding:5px;
}
.modal-status{display:none;padding:11px;border-radius:10px;font-size:10px;font-weight:700;line-height:1.6;margin-bottom:13px}
.modal-status.show{display:block}
.modal-status.error{background:var(--danger-bg);color:var(--danger)}
.modal-status.success{background:var(--success-bg);color:var(--success)}
.save-button{
  width:100%;border:0;background:var(--blue);color:white;height:47px;
  border-radius:11px;font-size:12px;font-weight:800;
}
.save-button:disabled{opacity:.6;cursor:not-allowed}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:72px;
  background:rgba(255,255,255,.97);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;z-index:50;
  backdrop-filter:blur(14px);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;color:#8994A6;font-size:9px;font-weight:600;min-width:55px;
}
.nav-item i{font-size:17px}
.nav-item.active,.nav-item:hover{color:var(--blue)}
.loading{text-align:center;padding:45px 20px;color:var(--muted)}
.loading i{display:block;font-size:25px;color:var(--blue);margin-bottom:12px}
.loading p{font-size:11px;line-height:1.7}

/* DARK MODE */
html.dark-mode,html.dark-mode body{background:#0B1120;color:#E5EAF5}
html.dark-mode .header{background:rgba(15,23,42,.97);border-bottom-color:#26334A}
html.dark-mode .header-title{color:#E5EAF5}
html.dark-mode .header-icon{background:#1D2D49;color:#7DB2FF}
html.dark-mode .section,html.dark-mode .menu-item,html.dark-mode .security-row{background:#151F33;border-color:#2B3A54}
html.dark-mode .section-title,html.dark-mode .menu-content strong{color:#E5EAF5}
html.dark-mode .menu-item{border-top-color:#2B3A54}
html.dark-mode .menu-item:hover{background:#1B2940}
html.dark-mode .menu-item:active{background:#203455}
html.dark-mode .menu-icon{background:#1D2D49;color:#7DB2FF}
html.dark-mode .menu-content span{color:#A5B4CC}
html.dark-mode .menu-arrow{color:#8493AB}
html.dark-mode .security-row{border-top-color:#2B3A54}
html.dark-mode .profile-card{background:linear-gradient(135deg,#173A83,#1D4ED8)}
html.dark-mode .logout-button{background:#351D2A;border-color:#653040;color:#FDA4AF}
html.dark-mode .version{color:#8493AB}
html.dark-mode .modal{background:rgba(0,0,0,.7)}
html.dark-mode .modal-box{background:#151F33;color:#E5EAF5;border:1px solid #2B3A54}
html.dark-mode .modal-header h2{color:#E5EAF5}
html.dark-mode .close-button{background:#26334A;color:#D6E0F0}
html.dark-mode .field label{color:#D6E0F0}
html.dark-mode .field input{background:#0B1120;border-color:#344765;color:#F1F5F9}
html.dark-mode .field input:focus{background:#101A2D;border-color:#60A5FA}
html.dark-mode .toggle-password{color:#A5B4CC}
html.dark-mode .modal-status.error{background:#351D2A;color:#FDA4AF}
html.dark-mode .modal-status.success{background:#153526;color:#86EFAC}
html.dark-mode .bottom-nav{background:rgba(15,23,42,.98);border-top-color:#26334A}
html.dark-mode .nav-item{color:#A5B4CC}
html.dark-mode .nav-item.active,html.dark-mode .nav-item:hover{color:#7DB2FF}
html.dark-mode .loading{color:#A5B4CC}
html.dark-mode .loading i{color:#7DB2FF}
html.dark-mode .theme-option{background:#151F33;color:#E5EAF5;border-color:#344765}
html.dark-mode .theme-option.selected{background:#1D2D49;border-color:#7DB2FF}
html.dark-mode .theme-help{color:#A5B4CC}
html.dark-mode .theme-notice{background:#153526;color:#86EFAC}

/* BLUE MODE */
html.blue-mode:not(.dark-mode) body{
  background:radial-gradient(circle at top right,rgba(37,99,235,.15),transparent 35%),#EAF2FF;
}
html.blue-mode:not(.dark-mode) .section{border-color:#C8DAFA}
html.blue-mode:not(.dark-mode) .header,
html.blue-mode:not(.dark-mode) .bottom-nav{background:rgba(239,246,255,.97)}
html.blue-mode:not(.dark-mode) .theme-option.selected{background:#DBEAFE}

@media(min-width:600px){.modal{align-items:center}.modal-box{border-radius:22px}}
@media(max-width:360px){
  .container{padding:16px 11px 30px}
  .profile-card{padding:21px 15px}
  .avatar{width:56px;height:56px;border-radius:16px}
  .profile-name{font-size:16px}
  .security-row{gap:8px;padding:12px}
  .security-status{font-size:8px}
  .theme-options{gap:6px;padding-left:10px;padding-right:10px}
  .theme-option{font-size:10px}
}
</style>
</head>

<body>
<header class="header">
  <div class="header-title">My Profile</div>
  <button id="backButton" class="header-icon" type="button" aria-label="Back to dashboard">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
</header>

<main class="container" id="pageContent">
  <div class="loading">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Loading your profile...</p>
  </div>
</main>

<div id="passwordModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="passwordTitle">Change Password</h2>
      <button id="closePasswordButton" class="close-button" type="button" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="modalStatus" class="modal-status" role="status" aria-live="polite"></div>

    <div class="field">
      <label for="currentPassword">Current Password</label>
      <div class="password-wrap">
        <input id="currentPassword" type="password" placeholder="Enter current password" autocomplete="current-password">
        <button class="toggle-password" type="button" data-password="currentPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>
    <div class="field">
      <label for="newPassword">New Password</label>
      <div class="password-wrap">
        <input id="newPassword" type="password" placeholder="At least 6 characters" autocomplete="new-password">
        <button class="toggle-password" type="button" data-password="newPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-wrap">
        <input id="confirmPassword" type="password" placeholder="Enter new password again" autocomplete="new-password">
        <button class="toggle-password" type="button" data-password="confirmPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>
    <button id="savePasswordButton" class="save-button" type="button">Change Password</button>
  </div>
</div>

<nav class="bottom-nav" aria-label="Main navigation">
  <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="dashboard.html#products" class="nav-item"><i class="fa-solid fa-box"></i><span>Products</span></a>
  <a href="orders.html" class="nav-item"><i class="fa-solid fa-receipt"></i><span>Orders</span></a>
  <a href="fund.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>Fund</span></a>
  <a href="profile.html" class="nav-item active" aria-current="page"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script>
"use strict";

let currentUser = null;
const pageContent = document.getElementById("pageContent");
const passwordModal = document.getElementById("passwordModal");
const modalStatus = document.getElementById("modalStatus");
const savePasswordButton = document.getElementById("savePasswordButton");

const THEME_KEY = "gentle-acct-store-theme";
let activeThemeUserKey = null;
let selectedTheme = "light";

function getUserThemeKey(user){
  return "gentle-acct-store-theme-user-" + user.uid;
}

function readTheme(key){
  try { return localStorage.getItem(key); }
  catch(e){ return null; }
}

function writeTheme(key,value){
  try { localStorage.setItem(key,value); }
  catch(e){ console.warn("Could not save theme preference.",e); }
}

function applyTheme(theme){
  selectedTheme = ["light","dark","blue"].includes(theme) ? theme : "light";

  const root = document.documentElement;
  root.classList.toggle("dark-mode",selectedTheme === "dark");
  root.classList.toggle("blue-mode",selectedTheme === "blue");

  if(document.body){
    document.body.classList.toggle("dark-mode",selectedTheme === "dark");
    document.body.classList.toggle("blue-mode",selectedTheme === "blue");
  }

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta){
    meta.setAttribute("content",selectedTheme === "dark" ? "#0B1120" : selectedTheme === "blue" ? "#1D4ED8" : "#2563EB");
  }

  document.querySelectorAll(".theme-option").forEach(function(button){
    const isSelected = button.dataset.theme === selectedTheme;
    button.classList.toggle("selected",isSelected);
    button.setAttribute("aria-pressed",String(isSelected));
    const check = button.querySelector(".theme-check");
    if(check) check.style.visibility = isSelected ? "visible" : "hidden";
  });
}

function loadUserTheme(user){
  activeThemeUserKey = getUserThemeKey(user);
  let theme = readTheme(activeThemeUserKey);

  if(!["light","dark","blue"].includes(theme)){
    const oldTheme = readTheme(THEME_KEY);
    theme = oldTheme === "dark" ? "dark" : "light";
    writeTheme(activeThemeUserKey,theme);
  }

  selectedTheme = theme;
  applyTheme(theme);

  // Existing pages use the shared light/dark setting.
  // Blue mode uses the existing light theme on those pages.
  writeTheme(THEME_KEY,theme === "dark" ? "dark" : "light");
}

function chooseTheme(theme){
  if(!currentUser) return;

  if(!["light","dark","blue"].includes(theme)) return;

  selectedTheme = theme;
  writeTheme(getUserThemeKey(currentUser),theme);
  writeTheme(THEME_KEY,theme === "dark" ? "dark" : "light");
  applyTheme(theme);

  const notice = document.getElementById("themeNotice");
  if(notice){
    notice.textContent = "Your appearance preference has been saved.";
    notice.classList.add("show");
    clearTimeout(window.themeNoticeTimer);
    window.themeNoticeTimer = setTimeout(function(){
      notice.classList.remove("show");
    },2200);
  }
}

window.addEventListener("storage",function(event){
  if(event.key === THEME_KEY || event.key === activeThemeUserKey){
    if(currentUser){
      const saved = readTheme(activeThemeUserKey);
      if(["light","dark","blue"].includes(saved)){
        selectedTheme = saved;
        applyTheme(saved);
      }else{
        applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
      }
    }else{
      applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
    }
  }
});

function syncCurrentUserTheme(){
  if(currentUser && activeThemeUserKey){
    const saved = readTheme(activeThemeUserKey);
    if(["light","dark","blue"].includes(saved)) applyTheme(saved);
    else applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
  }else{
    applyTheme(readTheme(THEME_KEY) === "dark" ? "dark" : "light");
  }
}
window.addEventListener("pageshow",syncCurrentUserTheme);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden) syncCurrentUserTheme();
});

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

firebaseAuth.onAuthStateChanged(function(user){
  if(!user){
    window.location.replace("login.html");
    return;
  }
  currentUser = user;
  loadUserTheme(user);
  renderProfile(user);
});

function renderProfile(user){
  const displayName = user.displayName || (user.email ? user.email.split("@")[0] : "Customer");
  const firstLetter = displayName.charAt(0).toUpperCase();

  pageContent.innerHTML = `
    <div class="profile-card">
      <div class="profile-top">
        <div class="avatar">${escapeHTML(firstLetter)}</div>
        <div class="profile-info">
          <div class="profile-name">${escapeHTML(displayName)}</div>
          <div class="profile-email">${escapeHTML(user.email || "")}</div>
          <div class="verified">
            <i class="fa-solid ${user.emailVerified ? "fa-circle-check" : "fa-circle-exclamation"}"></i>
            ${user.emailVerified ? "Email verified" : "Email not verified"}
          </div>
        </div>
      </div>
    </div>

    <section class="section" id="appearanceSection">
      <div class="section-title"><i class="fa-solid fa-palette" style="color:var(--blue);margin-right:7px"></i>Appearance &amp; Theme</div>
      <div class="theme-options">
        <button type="button" class="theme-option" data-theme="light" aria-pressed="false">
          <span class="theme-preview">
            <span class="preview-sidebar"></span>
            <span class="preview-lines"><i></i><i></i><i></i></span>
          </span>
          <span>Light</span>
          <i class="fa-solid fa-circle-check theme-check" style="visibility:hidden"></i>
        </button>
        <button type="button" class="theme-option" data-theme="dark" aria-pressed="false">
          <span class="theme-preview dark-preview">
            <span class="preview-sidebar"></span>
            <span class="preview-lines"><i></i><i></i><i></i></span>
          </span>
          <span>Dark</span>
          <i class="fa-solid fa-circle-check theme-check" style="visibility:hidden"></i>
        </button>
        <button type="button" class="theme-option" data-theme="blue" aria-pressed="false">
          <span class="theme-preview blue-preview">
            <span class="preview-sidebar"></span>
            <span class="preview-lines"><i></i><i></i><i></i></span>
          </span>
          <span>Blue</span>
          <i class="fa-solid fa-circle-check theme-check" style="visibility:hidden"></i>
        </button>
      </div>
      <p class="theme-help">Choose how Gentle Acct Store looks on your device. Your choice is saved for this signed-in account in this browser.</p>
      <div id="themeNotice" class="theme-notice" role="status" aria-live="polite"></div>
    </section>

    <section class="section">
      <div class="section-title">Account</div>
      <button id="changePasswordButton" class="menu-item" type="button">
        <div class="menu-icon"><i class="fa-solid fa-lock"></i></div>
        <div class="menu-content"><strong>Change Password</strong><span>Update your account password securely</span></div>
        <div class="menu-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </button>
      <button id="ordersButton" class="menu-item" type="button">
        <div class="menu-icon"><i class="fa-solid fa-receipt"></i></div>
        <div class="menu-content"><strong>My Orders</strong><span>View your purchased products</span></div>
        <div class="menu-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </button>
      <button id="walletButton" class="menu-item" type="button">
        <div class="menu-icon"><i class="fa-solid fa-wallet"></i></div>
        <div class="menu-content"><strong>Wallet</strong><span>View your wallet and add funds</span></div>
        <div class="menu-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </button>
    </section>

    <section class="section">
      <div class="section-title">Security</div>
      <div class="security-row">
        <div class="menu-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="menu-content"><strong>Account Security</strong><span>Authentication is managed by Firebase</span></div>
        <div class="security-status ${user.emailVerified ? "good" : "warning"}">
          <i class="fa-solid ${user.emailVerified ? "fa-circle-check" : "fa-circle-exclamation"}"></i>
          ${user.emailVerified ? "Verified" : "Unverified"}
        </div>
      </div>

    <button id="logoutButton" class="logout-button" type="button">
      <i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span>

  `;

  document.querySelectorAll(".theme-option").forEach(function(button){
    button.addEventListener("click",function(){
      chooseTheme(button.dataset.theme);
    });
  });
  applyTheme(selectedTheme);

  document.getElementById("changePasswordButton").addEventListener("click",openPasswordModal);
  document.getElementById("ordersButton").addEventListener("click",function(){window.location.href="orders.html";});
  document.getElementById("walletButton").addEventListener("click",function(){window.location.href="fund.html";});
  document.getElementById("logoutButton").addEventListener("click",logoutUser);
}

async function logoutUser(){
  const button = document.getElementById("logoutButton");
  if(button){
    button.disabled = true;
    button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Logging out...</span>';
  }
  try{
    await firebaseAuth.signOut();
    window.location.replace("login.html");
  }catch(error){
    console.error("LOGOUT ERROR:",error);
    if(button){
      button.disabled = false;
      button.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span>';
    }
    alert("Logout failed. Please try again.");
  }
}

function openPasswordModal(){
  passwordModal.classList.add("show");
  document.getElementById("currentPassword").value="";
  document.getElementById("newPassword").value="";
  document.getElementById("confirmPassword").value="";
  clearModalStatus();
  document.getElementById("currentPassword").focus();
}
function closePasswordModal(){passwordModal.classList.remove("show");}
function showModalStatus(text,type){
  modalStatus.className="modal-status show "+type;
  modalStatus.textContent=text;
}
function clearModalStatus(){
  modalStatus.className="modal-status";
  modalStatus.textContent="";
}

async function changePassword(){
  if(!currentUser || !currentUser.email){
    showModalStatus("Please sign in again before changing your password.","error");
    return;
  }

  const currentPassword=document.getElementById("currentPassword").value;
  const newPassword=document.getElementById("newPassword").value;
  const confirmPassword=document.getElementById("confirmPassword").value;

  if(!currentPassword){showModalStatus("Please enter your current password.","error");return;}
  if(newPassword.length<6){showModalStatus("Your new password must be at least 6 characters.","error");return;}
  if(newPassword!==confirmPassword){showModalStatus("Your new passwords do not match.","error");return;}
  if(newPassword===currentPassword){showModalStatus("Your new password must be different.","error");return;}

  try{
    savePasswordButton.disabled=true;
    savePasswordButton.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Changing...';

    const credential=firebase.auth.EmailAuthProvider.credential(currentUser.email,currentPassword);
    await currentUser.reauthenticateWithCredential(credential);
    await currentUser.updatePassword(newPassword);

    showModalStatus("Password changed successfully.","success");
    document.getElementById("currentPassword").value="";
    document.getElementById("newPassword").value="";
    document.getElementById("confirmPassword").value="";
    setTimeout(closePasswordModal,1200);
  }catch(error){
    console.error("PASSWORD ERROR:",error);
    let message="Could not change your password. Please try again.";
    if(error.code==="auth/wrong-password" || error.code==="auth/invalid-credential") message="Your current password is incorrect.";
    else if(error.code==="auth/too-many-requests") message="Too many attempts. Please try again later.";
    else if(error.code==="auth/weak-password") message="Your new password is too weak.";
    else if(error.code==="auth/requires-recent-login") message="Please sign in again, then change your password.";
    else if(error.code==="auth/network-request-failed") message="Network error. Check your internet connection and try again.";
    showModalStatus(message,"error");
  }finally{
    savePasswordButton.disabled=false;
    savePasswordButton.textContent="Change Password";
  }
}

document.querySelectorAll(".toggle-password").forEach(function(button){
  button.addEventListener("click",function(){
    const input=document.getElementById(button.dataset.password);
    const icon=button.querySelector("i");
    const showing=input.type==="password";
    input.type=showing?"text":"password";
    icon.className=showing?"fa-solid fa-eye-slash":"fa-solid fa-eye";
    button.setAttribute("aria-label",showing?"Hide password":"Show password");
  });
});

document.getElementById("backButton").addEventListener("click",function(){
  window.location.href="dashboard.html";
});
document.getElementById("closePasswordButton").addEventListener("click",closePasswordModal);
savePasswordButton.addEventListener("click",changePassword);
passwordModal.addEventListener("click",function(event){
  if(event.target===passwordModal) closePasswordModal();
});
document.addEventListener("keydown",function(event){
  if(event.key==="Escape" && passwordModal.classList.contains("show")) closePasswordModal();
});
</script>
</body>
</html>
