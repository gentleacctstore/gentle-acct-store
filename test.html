<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Connection Test</title>
  
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #f5f9ff;
      font-family: Arial, sans-serif;
      color: #10213b;
    }
    
    .card {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }
    
    h1 {
      font-size: 23px;
    }
    
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1264e8;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }
    
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f5f9;
      word-break: break-word;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  
  <div class="card">
    
    <h1>Supabase Connection Test</h1>
    
    <p>This page only tests the connection. It does not create an account.</p>
    
    <button onclick="testConnection()">
      Test Supabase Connection
    </button>
    
    <div id="result">
      Waiting for test...
    </div>
    
  </div>
  
  <script>
    const SUPABASE_URL =
      "https://fbeibzungcyhcgmidpw.supabase.co";
    
    const SUPABASE_KEY =
      "sb_publishable_6eVFrykVcHc6OQOcPhH3Fg_WQbAe7u3";
    
    async function testConnection() {
      
      const result =
        document.getElementById("result");
      
      result.innerHTML =
        "Testing connection...";
      
      try {
        
        const response =
          await fetch(
            SUPABASE_URL + "/auth/v1/settings",
            {
              method: "GET",
              
              headers: {
                "apikey": SUPABASE_KEY
              }
            }
          );
        
        const text =
          await response.text();
        
        result.innerHTML =
          "<strong>Connection reached Supabase.</strong><br><br>" +
          "HTTP Status: " +
          response.status +
          "<br><br>" +
          text;
        
      }
      
      catch (error) {
        
        result.innerHTML =
          "<strong>CONNECTION FAILED</strong><br><br>" +
          "Error: " +
          error.message;
        
        console.error(error);
        
      }
      
    }
  </script>
  
</body>

</html>
