<style>

body{

}

margin-top:4px;

}

.checkout-card{

background:var(--white);

border:1px solid var(--border);

border-radius:19px;

padding:18px;

box-shadow:var(--shadow);

margin-bottom:14px;

}

.card-title{

display:flex;

align-items:center;

gap:9px;

font-size:14px;

font-weight:800;

color:var(--blue-dark);

margin-bottom:16px;

}

.card-title i{

}

.wallet-box{

color:var(--white);

margin-bottom:3px;

}

}

}

gap:8px;

font-size:11px;

}

display:flex;

align-items:flex-start;

gap:9px;

border:1px solid var(--border);

}

.notice i{

font-size:12px;

}

.pay-btn{

width:100%;

border:none;

background:var(--blue);

color:var(--white);

border-radius:12px;

padding:14px;

font-size:13px;

font-weight:800;

margin-top:17px;

transition:.2s;

}

.pay-btn:hover{

background:var(--blue-dark);

}

.pay-btn:disabled{

opacity:.55;

cursor:not-allowed;

}

.pay-btn i{

margin-right:5px;

}

.fund-link{

display:block;

text-align:center;

margin-top:11px;

font-size:10px;

font-weight:700;

color:var(--blue);

}

.loading{

background:var(--white);

border:1px solid var(--border);

border-radius:19px;

padding:35px 20px;

}

.loading i{

color:var(--blue);

}

}

border:1px solid #f0d5d5;

}

}

display:block;

}

.success-icon{

width:72px;

height:72px;

border-radius:50%;

background:var(--blue-light);

color:var(--blue);

display:flex;

align-items:center;

justify-content:center;

margin:0 auto 15px;

font-size:30px;

}

.success h1{

font-size:21px;

font-weight:800;

color:var(--blue-dark);

margin-bottom:5px;

}

.success > p{

font-size:10px;

color:var(--muted);

margin-bottom:17px;

}

.purchase-card{

background:var(--white);

border:1px solid var(--border);

border-radius:18px;

padding:18px;

text-align:left;

}

.purchase-label{

font-size:11px;

font-weight:700;

color:var(--muted);

margin-bottom:9px;

}

.purchase-item{

background:var(--blue-light);

color:var(--blue-dark);

border-radius:13px;

padding:16px;

font-size:15px;

font-weight:800;

line-height:1.6;

word-break:break-word;

white-space:pre-wrap;

}

.success-buttons{

display:grid;

grid-template-columns:1fr 1fr;

gap:9px;

margin-top:15px;

}

.success-btn{

border:none;

border-radius:10px;

padding:12px;

font-size:10px;

font-weight:700;

}

.success-btn.primary{

background:var(--blue);

color:var(--white);

}

.success-btn.secondary{

background:var(--blue-light);

color:var(--blue);

}

.toast{

position:fixed;

left:50%;

bottom:25px;

transform:translate(-50%,20px);

transition:.25s;

z-index:200;

}

.toast.show{

opacity:1;

visibility:visible;

transform:translate(-50%,0);

}

background:#eef3f8;

<div class="page">

<header>

<div class="header-left">

<button
class="back-btn"
type="button"
onclick="goBack()"
>

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="header-title">
Checkout
</div>

</div>

</div>

<div id="checkoutContent">

</p>

id="successContent"
class="success"
>

</h1>

<p>

</p>

id="successPurchaseItem"
class="purchase-item"
>

</div>

class="success-btn primary"

onclick="window.location.href='orders.html'"
>

id="toast"

<script>

let currentUser = null;

let selectedProduct = null;

let walletBalance = 0;

const urlParams =
new URLSearchParams(
window.location.search
);

const urlProductId =
urlParams.get("id");

const savedProductId =
localStorage.getItem(
"gentleCheckoutProduct"
);

const selectedId =
urlProductId ||
savedProductId;


/* =========================
   AUTH
========================= */

firebaseAuth.onAuthStateChanged(
async function(user){

if(!user){

window.location.replace(
"login.html"
);

return;

}

currentUser = user;

if(!selectedId){

showError(
"No product was selected."
);

return;

}

await loadCheckout();

});


/* =========================
   LOAD CHECKOUT
========================= */

async function loadCheckout(){

try{

const productRef =
firebaseDB
.collection("products")
.doc(selectedId);

const productSnapshot =
await productRef.get();

if(!productSnapshot.exists){

showError(
"This product is no longer available."
);

return;

}

const product =
productSnapshot.data();

selectedProduct = {

id:productSnapshot.id,

...product

};

const walletSnapshot =
await firebaseDB
.collection("wallets")
.doc(currentUser.uid)
.get();

if(walletSnapshot.exists){

walletBalance =
Number(
walletSnapshot.data().balance || 0
);

}else{

walletBalance = 0;

}

renderCheckout();

}catch(error){

console.error(
"CHECKOUT ERROR:",
error
);

showError(
error.message ||
"Unable to load checkout."
);

}

}


/* =========================
   RENDER CHECKOUT
========================= */

function renderCheckout(){

const container =
document.getElementById(
"checkoutContent"
);

const productName =
escapeHTML(
selectedProduct.name ||
"Product"
);

const category =
escapeHTML(
selectedProduct.category ||
"Product"
);

const price =
Number(
selectedProduct.price || 0
);

const stock =
Number(
selectedProduct.stockCount || 0
);


/* =====================================================
   PRODUCT IMAGE
===================================================== */

const rawProductName =
String(
selectedProduct.name ||
"Product"
);

const isFacebook =
rawProductName
.toLowerCase()
.includes("facebook");


let imageHTML = `

<i
class="fa-solid fa-box"
></i>

`;


/*
   Facebook product gets the Facebook icon
   automatically.
*/

if(isFacebook){

imageHTML = `

<i
class="fa-brands fa-facebook"
style="font-size:30px;"
></i>

`;

}


/*
   If a product image URL exists,
   try to display it.
   If it fails, Facebook falls back
   to the Facebook icon.
*/

if(selectedProduct.image){

const fallbackIcon =
isFacebook
? "fa-brands fa-facebook"
: "fa-solid fa-box";


imageHTML = `

<img
src="${escapeAttribute(
selectedProduct.image
)}"
alt="${productName}"
onerror="
this.style.display='none';
this.parentElement.innerHTML='<i class=&quot;${fallbackIcon}&quot; style=&quot;font-size:30px;&quot;></i>';
"
>

`;

}


const hasEnoughBalance =
walletBalance >= price;

const canBuy =
stock > 0 &&
hasEnoughBalance;

container.innerHTML = `

<div class="page-heading">

<h1>
Complete Purchase
</h1>

<p>
Review your order before confirming payment.
</p>

</div>

<div class="product-card">

<div class="product-image">

${imageHTML}

</div>

<div class="product-info">

<h2>
${productName}
</h2>

<span class="category">
${category}
</span>

<p>
${escapeHTML(
selectedProduct.description ||
"Digital product"
)}
</p>

<div class="product-price">

₦${price.toLocaleString("en-NG",{
minimumFractionDigits:2,
maximumFractionDigits:2
})}

</div>

</div>

</div>

<div class="checkout-card">

<div class="card-title">

<i class="fa-solid fa-wallet"></i>

Wallet

</div>

<div class="wallet-box">

<div>

<div class="wallet-label">
Available Balance
</div>

<div class="wallet-balance">
${formatMoney(walletBalance)}
</div>

</div>

<div class="wallet-icon">

<i class="fa-solid fa-wallet"></i>

</div>

</div>

<div class="card-title">

<i class="fa-solid fa-file-invoice"></i>

Order Summary

</div>

<div class="summary-row">

<span>
Product
</span>

<span>
${productName}
</span>

</div>

<div class="summary-row">

<span>
Quantity
</span>

<span>
1
</span>

</div>

<div class="summary-row">

<span>
Price
</span>

<span>
${formatMoney(price)}
</span>

</div>

<div class="summary-row total-row">

<span>
Total
</span>

<span>
${formatMoney(price)}
</span>

</div>

<div class="stock-box">

<i class="fa-solid fa-box"></i>

${
stock > 0
? stock +
" item" +
(stock === 1 ? "" : "s") +
" available"
: "This product is sold out"
}

</div>

<div class="notice">

<i class="fa-solid fa-circle-info"></i>

<div>
Your wallet balance will be used for this purchase.
Make sure your balance is sufficient before confirming.
</div>

</div>

${
!hasEnoughBalance
?

`

<div class="notice">

<i class="fa-solid fa-triangle-exclamation"></i>

<div>
Your wallet balance is not enough for this purchase.
</div>

</div>

<a
href="fund.html"
class="fund-link"
>

Fund Wallet

<i class="fa-solid fa-arrow-right"></i>

</a>

`

:

""

}

<button
id="payButton"
class="pay-btn"
type="button"
${canBuy ? "" : "disabled"}
>

<i class="fa-solid fa-lock"></i>

${
stock <= 0
? "Sold Out"
: !hasEnoughBalance
? "Insufficient Balance"
: "Confirm & Pay " +
formatMoney(price)
}

</button>

</div>

`;

const payButton =
document.getElementById("payButton");

if(payButton && canBuy){

payButton.addEventListener(
"click",
completePurchase
);

}

}


/* =========================
   COMPLETE PURCHASE
========================= */

async function completePurchase(){

const button =
document.getElementById("payButton");

if(!selectedProduct){

showToast(
"Product information is missing."
);

return;

}

const price =
Number(
selectedProduct.price || 0
);

if(walletBalance < price){

showToast(
"Insufficient wallet balance."
);

return;

}

if(Number(selectedProduct.stockCount || 0) <= 0){

showToast(
"This product is sold out."
);

return;

}

try{

button.disabled = true;

button.innerHTML = `
<i class="fa-solid fa-spinner fa-spin"></i>
Processing...
`;


/* FIND NEXT INVENTORY ITEM */

const inventoryQuery =
   await firebaseDB
   .collection("products")
   .doc(selectedProduct.id)
   .collection("inventory")
   .where("sold", "==", false)
   .get();

if (inventoryQuery.empty) {

   throw new Error(
      "This product has no available inventory."
   );

}


/*
Get the first available inventory item
according to its position.
*/

const inventoryDocs =
   inventoryQuery.docs.sort(
      function(a, b) {

         const positionA =
            Number(
               a.data().position || 0
            );

         const positionB =
            Number(
               b.data().position || 0
            );

         return positionA - positionB;

      }
   );

const inventoryDoc =
   inventoryDocs[0];

const inventoryRef =
inventoryDoc.ref;

const inventoryData =
inventoryDoc.data();

const purchaseItem =
String(
inventoryData.value || ""
).trim();

if(!purchaseItem){

throw new Error(
"The available inventory item is empty."
);

}


/* REFERENCES */

const productRef =
firebaseDB
.collection("products")
.doc(selectedProduct.id);

const walletRef =
firebaseDB
.collection("wallets")
.doc(currentUser.uid);

const orderRef =
firebaseDB
.collection("orders")
.doc();


let newBalance = 0;


/* ATOMIC PURCHASE */

await firebaseDB.runTransaction(
async function(transaction){

const walletSnapshot =
await transaction.get(walletRef);

const productSnapshot =
await transaction.get(productRef);

const inventorySnapshot =
await transaction.get(inventoryRef);


/* CHECK REQUIRED DOCUMENTS */

if(!walletSnapshot.exists){

throw new Error(
"Your wallet has not been created yet. Please contact support."
);

}

if(!productSnapshot.exists){

throw new Error(
"This product no longer exists."
);

}

if(!inventorySnapshot.exists){

throw new Error(
"The inventory item no longer exists."
);

}


const wallet =
walletSnapshot.data();

const product =
productSnapshot.data();

const inventory =
inventorySnapshot.data();


const currentBalance =
Number(
wallet.balance || 0
);

const currentStock =
Number(
product.stockCount || 0
);

const currentPrice =
Number(
product.price || 0
);


if(currentStock <= 0){

throw new Error(
"This product is sold out."
);

}

if(currentBalance < currentPrice){

throw new Error(
"Insufficient wallet balance."
);

}

if(inventory.sold === true){

throw new Error(
"This inventory item has already been purchased. Please try again."
);

}

const currentItem =
String(
inventory.value || ""
).trim();

if(!currentItem){

throw new Error(
"The inventory item is empty."
);

}

newBalance =
Number(
(currentBalance - currentPrice)
.toFixed(2)
);


/* WALLET — UPDATED */

transaction.update(
walletRef,
{

balance:newBalance,

updatedAt:
firebase.firestore
.FieldValue
.serverTimestamp(),

lastOrderId:
orderRef.id

}
);


/* PRODUCT STOCK — UPDATED */

transaction.update(
productRef,
{

stockCount:
currentStock - 1,

updatedAt:
firebase.firestore
.FieldValue
.serverTimestamp(),

lastOrderId:
orderRef.id

}
);


/* INVENTORY */

transaction.update(
inventoryRef,
{

sold:true,

soldTo:
currentUser.uid,

soldAt:
firebase.firestore
.FieldValue
.serverTimestamp(),

orderId:
orderRef.id

}
);


/* ORDER */

transaction.set(
orderRef,
{

userId:
currentUser.uid,

userEmail:
currentUser.email || "",

productId:
selectedProduct.id,

productName:
product.name || "",

amount:
currentPrice,

status:
"completed",

purchaseText:
currentItem,

inventoryId:
inventoryDoc.id,

createdAt:
firebase.firestore
.FieldValue
.serverTimestamp()

}
);

}
);


/* UPDATE LOCAL DATA */

walletBalance =
newBalance;

selectedProduct.stockCount =
Number(
selectedProduct.stockCount || 0
) - 1;


/* SHOW ONLY INVENTORY ITEM */

showSuccess(
purchaseItem
);

}catch(error){

console.error(
"PURCHASE ERROR:",
error
);

button.disabled = false;

button.innerHTML = `
<i class="fa-solid fa-lock"></i>
Confirm & Pay ${formatMoney(price)}
`;

showToast(
error.message ||
"Purchase could not be completed."
);

}

}


/* =========================
   SUCCESS
========================= */

function showSuccess(
purchaseItem
){

document
.getElementById("checkoutContent")
.style.display =
"none";

document
.getElementById("successContent")
.classList
.add("show");

document
.getElementById("successPurchaseItem")
.textContent =
purchaseItem ||
"No purchase information found.";

localStorage.removeItem(
"gentleCheckoutProduct"
);

}


/* =========================
   ERROR
========================= */

function showError(
message
){

document
.getElementById("checkoutContent")
.innerHTML = `

<div class="error-box">

<i class="fa-solid fa-triangle-exclamation"></i>

<h2>
Checkout unavailable
</h2>

<p>
${escapeHTML(message)}
</p>

<button
type="button"
onclick="window.location.href='dashboard.html'"
>

Back to Store

</button>

</div>

`;

}


/* =========================
   GO BACK
========================= */

function goBack(){

if(
document
.getElementById("successContent")
.classList
.contains("show")
){

window.location.href =
"dashboard.html";

return;

}

window.history.back();

}


/* =========================
   MONEY
========================= */

function formatMoney(
amount
){

return "₦" +
Number(amount || 0)
.toLocaleString(
"en-NG",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(
message
){

const toast =
document.getElementById("toast");

toast.textContent =
message;

toast.classList.add("show");

clearTimeout(
toastTimer
);

toastTimer =
setTimeout(
function(){

toast.classList.remove("show");

},
3000
);

}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
   ATTRIBUTE SAFETY
========================= */

function escapeAttribute(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
);

}

</script>
