<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password | Gentle Acct Store</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f5f9ff;
  color: #10213b;
  min-height: 100vh;
}

a {
  text-decoration: none;
}

header {
  height: 70px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid #e5ebf4;
}

.nav {
  max-width: 1100px;
  height: 100%;
  margin: auto;
  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;

  color: #10213b;
  font-size: 17px;
  font-weight: 800;
}

.logo-box {
  width: 38px;
  height: 38px;

  border-radius: 11px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(135deg,#0757d5,#1780ff);
  color: white;

  font-weight: 900;
  font-size: 18px;
}

.logo span {
  color: #1264e8;
}

.back {
  display: flex;
  align-items: center;
  gap: 7px;

  color: #1264e8;
  background: #f1f6ff;

  padding: 9px 13px;
  border-radius: 9px;

  font-size: 12px;
  font-weight: 800;
}

.page {
  min-height: calc(100vh - 70px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 35px 16px;
}

.card {
  width: 100%;
  max-width: 450px;

  background: white;

  border: 1px solid #e1e8f2;
  border-radius: 22px;

  padding: 34px 24px;

  box-shadow: 0 18px 50px rgba(20,50,90,.08);
}

.title {
  text-align: center;
}

.icon {
  width: 58px;
  height: 58px;

  margin: 0 auto 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #eaf3ff;
  color: #1264e8;

  border-radius: 17px;

  font-size: 22px;
}

.title h1 {
  font-size: 27px;
  color: #0b1d35;
}

.title p {
  color: #718096;
  font-size: 13px;

  line-height: 1.7;

  margin-top: 9px;
}

form {
  margin-top: 28px;
}

label {
  display: block;

  color: #243650;

  font-size: 12px;
  font-weight: 800;

  margin-bottom: 7px;
}

.input-wrap {
  position: relative;
}

.input-icon {
  position: absolute;

  left: 14px;
  top: 50%;

  transform: translateY(-50%);

  color: #7f91aa;
}

input {
  width: 100%;
  height: 50px;

  border: 1px solid #dbe4ef;
  border-radius: 11px;

  outline: none;

  padding: 0 14px 0 40px;

  font-size: 14px;

  color: #10213b;

  background: #fbfdff;
}

input:focus {
  border-color: #1264e8;

  background: white;

  box-shadow:
    0 0 0 3px rgba(18,100,232,.08);
}

input::placeholder {
  color: #9aa7b8;
}

.reset-btn {
  width: 100%;
  height: 50px;

  margin-top: 20px;

  border: 0;
  border-radius: 11px;

  background: linear-gradient(
    135deg,
    #0757d5,
    #1264e8
  );

  color: white;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 10px 22px rgba(18,100,232,.18);
}

.reset-btn:disabled {
  opacity: .7;
  cursor: wait;
}

.message {
  display: none;

  margin-top: 15px;

  padding: 13px;

  border-radius: 11px;

  font-size: 12px;

  line-height: 1.6;

  text-align: center;
}

.message.success {
  display: block;

  background: #effaf3;

  border: 1px solid #ccebd7;

  color: #237a43;
}

.message.error {
  display: block;

  background: #fff0f0;

  border: 1px solid #f3d1d1;

  color: #c53030;
}

.back-login {
  display: block;

  text-align: center;

  margin-top: 23px;

  color: #1264e8;

  font-size: 12px;

  font-weight: 800;
}

.note {
  display: flex;

  gap: 8px;

  margin-top: 24px;

  padding: 13px;

  border-radius: 11px;

  background: #f5f9ff;

  border: 1px solid #e1ebfa;

  color: #718096;

  font-size: 10px;

  line-height: 1.6;
}

.note i {
  color: #1264e8;
  margin-top: 2px;
}

@media (max-width:450px) {

  .logo {
    font-size: 15px;
  }

  .logo-box {
    width: 35px;
    height: 35px;
  }

  .card {
    padding: 30px 19px;
  }

  .title h1 {
    font-size: 25px;
  }

}

</style>

</head>

<body>

<header>

<nav class="nav">

<a href="index.html" class="logo">

<div class="logo-box">
G
</div>

Gentle <span>Acct</span> Store

</a>

<a href="login.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

Sign In

</a>

</nav>

</header>


<main class="page">

<div class="card">

<div class="title">

<div class="icon">

<i class="fa-solid fa-key"></i>

</div>

<h1>
Forgot Password?
</h1>

<p>
Enter your email address and we'll send you a secure link to reset your password.
</p>

</div>


<form id="resetForm">

<label for="email">
Email Address
</label>

<div class="input-wrap">

<i class="fa-solid fa-envelope input-icon"></i>

<input
  id="email"
  type="email"
  placeholder="Enter your email"
  autocomplete="email"
  required
>

</div>


<button
  type="submit"
  class="reset-btn"
  id="resetBtn"
>

<i class="fa-solid fa-paper-plane"></i>

Send Reset Link

</button>


<div
  id="message"
  class="message"
></div>

</form>


<a
  href="login.html"
  class="back-login"
>

<i class="fa-solid fa-arrow-left"></i>

Back to Sign In

</a>


<div class="note">

<i class="fa-solid fa-shield-halved"></i>

<span>
For your security, we'll show the same confirmation message whether or not an account exists with that email address.
</span>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const form =
  document.getElementById("resetForm");

const emailInput =
  document.getElementById("email");

const resetBtn =
  document.getElementById("resetBtn");

const message =
  document.getElementById("message");


function showMessage(text, type) {

  message.className =
    "message " + type;

  message.innerHTML = text;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    resetBtn.disabled = true;

    resetBtn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';


    message.className =
      "message";

    message.style.display =
      "none";


    try {

      const redirectUrl =
        window.location.origin +
        window.location.pathname
          .replace(
            "forgot-password.html",
            "update-password.html"
          );


      const {
        error
      } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo: redirectUrl
            }
          );


      if(error) {

        throw error;

      }


      showMessage(
        '<i class="fa-solid fa-circle-check"></i> ' +
        'If an account exists with this email, a password reset link has been sent. Please check your email.',
        "success"
      );


      emailInput.value = "";


    } catch(error) {

      console.error(error);


      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'Unable to send the reset email. Please check your email address and try again.',
        "error"
      );

    }


    resetBtn.disabled = false;

    resetBtn.innerHTML =
      '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';

  }
);

</script>

</body>
</html>
