
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C9232C">
<meta name="description" content="Reset your Gentle Acct Store account password securely.">
<title>Forgot Password | Gentle Acct Store</title>

<script>
(function(){
  try {
    const uid = localStorage.getItem("gentleCurrentUserId");
    const personal = uid
      ? localStorage.getItem("gentle-acct-store-theme-user-" + uid)
      : null;
    const theme = personal ||
      localStorage.getItem("gentle-acct-store-theme") || "light";

    document.documentElement.dataset.theme =
      ["light","dark","blue"].includes(theme) ? theme : "light";
  } catch(e) {
    document.documentElement.dataset.theme = "light";
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme:light;
  --green:#C9232C;
  --green-dark:#991B24;
  --green-border:#d6e6dc;
  --background:#FFFFFF;
  --text:#171717;
  --muted:#858585;
  --input:#f8faf9;
  --white:#fff;
  --shadow:0 18px 48px rgba(201,35,44,.08);
}

html[data-theme="dark"] {
  color-scheme:dark;
  --green:#4ade80;
  --green-dark:#166534;
  --green-border:#304a3a;
  --background:#0b1424;
  --text:#f1f5f9;
  --muted:#a7b4c8;
  --input:#0c1728;
  --white:#111d30;
  --shadow:0 18px 48px rgba(0,0,0,.22);
}

html[data-theme="blue"] {
  color-scheme:light;
  --green:#C9232C;
  --green-dark:#991B24;
  --green-border:#c9e4f2;
  --background:#FFFFFF;
  --text:#123047;
  --muted:#54758b;
  --input:#fff;
  --white:#f8fdff;
  --shadow:0 18px 48px rgba(201,35,44,.08);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html {
  -webkit-text-size-adjust:100%;
}

body {
  min-height:100vh;
  min-height:100dvh;
  padding:0 14px 25px;
  font-family:"Space Grotesk",sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 8% 12%,rgba(253,238,239,.65),transparent 32%),
    radial-gradient(ellipse at 100% 48%,rgba(253,238,239,.6),transparent 32%),
    radial-gradient(ellipse at 8% 100%,rgba(253,238,239,.5),transparent 30%),
    var(--background);
  transition:background .2s,color .2s;
}

a {
  color:inherit;
  text-decoration:none;
}

button,input {
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

/* Brand heading */
.brand {
  width:100%;
  max-width:650px;
  margin:0 auto;
  padding:100px 5px 42px;
  text-align:center;
}

.brand-name {
  color:var(--text);
  font-size:clamp(25px,5.8vw,35px);
  font-weight:800;
  letter-spacing:-1.5px;
  line-height:1.3;
}

.brand-name span {

}

.brand-tagline {

/* Main card */
.wrapper {

  max-width:650px;
  margin:0 auto;
}

.card {

}

/* Card heading */
.card-header {

  gap:16px;

/* Key icon */

.title {

/* Email form */
form {

label {

.input-wrap {

input {

  transition:border-color .2s,box-shadow .2s;
}

input::placeholder {

input:focus {
  border-color:#D96A70;

/* Submit button */
.reset-btn {

  margin-top:29px;

.reset-btn:disabled {

.message.error {

  background:#fff5f5;

}

/* Back to sign in */
.back-login {

  width:max-content;
  max-width:100%;
  margin:31px auto 0;
  color:var(--green);
  font-size:17px;
  font-weight:700;
  text-align:center;
}

.back-login:hover {

}

/* Footer */
.footer {

@media(max-width:370px) {

<body>

<header class="brand">
  <a href="index.html" class="brand-name">
    Gentle <span>Acct</span> Store
  </a>
  <p class="brand-tagline">PREMIUM ACCOUNT MARKETPLACE</p>
</header>

<main class="wrapper">
  <section class="card">

    <div class="card-header">
      <a href="login.html" class="header-back" aria-label="Back to sign in">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <div class="header-title">
        <i class="fa-solid fa-lock-open"></i>
        <span>Reset Password</span>
      </div>
    </div>

    <div class="card-content">

      <div class="icon-circle" aria-hidden="true">
        <i class="fa-solid fa-key"></i>
      </div>

      <div class="title">
        <h1>Forgot Password?</h1>
        <p>Enter your email and we'll send you a reset link.</p>
      </div>

      <form id="forgotForm" novalidate>
        <div>
          <label for="email">EMAIL ADDRESS</label>

          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email address"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              inputmode="email"
              maxlength="254"
              required
            >
          </div>
        </div>

        <button type="submit" id="resetButton" class="reset-btn">
          <span>Send Reset Link</span>
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
        </button>

        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>

      <a href="login.html" class="back-login">Back to Sign In</a>
    </div>
  </section>
</main>

<footer class="footer">
  © 2026 Gentle Acct Store · Premium Account Marketplace
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase.js"></script>

<script>
"use strict";

const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const resetButton = document.getElementById("resetButton");
const messageBox = document.getElementById("message");

const defaultButton =
  '<span>Send Reset Link</span><i class="fa-solid fa-paper-plane" aria-hidden="true"></i>';

function applySavedTheme() {
  try {
    const uid = localStorage.getItem("gentleCurrentUserId");
    const personal = uid
      ? localStorage.getItem("gentle-acct-store-theme-user-" + uid)
      : null;
    const theme = personal ||
      localStorage.getItem("gentle-acct-store-theme") || "light";
    document.documentElement.dataset.theme =
      ["light", "dark", "blue"].includes(theme) ? theme : "light";
  } catch(e) {
    document.documentElement.dataset.theme = "light";
  }
}

window.addEventListener("storage", function(event) {
  if (
    event.key === "gentle-acct-store-theme" ||
    event.key === "gentleCurrentUserId" ||
    (event.key && event.key.startsWith("gentle-acct-store-theme-user-"))
  ) applySavedTheme();
});
window.addEventListener("pageshow", applySavedTheme);

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "message " + type;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  if (resetButton.disabled) return;

  const email = emailInput.value.trim().toLowerCase();
  if (!email || !emailInput.validity.valid) {
    showMessage("Please enter a valid email address.", "error");
    emailInput.focus();
    return;
  }

  resetButton.disabled = true;
  resetButton.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i><span>Sending...</span>';
  messageBox.className = "message";

  try {
    const response = await fetch("/api/password-reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(result.error || "We couldn't send the reset email right now. Please try again.");
    }

    showMessage(
      "If an account is registered with that email, reset instructions will be sent. Check your inbox and spam folder.",
      "success"
    );
    form.reset();
  } catch(error) {
    console.error("Password reset request error:", error);
    showMessage(
      error.message || "We couldn't send the reset email right now. Please try again.",
      "error"
    );
  } finally {
    resetButton.disabled = false;
    resetButton.innerHTML = defaultButton;
  }
});

applySavedTheme();
</script>

</body>
</html>
