<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password - Gentle Acct Store</title>


<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  background:#f5f8fc;

  color:#071f40;

  font-family:'Poppins',sans-serif;

  display:flex;
  flex-direction:column;
}


/* =========================
   HEADER
========================= */

header{
  height:68px;

  background:white;

  border-bottom:1px solid #e4e9f0;
}

.nav{
  width:100%;
  max-width:1100px;

  height:100%;

  margin:auto;

  padding:0 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;

  gap:9px;

  text-decoration:none;

  color:#071f40;

  font-size:16px;

  font-weight:800;
}

.logo-box{
  width:37px;
  height:37px;

  border-radius:11px;

  background:#0b2d5c;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;

  font-weight:800;
}

.logo span{
  color:#0b2d5c;
}

.back{
  display:flex;
  align-items:center;

  gap:7px;

  padding:8px 12px;

  border-radius:9px;

  background:#edf3fa;

  color:#0b2d5c;

  text-decoration:none;

  font-size:11px;

  font-weight:700;
}


/* =========================
   PAGE
========================= */

.page{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px 15px 45px;
}


/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:430px;

  background:white;

  border:1px solid #e2e8f0;

  border-radius:22px;

  padding:31px 21px;

  box-shadow:
    0 15px 40px rgba(7,31,64,.08);
}


/* =========================
   TITLE
========================= */

.title{
  text-align:center;
}

.icon{
  width:58px;
  height:58px;

  margin:0 auto 16px;

  border-radius:17px;

  background:#edf3fa;

  color:#0b2d5c;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
}

.title h1{
  color:#071f40;

  font-size:24px;

  line-height:1.25;
}

.title p{
  color:#778196;

  font-size:12px;

  line-height:1.6;

  margin-top:8px;
}


/* =========================
   FORM
========================= */

form{
  margin-top:25px;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;

  color:#243650;

  font-size:11px;

  font-weight:700;

  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;

  left:13px;
  top:50%;

  transform:translateY(-50%);

  color:#8491a3;

  font-size:13px;
}

input{
  width:100%;

  height:49px;

  border:1px solid #dce3ed;

  border-radius:11px;

  outline:none;

  padding:0 13px 0 39px;

  background:#fbfcfe;

  color:#172033;

  font-family:'Poppins',sans-serif;

  font-size:12px;
}

input:focus{
  border-color:#0b2d5c;

  background:white;

  box-shadow:
    0 0 0 3px rgba(11,45,92,.07);
}

input::placeholder{
  color:#9aa4b3;
}


/* =========================
   BUTTON
========================= */

.reset-btn{
  width:100%;

  height:49px;

  border:none;

  border-radius:11px;

  background:#0b2d5c;

  color:white;

  font-family:'Poppins',sans-serif;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 9px 20px rgba(11,45,92,.16);
}

.reset-btn:active{
  transform:scale(.98);
}

.reset-btn:disabled{
  opacity:.65;

  cursor:not-allowed;
}


/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  margin-top:14px;

  padding:12px;

  border-radius:11px;

  font-size:10px;

  line-height:1.6;

  text-align:center;
}

.message.success{
  display:block;

  background:#eaf8f0;

  border:1px solid #ccebd9;

  color:#168447;
}

.message.error{
  display:block;

  background:#fff0f0;

  border:1px solid #ffd5d5;

  color:#c62828;
}


/* =========================
   BACK LOGIN
========================= */

.back-login{
  display:block;

  text-align:center;

  margin-top:20px;

  color:#0b2d5c;

  text-decoration:none;

  font-size:11px;

  font-weight:700;
}


/* =========================
   NOTE
========================= */

.note{
  display:flex;

  align-items:flex-start;

  gap:8px;

  margin-top:21px;

  padding:12px;

  border-radius:11px;

  background:#f5f8fc;

  border:1px solid #e2e8f0;

  color:#7b8595;

  font-size:9px;

  line-height:1.6;
}

.note i{
  color:#0b2d5c;

  margin-top:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:450px){

  .logo{
    font-size:14px;
  }

  .logo-box{
    width:35px;
    height:35px;
  }

  .card{
    padding:29px 18px;
  }

  .title h1{
    font-size:23px;
  }

}

</style>

</head>


<body>


<header>

<nav class="nav">


<a
  href="index.html"
  class="logo"
>

  <div class="logo-box">
    G
  </div>

  Gentle <span>Acct</span> Store

</a>


<a
  href="login.html"
  class="back"
>

  <i class="fa-solid fa-arrow-left"></i>

  Sign In

</a>


</nav>

</header>


<main class="page">


<div class="card">


<div class="title">


<div class="icon">

  <i class="fa-solid fa-key"></i>

</div>


<h1>
  Forgot Password?
</h1>


<p>
  Enter your email address and we'll send you a password reset link.
</p>


</div>


<form id="forgotForm">


<div class="field">


<label for="email">
  Email Address
</label>


<div class="input-wrap">


<i
  class="fa-solid fa-envelope input-icon"
></i>


<input
  id="email"
  type="email"
  placeholder="Enter your email address"
  autocomplete="email"
  required
>


</div>


</div>


<button
  type="submit"
  id="resetButton"
  class="reset-btn"
>

  <i class="fa-solid fa-paper-plane"></i>

  &nbsp; Send Reset Link

</button>


<div
  id="message"
  class="message"
></div>


</form>


<a
  href="login.html"
  class="back-login"
>

  <i class="fa-solid fa-arrow-left"></i>

  &nbsp; Back to Sign In

</a>


<div class="note">

  <i class="fa-solid fa-shield-halved"></i>

  <span>
    If an account exists with this email, Firebase will send a secure password reset email.
  </span>

</div>


</div>

</main>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "forgotForm"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const resetButton =
  document.getElementById(
    "resetButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  message.innerHTML =
    text;

  message.className =
    "message " + type;

}


/* =========================
   RESET PASSWORD
========================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      emailInput.value
        .trim();


    if(!email){

      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        'Please enter your email address.',
        "error"
      );

      return;

    }


    try{

      resetButton.disabled =
        true;


      resetButton.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';


      /*
        Firebase will send the
        password reset email.
      */

      await firebaseAuth
        .sendPasswordResetEmail(
          email
        );


      showMessage(
        '<i class="fa-solid fa-circle-check"></i> ' +
        'Password reset email sent. Check your inbox and follow the link to create your new password.',
        "success"
      );


      emailInput.value =
        "";


    }catch(error){

      console.error(
        "FORGOT PASSWORD ERROR:",
        error
      );


      let errorMessage =
        "We could not send the reset email. Please try again.";


      if(
        error.code ===
        "auth/invalid-email"
      ){

        errorMessage =
          "Please enter a valid email address.";

      }

      else if(
        error.code ===
        "auth/user-not-found"
      ){

        errorMessage =
          "No account was found with this email address.";

      }

      else if(
        error.code ===
        "auth/too-many-requests"
      ){

        errorMessage =
          "Too many requests. Please wait a little and try again.";

      }

      else if(
        error.code ===
        "auth/network-request-failed"
      ){

        errorMessage =
          "Network error. Please check your internet connection.";

      }


      showMessage(
        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        errorMessage,
        "error"
      );


    }finally{

      resetButton.disabled =
        false;


      resetButton.innerHTML =
        '<i class="fa-solid fa-paper-plane"></i> &nbsp; Send Reset Link';

    }

  }
);

</script>


</body>

</html>
