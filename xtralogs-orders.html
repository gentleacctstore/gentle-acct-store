<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFCFA"><title>XtraLogs Orders | GentleLogs</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>:root{--o:#E87535;--od:#C96532;--bg:#FFFCFA;--ink:#252A30;--muted:#9298A2;--line:#F0EEEB}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif}.wrap{width:min(100%,720px);margin:auto;padding-bottom:95px}.top{height:65px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0}.brand{font-size:22px;font-weight:700;text-decoration:none;color:inherit}.brand span{color:var(--o)}.top a:last-child{font-size:11px;color:var(--od);text-decoration:none;font-weight:700}.intro{padding:25px 20px 16px}.intro h1{font-size:23px;margin:0 0 5px}.intro p{font-size:11px;color:var(--muted);margin:0}.list{padding:0 20px;display:grid;gap:11px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.row{display:flex;justify-content:space-between;gap:10px;align-items:start}.order strong{font-size:12px}.amount{font-weight:700;color:var(--od);font-size:13px;white-space:nowrap}.meta{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.6}.status{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:7px;background:#F4F3F1;color:#68707A;font-size:9px;font-weight:700;text-transform:uppercase}.status.completed{background:#EAF7EF;color:#25804D}.status.failed_refunded{background:#FFF0EC;color:#B94A32}.status.processing,.status.pending{background:#FFF4E8;color:#A86B28}.delivery{margin-top:12px;padding:11px;background:#F8F7F5;border-radius:10px;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:12px;border:1px solid var(--line);background:#fff;border-radius:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);height:72px;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;border-top:1px solid var(--line)}.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9A9EA5;text-decoration:none;font-size:9px;font-weight:600}.nav a.active{color:var(--od)}.nav i{font-size:17px}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="home.html">Gentle<span>Logs</span></a><a href="xtralogs.html">Browse services</a></header><section class="intro"><h1>My XtraLogs orders</h1><p>Track your XtraLogs purchases and view delivery details.</p></section><section class="list" id="orders"><div class="empty">Loading your orders…</div></section></div><nav class="nav"><a href="home.html"><i class="fa-solid fa-house"></i>Home</a><a href="xtralogs.html"><i class="fa-solid fa-layer-group"></i>Services</a><a class="active" href="xtralogs-orders.html"><i class="fa-regular fa-clipboard"></i>Orders</a><a href="fund.html"><i class="fa-solid fa-wallet"></i>Wallet</a><a href="profile.html"><i class="fa-regular fa-user"></i>Account</a></nav><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase.js"></script><script>(()=>{const el=document.getElementById('orders');let user;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(n,c)=>(c==='USD'?'$':'₦')+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){try{const token=await user.getIdToken();const r=await fetch('/api/xtralogs/customer/orders',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load orders');const rows=d.orders||[];el.innerHTML=rows.length?rows.map(o=>{const status=String(o.status||'pending').toLowerCase().replace(/[^a-z0-9_-]/g,'');const date=o.createdAt?new Date(o.createdAt).toLocaleString():'';return `<article class="order"><div class="row"><strong>${safe(o.serviceName||'XtraLogs service')}</strong><span class="amount">${money(o.amount,o.currency)}</span></div><div class="meta">${safe(o.catalog)} · Order ${safe(o.id)}<br>${safe(date)}</div><span class="status ${status}">${safe(status.replaceAll('_',' '))}</span>${o.purchaseText?`<div class="delivery"><strong>Delivery details</strong><br>${safe(o.purchaseText)}</div>`:''}${o.supplierMessage?`<div class="meta">${safe(o.supplierMessage)}</div>`:''}</article>`}).join(''):'<div class="empty">You have no XtraLogs orders yet. <br><br><a href="xtralogs.html" style="color:#C96532;font-weight:700">Explore services</a></div>'}catch(e){el.innerHTML='<div class="empty">'+safe(e.message)+'</div>'}}if(!window.firebaseAuth){el.textContent='Firebase is not connected.';return}window.firebaseAuth.onAuthStateChanged(u=>{if(!u){location.replace('login.html');return}user=u;load()})})();</script></body></html>
