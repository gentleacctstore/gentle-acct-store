<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Customers - Gentle Acct Store</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins',sans-serif;
  background:#f5f8fc;
  color:#071f40;
}

/* =========================
   HEADER
========================= */

header{
  background:white;
  padding:16px;
  border-bottom:1px solid #e5eaf1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  color:#0b2d5c;
  font-size:18px;
  font-weight:800;
}

.logo i{
  font-size:20px;
}

.back{
  text-decoration:none;
  color:#0b2d5c;
  font-size:13px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:6px;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:24px 15px 50px;
}

/* =========================
   HERO
========================= */

.hero{
  margin-bottom:18px;
}

.hero h1{
  font-size:25px;
  line-height:1.2;
  margin-bottom:6px;
  color:#071f40;
}

.hero p{
  color:#778196;
  font-size:13px;
}

/* =========================
   SUMMARY
========================= */

.summary{
  background:linear-gradient(
    135deg,
    #0b2d5c,
    #124681
  );

  color:white;

  border-radius:20px;

  padding:20px;

  margin-bottom:18px;

  box-shadow:
    0 12px 28px rgba(11,45,92,.18);
}

.summary-icon{
  width:44px;
  height:44px;

  border-radius:13px;

  background:rgba(255,255,255,.13);

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:13px;
}

.summary-icon i{
  font-size:19px;
}

.summary h2{
  font-size:28px;
  line-height:1;
  margin-bottom:6px;
}

.summary p{
  font-size:12px;
  opacity:.88;
}

/* =========================
   SEARCH
========================= */

.search-box{
  background:white;

  border:1px solid #e4e9f0;

  border-radius:15px;

  padding:12px 14px;

  display:flex;
  align-items:center;

  gap:10px;

  margin-bottom:20px;

  box-shadow:
    0 5px 15px rgba(20,40,80,.03);
}

.search-box i{
  color:#8c97a8;
  font-size:14px;
}

.search-box input{
  border:0;
  outline:none;

  width:100%;

  font-family:'Poppins',sans-serif;

  font-size:13px;

  color:#172033;

  background:transparent;
}

.search-box input::placeholder{
  color:#9aa4b3;
}

/* =========================
   LIST HEADER
========================= */

.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:13px;
}

.list-head h2{
  font-size:18px;
}

.count{
  background:#edf3fa;
  color:#0b2d5c;

  padding:6px 10px;

  border-radius:20px;

  font-size:10px;
  font-weight:700;
}

/* =========================
   CUSTOMERS
========================= */

.customers{
  display:grid;
  gap:13px;
}

.customer{
  background:white;

  border:1px solid #e4e9f0;

  border-radius:18px;

  padding:16px;

  box-shadow:
    0 7px 20px rgba(20,40,80,.05);
}

.customer-top{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:48px;
  height:48px;

  border-radius:14px;

  background:#edf3fa;
  color:#0b2d5c;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
  font-weight:800;

  flex-shrink:0;
}

.customer-info{
  min-width:0;
  flex:1;
}

.customer-info h3{
  font-size:14px;
  font-weight:700;

  margin-bottom:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.email{
  color:#778196;

  font-size:11px;

  word-break:break-word;
}

.status{
  background:#eaf8f0;
  color:#168447;

  padding:5px 8px;

  border-radius:20px;

  font-size:9px;

  font-weight:700;

  flex-shrink:0;
}

.details{
  border-top:1px solid #edf0f4;

  margin-top:14px;

  padding-top:12px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.detail{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.detail span:first-child{
  color:#929baa;

  font-size:9px;

  text-transform:uppercase;

  font-weight:700;
}

.detail span:last-child{
  color:#303b4e;

  font-size:11px;

  font-weight:600;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:white;

  border:1px dashed #cbd5e1;

  border-radius:18px;

  padding:45px 20px;

  text-align:center;
}

.empty i{
  color:#aab5c4;

  font-size:35px;

  margin-bottom:13px;
}

.empty h3{
  font-size:16px;

  margin-bottom:6px;
}

.empty p{
  color:#7b8595;

  font-size:12px;

  line-height:1.6;
}

/* =========================
   LOADING
========================= */

.loading{
  background:white;

  border:1px solid #e5eaf1;

  border-radius:18px;

  padding:42px 20px;

  text-align:center;

  color:#7b8595;
}

.loading i{
  color:#0b2d5c;

  font-size:24px;

  margin-bottom:10px;
}

.loading p{
  font-size:12px;
}

/* =========================
   ERROR
========================= */

.error-box{
  background:#fff5f5;

  border:1px solid #ffd5d5;

  color:#b42318;

  border-radius:18px;

  padding:25px 18px;

  text-align:center;
}

.error-box i{
  font-size:30px;

  margin-bottom:10px;
}

.error-box h3{
  font-size:15px;

  margin-bottom:5px;
}

.error-box p{
  font-size:11px;

  line-height:1.5;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:650px){

  .customers{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(min-width:950px){

  .customers{
    grid-template-columns:repeat(3,1fr);
  }

  .container{
    padding-top:35px;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">

    <i class="fa-solid fa-users"></i>

    Customers

  </div>


  <a
    href="admin.html"
    class="back"
  >

    <i class="fa-solid fa-arrow-left"></i>

    Admin

  </a>

</header>


<div class="container">


  <div class="hero">

    <h1>
      Customer Management
    </h1>

    <p>
      View registered customers on your store.
    </p>

  </div>


  <div class="summary">

    <div class="summary-icon">

      <i class="fa-solid fa-users"></i>

    </div>


    <h2 id="totalCustomers">
      0
    </h2>


    <p>
      Total Registered Customers
    </p>

  </div>


  <div class="search-box">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
      id="search"
      type="text"
      placeholder="Search by name or email..."
    >

  </div>


  <div class="list-head">

    <h2>
      Customers
    </h2>


    <span
      class="count"
      id="customerCount"
    >
      0 Customers
    </span>

  </div>


  <div
    id="customers"
    class="customers"
  >

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading customers...
      </p>

    </div>

  </div>


</div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
"UoEjCy99gbQKkGob59vGi3CunZi1";


/* =========================
   CUSTOMER DATA
========================= */

let gentleCustomers = [];


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(
      typeof firebaseAuth ===
      "undefined"
    ){

      showError(
        "Firebase Authentication is not available."
      );

      return;

    }


    if(
      typeof firebaseDB ===
      "undefined"
    ){

      showError(
        "Firebase Firestore is not available."
      );

      return;

    }


    firebaseAuth.onAuthStateChanged(
      function(user){

        if(!user){

          window.location.replace(
            "admin-login.html"
          );

          return;

        }


        if(
          user.uid !== ADMIN_UID
        ){

          showError(
            "You are not authorized to view customers."
          );

          return;

        }


        if(
          !user.emailVerified
        ){

          showError(
            "Your admin email must be verified."
          );

          return;

        }


        loadCustomers();

      }
    );

  }
);


/* =========================
   LOAD CUSTOMERS
========================= */

async function loadCustomers(){

  const container =
    document.getElementById(
      "customers"
    );


  container.innerHTML = `

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Loading customers...
      </p>

    </div>

  `;


  try{

    const snapshot =
      await firebaseDB
        .collection("customers")
        .get();


    gentleCustomers = [];


    snapshot.forEach(
      function(doc){

        const data =
          doc.data();


        gentleCustomers.push({

          id:
            doc.id,

          name:
            data.name ||
            "Customer",

          email:
            data.email ||
            "No email",

          status:
            data.status ||
            "Active",

          createdAt:
            data.createdAt ||
            ""

        });

      }
    );


    gentleCustomers.sort(
      function(a,b){

        const dateA =
          getTimeValue(
            a.createdAt
          );


        const dateB =
          getTimeValue(
            b.createdAt
          );


        return dateB - dateA;

      }
    );


    renderCustomers();


  }catch(error){

    console.error(
      "CUSTOMER LOAD ERROR:",
      error
    );


    showError(
      error.message ||
      "Could not load customers."
    );

  }

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderCustomers
  );


/* =========================
   RENDER
========================= */

function renderCustomers(){

  const searchInput =
    document.getElementById(
      "search"
    );


  const search =
    String(
      searchInput.value || ""
    )
    .toLowerCase()
    .trim();


  const filtered =
    gentleCustomers.filter(
      function(customer){

        const name =
          String(
            customer.name || ""
          )
          .toLowerCase();


        const email =
          String(
            customer.email || ""
          )
          .toLowerCase();


        return (
          name.includes(search) ||
          email.includes(search)
        );

      }
    );


  document.getElementById(
    "totalCustomers"
  ).textContent =
    gentleCustomers.length;


  document.getElementById(
    "customerCount"
  ).textContent =
    filtered.length +
    (
      filtered.length === 1
      ? " Customer"
      : " Customers"
    );


  const container =
    document.getElementById(
      "customers"
    );


  if(
    filtered.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-user-group"></i>

        <h3>

          ${
            search
            ? "No customers found"
            : "No customers yet"
          }

        </h3>

        <p>

          ${
            search
            ? "Try searching with another name or email."
            : "New registered customers will appear here."
          }

        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  filtered.forEach(
    function(customer,index){

      const name =
        customer.name ||
        "Customer";


      const email =
        customer.email ||
        "No email";


      const initial =
        name
          .charAt(0)
          .toUpperCase();


      const status =
        customer.status ||
        "Active";


      const registered =
        formatDate(
          customer.createdAt
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "customer";


      card.innerHTML = `

        <div class="customer-top">

          <div class="avatar">

            ${escapeHTML(initial)}

          </div>


          <div class="customer-info">

            <h3>

              ${escapeHTML(name)}

            </h3>


            <div class="email">

              ${escapeHTML(email)}

            </div>

          </div>


          <span class="status">

            ${escapeHTML(status)}

          </span>

        </div>


        <div class="details">

          <div class="detail">

            <span>
              Account
            </span>

            <span>
              Customer #${index + 1}
            </span>

          </div>


          <div class="detail">

            <span>
              Registered
            </span>

            <span>
              ${escapeHTML(registered)}
            </span>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================
   ERROR
========================= */

function showError(message){

  const container =
    document.getElementById(
      "customers"
    );


  container.innerHTML = `

    <div class="error-box">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h3>
        Unable to load customers
      </h3>

      <p>
        ${escapeHTML(message)}
      </p>

    </div>

  `;

}


/* =========================
   DATE
========================= */

function formatDate(value){

  if(!value){

    return "Not available";

  }


  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleDateString(
          undefined,
          {
            day:"numeric",
            month:"short",
            year:"numeric"
          }
        );

    }


    const date =
      new Date(value);


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date
        .toLocaleDateString(
          undefined,
          {
            day:"numeric",
            month:"short",
            year:"numeric"
          }
        );

    }

  }catch(error){

    console.error(
      "DATE ERROR:",
      error
    );

  }


  return "Not available";

}


/* =========================
   DATE VALUE
========================= */

function getTimeValue(value){

  try{

    if(
      value &&
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .getTime();

    }


    const date =
      new Date(value);


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date.getTime();

    }

  }catch(error){}


  return 0;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>


</body>

</html>
