<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Customers - Gentle Acct Store</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f8fc;
  color:#172033;
}

header{
  background:white;
  padding:18px;
  border-bottom:1px solid #e5eaf1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  color:#0866ff;
  font-size:19px;
  font-weight:800;
}

.logo i{
  font-size:22px;
}

.back{
  text-decoration:none;
  color:#596579;
  font-size:14px;
  font-weight:700;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 16px 50px;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:27px;
  margin-bottom:6px;
}

.hero p{
  color:#727c8d;
  font-size:14px;
}

.summary{
  background:linear-gradient(135deg,#0866ff,#0754d6);
  color:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(8,102,255,.18);
}

.summary-icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:rgba(255,255,255,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:13px;
}

.summary h2{
  font-size:27px;
  margin-bottom:4px;
}

.summary p{
  font-size:13px;
  opacity:.9;
}

.search-box{
  background:white;
  border:1px solid #e5eaf1;
  border-radius:15px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.search-box i{
  color:#8a95a6;
}

.search-box input{
  border:0;
  outline:none;
  width:100%;
  font-size:14px;
  background:transparent;
}

.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.list-head h2{
  font-size:19px;
}

.count{
  background:#edf4ff;
  color:#0866ff;
  padding:7px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.customers{
  display:grid;
  gap:14px;
}

.customer{
  background:white;
  border:1px solid #e5eaf1;
  border-radius:18px;
  padding:17px;
  box-shadow:0 7px 20px rgba(20,40,80,.05);
}

.customer-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:15px;
  background:#edf4ff;
  color:#0866ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:800;
  flex-shrink:0;
}

.customer-info{
  min-width:0;
  flex:1;
}

.customer-info h3{
  font-size:15px;
  margin-bottom:5px;
}

.email{
  color:#737e8f;
  font-size:12px;
  word-break:break-word;
}

.status{
  background:#eaf9f0;
  color:#168447;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
}

.details{
  border-top:1px solid #edf0f4;
  margin-top:15px;
  padding-top:13px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.detail{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.detail span:first-child{
  color:#929baa;
  font-size:10px;
  text-transform:uppercase;
  font-weight:700;
}

.detail span:last-child{
  color:#303b4e;
  font-size:12px;
  font-weight:600;
}

.empty{
  background:white;
  border:1px dashed #cbd5e1;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
}

.empty i{
  color:#aab5c4;
  font-size:38px;
  margin-bottom:13px;
}

.empty h3{
  margin-bottom:6px;
}

.empty p{
  color:#7b8595;
  font-size:13px;
  line-height:1.5;
}

.loading{
  background:white;
  border:1px solid #e5eaf1;
  border-radius:18px;
  padding:40px 20px;
  text-align:center;
  color:#7b8595;
}

.loading i{
  color:#0866ff;
  font-size:25px;
  margin-bottom:10px;
}

@media(min-width:650px){

  .customers{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(min-width:950px){

  .customers{
    grid-template-columns:repeat(3,1fr);
  }

  .container{
    padding-top:35px;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">

    <i class="fa-solid fa-users"></i>

    Customers

  </div>


  <a
    href="admin.html"
    class="back"
  >

    <i class="fa-solid fa-arrow-left"></i>

    Admin

  </a>

</header>


<div class="container">


  <div class="hero">

    <h1>
      Customer Management
    </h1>

    <p>
      View registered customers on your store.
    </p>

  </div>


  <div class="summary">

    <div class="summary-icon">

      <i class="fa-solid fa-users"></i>

    </div>


    <h2 id="totalCustomers">
      0
    </h2>


    <p>
      Total Registered Customers
    </p>

  </div>


  <div class="search-box">

    <i class="fa-solid fa-magnifying-glass"></i>


    <input
      id="search"
      type="text"
      placeholder="Search by name or email..."
      oninput="renderCustomers()"
    >

  </div>


  <div class="list-head">

    <h2>
      Customers
    </h2>


    <span
      class="count"
      id="customerCount"
    >
      0 Customers
    </span>

  </div>


  <div
    id="customers"
    class="customers"
  >

    <div class="loading">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <p>
        Checking Firebase...
      </p>

    </div>

  </div>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
"UoEjCy99gbQKkGob59vGi3CunZi1";


/* =========================
   CUSTOMER STORAGE
========================= */

window.gentleCustomers = [];


/* =========================
   START PAGE
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    firebaseAuth.onAuthStateChanged(
      function(user){

        if(!user){

          showError(
            "No Firebase user is currently signed in."
          );

          return;

        }


        /* =========================
           DIAGNOSTIC CHECK
        ========================= */

        const currentUID =
          user.uid;


        const currentEmail =
          user.email ||
          "No email";


        alert(
          "Firebase account detected.\n\n" +
          "Email:\n" +
          currentEmail +
          "\n\n" +
          "Firebase UID:\n" +
          currentUID +
          "\n\n" +
          "Expected Admin UID:\n" +
          ADMIN_UID
        );


        /* =========================
           ADMIN CHECK
        ========================= */

        if(
          currentUID !== ADMIN_UID
        ){

          showError(
            "The signed-in Firebase account does not match the admin account."
          );

          return;

        }


        if(
          !user.emailVerified
        ){

          showError(
            "The admin email address is not verified."
          );

          return;

        }


        loadCustomers();

      }
    );

  }
);


/* =========================
   LOAD CUSTOMERS
========================= */

async function loadCustomers(){

  try{

    if(
      typeof firebaseDB ===
      "undefined"
    ){

      throw new Error(
        "Firestore is not available."
      );

    }


    const snapshot =
      await firebaseDB
        .collection("customers")
        .get();


    const customers = [];


    snapshot.forEach(
      function(doc){

        const data =
          doc.data();


        customers.push({

          id:
            doc.id,

          name:
            data.name ||
            "Customer",

          email:
            data.email ||
            "No email",

          createdAt:
            data.createdAt ||
            "",

          status:
            data.status ||
            "Active"

        });

      }
    );


    window.gentleCustomers =
      customers;


    renderCustomers();


  }catch(error){

    console.error(
      "Customer loading error:",
      error
    );


    showError(
      error.message
    );

  }

}


/* =========================
   RENDER CUSTOMERS
========================= */

function renderCustomers(){

  const customers =
    window.gentleCustomers ||
    [];


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    customers.filter(
      function(customer){

        const name =
          String(
            customer.name || ""
          ).toLowerCase();


        const email =
          String(
            customer.email || ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          email.includes(search)
        );

      }
    );


  document.getElementById(
    "totalCustomers"
  ).textContent =
    customers.length;


  document.getElementById(
    "customerCount"
  ).textContent =
    filtered.length +
    (
      filtered.length === 1
      ? " Customer"
      : " Customers"
    );


  const container =
    document.getElementById(
      "customers"
    );


  if(
    filtered.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-user-group"></i>

        <h3>

          ${
            search
            ? "No customers found"
            : "No customers yet"
          }

        </h3>

        <p>

          ${
            search
            ? "Try a different name or email."
            : "Registered customers will appear here."
          }

        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  filtered.forEach(
    function(customer,index){

      const name =
        customer.name ||
        "Customer";


      const email =
        customer.email ||
        "No email";


      const initial =
        name
          .charAt(0)
          .toUpperCase();


      const date =
        formatDate(
          customer.createdAt
        );


      const status =
        customer.status ||
        "Active";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "customer";


      card.innerHTML = `

        <div class="customer-top">

          <div class="avatar">

            ${escapeHTML(initial)}

          </div>


          <div class="customer-info">

            <h3>

              ${escapeHTML(name)}

            </h3>


            <div class="email">

              ${escapeHTML(email)}

            </div>

          </div>


          <span class="status">

            ${escapeHTML(status)}

          </span>

        </div>


        <div class="details">

          <div class="detail">

            <span>
              Account
            </span>

            <span>
              Customer #${index + 1}
            </span>

          </div>


          <div class="detail">

            <span>
              Registered
            </span>

            <span>
              ${escapeHTML(date)}
            </span>

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================
   ERROR DISPLAY
========================= */

function showError(message){

  const container =
    document.getElementById(
      "customers"
    );


  container.innerHTML = `

    <div class="empty">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h3>
        Unable to load customers
      </h3>

      <p>
        ${escapeHTML(message)}
      </p>

    </div>

  `;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(value){

  if(!value){

    return "Registered account";

  }


  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value
        .toDate()
        .toLocaleDateString();

    }


    const date =
      new Date(value);


    if(
      !isNaN(
        date.getTime()
      )
    ){

      return date
        .toLocaleDateString();

    }

  }catch(error){}


  return String(value);

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
