<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFCFA"><title>Boosting Accounts | GentleLogs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--orange:#E87535;--od:#C96532;--soft:#FFF1E8;--bg:#FFFCFA;--ink:#252A30;--muted:#9298A2;--line:#F0EEEB;--shadow:0 5px 22px rgba(37,42,48,.045)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}button,input,select{font:inherit;font-size:16px}a{color:inherit;text-decoration:none}.wrap{width:min(100%,760px);margin:auto;padding-bottom:100px}.top{height:66px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:700;letter-spacing:-1px}.brand span{color:var(--orange)}.top a:last-child{font-size:12px;color:var(--od);font-weight:700}.hero{margin:20px;padding:23px;border-radius:22px;background:linear-gradient(120deg,#30343A,#252A30 70%,#41464D);color:#fff}.eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#FFC49F;font-weight:700}.hero h1{font-size:25px;letter-spacing:-1px;margin:7px 0}.hero p{font-size:12px;line-height:1.6;color:#D0D2D5;margin:0}.walletline{margin-top:17px;padding-top:13px;border-top:1px solid #ffffff24;display:flex;justify-content:space-between;font-size:11px;color:#D9DADD}.walletline strong{color:#fff}.controls{padding:0 20px}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;padding:0 15px;background:#fff;outline:none}.filters{display:flex;gap:8px;overflow:auto;padding:13px 0 4px;scrollbar-width:none}.filters button{border:1px solid var(--line);background:#fff;color:#6F7680;padding:9px 13px;border-radius:20px;font-size:11px;white-space:nowrap}.filters button.active{background:var(--soft);border-color:#F5D7C7;color:var(--od);font-weight:700}.country{display:none;margin-top:10px}.country.show{display:block}.country input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 13px}.heading{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}.heading h2{font-size:16px;margin:0}.heading small{font-size:10px;color:var(--muted)}.grid{padding:0 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}.item .ico{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--orange);display:grid;place-items:center;margin-bottom:12px}.item{cursor:pointer;text-align:center;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 10px}.item .service-logo{width:42px;height:42px;object-fit:contain;margin:0 auto 10px;display:block}.item .service-price{margin-top:9px;font-size:13px;font-weight:700;color:var(--orange);line-height:1.3}.item .service-logo{width:52px;height:52px;border-radius:14px}.item h3{font-size:11px;line-height:1.35;min-height:0;margin:0;overflow-wrap:anywhere}.item:active{transform:scale(.98)}.item h3{font-size:12px;margin:0;line-height:1.4;min-height:34px}.item p{font-size:10px;color:var(--muted);margin:6px 0 12px;min-height:24px}.price{font-size:15px;font-weight:700;color:var(--od)}.buy{margin-top:11px;width:100%;height:37px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:700}.empty{grid-column:1/-1;padding:30px 15px;text-align:center;color:var(--muted);font-size:12px;background:#fff;border:1px solid var(--line);border-radius:15px}.notice{margin:15px 20px;padding:12px 14px;background:#FFF7F1;border:1px solid #F6E0D4;border-radius:12px;color:#986044;font-size:10px;line-height:1.6}.modal{display:none;position:fixed;inset:0;z-index:20;background:#16191dcc;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{width:min(100%,520px);background:#fff;border-radius:22px;padding:21px;max-height:88vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 5px}.sheet p{font-size:11px;color:var(--muted);line-height:1.6}.sheet label{display:block;font-size:11px;font-weight:700;margin:13px 0 6px}.sheet input,.sheet textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}.sheet textarea{min-height:70px}.sheet-actions{display:flex;gap:9px;margin-top:17px}.sheet-actions button{height:45px;flex:1;border:0;border-radius:12px;font-weight:700;font-size:12px}.cancel{background:#F4F3F1;color:#626873}.submit{background:var(--orange);color:#fff}.toast{position:fixed;top:15px;left:50%;transform:translate(-50%,-10px);opacity:0;z-index:30;background:#252A30;color:#fff;padding:12px 16px;border-radius:11px;font-size:11px;max-width:90%;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);height:72px;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;border-top:1px solid var(--line);z-index:6}.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9A9EA5;font-size:9px;font-weight:600}.nav a.active{color:var(--od)}.nav i{font-size:17px}@media(max-width:370px){.grid{gap:8px;padding:0 14px}.controls{padding:0 14px}.hero{margin:14px}.heading{padding-left:14px;padding-right:14px}.item{padding:11px}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="home.html">Gentle<span>Logs</span></a><a href="service-orders.html"><i class="fa-regular fa-clipboard"></i> My orders</a></header><section class="hero"><div class="eyebrow">GentleLogs services</div><h1>Boosting Accounts</h1><p>Choose a platform and service to continue.</p><div class="walletline"><span>GentleLogs wallet</span><strong id="walletBalance">Loading…</strong></div></section><div class="controls"><input class="search" id="search" placeholder="Search services…" autocomplete="off"></div><div class="heading"><h2 id="catalogTitle">Available Logs</h2><small id="count">Loading…</small></div><section class="grid" id="products"><div class="empty">Loading services…</div></section></div><nav class="nav"><a href="home.html"><i class="fa-solid fa-house"></i>Home</a><a class="active" href="boosting.html"><i class="fa-solid fa-layer-group"></i>Services</a><a href="service-orders.html"><i class="fa-regular fa-clipboard"></i>Orders</a><a href="fund.html"><i class="fa-solid fa-wallet"></i>Wallet</a><a href="profile.html"><i class="fa-regular fa-user"></i>Account</a></nav><div class="modal" id="checkout"><div class="sheet"><h2 id="modalName">Service checkout</h2><p id="modalInfo"></p><div id="extraFields"></div><div class="sheet-actions"><button class="cancel" id="cancel">Cancel</button><button class="submit" id="confirm">Continue</button></div></div></div><div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let user=null,catalog='smm',items=[],selected=null,selectedCountry='';const titles={'logs':'Available Logs','numbers-usa':'USA Numbers','numbers-global':'World Numbers','smm':'Boosting Services','telegram':'Telegram Services','esim':'eSIM Packages','topup':'International Top-up','gifts':'Digital Gifts','proxies':'Proxy Services','vtu':'Nigeria Airtime & Data'};function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}function money(n,c){return(c==='USD'?'$':'₦')+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2})}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opts={}){const token=await user.getIdToken();const r=await fetch(path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.message||'Request failed');return d}async function loadWallet(){const d=await window.firebaseDB.collection('wallets').doc(user.uid).get();$('walletBalance').textContent=money(d.exists?d.data().balance:0,'NGN')}async function load(){catalog='smm';$('catalogTitle').textContent='Boosting Accounts';$('products').innerHTML='<div class="empty">Loading boosting services…</div>';const params=new URLSearchParams({catalog:'smm',page:'1',per_page:'80'});try{const d=await api('/api/xtralogs/customer/catalog?'+params);items=d.products||[];render()}catch(e){$('products').innerHTML='<div class="empty">'+safe(e.message)+'</div>';$('count').textContent='Unavailable'}}function brandFor(name){
 const s=String(name||"").toLowerCase();
 const brands=[
  [/audiomack/,"audiomack","FF6A00","AM"],
  [/instagram/,"instagram","E4405F","IG"],
  [/facebook|\bfb\b/,"facebook","0866FF","f"],
  [/tiktok/,"tiktok","111111","♪"],
  [/telegram/,"telegram","26A5E4","TG"],
  [/youtube/,"youtube","FF0033","YT"],
  [/twitter|\bx\b/,"x","111111","X"],
  [/reddit/,"reddit","FF4500","R"],
  [/spotify/,"spotify","1DB954","S"],
  [/snapchat/,"snapchat","F0C400","SC"],
  [/linkedin/,"linkedin","0A66C2","in"],
  [/pinterest/,"pinterest","BD081C","P"],
  [/discord/,"discord","5865F2","D"],
  [/twitch/,"twitch","9146FF","T"],
  [/soundcloud/,"soundcloud","FF5500","SC"],
  [/website|traffic/,"googlechrome","4285F4","WEB"]
 ];
 for(const [pattern,slug,color,initials] of brands) if(pattern.test(s)) return {slug,color,initials};
 const words=String(name||"Service").replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/).filter(Boolean);
 return {slug:"",color:"E87535",initials:(words.slice(0,2).map(x=>x[0]).join("")||"GL").toUpperCase()};
}
function fallbackLogo(color,initials){
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#${color}"/><stop offset="1" stop-color="#252A30"/></linearGradient></defs><rect x="2" y="2" width="92" height="92" rx="25" fill="url(#g)"/><text x="48" y="59" text-anchor="middle" font-family="Arial,sans-serif" font-size="${initials.length>2?25:34}" font-weight="700" fill="#fff">${initials}</text></svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const shown=items.filter(x=>(x.name+' '+x.id+' '+x.description).toLowerCase().includes(q));
 $('count').textContent=shown.length+' services';
 $('products').innerHTML=shown.length?shown.map((x,i)=>{
   const b=brandFor(x.name);
   const logo=b.slug?`https://cdn.simpleicons.org/${b.slug}/${b.color}`:fallbackLogo(b.color,b.initials);
   const fallback=fallbackLogo(b.color,b.initials);
   const price=Number(x.price);
   const priceText=Number.isFinite(price)&&price>0?money(price,x.currency):'Price unavailable';
   return `<article class="item" role="button" tabindex="0" data-index="${i}">
     <img class="service-logo" src="${logo}" alt="${safe(x.name)}" loading="lazy" onerror="this.onerror=null;this.src='${fallback}'">
     <h3>${safe(x.name)}</h3>
     <div class="service-price">${safe(priceText)}</div>
   </article>`;
 }).join(''):'<div class="empty">No matching services found.</div>';
 document.querySelectorAll('#products [data-index]').forEach(card=>{
   const open=()=>openCheckout(shown[Number(card.dataset.index)]);
   card.addEventListener('click',open);
   card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
 });
}
function openCheckout(item){selected=item;$('modalName').textContent=item.name;$('modalInfo').textContent='Price: '+money(item.price,item.currency)+' · Pay with your GentleLogs wallet';let fields='';if(catalog==='smm')fields='<label>Post or profile link</label><input id="xLink" placeholder="https://…"><label>Quantity</label><input id="xQuantity" type="number" min="1" value="1000">';else if(catalog==='numbers-usa'||catalog==='numbers-global')fields='<p>We will request a number session from the supplier. Keep this page open to view the order status.</p>';else fields='<p>Your selected log product will be ordered securely.</p>';$('extraFields').innerHTML=fields;$('checkout').classList.add('show')}async function buy(){if(!selected)return;const btn=$('confirm');btn.disabled=true;btn.textContent='Processing…';try{const requestId='xtra_'+user.uid.slice(0,8)+'_'+crypto.randomUUID().replace(/-/g,'');const body={catalog,itemId:selected.id,requestId};if(catalog==='numbers-global'&&selectedCountry)body.country=selectedCountry;if(catalog==='smm'){body.link=$('xLink')?.value.trim();body.quantity=Number($('xQuantity')?.value||1);if(!body.link||!/^https?:\/\//i.test(body.link))throw Error('Enter a valid post or profile link.')}const d=await api('/api/xtralogs/customer/purchase',{method:'POST',body:JSON.stringify(body)});$('checkout').classList.remove('show');toast(d.message||'Order submitted.');await loadWallet();setTimeout(()=>location.href='xtralogs-orders.html',650)}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent='Continue'}}$('search').addEventListener('input',render);$('cancel').addEventListener('click',()=>$('checkout').classList.remove('show'));$('confirm').addEventListener('click',buy);$('checkout').addEventListener('click',e=>{if(e.target===$('checkout'))$('checkout').classList.remove('show')});if(!window.firebaseAuth||!window.firebaseDB){toast('Firebase is not connected.');return}window.firebaseAuth.onAuthStateChanged(async u=>{if(!u){location.replace('login.html');return}user=u;try{await loadWallet();await load()}catch(e){toast(e.message)}})})();
</script></body></html>
