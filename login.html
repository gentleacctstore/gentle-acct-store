<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Sign In | Gentle Acct Store</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f5f9ff;
  color: #10213b;
  min-height: 100vh;
}

a {
  text-decoration: none;
}

header {
  height: 70px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid #e5ebf4;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(12px);
}

.nav {
  max-width: 1100px;
  height: 100%;
  margin: auto;
  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;

  color: #10213b;
  font-size: 17px;
  font-weight: 800;
}

.logo-box {
  width: 38px;
  height: 38px;
  border-radius: 11px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(135deg,#0757d5,#1780ff);
  color: white;

  font-weight: 900;
  font-size: 18px;

  box-shadow: 0 7px 16px rgba(7,87,213,.20);
}

.logo span {
  color: #1264e8;
}

.back {
  display: flex;
  align-items: center;
  gap: 7px;

  color: #1264e8;
  background: #f1f6ff;

  padding: 9px 13px;
  border-radius: 9px;

  font-size: 12px;
  font-weight: 800;
}

.page {
  min-height: calc(100vh - 70px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 35px 16px 45px;
}

.login-card {
  width: 100%;
  max-width: 450px;

  background: white;

  border: 1px solid #e1e8f2;
  border-radius: 22px;

  padding: 32px 24px;

  box-shadow: 0 18px 50px rgba(20,50,90,.08);
}

.title {
  text-align: center;
}

.lock-icon {
  width: 55px;
  height: 55px;

  margin: 0 auto 17px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #eaf3ff;
  color: #1264e8;

  border-radius: 16px;

  font-size: 21px;
}

.title h1 {
  font-size: 28px;
  color: #0b1d35;
  letter-spacing: -.5px;
}

.title p {
  color: #718096;
  font-size: 13px;
  margin-top: 8px;
  line-height: 1.6;
}

form {
  margin-top: 28px;
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 7px;
  color: #243650;
}

.input-wrap {
  position: relative;
}

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #7f91aa;
  font-size: 13px;
}

input {
  width: 100%;
  height: 49px;

  border: 1px solid #dbe4ef;
  border-radius: 11px;

  padding: 0 14px 0 40px;

  outline: none;
  font-size: 14px;

  color: #10213b;
  background: #fbfdff;

  transition: .2s;
}

input:focus {
  border-color: #1264e8;
  background: white;

  box-shadow:
    0 0 0 3px rgba(18,100,232,.08);
}

input::placeholder {
  color: #9aa7b8;
}

.password-row {
  display: flex;
  justify-content: flex-end;

  margin-top: -9px;
  margin-bottom: 20px;
}

.forgot {
  color: #1264e8;
  font-size: 12px;
  font-weight: 800;
}

.login-btn {
  width: 100%;
  height: 50px;

  border: 0;
  border-radius: 11px;

  background: linear-gradient(135deg,#0757d5,#1264e8);
  color: white;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  box-shadow: 0 10px 22px rgba(18,100,232,.18);

  transition: .2s;
}

.login-btn:hover {
  transform: translateY(-1px);
}

.login-btn:active {
  transform: scale(.98);
}

.login-btn:disabled {
  opacity: .75;
  cursor: wait;
}

.login-btn i {
  margin-right: 7px;
}

.message {
  display: none;

  margin-top: 14px;
  padding: 12px;

  border-radius: 10px;

  font-size: 12px;
  text-align: center;
  line-height: 1.5;
}

.message.error {
  background: #fff0f0;
  border: 1px solid #f3d1d1;
  color: #c53030;
}

.message.success {
  background: #effaf3;
  border: 1px solid #ccebd7;
  color: #237a43;
}

.signup-text {
  text-align: center;

  margin-top: 23px;

  color: #718096;
  font-size: 12px;
}

.signup-text a {
  color: #1264e8;
  font-weight: 800;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;

  margin: 25px 0;

  color: #a0aabd;
  font-size: 10px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: .5px;
}

.divider::before,
.divider::after {
  content: "";

  height: 1px;

  background: #e5ebf4;

  flex: 1;
}

.demo-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;

  background: #f5f9ff;
  border: 1px solid #e1ebfa;

  padding: 13px;
  border-radius: 11px;

  color: #718096;
  font-size: 10px;
  line-height: 1.6;
}

.demo-note i {
  color: #1264e8;
  margin-top: 2px;
}

@media (max-width: 450px) {

  .nav {
    padding: 0 14px;
  }

  .logo {
    font-size: 15px;
  }

  .logo-box {
    width: 35px;
    height: 35px;
    font-size: 16px;
  }

  .back {
    padding: 8px 10px;
    font-size: 11px;
  }

  .login-card {
    padding: 29px 19px;
    border-radius: 19px;
  }

  .title h1 {
    font-size: 25px;
  }

}

</style>

</head>

<body>

<header>

  <nav class="nav">

    <a href="index.html" class="logo">

      <div class="logo-box">
        G
      </div>

      Gentle <span>Acct</span> Store

    </a>

    <a href="index.html" class="back">

      <i class="fa-solid fa-arrow-left"></i>

      Home

    </a>

  </nav>

</header>


<main class="page">

  <div class="login-card">

    <div class="title">

      <div class="lock-icon">

        <i class="fa-solid fa-lock"></i>

      </div>

      <h1>
        Welcome back
      </h1>

      <p>
        Sign in to access your Gentle Acct Store account.
      </p>

    </div>


    <form id="loginForm">

      <div class="field">

        <label for="email">
          Email Address
        </label>

        <div class="input-wrap">

          <i class="fa-solid fa-envelope input-icon"></i>

          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="input-wrap">

          <i class="fa-solid fa-lock input-icon"></i>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

      </div>


      <div class="password-row">

        <a
          href="forgot-password.html"
          class="forgot"
        >
          Forgot Password?
        </a>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >

        <i class="fa-solid fa-right-to-bracket"></i>

        Sign In

      </button>


      <div
        class="message"
        id="message"
      ></div>

    </form>


    <div class="signup-text">

      Don't have an account?

      <a href="signup.html">
        Create Account
      </a>

    </div>


    <div class="divider">
      Secure account
    </div>


    <div class="demo-note">

      <i class="fa-solid fa-shield-halved"></i>

      <span>
        Your account is secured with Supabase Authentication.
        Your password is not stored in this website.
      </span>

    </div>

  </div>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const form =
  document.getElementById("loginForm");

const message =
  document.getElementById("message");

const loginBtn =
  document.getElementById("loginBtn");


function showMessage(text, type) {

  message.style.display = "block";

  message.className =
    "message " + type;

  message.innerHTML = text;

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message.style.display = "none";

    loginBtn.disabled = true;

    loginBtn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
      document
        .getElementById("password")
        .value;


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if(error) {

        throw error;

      }


      const user =
        data.user;


      if(!user) {

        throw new Error(
          "Unable to sign in. Please try again."
        );

      }


      localStorage.removeItem(
        "gentleAdminLoggedIn"
      );


      localStorage.setItem(
        "gentleCurrentUserId",
        user.id
      );


      localStorage.setItem(
        "gentleLoggedIn",
        "true"
      );


      /*
        Keep the customer's basic
        information for the existing
        dashboard.
      */

      const oldUser =
        localStorage.getItem(
          "gentleUser"
        );


      let existingUser = {};


      if(oldUser) {

        try {

          existingUser =
            JSON.parse(oldUser);

        } catch(error) {

          existingUser = {};

        }

      }


      const loggedInUser = {

        id: user.id,

        email: user.email,

        name:
          existingUser.name ||
          user.user_metadata?.full_name ||
          user.email?.split("@")[0] ||
          "Customer",

        balance:
          Number(existingUser.balance) || 0

      };


      localStorage.setItem(
        "gentleUser",
        JSON.stringify(
          loggedInUser
        )
      );


      localStorage.setItem(
        "gentleBalance",
        String(
          loggedInUser.balance
        )
      );


      localStorage.removeItem(
        "gentleCheckoutProduct"
      );


      window.location.replace(
        "dashboard.html"
      );

    } catch(error) {

      console.error(error);


      let errorMessage =
        "Incorrect email or password.";


      if(
        error.message &&
        error.message
          .toLowerCase()
          .includes("email not confirmed")
      ) {

        errorMessage =
          "Please confirm your email address before signing in.";

      }


      showMessage(

        '<i class="fa-solid fa-circle-exclamation"></i> ' +
        errorMessage,

        "error"

      );


      loginBtn.disabled = false;

      loginBtn.innerHTML =
        '<i class="fa-solid fa-right-to-bracket"></i> Sign In';

    }

  }
);

</script>

</body>
</html>
