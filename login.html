<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --green:#147A48;
  --green-dark:#0B5631;
  --green-border:#DCE9DF;
  --background:#F2F7F3;
  --text:#192B20;
  --muted:#7C8A80;
  --input:#FAFCFA;
  --white:#FFFFFF;
  --shadow:0 22px 60px rgba(22,75,42,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Space Grotesk",sans-serif;
}

html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  x 15px 30px;
  font-family: "Space Grotesk", sans-serif;
  font-size:12px;
  color:var(--text);
  background:
    radial-gradient(ellipse at 4% 8%,rgba(83,173,112,.17),transparent 34%),
    radial-gradient(ellipse at 96% 88%,rgba(54,142,83,.13),transparent 33%),
    linear-gradient(145deg,#F5FAF6 0%,#FFFFFF 48%,#EDF5EF 100%);
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button{
  cursor:pointer;
}

.brand{
  text-align:center;
  margin:0 auto 25px;
}

.brand-mark{
  width:53px;
  height:53px;
  margin:0 auto 11px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:17px;
  color:#FFFFFF;
  font-size:25px;
  font-weight:800;
  letter-spacing:-1.5px;
  background:linear-gradient(145deg,#24965A,#09542F);
  box-shadow:0 10px 24px rgba(20,122,72,.23);
}

.brand-name{
  font-size:24px;
  font-weight:800;
  line-height:1.4;
  letter-spacing:-.9px;
  color:#173522;
}

.brand-name span{
  color:var(--green);
}

.brand-tagline{
  margin-top:6px;
  color:#87968B;
  font-size:9px;
  letter-spacing:2px;
  font-weight:600;
}

.wrapper{
  width:100%;
  max-width:440px;
  margin:0 auto;
}

.card{
  position:relative;
  background:rgba(255,255,255,.97);
  border:1px solid var(--green-border);
  border-radius:23px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.card-top{
  height:5px;
  background:linear-gradient(90deg,#0B5631,#249B5D,#8CD8A6);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:54px;
  padding:0 14px;
  border-bottom:1px solid #E9F0EA;
}

.tab{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 5px;
  color:#879188;
  font-size:11.5px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s;
}

.tab i{
  font-size:12px;
}

.tab.active{
  color:var(--green);
}

.tab.active::after{
  content:"";
  position:absolute;
  bottom:0;
  left:12%;
  width:76%;
  height:3px;
  border-radius:8px 8px 0 0;
  background:linear-gradient(90deg,#0B5631,#28A463);
}

.content{
  padding:29px 27px 27px;
}

.heading-row{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:8px;
}

.heading-icon{
  width:43px;
  height:43px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  color:var(--green);
  background:#EAF5ED;
  border:1px solid #DCEFE1;
  font-size:17px;
}

h1{
  font-size:25px;
  line-height:1.35;
  letter-spacing:-.8px;
  font-weight:800;
  color:#17291D;
}

.subtitle{
  color:var(--muted);
  font-size:11.5px;
  line-height:1.9;
  margin:0 0 25px;
}

.group{
  margin-bottom:19px;
}

.label-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.label-row label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.6px;
  text-transform:uppercase;
  color:#425447;
}

.forgot{
  color:var(--green);
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.forgot:hover{
  text-decoration:underline;
}

.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
  min-height:50px;
  border:1px solid #DCE8DF;
  border-radius:12px;
  background:var(--input);
  transition:border-color .2s,box-shadow .2s,background .2s;
}

.input-wrap:focus-within{
  border-color:#58A875;
  background:#FFFFFF;
  box-shadow:0 0 0 4px rgba(20,122,72,.09);
}

.input-icon{
  width:45px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#91A295;
  font-size:14px;
}

.input-wrap input{
  width:100%;
  min-width:0;
  height:48px;
  padding:0 9px 0 0;
  border:0;
  outline:0;
  background:transparent;
  color:#203629;
  font-size:12px;
  font-weight:500;
}

.input-wrap input::placeholder{
  color:#A2ADA4;
  opacity:1;
  font-weight:400;
}

.eye{
  flex-shrink:0;
  width:39px;
  height:39px;
  margin-right:4px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#819087;
  font-size:13px;
  transition:background .2s,color .2s;
}

.eye:hover{
  background:#EDF5EF;
  color:var(--green);
}

.remember{
  display:flex;
  align-items:center;
  gap:9px;
  margin:1px 0 21px;
  color:#68776D;
  font-size:10.5px;
  font-weight:500;
  cursor:pointer;
}

.remember input{
  appearance:none;
  -webkit-appearance:none;
  width:17px;
  height:17px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid #C8DBCE;
  border-radius:5px;
  background:#FFFFFF;
  cursor:pointer;
}

.remember input:checked{
  border-color:var(--green);
  background:var(--green);
}

.remember input:checked::after{
  content:"";
  width:4px;
  height:8px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px);
}

.submit{
  width:100%;
  min-height:51px;
  border:0;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:linear-gradient(100deg,#0B6035,#18884D);
  color:#FFFFFF;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.2px;
  box-shadow:0 8px 19px rgba(20,122,72,.18);
  transition:background .2s,transform .2s,box-shadow .2s;
}

.submit:hover{
  background:linear-gradient(100deg,#094B2A,#116F3D);
  box-shadow:0 11px 23px rgba(20,122,72,.23);
}

.submit:active{
  transform:scale(.99);
}

.submit:disabled{
  opacity:.68;
  cursor:not-allowed;
}

.submit .spinner{
  display:none;
}

.submit.loading .spinner{
  display:inline-block;
}

.submit.loading .submit-arrow{
  display:none;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#FFFFFF;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.message{
  display:none;
  margin-top:13px;
  padding:12px 13px;
  border-radius:10px;
  font-size:11px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.message.error{
  display:block;
  color:#A32222;
  background:#FFF0F0;
  border:1px solid #F3D2D2;
}

.message.success{
  display:block;
  color:#17683D;
  background:#EDF8F0;
  border:1px solid #D3E9D8;
}

.message.info{
  display:block;
  color:#275C86;
  background:#EEF7FF;
  border:1px solid #D2E7FA;
}

.or-divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:23px 0 16px;
  color:#8B988F;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:1px;
  white-space:nowrap;
}

.or-divider::before,
.or-divider::after{
  content:"";
  height:1px;
  background:#E6EEE8;
  flex:1;
}

.google-btn{
  width:100%;
  min-height:49px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#FFFFFF;
  border:1px solid #DCE7DF;
  border-radius:12px;
  color:#33443A;
  font-size:12px;
  font-weight:600;
  transition:background .2s,border-color .2s,transform .2s;
}

.google-btn:hover{
  background:#F8FCF9;
  border-color:#B9D4C1;
}

.google-btn:active{
  transform:scale(.99);
}

.google-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.google-btn img{
  display:block;
  width:19px;
  height:19px;
  flex-shrink:0;
}

.footer{
  text-align:center;
  color:#859288;
  font-size:10px;
  line-height:1.9;
  margin:21px auto 0;
}

.footer strong{
  color:#607366;
  font-weight:600;
}

.footer .secure{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom:5px;
}

.footer .secure i{
  color:var(--green);
  font-size:11px;
}

@media(max-width:600px){
  body{padding:24px 13px 25px}
  .brand{margin-bottom:21px}
  .brand-mark{
    width:49px;height:49px;font-size:23px;border-radius:15px
  }
  .brand-name{font-size:22px}
  .content{padding:26px 23px 24px}
  h1{font-size:24px}
  .input-wrap input{font-size:16px}
}

@media(max-width:390px){
  body{padding:17px 10px 20px}
  .brand{margin-bottom:17px}

    width:45px;height:45px;font-size:21px;border-radius:14px
  }
  .brand-name{font-size:20px}
  .brand-tagline{font-size:8px;letter-spacing:1.6px}
  .card{border-radius:20px}
  .tabs{padding:0 8px;min-height:50px}
  .tab{font-size:10.5px;gap:6px}
  .content{padding:23px 17px 21px}
  .heading-row{gap:10px}
  .heading-icon{width:39px;height:39px;border-radius:12px}
  h1{font-size:22px}
  .subtitle{font-size:11px;margin-bottom:21px}
  .group{margin-bottom:17px}
  .input-wrap{min-height:48px}
  .input-wrap input{height:46px}
  .input-icon{width:40px}
}

@media(max-width:340px){
  .content{padding:20px 13px 18px}
  .tab{gap:4px;font-size:10px}
  .label-row label{font-size:9.5px}
  .forgot{font-size:9px}
}

    scroll-behavior:auto!important;
  }
}
</style>

<body>

<header class="brand">
  <a href="index.html" class="brand-mark" aria-label="GentleLogs home">G.</a>
  <a href="index.html" class="brand-name">Gentle<span>Logs</span></a>
  <p class="brand-tagline">DIGITAL PRODUCTS. ONE DESK.</p>
</header>

<main class="wrapper">
  <section class="card">
    <div class="card-top"></div>

    <nav class="tabs" aria-label="Account pages">
      <a href="login.html" class="tab active" aria-current="page">
        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
        <span>Sign In</span>
      </a>
      <a href="signup.html" class="tab">
        <i class="fa-solid fa-user-plus" aria-hidden="true"></i>

      </a>
    </nav>

    <div class="content">
      <div class="heading-row">
        <div class="heading-icon">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
        </div>
        <h1>Welcome Back</h1>
      </div>

      <p class="subtitle">Access your wallet, orders, and digital products.</p>

      <form id="loginForm" novalidate>
        <div class="group">
          <div class="label-row">
            <label for="email">Email Address</label>
          </div>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
            <input id="email" name="email" type="email"
              placeholder="Enter your email address" autocomplete="email"
              autocapitalize="none" spellcheck="false" inputmode="email" required>
          </div>
        </div>

        <div class="group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="forgot-password.html" class="forgot">Forgot password?</a>
          </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
(function(){
  "use strict";

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const passwordToggle = document.getElementById("passwordToggle");
  const googleBtn = document.getElementById("googleBtn");
  const rememberMe = document.getElementById("rememberMe");
  let submitting = false;

  function showMessage(text, type){
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
  }

  function clearMessage(){
    message.textContent = "";
    message.className = "message";
    message.style.display = "none";
  }

  function setLoading(button, loading){
    button.disabled = loading;

    if(button === loginBtn){
      button.classList.toggle("loading", loading);
      const label = button.querySelector(".submit-label");
      if(label) label.textContent = loading ? "Signing In..." : "Sign In";
    }else{
      const label = button.querySelector("span");
      if(label) label.textContent = loading
        ? "Connecting to Google..."
        : "Continue with Google";
    }
  }

  function getAuth(){
    if(typeof firebaseAuth !== "undefined" && firebaseAuth) return firebaseAuth;
    if(typeof firebase !== "undefined" && firebase.apps.length) return firebase.auth();
    throw new Error("Firebase Authentication is not configured. Check firebase.js.");
  }

  function getDatabase(){
    if(typeof firebaseDB !== "undefined" && firebaseDB) return firebaseDB;
    if(typeof firebase !== "undefined" && firebase.apps.length) return firebase.firestore();
    throw new Error("Firebase Firestore is not configured. Check firebase.js.");
  }

  function getFirebaseError(error){
    const code = error && error.code ? error.code : "";
    const errors = {
      "auth/invalid-email":"Please enter a valid email address.",
      "auth/user-disabled":"This account has been disabled. Please contact support.",
      "auth/user-not-found":"No account was found with this email address.",
      "auth/wrong-password":"Incorrect email or password.",
      "auth/invalid-credential":"Incorrect email or password.",
      "auth/too-many-requests":"Too many attempts. Please wait before trying again.",
      "auth/network-request-failed":"Network error. Please check your internet connection.",
      "auth/operation-not-allowed":"This sign-in method is not enabled in Firebase Authentication.",
      "auth/unauthorized-domain":"This website domain is not authorized for sign-in in Firebase.",
      "auth/popup-closed-by-user":"Google sign-in was cancelled.",
      "auth/popup-blocked":"Your browser blocked the Google sign-in window. Allow pop-ups and try again.",
      "auth/cancelled-popup-request":"A Google sign-in window is already open.",
      "auth/account-exists-with-different-credential":"An account already exists with this email using another sign-in method.",
      "permission-denied":"Firestore denied access. Check your published Firestore customer rules.",
      "unavailable":"The database is temporarily unavailable. Please try again."
    };

    if(errors[code]) return errors[code];
    if(error && error.message) return error.message;
    return "Sign-in failed. Please try again.";
  }

  function cleanUsername(value){
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9._]/g, "")
      .slice(0, 20);
  }

  function getGoogleName(user){
    const parts = String(user.displayName || "").trim().split(/\s+/);
    return {
      firstName: parts[0] || "",
      lastName: parts.slice(1).join(" ")
    };
  }

  async function loadCustomerProfile(user, createGoogleProfile){
    const db = getDatabase();
    const customerRef = db.collection("customers").doc(user.uid);
    const snapshot = await customerRef.get();

    if(snapshot.exists){
      const existing = snapshot.data() || {};
      const updates = {
        email: existing.email || user.email || "",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if(!existing.username){
        const prefix = (user.email || "customer").split("@")[0];
        updates.username = cleanUsername(
          prefix + "_" + user.uid.slice(0, 5)
        ) || "customer";
      }

      if(createGoogleProfile){
        updates.signupMethod = existing.signupMethod || "google";

        const names = getGoogleName(user);
        if(!existing.firstName && names.firstName){
          updates.firstName = names.firstName;
        }
        if(!existing.lastName && names.lastName){
          updates.lastName = names.lastName;
        }
      }

      // Merge only profile fields; never overwrite balance or status.
      await customerRef.set(updates, { merge: true });

      const refreshed = await customerRef.get();
      return refreshed.exists ? refreshed.data() : existing;
    }

    if(!createGoogleProfile){
      throw new Error(
        "Your customer profile was not found. Please use Create Account or contact support."
      );
    }

    // Create a profile for a Google user who has no Firestore document.
    const names = getGoogleName(user);
    const emailPrefix = (user.email || "customer").split("@")[0];

    const profile = {
      uid: user.uid,
      email: user.email || "",
      username: cleanUsername(
        emailPrefix + "_" + user.uid.slice(0, 5)
      ) || "customer",
      firstName: names.firstName,
      lastName: names.lastName,
      phone: "",
      status: "Active",
      signupMethod: "google",
      balance: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await customerRef.set(profile);

    const saved = await customerRef.get();
    if(!saved.exists){
      throw new Error("Your Google account signed in, but its customer profile could not be confirmed.");
    }

    return saved.data();
  }

  function saveLoginState(user, profile){
    const customer = profile || {};
    const balance = Number(customer.balance) || 0;

    const loggedInUser = {
      uid: user.uid,
      id: user.uid,
      email: user.email || customer.email || "",
      name: user.displayName ||
        [customer.firstName, customer.lastName].filter(Boolean).join(" ") ||
        customer.username ||
        ((user.email || "customer").split("@")[0]),
      username: customer.username || "",
      firstName: customer.firstName || "",
      lastName: customer.lastName || "",
      phone: customer.phone || "",
      balance: balance
    };

    localStorage.removeItem("gentleAdminLoggedIn");
    localStorage.setItem("gentleCurrentUserId", user.uid);
    localStorage.setItem("gentleLoggedIn", "true");
    localStorage.setItem("gentleUser", JSON.stringify(loggedInUser));
    localStorage.setItem("gentleBalance", String(balance));

    if(rememberMe.checked){
      localStorage.setItem("gentleRememberMe", "true");
    }else{
      localStorage.removeItem("gentleRememberMe");
    }

    localStorage.removeItem("gentleCheckoutProduct");
  }

  async function finishLogin(user, createGoogleProfile){
    const profile = await loadCustomerProfile(user, createGoogleProfile);
    saveLoginState(user, profile);

    showMessage("Authentication successful. Opening your dashboard...", "success");

    window.setTimeout(function(){
      window.location.replace("dashboard.html");
    }, 450);
  }

  passwordToggle.addEventListener("click", function(){
    const icon = passwordToggle.querySelector("i");
    const showing = passwordInput.type === "password";

    passwordInput.type = showing ? "text" : "password";
    icon.className = showing ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
    passwordToggle.setAttribute("aria-label", showing ? "Hide password" : "Show password");
    passwordToggle.setAttribute("aria-pressed", String(showing));
  });

  form.addEventListener("submit", async function(event){
    event.preventDefault();
    clearMessage();

    if(submitting) return;

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if(!email || !password){
      showMessage("Please enter your email address and password.", "error");
      return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      showMessage("Please enter a valid email address.", "error");
      emailInput.focus();
      return;
    }

    submitting = true;
    setLoading(loginBtn, true);
    googleBtn.disabled = true;

    try{
      const result = await getAuth().signInWithEmailAndPassword(email, password);
      if(!result.user) throw new Error("Unable to sign in. Please try again.");

      await finishLogin(result.user, false);
    }catch(error){
      console.error("Gentle Acct Store login error:", error);
      showMessage(getFirebaseError(error), "error");
      setLoading(loginBtn, false);
    }finally{
      submitting = false;
      googleBtn.disabled = false;
    }
  });

  googleBtn.addEventListener("click", async function(){
    clearMessage();
    if(submitting) return;

    submitting = true;
    setLoading(googleBtn, true);
    loginBtn.disabled = true;

    try{
      const auth = getAuth();
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });

      const result = await auth.signInWithPopup(provider);
      if(!result.user) throw new Error("Google sign-in could not be completed.");

      // FIX: Google login creates the missing Firestore customer profile.
      await finishLogin(result.user, true);
    }catch(error){
      console.error("Gentle Acct Store Google sign-in error:", error);
      showMessage(getFirebaseError(error), "error");
    }finally{
      submitting = false;
      setLoading(googleBtn, false);
      loginBtn.disabled = false;
    }
  });

  [emailInput, passwordInput].forEach(function(input){
    input.addEventListener("input", function(){
      if(message.classList.contains("error")) clearMessage();
    });
  });
})();
</script>

<script id="gentlelogs-force-white">
(function () {
  function keepWhite() {
    var root = document.documentElement;
    if (!root) return;
    root.dataset.theme = "light";
    root.classList.remove("dark-mode", "blue-mode");
    try {
      localStorage.setItem("gentle-acct-store-theme", "light");
      var uid = localStorage.getItem("gentleCurrentUserId");
      if (uid) localStorage.setItem("gentle-acct-store-theme-user-" + uid, "light");
    } catch (e) {}
    ["themeToggle", "themeButton", "gentleThemeQuickToggle"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    });
  }
  keepWhite();
  document.addEventListener("DOMContentLoaded", keepWhite);
  window.addEventListener("pageshow", keepWhite);
