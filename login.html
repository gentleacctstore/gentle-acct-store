
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCFA">
<meta name="description" content="Sign in securely to your GentleLogs account.">
<title>Login | GentleLogs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --orange:#E87535;
  --orange-dark:#C96532;
  --orange-soft:#FFF1E8;
  --background:#FFFCFA;
  --surface:#FFFFFF;
  --text:#252A30;
  --muted:#7B838D;
  --border:#EDE5DF;
  --input:#FFFEFD;
  --shadow:0 22px 60px rgba(64,43,30,.09);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Space Grotesk",sans-serif;
}

html {
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}

body {
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:25px 16px 30px;
  color:var(--text);
  background:
    radial-gradient(ellipse at 5% 5%,rgba(232,117,53,.09),transparent 35%),
    radial-gradient(ellipse at 95% 95%,rgba(201,101,50,.07),transparent 35%),
    var(--background);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

a {
  color:inherit;
  text-decoration:none;
}

button,input {
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}

button {
  cursor:pointer;
}

.brand {
  text-align:center;
  margin:0 auto 25px;
}

.brand-mark {
  width:47px;
  height:47px;
  margin:0 auto 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  color:#fff;
  font-size:22px;
  font-weight:700;
  letter-spacing:-1.5px;
  background:linear-gradient(145deg,#F18B50,#C96532);
  box-shadow:0 9px 22px rgba(201,101,50,.20);
}

.brand-name {
  display:inline-block;
  font-size:24px;
  font-weight:700;
  line-height:1.4;
  letter-spacing:-1px;
  color:var(--text);
}

.brand-name span {
  color:var(--orange);
}

.brand-tagline {
  margin-top:4px;
  color:#92969C;
  font-size:9px;
  letter-spacing:1.8px;
  font-weight:600;
}

.wrapper {
  width:100%;
  max-width:420px;
  margin:0 auto;
}

.card {
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.card-top {
  height:4px;
  background:linear-gradient(90deg,#C96532,#E87535,#F5B17E);
}

.tabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:54px;
  padding:0 15px;
  border-bottom:1px solid #F0EBE7;
}

.tab {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 5px;
  color:#89909A;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s;
}

.tab i {
  font-size:12px;
}

.tab.active {
  color:var(--orange-dark);
}

.tab.active::after {
  content:"";
  position:absolute;
  bottom:0;
  left:12%;
  width:76%;
  height:3px;
  border-radius:8px 8px 0 0;
  background:linear-gradient(90deg,#C96532,#E87535);
}

.content {
  padding:28px 26px 26px;
}

.heading-row {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:7px;
}

.heading-icon {
  width:42px;
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  color:var(--orange-dark);
  background:var(--orange-soft);
  border:1px solid #F8E1D2;
  font-size:17px;
}

h1 {
  font-size:25px;
  line-height:1.3;
  letter-spacing:-.9px;
  font-weight:700;
  color:var(--text);
}

.subtitle {
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  margin:0 0 24px;
}

.group {
  margin-bottom:17px;
}

.label-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.label-row label {
  font-size:10px;
  font-weight:700;
  letter-spacing:.65px;
  text-transform:uppercase;
  color:#424B55;
}

.forgot {
  color:var(--orange-dark);
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.forgot:hover {
  text-decoration:underline;
}

.input-wrap {
  position:relative;
  display:flex;
  align-items:center;
  min-height:49px;
  border:1px solid #E8E3DE;
  border-radius:11px;
  background:var(--input);
  transition:border-color .2s,box-shadow .2s,background .2s;
}

.input-wrap:focus-within {
  border-color:var(--orange);
  background:#fff;
  box-shadow:0 0 0 3px rgba(232,117,53,.10);
}

.input-icon {
  width:43px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#A0A2A6;
  font-size:14px;
}

.input-wrap input {
  width:100%;
  min-width:0;
  height:48px;
  padding:0 9px 0 0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  font-weight:500;
}

.input-wrap input::placeholder {
  color:#A6A8AC;
  opacity:1;
  font-weight:400;
}

.eye {
  flex-shrink:0;
  width:39px;
  height:39px;
  margin-right:4px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#858B94;
  font-size:13px;
  transition:background .2s,color .2s;
}

.eye:hover {
  background:var(--orange-soft);
  color:var(--orange-dark);
}

.remember {
  display:flex;
  align-items:center;
  gap:9px;
  margin:1px 0 20px;
  color:#737B84;
  font-size:11px;
  font-weight:500;
  cursor:pointer;
}

.remember input {
  appearance:none;
  -webkit-appearance:none;
  width:17px;
  height:17px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid #D8D4D0;
  border-radius:5px;
  background:#fff;
  cursor:pointer;
}

.remember input:checked {
  border-color:var(--orange);
  background:var(--orange);
}

.remember input:checked::after {
  content:"";
  width:4px;
  height:8px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px);
}

.submit {
  width:100%;
  min-height:49px;
  border:0;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:linear-gradient(100deg,#C96532,#E87535);
  color:#fff;
  font-size:13px;
  font-weight:700;
  letter-spacing:.1px;
  box-shadow:0 8px 19px rgba(201,101,50,.18);
  transition:background .2s,transform .2s,box-shadow .2s;
}

.submit:hover {
  background:linear-gradient(100deg,#B95B2D,#D96D32);
  box-shadow:0 10px 22px rgba(201,101,50,.23);
}

.submit:active {
  transform:scale(.99);
}

.submit:disabled {
  opacity:.68;
  cursor:not-allowed;
}

.submit .spinner {
  display:none;
}

.submit.loading .spinner {
  display:inline-block;
}

.submit.loading .submit-arrow {
  display:none;
}

.spinner {
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin {
  to {transform:rotate(360deg);}
}

.or-divider {
  display:flex;
  align-items:center;
  gap:12px;
  margin:21px 0 15px;
  color:#92969D;
  font-size:9px;
  font-weight:600;
  letter-spacing:1px;
  white-space:nowrap;
}

.or-divider::before,
.or-divider::after {
  content:"";
  height:1px;
  background:#ECE8E4;
  flex:1;
}

.google-btn {
  width:100%;
  min-height:47px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#fff;
  border:1px solid #E8E3DE;
  border-radius:11px;
  color:#39414B;
  font-size:12px;
  font-weight:600;
  transition:background .2s,border-color .2s,transform .2s;
}

.google-btn:hover {
  background:#FFFAF6;
  border-color:#E8C8B3;
}

.google-btn:active {
  transform:scale(.99);
}

.google-btn:disabled {
  opacity:.65;
  cursor:not-allowed;
}

.google-btn img {
  display:block;
  width:19px;
  height:19px;
  flex-shrink:0;
}

.footer {
  text-align:center;
  color:#92979E;
  font-size:10px;
  line-height:1.9;
  margin:20px auto 0;
}

.footer strong {
  color:#626B75;
  font-weight:600;
}

.footer .secure {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom:5px;
}

.footer .secure i {
  color:var(--orange-dark);
  font-size:11px;
}

.toast-container {
  position:fixed;
  z-index:9999;
  top:max(18px,env(safe-area-inset-top));
  right:18px;
  width:min(360px,calc(100% - 36px));
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none;
}

.toast {
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:13px 14px;
  border:1px solid #EDE5DF;
  border-left:4px solid var(--orange);
  border-radius:12px;
  background:#fff;
  color:var(--text);
  box-shadow:0 12px 35px rgba(35,29,24,.13);
  pointer-events:auto;
  opacity:0;
  transform:translateY(-10px);
  animation:toastIn .25s ease forwards;
}

.toast.success {
  border-left-color:#29965B;
}

.toast.error {
  border-left-color:#D94A4A;
}

.toast-icon {
  width:20px;
  height:20px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  color:var(--orange);
  font-size:15px;
}

.toast.success .toast-icon {
  color:#29965B;
}

.toast.error .toast-icon {
  color:#D94A4A;
}

.toast-body {
  flex:1;
  min-width:0;
}

.toast-title {
  display:block;
  margin-bottom:2px;
  font-size:12px;
  font-weight:700;
}

.toast-message {
  color:#747C85;
  font-size:11px;
  line-height:1.55;
  overflow-wrap:anywhere;
}

.toast-close {
  width:24px;
  height:24px;
  flex-shrink:0;
  border:0;
  border-radius:6px;
  background:transparent;
  color:#92979E;
  font-size:13px;
}

.toast-close:hover {
  background:#F5F1ED;
  color:var(--text);
}

.toast.removing {
  animation:toastOut .2s ease forwards;
}

@keyframes toastIn {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes toastOut {
  to {
    opacity:0;
    transform:translateY(-8px);
  }
}

@media(max-width:600px) {
  body {
    padding:24px 14px 25px;
  }

  .brand {
    margin-bottom:22px;
  }

  .content {
    padding:25px 22px 23px;
  }

  h1 {
    font-size:24px;
  }
}

@media(max-width:390px) {
  body {
    padding:19px 11px 21px;
  }

  .brand {
    margin-bottom:18px;
  }

  .brand-mark {
    width:44px;
    height:44px;
    font-size:21px;
    border-radius:14px;
  }

  .brand-name {
    font-size:21px;
  }

  .brand-tagline {
    font-size:8px;
    letter-spacing:1.5px;
  }

  .card {
    border-radius:18px;
  }

  .tabs {
    padding:0 8px;
    min-height:50px;
  }

  .tab {
    font-size:10.5px;
    gap:6px;
  }

  .content {
    padding:22px 17px 20px;
  }

  .heading-row {
    gap:10px;
  }

  .heading-icon {
    width:39px;
    height:39px;
    border-radius:12px;
  }

  h1 {
    font-size:22px;
  }

  .subtitle {
    font-size:11px;
    margin-bottom:21px;
  }

  .group {
    margin-bottom:16px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}

/* ==========================================================
   GENTLELOGS SIGN-IN — PREMIUM VISUAL REDESIGN

:root{
  --orange:#E87535;--orange-dark:#C96532;--orange-soft:#FFF1E8;
  --background:#F8F7F5;--surface:#FFFFFF;--text:#222832;--muted:#89919C;
  --border:#ECE8E3;--input:#FAFAF9;
}
html,body{min-height:100%;width:100%}
body{
  position:relative;isolation:isolate;overflow-x:hidden;
  display:grid;grid-template-columns:minmax(0,1.04fr) minmax(390px,.96fr);
  grid-template-rows:1fr auto;align-items:center;justify-items:center;
  gap:0;min-height:100vh;min-height:100dvh;
  padding:54px clamp(26px,6vw,100px) 26px;
  background:
    radial-gradient(ellipse at 12% 18%,rgba(232,117,53,.12),transparent 34%),
    radial-gradient(ellipse at 85% 85%,rgba(108,89,168,.07),transparent 32%),
    linear-gradient(135deg,#FBFAF8 0%,#F4F2EF 100%);
}
body:before,body:after{
  content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;
  filter:blur(70px);animation:glAmbientDrift 14s ease-in-out infinite alternate;
}
body:before{width:260px;height:260px;top:-120px;left:34%;background:rgba(238,142,91,.14)}
body:after{width:300px;height:300px;right:-150px;bottom:-130px;background:rgba(130,107,190,.10);animation-delay:-6s}
.brand{
  grid-column:1;grid-row:1;align-self:center;justify-self:stretch;
  width:min(100%,610px);margin:0 auto;text-align:left;position:relative;
  display:flex;flex-direction:column;align-items:flex-start;padding:0 5% 0 0;
}
.brand-mark{
  width:48px;height:48px;margin:0 0 12px;border-radius:16px;
  background:linear-gradient(145deg,#FF9A5E,#D95E2C);
  box-shadow:0 12px 28px rgba(201,101,50,.24),inset 0 1px 0 rgba(255,255,255,.5);
  animation:glBrandBob 4s ease-in-out infinite;
}
.brand-mark:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(232,117,53,.28);border-radius:21px;animation:glBrandHalo 2.8s ease-out infinite}
.brand-name{font-size:25px;letter-spacing:-1.2px}
.brand-tagline{margin-top:5px;font-size:8px;letter-spacing:2.4px}
.login-showcase{
  position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:530px;
  margin-top:38px;padding:42px 38px 28px;border-radius:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  color:#fff;background:
    radial-gradient(ellipse at 50% 39%,rgba(232,117,53,.23),transparent 35%),
    radial-gradient(ellipse at 5% 95%,rgba(119,93,197,.18),transparent 42%),
    linear-gradient(145deg,#111925 0%,#202A38 53%,#111925 100%);
  box-shadow:0 28px 70px rgba(27,33,44,.16),inset 0 1px 0 rgba(255,255,255,.09);
}
.login-showcase:before,.login-showcase:after{
  content:"";position:absolute;z-index:-1;border:1px solid rgba(255,255,255,.07);border-radius:50%;pointer-events:none;
}
.login-showcase:before{width:420px;height:420px;top:0;left:50%;transform:translateX(-50%);animation:glShowcaseOrbit 18s linear infinite}
.login-showcase:after{width:570px;height:570px;top:-65px;left:50%;transform:translateX(-50%);border-color:rgba(232,117,53,.13);animation:glShowcaseOrbit 25s linear infinite reverse}
.showcase-glow{position:absolute;top:75px;left:50%;width:210px;height:210px;transform:translateX(-50%);border-radius:50%;background:#E87535;filter:blur(90px);opacity:.28;animation:glGlowPulse 4s ease-in-out infinite}
.showcase-core{position:relative;z-index:2;width:122px;height:122px;margin:8px auto 0;display:grid;place-items:center}
.showcase-core:before,.showcase-core:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.25);border-radius:38px;transform:rotate(22deg);animation:glCoreSpin 12s linear infinite}
.showcase-core:after{inset:10px;border-color:rgba(232,117,53,.5);transform:rotate(-18deg);animation-duration:9s;animation-direction:reverse}
.showcase-core-icon{width:78px;height:78px;display:grid;place-items:center;border-radius:27px;font-size:31px;color:#fff;
  background:linear-gradient(145deg,#FF985C,#D95E2C);box-shadow:0 16px 42px rgba(232,117,53,.35),inset 0 1px 0 rgba(255,255,255,.45);animation:glCoreFloat 3.5s ease-in-out infinite}
.core-spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#FFC394;box-shadow:0 0 15px #FF9B61}
.spark-a{top:8px;right:14px;animation:glSpark 2s infinite}.spark-b{bottom:8px;left:8px;animation:glSpark 2.4s .6s infinite}
.showcase-orbit{position:absolute;z-index:0;left:50%;top:74px;border:1px solid rgba(255,255,255,.10);border-radius:50%;pointer-events:none}
.orbit-a{width:260px;height:120px;transform:translateX(-50%) rotate(-22deg);animation:glOrbitFloat 8s ease-in-out infinite}
.orbit-b{width:290px;height:130px;transform:translateX(-50%) rotate(28deg);border-color:rgba(232,117,53,.19);animation:glOrbitFloat 10s ease-in-out infinite reverse}
.orbit-c{width:220px;height:220px;transform:translateX(-50%);border-style:dashed;border-color:rgba(255,255,255,.08);animation:glShowcaseOrbit 30s linear infinite}
.showcase-floating-card{
  position:absolute;z-index:3;display:flex;align-items:center;gap:10px;min-width:210px;
  padding:12px 14px;border:1px solid rgba(255,255,255,.13);border-radius:15px;
  background:rgba(255,255,255,.09);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 12px 28px rgba(0,0,0,.15);animation:glFloatCard 5s ease-in-out infinite;
}
.showcase-card-wallet{top:152px;left:4px}.showcase-card-orders{top:226px;right:0;animation-delay:-2.3s}
.showcase-card-icon{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;background:rgba(232,117,53,.19);color:#FFA16C}
.showcase-floating-card b,.showcase-floating-card small{display:block;text-align:left}
.showcase-floating-card b{font-size:10px;color:#fff}.showcase-floating-card small{margin-top:3px;color:#AEB8C7;font-size:8px}
.showcase-card-arrow{margin-left:auto;color:#AEB8C7;font-size:10px}.showcase-card-check{margin-left:auto;color:#6FE0AD}
.showcase-copy{position:relative;z-index:2;max-width:420px;margin:52px auto 0;text-align:center}
.showcase-eyebrow{display:inline-flex;align-items:center;gap:8px;color:#F3A174;font-size:8px;font-weight:700;letter-spacing:2.1px}
.showcase-eyebrow i{width:6px;height:6px;border-radius:50%;background:#66D6A5;box-shadow:0 0 12px #66D6A5;animation:glSpark 1.8s infinite}
.showcase-copy h2{margin-top:15px;color:#fff;font-size:clamp(27px,3vw,39px);line-height:1.12;letter-spacing:-1.6px;font-weight:700}
.showcase-copy h2 em{font-style:normal;color:#F18B50}
.showcase-copy p{max-width:345px;margin:13px auto 0;color:#B6C0CD;font-size:11px;line-height:1.8}
.showcase-bottom{position:relative;z-index:2;display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin-top:auto;padding-top:27px}
.showcase-bottom span{display:flex;align-items:center;gap:6px;color:#B9C3D0;font-size:8px;letter-spacing:.2px}
.showcase-bottom i{color:#F19A68;font-size:10px}
.wrapper{grid-column:2;grid-row:1;width:100%;max-width:470px;margin:0 auto;padding-left:clamp(0px,2vw,26px)}
.card{
  border:1px solid rgba(255,255,255,.92);border-radius:25px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 25px 75px rgba(40,42,48,.10),0 3px 10px rgba(40,42,48,.035);
  transition:transform .35s ease,box-shadow .35s ease;
}

<script>
(function() {
  "use strict";

  const form = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const passwordToggle = document.getElementById("passwordToggle");
  const googleBtn = document.getElementById("googleBtn");
  const rememberMe = document.getElementById("rememberMe");
  const toastContainer = document.getElementById("toastContainer");

  let submitting = false;
  let redirecting = false;

  function showMessage(message, type) {
    const toast = document.createElement("div");
    toast.className = "toast " + (type || "info");

    let icon = "fa-circle-info";
    let title = "Notice";

    if(type === "success") {
      icon = "fa-circle-check";
      title = "Success";
    } else if(type === "error") {
      icon = "fa-circle-exclamation";
      title = "Sign-in failed";
    }

    const iconElement = document.createElement("div");
    iconElement.className = "toast-icon";
    iconElement.innerHTML =
      '<i class="fa-solid ' + icon + '" aria-hidden="true"></i>';

    const body = document.createElement("div");
    body.className = "toast-body";

    const titleElement = document.createElement("strong");
    titleElement.className = "toast-title";
    titleElement.textContent = title;

    const messageElement = document.createElement("div");
    messageElement.className = "toast-message";
    messageElement.textContent = message;

    const close = document.createElement("button");
    close.type = "button";
    close.className = "toast-close";
    close.setAttribute("aria-label", "Close notification");
    close.innerHTML =
      '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';

    body.appendChild(titleElement);
    body.appendChild(messageElement);

    toast.appendChild(iconElement);
    toast.appendChild(body);
    toast.appendChild(close);

    toastContainer.appendChild(toast);

    let removeTimer;

    function removeToast() {
      if(!toast.isConnected) return;

      clearTimeout(removeTimer);
      toast.classList.add("removing");

      setTimeout(function() {
        toast.remove();
      }, 220);
    }

    close.addEventListener("click", removeToast);

    removeTimer = setTimeout(removeToast, type === "success" ? 1800 : 4000);

    while(toastContainer.children.length > 3) {
      toastContainer.firstElementChild.remove();
    }
  }

  function setLoading(button, loading) {
    button.disabled = loading;

    if(button === loginBtn) {
      button.classList.toggle("loading", loading);

      const label = button.querySelector(".submit-label");

      if(label) {
        label.textContent = loading ? "Signing In..." : "Sign In";
      }
    } else {
      const label = button.querySelector("span");

      if(label) {
        label.textContent = loading
          ? "Connecting to Google..."
          : "Continue with Google";
      }
    }
  }

  function getAuth() {
    if(typeof firebaseAuth !== "undefined" && firebaseAuth) {
      return firebaseAuth;
    }

    if(typeof firebase !== "undefined" && firebase.apps.length) {
      return firebase.auth();
    }

    throw new Error(
      "Firebase Authentication is not configured. Check firebase.js."
    );
  }

  function getDatabase() {
    if(typeof firebaseDB !== "undefined" && firebaseDB) {
      return firebaseDB;
    }

    if(typeof firebase !== "undefined" && firebase.apps.length) {
      return firebase.firestore();
    }

    throw new Error(
      "Firebase Firestore is not configured. Check firebase.js."
    );
  }

  function getFirebaseError(error) {
    const code = error && error.code ? error.code : "";

    const errors = {
      "auth/invalid-email":
        "Please enter a valid email address.",

      "auth/user-disabled":
        "This account has been disabled. Please contact support.",

      "auth/user-not-found":
        "No account was found with this email address.",

      "auth/wrong-password":
        "Incorrect email or password.",

      "auth/invalid-credential":
        "Incorrect email or password.",

      "auth/too-many-requests":
        "Too many attempts. Please wait before trying again.",

      "auth/network-request-failed":
        "Network error. Please check your internet connection.",

      "auth/operation-not-allowed":
        "This sign-in method is not enabled in Firebase Authentication.",

      "auth/unauthorized-domain":
        "This website domain is not authorized for sign-in in Firebase.",

      "auth/popup-closed-by-user":
        "Google sign-in was cancelled.",

      "auth/popup-blocked":
        "Your browser blocked the Google sign-in window. Allow pop-ups and try again.",

      "auth/cancelled-popup-request":
        "A Google sign-in window is already open.",

      "auth/account-exists-with-different-credential":
        "An account already exists with this email using another sign-in method.",

      "permission-denied":
        "Firestore denied access. Check your published Firestore customer rules.",

      "unavailable":
        "The database is temporarily unavailable. Please try again."
    };

    if(errors[code]) return errors[code];

    if(error && error.message) return error.message;

    return "Sign-in failed. Please try again.";
  }

  function cleanUsername(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9._]/g, "")
      .slice(0, 20);
  }

  function getGoogleName(user) {
    const parts = String(user.displayName || "")
      .trim()
      .split(/\s+/);

    return {
      firstName: parts[0] || "",
      lastName: parts.slice(1).join(" ")
    };
  }

  async function applyAuthPersistence(auth) {
    const persistence = rememberMe.checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION;

    await auth.setPersistence(persistence);
  }

  async function loadCustomerProfile(user, createGoogleProfile) {
    const db = getDatabase();
    const customerRef = db.collection("customers").doc(user.uid);
    const snapshot = await customerRef.get();

    if(snapshot.exists) {
      const existing = snapshot.data() || {};

      if(!createGoogleProfile) return existing;

      const names = getGoogleName(user);
      const updates = {};

      if(!existing.email && user.email) {
        updates.email = user.email;
      }

      if(!existing.username) {
        const prefix = (user.email || "customer").split("@")[0];

        updates.username =
          cleanUsername(prefix + "_" + user.uid.slice(0, 5)) || "customer";
      }

      if(!existing.signupMethod) {
        updates.signupMethod = "google";
      }

      if(!existing.firstName && names.firstName) {
        updates.firstName = names.firstName;
      }

      if(!existing.lastName && names.lastName) {
        updates.lastName = names.lastName;
      }

      if(Object.keys(updates).length) {
        updates.updatedAt =
          firebase.firestore.FieldValue.serverTimestamp();

        await customerRef.set(updates, { merge: true });

        return Object.assign({}, existing, updates);
      }

      return existing;
    }

    if(!createGoogleProfile) {
      throw new Error(
        "Your customer profile was not found. Please use Create Account or contact support."
      );
    }

    const names = getGoogleName(user);
    const emailPrefix = (user.email || "customer").split("@")[0];

    const profile = {
      uid: user.uid,
      email: user.email || "",
      username:
        cleanUsername(emailPrefix + "_" + user.uid.slice(0, 5)) || "customer",
      firstName: names.firstName,
      lastName: names.lastName,
      phone: "",
      status: "Active",
      signupMethod: "google",
      balance: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await customerRef.set(profile);

    return profile;
  }

  function saveLoginState(user, profile) {
    const customer = profile || {};
    const balance = Number(customer.balance) || 0;

    const loggedInUser = {
      uid: user.uid,
      id: user.uid,
      email: user.email || customer.email || "",
      name:
        user.displayName ||
        [customer.firstName, customer.lastName].filter(Boolean).join(" ") ||
        customer.username ||
        ((user.email || "customer").split("@")[0]),
      username: customer.username || "",
      firstName: customer.firstName || "",
      lastName: customer.lastName || "",
      phone: customer.phone || "",
      balance: balance
    };

    try {
      localStorage.removeItem("gentleAdminLoggedIn");
      localStorage.setItem("gentleCurrentUserId", user.uid);
      localStorage.setItem("gentleLoggedIn", "true");
      localStorage.setItem("gentleUser", JSON.stringify(loggedInUser));
      localStorage.setItem("gentleBalance", String(balance));

      if(rememberMe.checked) {
        localStorage.setItem("gentleRememberMe", "true");
      } else {
        localStorage.removeItem("gentleRememberMe");
      }

      localStorage.removeItem("gentleCheckoutProduct");
    } catch(error) {
      console.warn("Login state could not be cached:", error);
    }

  }

  /*
   * Email verification is intentionally NOT required.
   * Any successfully authenticated customer can proceed.
   */
  async function finishLogin(user, createGoogleProfile) {
    if(!user) {
      throw new Error("Unable to identify your account. Please try again.");
    }

    if(!createGoogleProfile) {
      try {
        const cached = JSON.parse(
          localStorage.getItem("gentleUser") || "null"
        );

        if(cached && cached.uid === user.uid) {
          saveLoginState(user, cached);
          redirectToHome(user, cached);
          return;
        }
      } catch(error) {
        console.warn(
          "Saved customer profile cache could not be used:",
          error
        );
      }
    }

    const profile = await loadCustomerProfile(
      user,
      createGoogleProfile
    );

    saveLoginState(user, profile);
    redirectToHome(user, profile);
  }

  function redirectToHome(user, profile) {
    redirecting = true;
    showMessage("Login successful. Opening your dashboard...", "success");
    setTimeout(function() {
      window.location.replace("home.html");
    }, 950);
  }

  passwordToggle.addEventListener("click", function() {
    const icon = passwordToggle.querySelector("i");
    const showing = passwordInput.type === "password";

    passwordInput.type = showing ? "text" : "password";

    icon.className = showing
      ? "fa-solid fa-eye-slash"
      : "fa-solid fa-eye";

    passwordToggle.setAttribute(
      "aria-label",
      showing ? "Hide password" : "Show password"
    );

    passwordToggle.setAttribute(
      "aria-pressed",
      String(showing)
    );
  });

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if(submitting || redirecting) return;

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if(!email || !password) {
      showMessage(
        "Please enter your email address and password.",
        "error"
      );
      return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showMessage("Please enter a valid email address.", "error");
      emailInput.focus();
      return;
    }

    submitting = true;

    setLoading(loginBtn, true);
    googleBtn.disabled = true;

    try {
      const auth = getAuth();

      await applyAuthPersistence(auth);

      const result = await auth.signInWithEmailAndPassword(
        email,
        password
      );

      if(!result.user) {
        throw new Error("Unable to sign in. Please try again.");
      }

      await finishLogin(result.user, false);

    } catch(error) {
      console.error("GentleLogs login error:", error);

      showMessage(getFirebaseError(error), "error");

      setLoading(loginBtn, false);

    } finally {
      submitting = false;

      if(!redirecting) {
        googleBtn.disabled = false;
      }
    }
  });

  googleBtn.addEventListener("click", async function() {
    if(submitting || redirecting) return;

    submitting = true;

    setLoading(googleBtn, true);
    loginBtn.disabled = true;

    try {
      const auth = getAuth();

      await applyAuthPersistence(auth);

      const provider = new firebase.auth.GoogleAuthProvider();

      provider.setCustomParameters({
        prompt:"select_account"
      });

      const result = await auth.signInWithPopup(provider);

      if(!result.user) {
        throw new Error("Google sign-in could not be completed.");
      }

      await finishLogin(result.user, true);

    } catch(error) {
      console.error("GentleLogs Google sign-in error:", error);

      showMessage(getFirebaseError(error), "error");

    } finally {
      submitting = false;

      if(!redirecting) {
        setLoading(googleBtn, false);
        loginBtn.disabled = false;
      }
    }
  });

})();
</script>
