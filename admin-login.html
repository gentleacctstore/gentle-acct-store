
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <meta name="description" content="Secure administrator login for Gentle Acct Store.">
  <title>Admin Login | Gentle Acct Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-light: #EFF6FF;
      --background: #F8FAFC;
      --text: #172033;
      --muted: #7B8798;
      --border: #E5EAF2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 5% 0%, rgba(37,99,235,.09), transparent 32%),
        var(--background);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 68px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .logo-icon {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 13px;
      box-shadow: 0 6px 15px rgba(37,99,235,.18);
    }

    .logo-accent { color: var(--blue); }

    .back-store {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 12px;
      color: var(--blue-dark);
      background: var(--blue-light);
      border: 1px solid #DBEAFE;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 700;
      transition: .2s;
    }

    .back-store:hover { background: #DBEAFE; }

    .page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 38px 15px 45px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 35px 29px 29px;
      text-align: center;
      background: rgba(255,255,255,.98);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(15,23,42,.055);
    }

    .shield {
      width: 76px;
      height: 76px;
      margin: 0 auto 19px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, #3B82F6, #1D4ED8);
      border-radius: 23px;
      font-size: 29px;
      box-shadow: 0 10px 23px rgba(37,99,235,.19);
    }

    .badge {
      width: max-content;
      max-width: 100%;
      margin: 0 auto 17px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--blue-dark);
      background: var(--blue-light);
      border: 1px solid #DBEAFE;
      border-radius: 30px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    h1 {
      margin-bottom: 10px;
      color: var(--text);
      font-size: clamp(26px, 5vw, 32px);
      line-height: 1.25;
      letter-spacing: -.8px;
      font-weight: 800;
    }

    .subtitle {
      max-width: 340px;
      margin: 0 auto 27px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 13px;
      border-radius: 12px;
      text-align: left;
      font-size: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #B42318;
      background: #FFF5F5;
      border: 1px solid #FECACA;
    }

    .message.success {
      display: block;
      color: #166534;
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
    }

    .message.info {
      display: block;
      color: #1D4ED8;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
    }

    .form { text-align: left; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      color: #344054;
      font-size: 11px;
      font-weight: 700;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 51px;
      padding: 0 47px 0 15px;
      color: var(--text);
      background: #FBFCFE;
      border: 1px solid #DCE3ED;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      font-size: 12px;
      transition: .2s;
    }

    input:hover { border-color: #CBD5E1; }

    input:focus {
      background: white;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37,99,235,.09);
    }

    input::placeholder { color: #9AA5B5; }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 9px;
      width: 34px;
      height: 34px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      color: #7B8798;
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--blue-dark);
      background: var(--blue-light);
    }

    .login-btn {
      width: 100%;
      min-height: 51px;
      margin-top: 4px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: white;
      background: var(--blue);
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(37,99,235,.17);
      transition: .2s;
    }

    .login-btn:hover:not(:disabled) {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .loading {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .forgot {
      display: block;
      margin-top: 19px;
      color: var(--blue-dark);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }

    .forgot:hover { text-decoration: underline; }

    .security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 26px;
      color: var(--muted);
      font-size: 10px;
    }

    .security i { color: var(--blue); }

    .bottom-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 22px;
      color: #64748B;
      font-size: 11px;
      font-weight: 600;
    }

    .bottom-link:hover { color: var(--blue-dark); }

    .footer {
      padding: 0 15px 22px;
      color: #94A3B8;
      text-align: center;
      font-size: 9px;
    }

    @media (max-width: 450px) {
      .header { height: 64px; padding: 0 13px; }
      .logo { gap: 8px; font-size: 13px; }
      .logo-icon { width: 35px; height: 35px; border-radius: 11px; }
      .back-store { padding: 8px 10px; font-size: 10px; }
      .page { padding: 27px 13px 35px; align-items: flex-start; }
      .card { padding: 30px 20px 25px; border-radius: 21px; }
      .shield { width: 68px; height: 68px; border-radius: 20px; font-size: 25px; }
    }

    @media (max-width: 350px) {
      .logo { font-size: 11px; }
      .back-store { gap: 5px; font-size: 9px; }
      .card { padding: 25px 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="index.html" class="logo">
      <span class="logo-icon"><i class="fa-solid fa-store"></i></span>
      <span>Gentle <span class="logo-accent">Acct</span> Store</span>
    </a>

    <a href="index.html" class="back-store">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Store
    </a>
  </header>

  <main class="page">
    <section class="card">
      <div class="shield">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <div class="badge">
        <i class="fa-solid fa-lock"></i>
        ADMIN ACCESS
      </div>

      <h1>Admin Login</h1>

      <p class="subtitle">
        Sign in with your authorized Gentle Acct Store administrator account.
      </p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="loginForm" class="form">
        <div class="field">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter admin email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter admin password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Login to Admin Panel</span>
        </button>
      </form>

      <a href="forgot-password.html" class="forgot">
        Forgot your password?
      </a>

      <div class="security">
        <i class="fa-solid fa-lock"></i>
        <span>Secure Firebase authentication</span>
      </div>

      <a href="index.html" class="bottom-link">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Store
      </a>
    </section>
  </main>

  <footer class="footer">
    © 2026 Gentle Acct Store. All rights reserved.
  </footer>

  <!-- Firebase SDKs: use one compatible version and initialize once -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    "use strict";

    const ADMIN_UID = "UoEjCy99gbQKkGob59vGi3CunZi1";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    let loginInProgress = false;
    let redirectStarted = false;
    let authListenerReady = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function setBusy(busy) {
      loginBtn.disabled = busy;

      loginBtn.innerHTML = busy
        ? '<span class="loading"></span><span>Checking Access...</span>'
        : '<i class="fa-solid fa-right-to-bracket"></i><span>Login to Admin Panel</span>';
    }

    function clearAdminFlags() {
      // Remove legacy flags; they are not used to grant access.
      try {
        localStorage.removeItem("gentleAdminLoggedIn");
        localStorage.removeItem("gentleAdminUID");
      } catch (error) {
        // Authentication does not depend on localStorage.
      }
    }

    function friendlyLoginError(error) {
      switch (error && error.code) {
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Incorrect email or password.";

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/too-many-requests":
          return "Too many login attempts. Please wait a while and try again.";

        case "auth/network-request-failed":
          return "Network error. Check your internet connection and try again.";

        case "auth/user-disabled":
          return "This account has been disabled. Please contact the administrator.";

        case "auth/operation-not-allowed":
          return "Email and password sign-in is not enabled in Firebase Authentication.";

        default:
          return "Unable to sign in right now. Please try again.";
      }
    }

    function goToAdmin() {
      if (redirectStarted) return;

      redirectStarted = true;
      window.location.replace("admin.html");
    }

    togglePassword.addEventListener("click", function () {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";

      togglePassword.querySelector("i").className =
        show ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";

      togglePassword.setAttribute(
        "aria-label",
        show ? "Hide password" : "Show password"
      );

      togglePassword.setAttribute("aria-pressed", String(show));
    });

    function initializeLogin() {
      if (
        typeof firebaseAuth === "undefined" ||
        !firebaseAuth ||
        typeof firebaseAuth.onAuthStateChanged !== "function" ||
        typeof firebaseAuth.signInWithEmailAndPassword !== "function"
      ) {
        showMessage(
          "Firebase Authentication is not initialized. Check firebase.js and try again.",
          "error"
        );
        loginBtn.disabled = true;
        return;
      }

      firebaseAuth.onAuthStateChanged(async function (user) {
        authListenerReady = true;

        // The form handler performs its own checks after a new sign-in.
        if (loginInProgress || redirectStarted) return;

        if (!user) return;

        if (user.uid !== ADMIN_UID) {
          clearAdminFlags();

          try {
            await firebaseAuth.signOut();
          } catch (error) {
            console.error("Unable to clear unauthorized session:", error);
          }

          showMessage(
            "This signed-in account is not authorized for the admin panel.",
            "error"
          );
          return;
        }

        if (!user.emailVerified) {
          clearAdminFlags();

          try {
            await firebaseAuth.signOut();
          } catch (error) {
            console.error("Unable to sign out unverified admin:", error);
          }

          showMessage(
            "Please verify the administrator email address before accessing the admin panel.",
            "error"
          );
          return;
        }

        goToAdmin();
      });
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (loginInProgress || redirectStarted) return;

      if (
        typeof firebaseAuth === "undefined" ||
        !firebaseAuth ||
        typeof firebaseAuth.signInWithEmailAndPassword !== "function"
      ) {
        showMessage(
          "Firebase Authentication is unavailable. Check firebase.js and reload the page.",
          "error"
        );
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !emailInput.validity.valid || !password) {
        showMessage("Enter a valid email address and password.", "error");
        return;
      }

      loginInProgress = true;
      setBusy(true);
      message.className = "message";

      try {
        const credential =
          await firebaseAuth.signInWithEmailAndPassword(email, password);

        const user = credential.user;

        if (!user || user.uid !== ADMIN_UID) {
          clearAdminFlags();

          try {
            await firebaseAuth.signOut();
          } catch (signOutError) {
            console.error("Unauthorized sign-out error:", signOutError);
          }

          showMessage(
            "This account is not authorized to access the admin panel.",
            "error"
          );
          return;
        }

        if (!user.emailVerified) {
          clearAdminFlags();

          try {
            await firebaseAuth.signOut();
          } catch (signOutError) {
            console.error("Unverified sign-out error:", signOutError);
          }

          showMessage(
            "Please verify the admin email address before accessing the admin panel.",
            "error"
          );
          return;
        }

        showMessage("Admin login successful. Opening dashboard...", "success");
        goToAdmin();

      } catch (error) {
        console.error("Admin login error:", error);
        showMessage(friendlyLoginError(error), "error");

      } finally {
        loginInProgress = false;

        if (!redirectStarted) {
          setBusy(false);
        }
      }
    });

    initializeLogin();
  </script>
</body>
</html>
