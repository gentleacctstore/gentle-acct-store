<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin Login - Gentle Acct Store</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:#f5f8fc;

  font-family:'Poppins',sans-serif;

  color:#071f40;
}

.login-card{
  width:100%;
  max-width:410px;

  background:white;

  border:1px solid #e4e9f0;

  border-radius:24px;

  padding:30px 22px;

  box-shadow:
    0 15px 40px rgba(7,31,64,.08);
}

.logo{
  width:64px;
  height:64px;

  margin:0 auto 16px;

  border-radius:18px;

  background:#edf3fa;

  color:#0b2d5c;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;
}

h1{
  text-align:center;

  font-size:24px;

  margin-bottom:7px;

  color:#071f40;
}

.subtitle{
  text-align:center;

  color:#7b8595;

  font-size:12px;

  line-height:1.6;

  margin-bottom:24px;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;

  font-size:12px;

  font-weight:700;

  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;

  border:1px solid #dce3ed;

  border-radius:12px;

  padding:13px 45px 13px 13px;

  font-family:'Poppins',sans-serif;

  font-size:13px;

  outline:none;

  background:#fbfcfe;

  color:#172033;
}

input:focus{
  border-color:#0b2d5c;

  background:white;
}

input::placeholder{
  color:#9aa4b3;
}

.password-toggle{
  position:absolute;

  right:13px;
  top:50%;

  transform:translateY(-50%);

  border:none;

  background:transparent;

  color:#7b8595;

  cursor:pointer;

  font-size:15px;
}

.login-btn{
  width:100%;

  border:none;

  background:#0b2d5c;

  color:white;

  padding:14px;

  border-radius:12px;

  font-family:'Poppins',sans-serif;

  font-weight:700;

  font-size:13px;

  cursor:pointer;

  margin-top:5px;

  transition:.2s;
}

.login-btn:active{
  transform:scale(.98);
}

.login-btn:disabled{
  opacity:.6;

  cursor:not-allowed;
}

.message{
  display:none;

  margin-bottom:15px;

  padding:12px;

  border-radius:11px;

  font-size:11px;

  line-height:1.6;
}

.error{
  display:block;

  background:#fff0f0;

  color:#c62828;

  border:1px solid #ffd5d5;
}

.success{
  display:block;

  background:#eaf8f0;

  color:#16834b;

  border:1px solid #ccebd9;
}

.back{
  display:block;

  text-align:center;

  margin-top:19px;

  color:#0b2d5c;

  text-decoration:none;

  font-size:12px;

  font-weight:700;
}

.security{
  text-align:center;

  color:#929baa;

  font-size:10px;

  margin-top:20px;
}

</style>

</head>


<body>


<div class="login-card">


  <div class="logo">

    <i class="fa-solid fa-shield-halved"></i>

  </div>


  <h1>
    Admin Login
  </h1>


  <p class="subtitle">
    Sign in with your authorized Gentle Acct Store admin account.
  </p>


  <div
    id="message"
    class="message"
  ></div>


  <div class="field">

    <label>
      Email Address
    </label>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="username"
    >

  </div>


  <div class="field">

    <label>
      Password
    </label>


    <div class="input-wrap">

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >


      <button
        type="button"
        id="passwordToggle"
        class="password-toggle"
      >

        <i
          id="eyeIcon"
          class="fa-solid fa-eye"
        ></i>

      </button>

    </div>

  </div>


  <button
    type="button"
    id="loginButton"
    class="login-btn"
  >

    <i class="fa-solid fa-right-to-bracket"></i>

    &nbsp; Login to Admin Panel

  </button>


  <a
    href="forgot-password.html"
    class="back"
  >
    Forgot password?
  </a>


  <div class="security">

    <i class="fa-solid fa-lock"></i>

    &nbsp; Secure Firebase authentication

  </div>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
"UoEjCy99gbQKkGob59vGi3CunZi1";


/* =========================
   ELEMENTS
========================= */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const passwordToggle =
document.getElementById("passwordToggle");

const eyeIcon =
document.getElementById("eyeIcon");

const messageBox =
document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(
  message,
  type
){

  messageBox.textContent =
    message;

  messageBox.className =
    "message " + type;

}


/* =========================
   PASSWORD TOGGLE
========================= */

passwordToggle.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      eyeIcon.className =
        "fa-solid fa-eye-slash";

    }else{

      passwordInput.type =
        "password";

      eyeIcon.className =
        "fa-solid fa-eye";

    }

  }
);


/* =========================
   LOGIN
========================= */

async function adminLogin(){

  const email =
    emailInput.value
      .trim();

  const password =
    passwordInput.value;


  if(
    !email ||
    !password
  ){

    showMessage(
      "Please enter your email and password.",
      "error"
    );

    return;

  }


  try{

    loginButton.disabled =
      true;

    loginButton.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';


    const result =
      await firebaseAuth
        .signInWithEmailAndPassword(
          email,
          password
        );


    const user =
      result.user;


    /* =========================
       ADMIN CHECK
    ========================= */

    if(
      user.uid !== ADMIN_UID
    ){

      await firebaseAuth.signOut();

      showMessage(
        "This account is not authorized to access the admin panel.",
        "error"
      );

      return;

    }


    /* =========================
       EMAIL CHECK
    ========================= */

    if(
      !user.emailVerified
    ){

      await firebaseAuth.signOut();

      showMessage(
        "Please verify your admin email address before logging in.",
        "error"
      );

      return;

    }


    /* =========================
       SAVE ADMIN SESSION
    ========================= */

    localStorage.setItem(
      "gentleAdminLoggedIn",
      "true"
    );

    localStorage.setItem(
      "gentleAdminUID",
      user.uid
    );


    showMessage(
      "Admin login successful. Opening admin panel...",
      "success"
    );


    setTimeout(
      function(){

        window.location.replace(
          "admin.html"
        );

      },
      600
    );


  }catch(error){

    console.error(
      "ADMIN LOGIN ERROR:",
      error
    );


    let message =
      "Login failed. Please check your email and password.";


    if(
      error.code ===
      "auth/invalid-credential"
    ){

      message =
        "Incorrect email or password.";

    }

    else if(
      error.code ===
      "auth/user-not-found"
    ){

      message =
        "No account was found with this email.";

    }

    else if(
      error.code ===
      "auth/wrong-password"
    ){

      message =
        "Incorrect password.";

    }

    else if(
      error.code ===
      "auth/invalid-email"
    ){

      message =
        "Please enter a valid email address.";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
        "Too many login attempts. Please try again later.";

    }

    else if(
      error.code ===
      "auth/network-request-failed"
    ){

      message =
        "Network error. Please check your internet connection.";

    }


    showMessage(
      message,
      "error"
    );


  }finally{

    loginButton.disabled =
      false;

    loginButton.innerHTML =
      '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Login to Admin Panel';

  }

}


/* =========================
   BUTTON
========================= */

loginButton.addEventListener(
  "click",
  adminLogin
);


/* =========================
   ENTER KEY
========================= */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      adminLogin();

    }

  }
);

</script>


</body>

</html>
