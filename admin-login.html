<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0b2d5c"
>

<title>Admin Login - Gentle Acct Store</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
}

body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top right,
      rgba(18,75,136,.10),
      transparent 35%
    ),
    #f5f8fc;

  font-family:'Poppins',sans-serif;

  color:#071f40;
}

/* =========================
   CARD
========================= */

.login-card{
  width:100%;
  max-width:410px;

  background:rgba(255,255,255,.97);

  border:1px solid #e1e8f0;

  border-radius:25px;

  padding:28px 22px;

  box-shadow:
    0 20px 50px rgba(7,31,64,.10);
}

/* =========================
   BRAND
========================= */

.brand{
  text-align:center;

  margin-bottom:22px;
}

.logo{
  width:62px;
  height:62px;

  margin:0 auto 13px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #0b2d5c,
      #124b88
    );

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;

  box-shadow:
    0 10px 24px rgba(11,45,92,.20);
}

.brand h1{
  color:#071f40;

  font-size:23px;
  font-weight:800;

  line-height:1.2;

  margin-bottom:6px;
}

.subtitle{
  color:#7b8595;

  font-size:11px;

  line-height:1.6;

  max-width:300px;

  margin:auto;
}

/* =========================
   ADMIN BADGE
========================= */

.admin-badge{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  width:max-content;

  margin:0 auto 20px;

  padding:6px 10px;

  border-radius:20px;

  background:#edf3fa;

  color:#0b2d5c;

  font-size:9px;
  font-weight:700;
}

.admin-badge i{
  font-size:9px;
}

/* =========================
   MESSAGE
========================= */

.message{
  display:none;

  margin-bottom:15px;

  padding:11px 12px;

  border-radius:11px;

  font-size:10px;

  line-height:1.6;
}

.message.error{
  display:block;

  background:#fff0f0;

  color:#b42318;

  border:1px solid #ffd5d5;
}

.message.success{
  display:block;

  background:#eaf8f0;

  color:#168447;

  border:1px solid #ccebd9;
}

/* =========================
   FIELD
========================= */

.field{
  margin-bottom:15px;
}

label{
  display:block;

  color:#26364c;

  font-size:10px;
  font-weight:700;

  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;

  height:48px;

  border:1px solid #dce4ee;

  border-radius:12px;

  padding:0 44px 0 13px;

  background:#f9fbfd;

  color:#172033;

  outline:none;

  font-family:'Poppins',sans-serif;

  font-size:12px;

  transition:.2s;
}

input:focus{
  border-color:#0b2d5c;

  background:white;

  box-shadow:
    0 0 0 4px rgba(11,45,92,.06);
}

input::placeholder{
  color:#9aa4b3;
}

/* =========================
   PASSWORD
========================= */

.password-toggle{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  width:30px;
  height:30px;

  border:0;

  background:transparent;

  color:#7b8595;

  cursor:pointer;

  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.password-toggle:hover{
  background:#edf3fa;

  color:#0b2d5c;
}

/* =========================
   LOGIN BUTTON
========================= */

.login-btn{
  width:100%;

  height:49px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #0b2d5c,
      #124b88
    );

  color:white;

  font-family:'Poppins',sans-serif;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

  margin-top:4px;

  box-shadow:
    0 9px 20px rgba(11,45,92,.16);

  transition:
    transform .2s,
    box-shadow .2s,
    opacity .2s;
}

.login-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 12px 25px rgba(11,45,92,.21);
}

.login-btn:active{
  transform:scale(.98);
}

.login-btn:disabled{
  opacity:.6;

  cursor:not-allowed;

  transform:none;
}

/* =========================
   FORGOT
========================= */

.forgot{
  display:block;

  text-align:center;

  margin-top:17px;

  color:#0b2d5c;

  text-decoration:none;

  font-size:10px;

  font-weight:700;
}

.forgot:hover{
  text-decoration:underline;
}

/* =========================
   SECURITY
========================= */

.security{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  margin-top:21px;

  color:#929baa;

  font-size:9px;
}

.security i{
  color:#0b2d5c;

  font-size:9px;
}

/* =========================
   BACK HOME
========================= */

.home{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  margin-top:14px;

  color:#6f7b8d;

  text-decoration:none;

  font-size:10px;

  font-weight:600;
}

.home:hover{
  color:#0b2d5c;
}

/* =========================
   MOBILE
========================= */

@media(max-width:360px){

  body{
    padding:14px;
  }

  .login-card{
    padding:24px 17px;

    border-radius:21px;
  }

  .brand h1{
    font-size:21px;
  }

}

</style>

</head>


<body>


<div class="login-card">


  <!-- BRAND -->

  <div class="brand">

    <div class="logo">

      <i class="fa-solid fa-shield-halved"></i>

    </div>


    <div class="admin-badge">

      <i class="fa-solid fa-lock"></i>

      ADMIN ACCESS

    </div>


    <h1>
      Admin Login
    </h1>


    <p class="subtitle">
      Sign in with your authorized Gentle Acct Store admin account.
    </p>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- EMAIL -->

  <div class="field">

    <label>
      Email Address
    </label>


    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
    >

  </div>


  <!-- PASSWORD -->

  <div class="field">

    <label>
      Password
    </label>


    <div class="input-wrap">

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >


      <button
        type="button"
        id="passwordToggle"
        class="password-toggle"
        aria-label="Show password"
      >

        <i
          id="eyeIcon"
          class="fa-solid fa-eye"
        ></i>

      </button>

    </div>

  </div>


  <!-- LOGIN -->

  <button
    type="button"
    id="loginButton"
    class="login-btn"
  >

    <i class="fa-solid fa-right-to-bracket"></i>

    &nbsp; Login to Admin Panel

  </button>


  <!-- FORGOT -->

  <a
    href="forgot-password.html"
    class="forgot"
  >

    Forgot your password?

  </a>


  <!-- SECURITY -->

  <div class="security">

    <i class="fa-solid fa-lock"></i>

    <span>
      Secure Firebase authentication
    </span>

  </div>


  <!-- HOME -->

  <a
    href="index.html"
    class="home"
  >

    <i class="fa-solid fa-arrow-left"></i>

    Back to Store

  </a>


</div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>


<script>

/* =========================
   ADMIN UID
========================= */

const ADMIN_UID =
"UoEjCy99gbQQKkGob59vGi3CunZi1";


/* =========================
   ELEMENTS
========================= */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const passwordToggle =
document.getElementById("passwordToggle");

const eyeIcon =
document.getElementById("eyeIcon");

const messageBox =
document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(
  message,
  type
){

  messageBox.textContent =
    message;

  messageBox.className =
    "message " + type;

}


/* =========================
   PASSWORD TOGGLE
========================= */

passwordToggle.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type ===
      "password"
    ){

      passwordInput.type =
        "text";

      eyeIcon.className =
        "fa-solid fa-eye-slash";

      passwordToggle.setAttribute(
        "aria-label",
        "Hide password"
      );

    }else{

      passwordInput.type =
        "password";

      eyeIcon.className =
        "fa-solid fa-eye";

      passwordToggle.setAttribute(
        "aria-label",
        "Show password"
      );

    }

  }
);


/* =========================
   LOGIN
========================= */

async function adminLogin(){

  const email =
    emailInput.value
      .trim();

  const password =
    passwordInput.value;


  if(
    !email ||
    !password
  ){

    showMessage(
      "Please enter your email and password.",
      "error"
    );

    return;

  }


  try{

    loginButton.disabled =
      true;

    loginButton.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';


    const result =
      await firebaseAuth
        .signInWithEmailAndPassword(
          email,
          password
        );


    const user =
      result.user;


    /* =========================
       ADMIN CHECK
    ========================= */

    if(
      user.uid !== ADMIN_UID
    ){

      await firebaseAuth.signOut();

      showMessage(
        "This account is not authorized to access the admin panel.",
        "error"
      );

      return;

    }


    /* =========================
       EMAIL CHECK
    ========================= */

    if(
      !user.emailVerified
    ){

      await firebaseAuth.signOut();

      showMessage(
        "Please verify your admin email address before logging in.",
        "error"
      );

      return;

    }


    /* =========================
       SAVE ADMIN SESSION
    ========================= */

    localStorage.setItem(
      "gentleAdminLoggedIn",
      "true"
    );

    localStorage.setItem(
      "gentleAdminUID",
      user.uid
    );


    showMessage(
      "Admin login successful. Opening admin panel...",
      "success"
    );


    setTimeout(
      function(){

        window.location.replace(
          "admin.html"
        );

      },
      600
    );


  }catch(error){

    console.error(
      "ADMIN LOGIN ERROR:",
      error
    );


    let message =
      "Login failed. Please check your email and password.";


    if(
      error.code ===
      "auth/invalid-credential"
    ){

      message =
        "Incorrect email or password.";

    }

    else if(
      error.code ===
      "auth/user-not-found"
    ){

      message =
        "No account was found with this email.";

    }

    else if(
      error.code ===
      "auth/wrong-password"
    ){

      message =
        "Incorrect password.";

    }

    else if(
      error.code ===
      "auth/invalid-email"
    ){

      message =
        "Please enter a valid email address.";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
        "Too many login attempts. Please try again later.";

    }

    else if(
      error.code ===
      "auth/network-request-failed"
    ){

      message =
        "Network error. Please check your internet connection.";

    }


    showMessage(
      message,
      "error"
    );


  }finally{

    loginButton.disabled =
      false;

    loginButton.innerHTML =
      '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Login to Admin Panel';

  }

}


/* =========================
   LOGIN BUTTON
========================= */

loginButton.addEventListener(
  "click",
  adminLogin
);


/* =========================
   ENTER KEY
========================= */

emailInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      passwordInput.focus();

    }

  }
);


passwordInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      adminLogin();

    }

  }
);

</script>


</body>

</html>
