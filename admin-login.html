<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0b2d5c"
>

<title>Admin Login | Gentle Acct Store</title>

<!-- GOOGLE FONT -->

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<!-- FONT AWESOME -->

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase.js"></script>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Poppins", sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(37, 99, 235, 0.08),
      transparent 35%
    ),
    #f3f6fb;
  color: #14213d;
  min-height: 100vh;
}

a {
  text-decoration: none;
  color: inherit;
}

.header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(255,255,255,0.94);
  border-bottom: 1px solid #e5eaf2;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(14px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 800;
  color: #12376d;
}

.logo-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #12376d;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

.back-store {
  color: #64748b;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 7px;
}

.back-store:hover {
  color: #12376d;
}

.page {
  min-height: calc(100vh - 72px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 45px 18px;
}

.card {
  width: 100%;
  max-width: 720px;
  background: white;
  border: 1px solid #dfe6f0;
  border-radius: 38px;
  padding: 58px 48px 48px;
  box-shadow: 0 25px 70px rgba(20, 50, 90, 0.10);
  text-align: center;
}

.shield {
  width: 132px;
  height: 132px;
  margin: 0 auto 28px;
  border-radius: 38px;
  background: linear-gradient(
    145deg,
    #183b73,
    #28599b
  );
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 54px;
  box-shadow: 0 18px 38px rgba(18,55,109,0.20);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border-radius: 999px;
  background: #eef4fb;
  color: #183b73;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 32px;
}

h1 {
  font-size: 48px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -1.5px;
  color: #10284d;
  margin-bottom: 15px;
}

.subtitle {
  color: #7c879b;
  font-size: 18px;
  line-height: 1.7;
  margin: 0 auto 38px;
  max-width: 590px;
}

.message {
  display: none;
  text-align: left;
  padding: 17px 20px;
  border-radius: 18px;
  margin-bottom: 25px;
  font-size: 14px;
  line-height: 1.6;
  font-weight: 500;
}

.message.error {
  display: block;
  background: #fff1f1;
  border: 1px solid #ffcaca;
  color: #b83232;
}

.message.success {
  display: block;
  background: #effbf4;
  border: 1px solid #bce8cb;
  color: #20733c;
}

.form {
  text-align: left;
}

.field {
  margin-bottom: 24px;
}

label {
  display: block;
  margin-bottom: 10px;
  color: #263650;
  font-size: 15px;
  font-weight: 700;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  height: 68px;
  border: 2px solid #dce4ef;
  background: #f8fafc;
  border-radius: 20px;
  padding: 0 58px 0 20px;
  font-family: "Poppins", sans-serif;
  font-size: 16px;
  color: #17233b;
  outline: none;
  transition: 0.2s ease;
}

input:focus {
  border-color: #28599b;
  background: white;
  box-shadow: 0 0 0 4px rgba(40,89,155,0.08);
}

.toggle-password {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #7f8a9c;
  font-size: 20px;
  cursor: pointer;
  padding: 8px;
}

.login-btn {
  width: 100%;
  height: 68px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(
    135deg,
    #17396f,
    #28599b
  );
  color: white;
  font-family: "Poppins", sans-serif;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
  box-shadow: 0 15px 30px rgba(18,55,109,0.20);
  transition: 0.2s ease;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 34px rgba(18,55,109,0.25);
}

.login-btn:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
}

.forgot {
  display: block;
  text-align: center;
  margin-top: 27px;
  color: #17396f;
  font-size: 15px;
  font-weight: 800;
}

.security {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 45px;
  color: #9aa4b5;
  font-size: 14px;
  font-weight: 500;
}

.security i {
  color: #17396f;
}

.bottom-link {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  margin-top: 30px;
  color: #7b8799;
  font-size: 15px;
  font-weight: 700;
}

.bottom-link:hover {
  color: #17396f;
}

.loading {
  display: inline-block;
  width: 19px;
  height: 19px;
  border: 3px solid rgba(255,255,255,0.35);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@media (max-width: 600px) {

  .header {
    height: 64px;
    padding: 0 16px;
  }

  .logo {
    font-size: 16px;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
  }

  .back-store {
    font-size: 12px;
  }

  .page {
    padding: 22px 10px 35px;
    align-items: flex-start;
  }

  .card {
    border-radius: 30px;
    padding: 42px 24px 36px;
  }

  .shield {
    width: 112px;
    height: 112px;
    border-radius: 32px;
    font-size: 45px;
    margin-bottom: 24px;
  }

  .badge {
    font-size: 12px;
    padding: 9px 16px;
    margin-bottom: 25px;
  }

  h1 {
    font-size: 36px;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.65;
    margin-bottom: 30px;
  }

  input {
    height: 62px;
    border-radius: 17px;
    font-size: 15px;
  }

  .login-btn {
    height: 62px;
    border-radius: 17px;
    font-size: 15px;
  }

  .security {
    margin-top: 34px;
    font-size: 12px;
  }

  .bottom-link {
    font-size: 13px;
  }
}

</style>

</head>


<body>


<header class="header">

  <a href="index.html" class="logo">

    <span class="logo-icon">
      <i class="fa-solid fa-store"></i>
    </span>

    <span>Gentle Acct Store</span>

  </a>

  <a href="index.html" class="back-store">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Store
  </a>

</header>


<main class="page">

  <section class="card">

    <div class="shield">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <div class="badge">
      <i class="fa-solid fa-lock"></i>
      ADMIN ACCESS
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in with your authorized Gentle Acct Store admin account.
    </p>


    <div
      id="message"
      class="message"
    ></div>


    <form
      id="loginForm"
      class="form"
    >

      <div class="field">

        <label for="email">
          Email Address
        </label>

        <div class="input-wrap">

          <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
          >

        </div>

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="input-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password"
          >
            <i class="fa-solid fa-eye"></i>
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >

        <i class="fa-solid fa-right-to-bracket"></i>

        <span>Login to Admin Panel</span>

      </button>

    </form>


    <a
      href="forgot-password.html"
      class="forgot"
    >
      Forgot your password?
    </a>


    <div class="security">

      <i class="fa-solid fa-lock"></i>

      <span>
        Secure Firebase authentication
      </span>

    </div>


    <a
      href="index.html"
      class="bottom-link"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Back to Store

    </a>

  </section>

</main>


<script>

/* =========================================
   ADMIN UID
   ========================================= */

const ADMIN_UID =
  "UoEjCy99gbQKkGob59vGi3CunZi1";


/* =========================================
   ELEMENTS
   ========================================= */

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const message =
  document.getElementById("message");

const togglePassword =
  document.getElementById("togglePassword");


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================================
   PASSWORD TOGGLE
   ========================================= */

togglePassword.addEventListener(
  "click",
  function () {

    const icon =
      togglePassword.querySelector("i");

    if (
      passwordInput.type === "password"
    ) {

      passwordInput.type = "text";

      icon.className =
        "fa-solid fa-eye-slash";

      togglePassword.setAttribute(
        "aria-label",
        "Hide password"
      );

    } else {

      passwordInput.type = "password";

      icon.className =
        "fa-solid fa-eye";

      togglePassword.setAttribute(
        "aria-label",
        "Show password"
      );

    }

  }
);


/* =========================================
   CHECK EXISTING SESSION
   ========================================= */

firebaseAuth.onAuthStateChanged(
  async function (user) {

    if (!user) {
      return;
    }

    if (user.uid !== ADMIN_UID) {

      await firebaseAuth.signOut();

      localStorage.removeItem(
        "gentleAdminLoggedIn"
      );

      localStorage.removeItem(
        "gentleAdminUID"
      );

      return;
    }

    if (!user.emailVerified) {

      await firebaseAuth.signOut();

      localStorage.removeItem(
        "gentleAdminLoggedIn"
      );

      localStorage.removeItem(
        "gentleAdminUID"
      );

      showMessage(
        "Please verify the admin email address before accessing the admin panel.",
        "error"
      );

      return;
    }

    localStorage.setItem(
      "gentleAdminLoggedIn",
      "true"
    );

    localStorage.setItem(
      "gentleAdminUID",
      user.uid
    );

    window.location.href =
      "admin.html";

  }
);


/* =========================================
   LOGIN
   ========================================= */

loginForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "error"
      );

      return;
    }


    loginBtn.disabled = true;

    loginBtn.innerHTML = `
      <span class="loading"></span>
      <span>Checking Access...</span>
    `;


    try {

      const credential =
        await firebaseAuth.signInWithEmailAndPassword(
          email,
          password
        );

      const user =
        credential.user;


      /* =========================================
         CHECK ADMIN UID
         ========================================= */

      if (user.uid !== ADMIN_UID) {

        await firebaseAuth.signOut();

        localStorage.removeItem(
          "gentleAdminLoggedIn"
        );

        localStorage.removeItem(
          "gentleAdminUID"
        );

        showMessage(
          "This account is not authorized to access the admin panel.",
          "error"
        );

        loginBtn.disabled = false;

        loginBtn.innerHTML = `
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Login to Admin Panel</span>
        `;

        return;
      }


      /* =========================================
         CHECK EMAIL VERIFICATION
         ========================================= */

      if (!user.emailVerified) {

        await firebaseAuth.signOut();

        localStorage.removeItem(
          "gentleAdminLoggedIn"
        );

        localStorage.removeItem(
          "gentleAdminUID"
        );

        showMessage(
          "Please verify this admin email address before accessing the admin panel.",
          "error"
        );

        loginBtn.disabled = false;

        loginBtn.innerHTML = `
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Login to Admin Panel</span>
        `;

        return;
      }


      /* =========================================
         SAVE ADMIN SESSION
         ========================================= */

      localStorage.setItem(
        "gentleAdminLoggedIn",
        "true"
      );

      localStorage.setItem(
        "gentleAdminUID",
        user.uid
      );


      showMessage(
        "Admin login successful. Opening dashboard...",
        "success"
      );


      setTimeout(
        function () {

          window.location.href =
            "admin.html";

        },
        700
      );

    } catch (error) {

      console.error(
        "Admin login error:",
        error
      );


      let errorMessage =
        "Unable to login. Please check your email and password.";


      if (
        error.code ===
        "auth/invalid-credential"
      ) {

        errorMessage =
          "Incorrect email or password.";

      }

      else if (
        error.code ===
        "auth/user-not-found"
      ) {

        errorMessage =
          "No account was found with this email.";

      }

      else if (
        error.code ===
        "auth/wrong-password"
      ) {

        errorMessage =
          "Incorrect password.";

      }

      else if (
        error.code ===
        "auth/invalid-email"
      ) {

        errorMessage =
          "Please enter a valid email address.";

      }

      else if (
        error.code ===
        "auth/too-many-requests"
      ) {

        errorMessage =
          "Too many login attempts. Please wait and try again.";

      }

      else if (
        error.code ===
        "auth/network-request-failed"
      ) {

        errorMessage =
          "Network error. Please check your internet connection.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      loginBtn.disabled = false;

      loginBtn.innerHTML = `
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Login to Admin Panel</span>
      `;

    }

  }
);

</script>


</body>

</html>
