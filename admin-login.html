
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<meta name="description" content="Secure administrator login for Gentle Acct Store.">
<title>Admin Login | Gentle Acct Store</title>

<script>
/* Shared site theme: the global setting takes priority on every page. */
(function () {
  try {
    const theme = localStorage.getItem("gentle-acct-store-theme");
    document.documentElement.dataset.theme =
      ["dark", "light", "blue"].includes(theme) ? theme : "dark";
  } catch (error) {
    document.documentElement.dataset.theme = "dark";
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root,
html[data-theme="dark"] {
  color-scheme: dark;
  --bg:#05070D;
  --surface:#0B1220;
  --surface2:#101A2D;
  --surface3:#15233B;
  --text:#F8FAFC;
  --muted:#94A3B8;
  --border:#23334F;
  --accent:#3B82F6;
  --accent2:#60A5FA;
  --accent-soft:#10234A;
  --heading:#FFFFFF;
  --shadow:0 18px 48px rgba(0,0,0,.25);
  --input-bg:#080D17;
  --input-border:#2A3A55;
  --message-error-bg:#351923;
  --message-error-text:#FCA5A5;
  --message-success-bg:#102C22;
  --message-success-text:#86EFAC;
  --message-info-bg:#10234A;
  --message-info-text:#BFDBFE;
}

html[data-theme="light"] {
  color-scheme: light;
  --bg:#F3F6FB;
  --surface:#FFFFFF;
  --surface2:#F8FAFC;
  --surface3:#EAF0FA;
  --text:#172033;
  --muted:#64748B;
  --border:#E0E7F0;
  --accent:#2563EB;
  --accent2:#1D4ED8;
  --accent-soft:#EFF6FF;
  --heading:#102347;
  --shadow:0 18px 48px rgba(25,55,100,.07);
  --input-bg:#FBFCFE;
  --input-border:#DCE3ED;
  --message-error-bg:#FFF5F5;
  --message-error-text:#B42318;
  --message-success-bg:#F0FDF4;
  --message-success-text:#166534;
  --message-info-bg:#EFF6FF;
  --message-info-text:#1D4ED8;
}

html[data-theme="blue"] {
  color-scheme: dark;
  --bg:#061421;
  --surface:#0A2032;
  --surface2:#0E2B42;
  --surface3:#153A54;
  --text:#F0F9FF;
  --muted:#A1BDCE;
  --border:#21465E;
  --accent:#06B6D4;
  --accent2:#67E8F9;
  --accent-soft:#10384B;
  --heading:#ECFEFF;
  --shadow:0 18px 48px rgba(0,0,0,.22);
  --input-bg:#071A29;
  --input-border:#28516A;
  --message-error-bg:#351923;
  --message-error-text:#FCA5A5;
  --message-success-bg:#102C22;
  --message-success-text:#86EFAC;
  --message-info-bg:#10384B;
  --message-info-text:#A5F3FC;
}

* { box-sizing:border-box; margin:0; padding:0; }

html {
  min-height:100%;
  scroll-behavior:smooth;
}

body {
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  color:var(--text);
  font-family:Poppins,sans-serif;
  background:
    radial-gradient(ellipse at 5% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 34%),
    var(--bg);
  transition:background .2s,color .2s;
}

button,input { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.65; cursor:not-allowed; }
a { color:inherit; text-decoration:none; }

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline:2px solid var(--accent2);
  outline-offset:3px;
}

.header {
  position:sticky;
  top:0;
  z-index:20;
  min-height:68px;
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow:0 5px 24px rgba(0,0,0,.08);
}

.logo {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--heading);
  font-size:16px;
  font-weight:800;
  letter-spacing:-.4px;
}

.logo-icon {
  width:39px;
  height:39px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  color:white;
  background:linear-gradient(145deg,var(--accent),#142C58);
  border-radius:13px;
  box-shadow:0 6px 15px color-mix(in srgb,var(--accent) 18%,transparent);
}

.logo-accent { color:var(--accent2); }

.header-actions {
  display:flex;
  align-items:center;
  gap:8px;
}

.theme-btn,
.back-store {
  min-height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 12px;
  border:1px solid var(--border);
  border-radius:11px;
  font-size:10px;
  font-weight:700;
  transition:background .2s,border-color .2s,transform .2s;
}

.theme-btn {
  width:42px;
  padding:0;
  color:var(--accent2);
  background:var(--surface2);
  font-size:14px;
}

.theme-btn:hover,
.back-store:hover {
  border-color:var(--accent);
  background:var(--accent-soft);
}

.back-store {
  color:var(--accent2);
  background:var(--accent-soft);
}

.page {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:38px 15px 45px;
}

.card {
  width:100%;
  max-width:480px;
  padding:35px 29px 29px;
  text-align:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.shield {
  width:76px;
  height:76px;
  margin:0 auto 19px;
  display:grid;
  place-items:center;
  color:white;
  background:linear-gradient(145deg,var(--accent),#1D4ED8);
  border-radius:23px;
  font-size:29px;
  box-shadow:0 10px 23px color-mix(in srgb,var(--accent) 20%,transparent);
}

.badge {
  width:max-content;
  max-width:100%;
  margin:0 auto 17px;
  padding:7px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--accent2);
  background:var(--accent-soft);
  border:1px solid var(--border);
  border-radius:30px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.4px;
}

h1 {
  margin-bottom:10px;
  color:var(--heading);
  font-size:clamp(26px,5vw,32px);
  line-height:1.25;
  letter-spacing:-.8px;
  font-weight:800;
}

.subtitle {
  max-width:340px;
  margin:0 auto 27px;
  color:var(--muted);
  font-size:11px;
  line-height:1.9;
}

.message {
  display:none;
  margin-bottom:18px;
  padding:12px 13px;
  border-radius:12px;
  text-align:left;
  font-size:10px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.message.error {
  display:block;
  color:var(--message-error-text);
  background:var(--message-error-bg);
  border:1px solid var(--border);
}

.message.success {
  display:block;
  color:var(--message-success-text);
  background:var(--message-success-bg);
  border:1px solid var(--border);
}

.message.info {
  display:block;
  color:var(--message-info-text);
  background:var(--message-info-bg);
  border:1px solid var(--border);
}

.form { text-align:left; }
.field { margin-bottom:18px; }

label {
  display:block;
  margin-bottom:8px;
  color:var(--text);
  font-size:11px;
  font-weight:700;
}

.input-wrap { position:relative; }

input {
  width:100%;
  height:51px;
  padding:0 47px 0 15px;
  color:var(--text);
  background:var(--input-bg);
  border:1px solid var(--input-border);
  border-radius:12px;
  outline:none;
  font-family:inherit;
  font-size:12px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}

input:hover { border-color:var(--accent); }

input:focus {
  background:var(--surface2);
  border-color:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent);
}

input::placeholder { color:var(--muted); opacity:.8; }

.toggle-password {
  position:absolute;
  top:50%;
  right:9px;
  width:34px;
  height:34px;
  transform:translateY(-50%);
  display:grid;
  place-items:center;
  color:var(--muted);
  background:transparent;
  border:0;
  border-radius:9px;
  cursor:pointer;
}

.toggle-password:hover {
  color:var(--accent2);
  background:var(--accent-soft);
}

.login-btn {
  width:100%;
  min-height:51px;
  margin-top:4px;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:white;
  background:var(--accent);
  border:0;
  border-radius:12px;
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 17%,transparent);
  transition:background .2s,transform .2s;
}

.login-btn:hover:not(:disabled) {
  background:var(--accent2);
  color:var(--bg);
  transform:translateY(-1px);
}

.loading {
  width:17px;
  height:17px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg); } }

.forgot {
  display:block;
  margin-top:19px;
  color:var(--accent2);
  text-align:center;
  font-size:11px;
  font-weight:700;
}

.forgot:hover { text-decoration:underline; }

.security {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:26px;
  color:var(--muted);
  font-size:10px;
}

.security i { color:var(--accent2); }

.bottom-link {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:22px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}

.bottom-link:hover { color:var(--accent2); }

.footer {
  padding:0 15px 22px;
  color:var(--muted);
  text-align:center;
  font-size:9px;
}

@media(max-width:450px) {
  .header { min-height:64px; padding:9px 13px; }
  .logo { gap:8px; font-size:13px; }
  .logo-icon { width:35px; height:35px; border-radius:11px; }
  .theme-btn { width:38px; min-height:38px; }
  .back-store { padding:8px 10px; font-size:10px; }
  .page { padding:27px 13px 35px; align-items:flex-start; }
  .card { padding:30px 20px 25px; border-radius:21px; }
  .shield { width:68px; height:68px; border-radius:20px; font-size:25px; }
}

@media(max-width:350px) {
  .logo { font-size:11px; }
  .back-store { gap:5px; font-size:9px; }
  .card { padding:25px 15px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<header class="header">
  <a href="index.html" class="logo">
    <span class="logo-icon"><i class="fa-solid fa-store"></i></span>
    <span>Gentle <span class="logo-accent">Acct</span> Store</span>
  </a>

  <div class="header-actions">
    <button type="button" class="theme-btn" id="themeButton"
      title="Change site theme" aria-label="Change site theme">
      <i class="fa-solid fa-moon"></i>
    </button>
    <a href="index.html" class="back-store">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Store
    </a>
  </div>
</header>

<main class="page">
  <section class="card">
    <div class="shield">
      <i class="fa-solid fa-shield-halved"></i>
    </div>

    <div class="badge">
      <i class="fa-solid fa-lock"></i>
      ADMIN ACCESS
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in with your authorized Gentle Acct Store administrator account.
    </p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="loginForm" class="form">
      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter admin email"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password"
            aria-pressed="false"
          >
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Login to Admin Panel</span>
      </button>
    </form>

    <a href="forgot-password.html" class="forgot">Forgot your password?</a>

    <div class="security">
      <i class="fa-solid fa-lock"></i>
      <span>Secure Firebase authentication</span>
    </div>

    <a href="index.html" class="bottom-link">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Store
    </a>
  </section>
</main>

<footer class="footer">
  © 2026 Gentle Acct Store. All rights reserved.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase.js"></script>

<script>
"use strict";

const ADMIN_UID = "UoEjCy99gbQKkGob59vGi3CunZi1";

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");
const themeButton = document.getElementById("themeButton");

let loginInProgress = false;
let redirectStarted = false;

function applyTheme(theme, save) {
  if (!["dark", "light", "blue"].includes(theme)) theme = "dark";

  document.documentElement.dataset.theme = theme;

  const icon = themeButton.querySelector("i");
  const meta = document.querySelector('meta[name="theme-color"]');

  if (theme === "dark") {
    icon.className = "fa-solid fa-moon";
    themeButton.title = "Current theme: Dark. Tap to change.";
    meta.content = "#05070D";
  } else if (theme === "light") {
    icon.className = "fa-solid fa-sun";
    themeButton.title = "Current theme: Light. Tap to change.";
    meta.content = "#F3F6FB";
  } else {
    icon.className = "fa-solid fa-water";
    themeButton.title = "Current theme: Blue. Tap to change.";
    meta.content = "#061421";
  }

  if (save) {
    try {
      // This is the shared theme setting used by the Wallet page.
      localStorage.setItem("gentle-acct-store-theme", theme);

      // Update the legacy per-user key too, for pages that still read it.
      const uid = localStorage.getItem("gentleCurrentUserId");
      if (uid) {
        localStorage.setItem("gentle-acct-store-theme-user-" + uid, theme);
      }
    } catch (error) {
      console.warn("Unable to save theme preference.", error);
    }
  }
}

themeButton.addEventListener("click", function () {
  const current = document.documentElement.dataset.theme || "dark";
  const next = current === "dark" ? "light" :
    current === "light" ? "blue" : "dark";

  applyTheme(next, true);
});

/* Update this page if another same-origin page changes the shared theme. */
window.addEventListener("storage", function (event) {
  if (event.key === "gentle-acct-store-theme" && event.newValue) {
    applyTheme(event.newValue, false);
  }
});

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

function setBusy(busy) {
  loginBtn.disabled = busy;
  loginBtn.innerHTML = busy
    ? '<span class="loading"></span><span>Checking Access...</span>'
    : '<i class="fa-solid fa-right-to-bracket"></i><span>Login to Admin Panel</span>';
}

function clearAdminFlags() {
  try {
    localStorage.removeItem("gentleAdminLoggedIn");
    localStorage.removeItem("gentleAdminUID");
  } catch (error) {}
}

function friendlyLoginError(error) {
  switch (error && error.code) {
    case "auth/invalid-credential":
    case "auth/wrong-password":
    case "auth/user-not-found":
      return "Incorrect email or password.";
    case "auth/invalid-email":
      return "Please enter a valid email address.";
    case "auth/too-many-requests":
      return "Too many login attempts. Please wait a while and try again.";
    case "auth/network-request-failed":
      return "Network error. Check your internet connection and try again.";
    case "auth/user-disabled":
      return "This account has been disabled. Please contact the administrator.";
    case "auth/operation-not-allowed":
      return "Email and password sign-in is not enabled in Firebase Authentication.";
    default:
      return "Unable to sign in right now. Please try again.";
  }
}

function goToAdmin() {
  if (redirectStarted) return;
  redirectStarted = true;
  window.location.replace("admin.html");
}

togglePassword.addEventListener("click", function () {
  const show = passwordInput.type === "password";
  passwordInput.type = show ? "text" : "password";
  togglePassword.querySelector("i").className =
    show ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
  togglePassword.setAttribute("aria-label", show ? "Hide password" : "Show password");
  togglePassword.setAttribute("aria-pressed", String(show));
});

function initializeLogin() {
  if (
    typeof firebaseAuth === "undefined" ||
    !firebaseAuth ||
    typeof firebaseAuth.onAuthStateChanged !== "function" ||
    typeof firebaseAuth.signInWithEmailAndPassword !== "function"
  ) {
    showMessage(
      "Firebase Authentication is not initialized. Check firebase.js and try again.",
      "error"
    );
    loginBtn.disabled = true;
    return;
  }

  firebaseAuth.onAuthStateChanged(async function (user) {
    if (loginInProgress || redirectStarted || !user) return;

    if (user.uid !== ADMIN_UID) {
      clearAdminFlags();

      try {
        await firebaseAuth.signOut();
      } catch (error) {
        console.error("Unable to sign out unauthorized user:", error);
      }

      showMessage("This account is not authorized for the admin panel.", "error");
      return;
    }

    if (!user.emailVerified) {
      clearAdminFlags();

      try {
        await firebaseAuth.signOut();
      } catch (error) {
        console.error("Unable to sign out unverified admin:", error);
      }

      showMessage(
        "Please verify the administrator email address before accessing the admin panel.",
        "error"
      );
      return;
    }

    goToAdmin();
  }, function (error) {
    console.error("Authentication state error:", error);
    showMessage("Unable to check your login session. Please reload the page.", "error");
  });
}

loginForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  if (loginInProgress || redirectStarted) return;

  if (
    typeof firebaseAuth === "undefined" ||
    !firebaseAuth ||
    typeof firebaseAuth.signInWithEmailAndPassword !== "function"
  ) {
    showMessage("Firebase Authentication is unavailable. Check firebase.js and reload.", "error");
    return;
  }

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !emailInput.validity.valid || !password) {
    showMessage("Enter a valid email address and password.", "error");
    return;
  }

  loginInProgress = true;
  setBusy(true);
  message.className = "message";

  try {
    const credential = await firebaseAuth.signInWithEmailAndPassword(email, password);
    const user = credential.user;

    if (!user || user.uid !== ADMIN_UID) {
      clearAdminFlags();

      try {
        await firebaseAuth.signOut();
      } catch (error) {
        console.error("Unauthorized sign-out error:", error);
      }

      showMessage("This account is not authorized to access the admin panel.", "error");
      return;
    }

    if (!user.emailVerified) {
      clearAdminFlags();

      try {
        await firebaseAuth.signOut();
      } catch (error) {
        console.error("Unverified sign-out error:", error);
      }

      showMessage(
        "Please verify the admin email address before accessing the admin panel.",
        "error"
      );
      return;
    }

    showMessage("Admin login successful. Opening dashboard...", "success");
    goToAdmin();

  } catch (error) {
    console.error("Admin login error:", error);
    showMessage(friendlyLoginError(error), "error");

  } finally {
    loginInProgress = false;
    if (!redirectStarted) setBusy(false);
  }
});

/* Always use the shared theme first; do not override it with a user-specific theme. */
try {
  const sharedTheme = localStorage.getItem("gentle-acct-store-theme");
  applyTheme(sharedTheme || "dark", false);
} catch (error) {
  applyTheme("dark", false);
}

initializeLogin();
</script>
</body>
</html>
