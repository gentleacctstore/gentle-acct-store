
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#29532A">
<meta name="description" content="Browse available logs and digital products on GentleLogs.">
<title>Marketplace | GentleLogs</title>

<script>
try {
  if (localStorage.getItem("gentle-acct-store-theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
} catch(e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="firebase.js"></script>

<style>
:root {
  --green:#C9232C;
  --green-dark:#991B24;
  --green-soft:#FDEEEF;
  --green-pale:#FFF7F7;
  --white:#FFFFFF;
  --text:#171923;
  --muted:#747985;
  --border:#F1DCDD;
  --orange:#D97819;
  --red:#EF7D80;
  --shadow:0 8px 28px rgba(153,27,36,.07);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html {
  scroll-behavior:smooth;
  scroll-padding-top:100px;
  -webkit-text-size-adjust:100%;
}

body {
  font-family:"Space Grotesk",sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at top left,rgba(253,222,224,.55),transparent 42%),
    var(--green-pale);
  min-height:100vh;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

button,input {font:inherit}
button,a {-webkit-tap-highlight-color:transparent}
button {cursor:pointer}
a {text-decoration:none;color:inherit}

.page {
  width:100%;
  max-width:900px;
  min-height:100vh;
  margin:0 auto;
  background:transparent;
}

.top-header {
  position:relative;
  top:auto;
  z-index:1;
  padding:15px 22px;
  background:rgba(255,247,247,.94);
  border-bottom:1px solid rgba(241,220,221,.9);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.top-header-row,.brand-area,.header-actions,.user-info,
.wallet-top,.wallet-bottom,.wallet-stats,.wallet-buttons,
.section-heading,.product-card,.product-meta,.category-heading {
  display:flex;
  align-items:center;
}

.top-header-row,.wallet-top,.wallet-bottom,.section-heading {
  justify-content:space-between;
}

.top-header-row {gap:14px}
.brand-area {gap:11px;min-width:0}

.brand-logo {
  width:46px;
  height:46px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:linear-gradient(145deg,#D93640,#991B24);
  border-radius:15px;
  font-size:20px;
  box-shadow:0 5px 13px rgba(201,35,44,.18);
}

.brand-text {min-width:0}
.brand-text h1 {
  color:var(--green);
  font-size:17px;
  font-weight:1000;
  white-space:nowrap;
  letter-spacing:-.35px;
}
.brand-text p {
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.header-actions {gap:13px}
.header-icon {
  display:flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  flex-shrink:0;
  border:1px solid var(--border);
  border-radius:14px;
  background:white;
  color:var(--green);
  font-size:17px;
  transition:transform .2s,background .2s;
}
.header-icon:active {transform:scale(.95)}

.header-wallet {
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}
.header-wallet span {
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  margin-bottom:2px;
}
.header-wallet strong {
  color:var(--green);
  font-size:16px;
  font-weight:1000;
  white-space:nowrap;
}

main {padding:22px 22px 30px}
.section {margin-top:26px}

.section-heading {
  gap:12px;
  margin-bottom:14px;
}
.section-heading h2 {
  color:var(--text);
  font-size:17px;
  font-weight:1000;
  letter-spacing:-.45px;
}
.section-heading>a {
  color:var(--green);
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
}
.section-heading>a i {margin-left:3px}

/* PREMIUM WALLET CARD */

.wallet-card {
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:23px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:25px;
  color:white;
  background:linear-gradient(125deg,#991B24 0%,#B8202A 53%,#D93640 100%);
  box-shadow:0 14px 32px rgba(201,35,44,.18);
}
.wallet-card:before,.wallet-card:after {
  content:"";
  position:absolute;
  z-index:-1;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;
}
.wallet-card:before {
  width:280px;height:280px;right:-135px;top:-155px;
}
.wallet-card:after {
  width:190px;height:190px;right:-75px;bottom:-130px;
}
.wallet-glow {
  position:absolute;
  z-index:-1;
  width:190px;height:190px;
  left:-90px;bottom:-115px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
}

.user-info {gap:11px;min-width:0}
.user-avatar {
  display:flex;
  align-items:center;
  justify-content:center;
  width:46px;height:46px;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  background:rgba(255,255,255,.13);
  color:white;
  font-size:17px;
}
.user-info small {
  display:block;
  margin-bottom:4px;
  font-size:12px;
  font-weight:700;
  opacity:.88;
}
.user-info strong {
  display:block;
  max-width:175px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:15px;
  font-weight:900;
}
.wallet-balance {text-align:right}
.wallet-balance span {
  display:block;
  margin-bottom:4px;
  font-size:11px;
  font-weight:700;
  opacity:.9;
}
.wallet-balance strong {
  font-size:15px;
  font-weight:1000;
  white-space:nowrap;
}

.wallet-art {
  position:absolute;
  z-index:1;
  top:77px;
  right:17px;
  width:125px;height:105px;
  pointer-events:none;
  transform:scale(.9);
  transform-origin:top right;
  filter:drop-shadow(0 12px 12px rgba(0,0,0,.16));
}
.wallet-art .wallet-body {
  position:absolute;
  right:9px;bottom:8px;
  width:105px;height:68px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:15px;
  background:linear-gradient(145deg,#F08A8F,#C9232C 50%,#991B24);
  transform:rotate(-7deg);
}
.wallet-art .wallet-flap {
  position:absolute;
  right:5px;bottom:8px;
  width:94px;height:34px;
  border-radius:10px 10px 15px 15px;
  background:linear-gradient(140deg,#D93640,#A91E27);
  border:1px solid rgba(255,255,255,.3);
  transform:rotate(-7deg);
}
.wallet-art .wallet-clasp {
  position:absolute;
  right:12px;bottom:18px;
  width:17px;height:17px;
  border:3px solid #F7C5C8;
  border-radius:50%;
  background:white;
}
.wallet-art .coin {
  position:absolute;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #FFE7A0;
  border-radius:50%;
  color:#B77900;
  font-size:12px;
  font-weight:900;
  background:linear-gradient(145deg,#FFF6B7,#FFC83D 65%,#E99B13);
}
.wallet-art .coin-one {width:32px;height:32px;top:5px;right:22px}
.wallet-art .coin-two {width:29px;height:29px;top:23px;right:52px}
.wallet-art .coin-three {width:25px;height:25px;top:28px;right:7px}

.wallet-middle {
  position:relative;
  z-index:2;
  margin-top:25px;
  padding-right:95px;
}
.wallet-middle p {
  margin-bottom:5px;
  font-size:12px;
  font-weight:700;
  opacity:.9;
}
.wallet-middle h2 {
  font-size:clamp(27px,5vw,34px);
  font-weight:1000;
  letter-spacing:-1.1px;
  overflow-wrap:anywhere;
}
.wallet-bottom {
  position:relative;
  z-index:2;
  align-items:flex-end;
  gap:12px;
  margin-top:23px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.17);
}
.wallet-stats {gap:22px}
.wallet-stat span {
  display:block;
  margin-bottom:4px;
  font-size:11px;
  font-weight:700;
  opacity:.88;
}
.wallet-stat strong {font-size:15px;font-weight:900}
.wallet-buttons {
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
}
.wallet-btn {
  padding:10px 13px;
  min-height:39px;
  border:1px solid white;
  border-radius:24px;
  background:white;
  color:var(--green);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  transition:transform .2s;
}
.wallet-btn:active {transform:scale(.97)}
.wallet-btn.secondary {
  border-color:rgba(255,255,255,.5);
  background:rgba(255,255,255,.08);
  color:white;
}

/* STATISTICS */

.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:17px;
}
.stat-card {
  min-width:0;
  padding:17px 8px;
  border:1px solid var(--border);
  border-radius:19px;
  background:rgba(255,255,255,.94);
  text-align:center;
  box-shadow:var(--shadow);
  transition:transform .2s;
}
.stat-icon {
  display:flex;
  align-items:center;
  justify-content:center;
  width:39px;height:39px;
  margin:0 auto 9px;
  border-radius:13px;
  background:#FDEEEF;
  color:var(--green);
  font-size:16px;
}
.stat-card strong {
  display:block;
  color:var(--green);
  font-size:17px;
  font-weight:1000;
  overflow-wrap:anywhere;
}
.stat-card span {
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

/* REFERRALS */

.referral-premium {
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  gap:13px;
  min-height:125px;
  padding:16px;
  overflow:hidden;
  border:1px solid #F0B9BD;
  border-radius:22px;
  color:white;
  background:linear-gradient(120deg,#FFF0F1,#FCE3E5 55%,#FFF8F8);
  box-shadow:var(--shadow);
  transition:transform .2s;
}
.referral-premium:active {transform:scale(.99)}
.gift-art {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 82px;
  width:82px;height:88px;
  color:#FFD96A;
}
.gift-box {
  position:absolute;
  bottom:11px;
  width:62px;height:49px;
  border:1px solid #E58A90;
  border-radius:8px;
  background:linear-gradient(145deg,#D94B54,#B8202A 60%,#8F1B23);
  transform:rotate(-5deg);
}
.gift-lid {
  position:absolute;
  bottom:53px;
  width:69px;height:15px;
  border:1px solid #F2AEB3;
  border-radius:6px;
  background:linear-gradient(145deg,#E35C64,#B8202A);
  transform:rotate(-5deg);
}
.gift-ribbon {
  position:absolute;
  bottom:11px;left:50%;
  width:12px;height:57px;
  border-radius:3px;
  background:linear-gradient(90deg,#FFE9A3,#F9BC35,#FFE9A3);
  transform:translateX(-50%) rotate(-5deg);
}
.gift-bow {
  position:absolute;
  top:7px;left:50%;
  width:43px;height:22px;
  transform:translateX(-50%);
}
.gift-bow:before,.gift-bow:after {
  content:"";
  position:absolute;
  top:0;
  width:20px;height:17px;
  border:3px solid #FFE7A0;
  border-radius:70% 70% 45% 70%;
  background:linear-gradient(145deg,#FFECA9,#F6B82E);
}
.gift-bow:before {left:0;transform:rotate(25deg)}
.gift-bow:after {right:0;transform:scaleX(-1) rotate(25deg)}
.referral-copy {position:relative;flex:1;min-width:0}
.special-offer-label {
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-bottom:7px;
  padding:5px 9px;
  border-radius:20px;
  background:var(--green);
  color:white;
  font-size:10px;
  font-weight:900;
}
.referral-copy h3 {
  color:#32191B;
  font-size:21px;
  line-height:1.3;
  font-weight:1000;
}
.reward-amount {color:var(--green)}
.referral-copy p {
  margin-top:5px;
  color:#76575A;
  font-size:12px;
  font-weight:700;
  line-height:1.6;
}
.referral-arrow {
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 33px;
  width:33px;height:33px;
  border-radius:50%;
  background:var(--green);
  color:white;
  font-size:12px;
}
.sparkle {position:absolute;color:#D97980;pointer-events:none}
.sparkle-one {top:12px;right:42px;font-size:17px}
.sparkle-two {bottom:12px;left:10px;font-size:12px}

/* SEARCH */

.search-box {
  display:flex;
  align-items:center;
  gap:12px;
  height:54px;
  padding:0 17px;
  border:1px solid #F1DCDD;
  border-radius:16px;
  background:white;
  box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s;
}
.search-box:focus-within {
  border-color:#D95B63;
  box-shadow:0 0 0 4px rgba(201,35,44,.08);
}
.search-box i {color:var(--green);font-size:17px}
.search-box input {
  width:100%;height:100%;
  border:0;outline:none;
  background:transparent;
  color:var(--text);
  font-size:14px;
  font-weight:700;
}
.search-box input::placeholder {color:#92939A}

/* CATEGORY FILTERS */

.category-scroll {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:3px 1px 8px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.category-scroll::-webkit-scrollbar {display:none}
.category-btn {
  padding:10px 16px;
  border:1px solid #F1DCDD;
  border-radius:24px;
  background:white;
  color:#656873;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  transition:background .2s,color .2s;
}
.category-btn.active {
  background:var(--green);
  border-color:var(--green);
  color:white;
}

/* CATEGORY HEADINGS */

.category-heading {gap:11px;min-width:0}
.category-logo {
  display:block;
  width:36px;height:36px;
  flex:0 0 36px;
  object-fit:contain;
  border-radius:9px;
  background:transparent;
}
.product-section {
  margin-top:29px;
  scroll-margin-top:105px;
}
.product-section .section-heading {margin-bottom:15px}
.product-section .section-heading h2 {
  color:#171923;
  font-size:17px;
  font-weight:1000;
  line-height:1.35;
  letter-spacing:-.4px;
  overflow-wrap:anywhere;
}
.product-section .section-heading a {
  color:var(--green);
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
}
.product-section .section-heading a i {font-size:13px}

/* PRODUCT CARDS */

.product-list {
  display:flex;
  flex-direction:column;
  gap:0;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:22px;
  background:white;
  box-shadow:var(--shadow);
}
.product-card {
  display:flex;
  align-items:center;
  gap:12px;
  min-height:104px;
  padding:12px 14px;
  border:0;
  border-bottom:1px solid #F5E8E9;
  border-radius:0;
  background:white;
  box-shadow:none;
}
.product-card:last-child {border-bottom:0}
.product-image {
  display:flex;
  align-items:center;
  justify-content:center;
  width:58px;height:58px;
  flex:0 0 58px;
  overflow:hidden;
  border-radius:15px;
  background:transparent;
  color:var(--green);
}
.product-image img {
  display:block;
  width:100%;height:100%;
  object-fit:contain;
  padding:1px;
}
.product-image img.platform-logo {
  padding:0;
  background:transparent;
  object-fit:contain;
}
.product-image>i {font-size:37px}
.product-info {flex:1;min-width:0}
.product-actions {flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:0}
.product-info h3 {
  margin:0 0 7px;
  color:#171917;
  font-size:15px;
  font-weight:900;
  line-height:1.25;
  letter-spacing:0;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  overflow-wrap:anywhere;
}
.product-meta {flex-wrap:wrap;gap:7px}
.product-stock {
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#747985;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.product-stock i {color:var(--green);font-size:10px}
.product-stock.low-stock i,.product-stock.low-stock {color:var(--orange)}
.product-stock.out-stock i,.product-stock.out-stock {color:var(--red)}
.product-category {
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:4px 9px;
  border-radius:20px;
  background:#FDEEEF;
  color:var(--green);
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}
.product-price {
  margin-top:0;
  color:var(--green);
  font-size:16px;
  font-weight:1000;
  line-height:1.25;
  overflow-wrap:anywhere;
  white-space:nowrap;
}
.buy-btn {
  flex:0 0 auto;
  min-width:76px;
  min-height:38px;
  padding:8px 11px;
  border:1px solid var(--green);
  border-radius:25px;
  background:var(--green);
  color:white;
  font-size:13px;
  font-weight:1000;
  white-space:nowrap;
  transition:transform .2s,background .2s;
}
.buy-btn i {margin-left:3px}
.buy-btn:active:not(:disabled) {
  background:var(--green-dark);
  transform:scale(.97);
}
.buy-btn.disabled,.buy-btn:disabled {
  min-width:84px;
  border-color:#FCEEEE;
  border-radius:25px;
  background:#FDF1F1;
  color:#E87D7F;
  font-size:12px;
  cursor:not-allowed;
}

/* EMPTY AND LOADING STATES */

.empty-products {
  padding:38px 20px;
  border:1px solid var(--border);
  border-radius:21px;
  background:white;
  color:var(--muted);
  text-align:center;
  box-shadow:var(--shadow);
}
.empty-products>i {
  display:flex;
  align-items:center;
  justify-content:center;
  width:52px;height:52px;
  margin:0 auto 13px;
  border-radius:16px;
  background:#FDEEEF;
  color:var(--green);
  font-size:21px;
}
.empty-products h3 {
  margin-bottom:7px;
  color:var(--green);
  font-size:17px;
  font-weight:1000;
}
.empty-products p {font-size:13px;line-height:1.7}
.loading {
  padding:42px 20px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
.loading i {
  display:block;
  margin-bottom:12px;
  color:var(--green);
  font-size:25px;
}

/* TUTORIAL */

.tutorial-card {
  padding:19px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:22px;
  background:white;
  box-shadow:var(--shadow);
}
.tutorial-card h3 {
  margin-bottom:9px;
  color:var(--green);
  font-size:16px;
  font-weight:1000;
}
.tutorial-card p {
  margin-bottom:15px;
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}
.tutorial-video {
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:16px;
  background:#FDEEEF;
}
.tutorial-video iframe {
  position:absolute;
  inset:0;
  width:100%;height:100%;
  border:0;
}
.tutorial-whatsapp {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  margin-top:14px;

/* REFERRAL LINK */
function getReferralLink() {
  if (!currentUser) return "";

  const url = new URL("signup.html", window.location.href);
  url.searchParams.set("ref", currentUser.uid);

  return url.href;
}

function displayReferralLink() {

}

async function copyReferralLink() {
  if (!currentUser) {
    showToast("Please log in first.");
    return;
  }

  const link = getReferralLink();

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(link);
      showToast("Referral link copied!");
    } else {
      window.prompt("Copy your referral link:", link);
    }
  } catch(error) {
    console.error("Copy referral link error:", error);
    window.prompt("Copy your referral link:", link);
  }
}

async function shareReferralLink() {
  if (!currentUser) {
    showToast("Please log in first.");
    return;
  }

  const link = getReferralLink();

  try {
    if (navigator.share) {
      await navigator.share({
        title:"Join Gentle Acct Store",
        text:"Sign up using my referral link!",
        url:link
      });
    } else {
      await copyReferralLink();
    }
  } catch(error) {
    if (error.name !== "AbortError") {
      console.error("Referral sharing error:", error);
      showToast("Unable to share. Try copying your link.");

async function loadReferralCount() {

/* NOTIFICATIONS */
async function enableGentleNotifications() {
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) {
      showToast("Notifications are not supported in this browser.");
      return;
    }

    if (!currentUser) {
      showToast("Please log in first.");
      return;
    }

    if (!firebase.messaging.isSupported ||
        !await firebase.messaging.isSupported()) {
      showToast("Firebase Messaging is not supported on this device.");
      return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      showToast("Please allow notifications in your device settings.");
      return;
    }

    const registration = await navigator.serviceWorker.register(
      "/firebase-messaging-sw.js"
    );

    const token = await firebase.messaging().getToken({
      vapidKey:FCM_VAPID_KEY,
      serviceWorkerRegistration:registration
    });

    if (!token) {
      showToast("Could not generate a notification token.");
      return;
    }

    const db = window.firebaseDB || firebase.firestore();

    await db.collection("adminPushTokens").doc(currentUser.uid).set({
      token:token,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

    showToast("Notifications enabled and device registered.");
  } catch(error) {
    console.error("Notification setup error:", error);
    showToast(error.message || "Notification setup failed.");
  }
}

/* AUTHENTICATION */

  } finally {

});

async function loadUserInformation() {
  const displayName = currentUser.displayName ||
    (currentUser.email ? currentUser.email.split("@")[0] : "") ||
    "Customer";

  document.getElementById("userName").textContent = displayName;
}

function formatMoney(amount) {
  const number = Number(amount || 0);

  return "₦" + number.toLocaleString("en-NG",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

/* WALLET */
async function loadWallet() {
  try {
    const db = window.firebaseDB || firebase.firestore();
    const snapshot = await db.collection("wallets").doc(currentUser.uid).get();

    walletBalance = snapshot.exists
      ? Number(snapshot.data().balance || 0)
      : 0;

    if (!Number.isFinite(walletBalance)) walletBalance = 0;
  } catch(error) {
    console.error("Wallet loading error:", error);
    walletBalance = 0;
    showToast("Wallet balance could not be loaded.");

  document.getElementById("walletBalance").textContent = formatted;

}

/* ORDERS */
async function loadOrders() {
  orders = [];

  try {

/* PRODUCTS */
async function loadProducts() {
  const container = document.getElementById("productsContainer");

  try {
    const db = window.firebaseDB || firebase.firestore();
    const snapshot = await db.collection("products").get();

    products = [];

    snapshot.forEach(doc => {
      products.push({id:doc.id,...doc.data()});
    });

    products.sort((a,b) => {
      const at = a.createdAt && a.createdAt.seconds
        ? a.createdAt.seconds : 0;
      const bt = b.createdAt && b.createdAt.seconds
        ? b.createdAt.seconds : 0;

      return bt - at;
    });

    buildCategoryButtons();
renderProducts();
  } catch(error) {
    console.error("Products loading error:", error);

    container.innerHTML = `<section class="product-section">

        <h3>Unable to load products</h3>

const CATEGORY_ORDER = [
  "Giveaway Accounts",
  "All Texting Apps",
  "USA Facebook",
  "Aged Facebook",
  "Instagram",
  "Aged Instagram",
  "TikTok Accounts",
  "Twitter",
  "Twitter Followers",
  "VPN Premium",
  "9 Proxy",
  "Working Tools",
  "Netflix Accounts",
  "Snapchat",
  "USA iCloud",
  "USA Facebook Dating (Female)",
  "USA Facebook Dating (Male)",
  "Email Services",
  "LinkedIn",
  "Reddit Accounts",
  "Advertising Facebook",
  "Verified Profiles",
  "Aged Instagram with Followers and Old Posts",
  "Plenty of Fish (POF) Dating Sites"
];

function getCategoryPriority(category) {
  const name = String(category || "").trim().toLowerCase();
  const index = CATEGORY_ORDER.findIndex(
    item => item.trim().toLowerCase() === name
  );
  return index === -1 ? CATEGORY_ORDER.length : index;
}

// Always keep the 24 requested categories in their exact supplied order.
// Any extra categories are placed after them, alphabetically.
function sortCategories(a, b) {
  const priorityDifference = getCategoryPriority(a) - getCategoryPriority(b);
  if (priorityDifference !== 0) return priorityDifference;
  return String(a).localeCompare(String(b));
}

function getOrderedCategories(categories) {
  return [...categories].sort(sortCategories);
}

function buildCategoryButtons() {
  const container = document.getElementById("categoryButtons");
  container.innerHTML = "";

  const all = document.createElement("button");
  all.className = "category-btn" +
    (activeCategory === "all" ? " active" : "");
  all.type = "button";
  all.textContent = "All";
  all.addEventListener("click",() => selectCategory("all"));
  container.appendChild(all);

  const categories = [];

  products.forEach(product => {
    const category = String(product.category || "").trim();

    if (category && !categories.some(
      item => item.toLowerCase() === category.toLowerCase()
    )) {
      categories.push(category);
    }
  });

  getOrderedCategories(categories).forEach(category => {
    const button = document.createElement("button");

    button.className = "category-btn" +
      (activeCategory.toLowerCase() === category.toLowerCase()
        ? " active" : "");

    button.type = "button";
    button.textContent = category;
    button.addEventListener("click",() => selectCategory(category));
    container.appendChild(button);
  });
}

function selectCategory(category) {
  activeCategory = category;
  buildCategoryButtons();
  renderProducts();
}


/* RENDER CATEGORY SECTIONS */
function renderProducts() {
  const container = document.getElementById("productsContainer");
  const search = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const filtered = products.filter(product => {
    const name = String(product.name || "").toLowerCase();
    const category = String(product.category || "").toLowerCase();

    const matchesSearch =
      !search || name.includes(search) || category.includes(search);

    const matchesCategory =
      activeCategory === "all" ||
      category === activeCategory.toLowerCase();

    return matchesSearch && matchesCategory;
  });

  if (!filtered.length) {
    container.innerHTML = `<section class="product-section">
      <div class="empty-products">
        <i class="fa-solid fa-box-open"></i>
        <h3>No products found</h3>
        <p>${products.length
          ? "Try another search or category."
          : "Products will appear here when they are added."}</p>
      </div>
    </section>`;
    return;
  }

  const groups = {};

  filtered.forEach(product => {
    const category = String(product.category || "Products").trim();

    if (!groups[category]) groups[category] = [];
    groups[category].push(product);
  });

  let html = "";

  getOrderedCategories(Object.keys(groups)).forEach(category => {
    const sectionId = "products-" + slugify(category);
    const safeCategory = escapeAttribute(category);

    html += `<section class="product-section" id="${sectionId}">
      <div class="section-heading">
        <div class="category-heading">
          ${getCategoryIcon(category)}
          <h2>${escapeHtml(category)}</h2>
        </div>
        <a href="#${sectionId}" onclick="showCategory('${safeCategory}');return false;">
          View All <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
      <div class="product-list">`;

    groups[category].forEach(product => {
      html += createProductCard(product);
    });

    html += `</div></section>`;
  });

  container.innerHTML = html;
}


/* COMPACT PRODUCT NAMES
   Keep important details, use familiar short forms, and display in capitals. */
function getDisplayProductName(product) {
  // An admin-entered displayName takes priority over the automatic shortened name.
  let original = String(product.displayName || product.name || "Product").trim();
  const entityDecoder = document.createElement("textarea");
  entityDecoder.innerHTML = original;
  original = entityDecoder.value.trim();
  for (let i = 0; i < 3 && /&(?:amp|quot|#39|lt|gt);/i.test(original); i++) {
    entityDecoder.innerHTML = original;
    original = entityDecoder.value.trim();
  }
  return original
    .replace(/\s+/g, " ")
    .replace(/Facebook/gi, "FB")
    .replace(/Instagram/gi, "IG")
    .replace(/Accounts/gi, "ACCTS")
    .replace(/Account/gi, "ACCT")
    .replace(/Followers/gi, "FOLLOWS")
    .replace(/Verified by e-mail/gi, "EMAIL VERIFIED")
    .replace(/Verified by email/gi, "EMAIL VERIFIED")
    .replace(/Email Included/gi, "EMAIL INCL.")
    .replace(/No email in the set/gi, "NO EMAIL")
    .replace(/Registered in/gi, "REG. IN")
    .replace(/Partially filled profile/gi, "PARTIAL PROFILE")
    .replace(/2FA in the set/gi, "2FA INCL.")
    .replace(/Sharp & Ready to Use/gi, "SHARP & READY")
    .replace(/\s*\|\s*/g, " | ")
    .toUpperCase();
}

/* PRODUCT CARD */
function createProductCard(product) {
  const id = String(product.id || "");
  const productName = getDisplayProductName(product);
  const name = escapeHtml(productName);
  const price = formatMoney(product.price || 0);
  const stock = Math.max(0,Number(product.stockCount || 0));
  const categoryName = String(product.category || "").trim().toLowerCase();

  const isMessagingApp =
    categoryName === "all texting app" ||
    categoryName === "all messaging apps";

  let imageHTML = `<i class="fa-solid fa-box"></i>`;

  if (product.image && !isMessagingApp) {
    const fallback = getPlatformLogo(productName) ||
      getPlatformLogo(product.category);

    imageHTML = `<img src="${escapeAttribute(product.image)}" alt="${name}" loading="lazy"
      onerror="this.onerror=null;${fallback
        ? `this.src='${fallback}'`
        : `this.style.display='none'`}">`;
  } else if (isMessagingApp) {
    imageHTML = `<i class="fa-solid fa-comment"></i>`;
  } else {
    const logo = getPlatformLogo(productName) ||
      getPlatformLogo(product.category);

    if (logo) {
      imageHTML = `<img class="platform-logo" src="${logo}" alt="${name}" loading="lazy"
        onerror="this.onerror=null;this.style.display='none'">`;
    }
  }

    let stockClass = "";
  let stockText = stock > 0 ? "In Stock" : "Out of Stock";
  
  if (stock <= 0) {
    stockClass = "out-stock";
  }
  

  const button = stock > 0
    ? `<button class="buy-btn" type="button" onclick="buyProduct('${escapeAttribute(id)}')">
         Buy <i class="fa-solid fa-chevron-right"></i>
       </button>`
    : `<button class="buy-btn disabled" type="button" disabled>Sold</button>`;

  return `<article class="product-card" data-product-id="${escapeAttribute(id)}">
    <div class="product-image">${imageHTML}</div>
    <div class="product-info">
      <h3 title="${escapeAttribute(product.name || productName)}">${name}</h3>
      <div class="product-meta">
        <span class="product-stock ${stockClass}">
          <i class="fa-solid fa-circle"></i>${stockText}
        </span>
      </div>
    </div>
    <div class="product-actions">
      <div class="product-price">${price}</div>
      ${button}
    </div>
  </article>`;
}

/* CHECKOUT */
function buyProduct(productId) {
  const product = products.find(item => item.id === productId);

  if (!product) {
    showToast("Product could not be found.");
    return;
  }

  if (Number(product.stockCount || 0) <= 0) {
    showToast("This product is sold out.");
    return;
  }

  localStorage.setItem("gentleCheckoutProduct",productId);
  window.location.href = "checkout.html?id=" + encodeURIComponent(productId);
}

/* SEARCH */
document.getElementById("searchInput")
  .addEventListener("input",renderProducts);

function showCategory(category) {
  activeCategory = category;
  buildCategoryButtons();
  renderProducts();

  setTimeout(() => {
    const section = document.querySelector(
      "#productsContainer .product-section"
    );

    if (section) {
      section.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });
    }
  },80);
}

function scrollToProducts(event) {
  if (event) event.preventDefault();

  const element = document.getElementById("productsContainer");

  if (element) {
    element.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

function slugify(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value) {
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function showToast(message) {
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  },2600);
}

/* KEEP THEME IN SYNC */
(function() {
  const key = "gentle-acct-store-theme";

  function syncTheme() {
    let dark = false;

    try {
      dark = localStorage.getItem(key) === "dark";
    } catch(error) {}

    document.documentElement.classList.toggle("dark-mode",dark);
    document.body.classList.toggle("dark-mode",dark);

    const meta = document.querySelector('meta[name="theme-color"]');

    if (meta) {
      meta.setAttribute("content",dark ? "#0B1120" : "#F3F7F4");
    }
  }

  window.addEventListener("storage",event => {
    if (event.key === key || event.key === null) syncTheme();
  });

  window.addEventListener("pageshow",syncTheme);

  document.addEventListener("visibilitychange",() => {
    if (!document.hidden) syncTheme();
  });

  syncTheme();
})();

/* MAIN MENU DRAWER */
function openMainMenu() {
  document.body.classList.add("main-menu-open");
  const drawer=document.getElementById("mainMenuDrawer");
  const trigger=document.querySelector(".menu-nav-trigger");
  const backdrop=document.getElementById("mainMenuBackdrop");
  if(drawer) drawer.setAttribute("aria-hidden","false");
  if(backdrop) backdrop.setAttribute("aria-hidden","false");
  if(trigger) trigger.setAttribute("aria-expanded","true");
  const balance=document.getElementById("headerBalance");
  const menuBalance=document.getElementById("menuWalletBalance");
  if(balance && menuBalance) menuBalance.textContent=balance.textContent;
}
function closeMainMenu() {
  document.body.classList.remove("main-menu-open");
  const drawer=document.getElementById("mainMenuDrawer");
  const trigger=document.querySelector(".menu-nav-trigger");
  const backdrop=document.getElementById("mainMenuBackdrop");
  if(drawer) drawer.setAttribute("aria-hidden","true");
  if(backdrop) backdrop.setAttribute("aria-hidden","true");
  if(trigger) trigger.setAttribute("aria-expanded","false");
}
async function signOutFromMainMenu() {
  closeMainMenu();
  try {
    await firebase.auth().signOut();
    window.location.href="login.html";
  } catch(error) {
    console.error("Sign out error:",error);
    showToast("Could not sign out. Please try again.");
  }
}
document.addEventListener("keydown",event=>{
  if(event.key==="Escape") closeMainMenu();
});
</script>
