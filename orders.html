<script>
(function(){
  try {
    const t=localStorage.getItem("gentle-acct-store-theme");
    if(t==="dark")document.documentElement.classList.add("dark-mode");
    if(t==="blue")document.documentElement.classList.add("blue-mode");
  } catch(e){}
})();
</script>

<style>
:root{
  --blue:#285B32;
  --blue-dark:#194D28;
  --blue-light:#EAF4EC;
  --blue-soft:#F2F6F3;
  --white:#FFFFFF;
  --text:#171717;
  --muted:#858585;
  --border:#D9E9DC;
  --success:#15803D;
  --success-bg:#EAF4EC;
  --danger:#DC2626;
  --danger-bg:#FEF2F2;
  --shadow:0 4px 14px rgba(40,91,50,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Poppins",sans-serif;
  background:var(--blue-soft);
  color:var(--text);
  min-height:100vh;
  padding-bottom:78px;
  font-size:12px;
  transition:background .2s,color .2s;
}
button,input{font-family:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:600px;min-height:100vh;margin:0 auto}

header{
  height:54px;padding:0 12px;background:#fff;
  border-bottom:2px solid var(--blue);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.header-left{display:flex;align-items:center;gap:9px}
.back-btn,.header-icon{
  width:32px;height:32px;border:none;border-radius:10px;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.header-title{font-size:13px;font-weight:800;color:var(--blue-dark)}
main{padding:15px 11px 22px}
.page-heading{margin-bottom:13px}
.page-heading h1{font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--text);margin-bottom:4px}
.page-heading p{color:var(--muted);font-size:10px;line-height:1.7}

.summary-card{
  background:linear-gradient(135deg,#285B32,#194D28);
  color:white;border-radius:14px;padding:14px;
  margin-bottom:17px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:0 6px 15px rgba(40,91,50,.12);
}
.summary-label{font-size:10px;opacity:.85;margin-bottom:4px}
.summary-number{font-size:25px;font-weight:800;line-height:1.2}
.summary-description{font-size:9px;opacity:.8;margin-top:4px}
.summary-icon{
  width:39px;height:39px;border-radius:12px;
  background:rgba(255,255,255,.17);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.section-heading h2{font-size:12px;font-weight:800}
.section-count{background:var(--blue-light);color:var(--blue);padding:5px 8px;border-radius:7px;font-size:9px;font-weight:700}

.order{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:12px;margin-bottom:11px;box-shadow:var(--shadow);
}
.order-top{display:flex;align-items:center;gap:9px}
.order-icon{
  width:39px;height:39px;flex-shrink:0;border-radius:11px;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.order-name{flex:1;min-width:0}
.order-name h3{font-size:11px;font-weight:800;color:var(--text);margin-bottom:4px;overflow-wrap:anywhere}
.order-category{display:inline-block;background:#F1F5F2;color:#647568;font-size:8px;font-weight:600;padding:4px 7px;border-radius:6px}
.status{flex-shrink:0;border-radius:20px;padding:5px 7px;font-size:8px;font-weight:700;background:var(--success-bg);color:var(--success)}
.status.pending{background:#FFFBEB;color:#92400E}
.status.failed{background:var(--danger-bg);color:var(--danger)}

.order-meta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 0;margin-top:10px;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.order-date{color:var(--muted);font-size:9px;line-height:1.8}
.order-date i{color:var(--blue);margin-right:4px}
.order-price{color:var(--blue);font-size:12px;font-weight:800;white-space:nowrap}
.purchase{margin-top:11px}
.purchase-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.purchase-heading span{font-size:10px;font-weight:700}
.purchase-heading i{color:var(--blue);margin-right:4px}
.purchase-text{
  background:var(--blue-soft);border:1px solid var(--border);
  border-radius:9px;padding:10px;color:var(--text);
  font-size:10px;line-height:1.7;font-weight:500;
  overflow-wrap:anywhere;white-space:pre-wrap;
  user-select:text;-webkit-user-select:text;
}
.copy-btn{
  width:100%;border:1px solid #B5D7BC;background:#fff;color:var(--blue);
  border-radius:9px;padding:9px;margin-top:8px;font-size:9px;font-weight:700;
}
.copy-btn:hover{background:var(--blue-light)}
.copy-btn i{margin-right:5px}

.state-box{
  background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:28px 16px;text-align:center;box-shadow:var(--shadow);
}
.state-icon{
  width:48px;height:48px;border-radius:50%;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;margin:0 auto 11px;
}
.state-icon.error{background:var(--danger-bg);color:var(--danger)}
.state-box h3{font-size:13px;font-weight:800;margin-bottom:5px}
.state-box p{color:var(--muted);font-size:10px;line-height:1.8;overflow-wrap:anywhere}
.state-box .retry-btn,.shop-btn{
  border:none;background:var(--blue);color:white;
  padding:9px 14px;border-radius:9px;margin-top:12px;
  font-size:10px;font-weight:700;
}
.loading-spinner{color:var(--blue);font-size:21px;margin-bottom:10px}

.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:600px;height:62px;background:rgba(255,255,255,.98);
  border-top:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-around;z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  color:#89938A;font-size:8px;font-weight:600;
}
.nav-item i{font-size:15px}
.nav-item.active{color:var(--blue)}
.nav-item.active i{background:var(--blue-light);padding:6px 10px;border-radius:9px}

.toast{
  position:fixed;left:50%;bottom:75px;transform:translate(-50%,10px);
  background:#194D28;color:white;padding:10px 14px;border-radius:10px;
  font-size:10px;opacity:0;visibility:hidden;transition:.2s;z-index:200;
  width:max-content;max-width:calc(100% - 25px);text-align:center;overflow-wrap:anywhere;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* DARK THEME */
html.dark-mode,html.dark-mode body{background:#0B1120;color:#E5EAF5}
html.dark-mode header,html.dark-mode .bottom-nav{background:rgba(15,23,42,.98);border-color:#31543A}
html.dark-mode .header-title,html.dark-mode .page-heading h1,
html.dark-mode .order-name h3,html.dark-mode .section-heading h2{color:#E5EAF5}
html.dark-mode .header-icon,html.dark-mode .back-btn{background:#203B29;color:#BDE5C5}
html.dark-mode .order,html.dark-mode .state-box{background:#151F33;border-color:#31543A}
html.dark-mode .order-icon,html.dark-mode .state-icon{background:#203B29;color:#BDE5C5}
html.dark-mode .order-category{background:#26334A;color:#CBD5E1}
html.dark-mode .order-meta{border-color:#2B3A54}
html.dark-mode .purchase-text{background:#0F172A;border-color:#344765;color:#E5EAF5}
html.dark-mode .copy-btn{background:#203B29;border-color:#31543A;color:#BDE5C5}
html.dark-mode .nav-item{color:#A5B4CC}
html.dark-mode .nav-item.active{color:#BDE5C5}
html.dark-mode .nav-item.active i{background:#203B29}
html.dark-mode .toast{background:#194D28}

/* BLUE THEME */
html.blue-mode:not(.dark-mode),html.blue-mode:not(.dark-mode) body{background:#EAF2FF;color:#172033}
html.blue-mode:not(.dark-mode) header,html.blue-mode:not(.dark-mode) .bottom-nav{background:rgba(239,246,255,.98)}
html.blue-mode:not(.dark-mode) .order,html.blue-mode:not(.dark-mode) .state-box{border-color:#C8DAFA}
html.blue-mode:not(.dark-mode) .purchase-text{background:#F0F6FF;border-color:#C8DAFA}
html.blue-mode:not(.dark-mode) .order-category{background:#DBEAFE;color:#1D4ED8}

@media(min-width:700px){
  body{background:#EEF4FC}
  .page{background:var(--blue-soft);box-shadow:0 0 30px rgba(40,91,50,.04);padding-bottom:65px}
  html.dark-mode .page{background:#0B1120}
}
@media(max-width:370px){
  main{padding-left:9px;padding-right:9px}
  .order{padding:10px}
  .order-icon{width:35px;height:35px}
  .status{font-size:7px;padding:4px 5px}
  .order-name h3{font-size:10px}
}
</style>

<body>
<div class="page">
  <header>
    <div class="header-left">
      <button class="back-btn" id="backButton" type="button" aria-label="Back to dashboard">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="header-title">Gentle Acct Store</div>
    </div>
    <div class="header-icon"><i class="fa-solid fa-receipt"></i></div>
  </header>

  <main>
    <div class="page-heading">
      <h1>My Orders</h1>
      <p>View your purchases and access your account details.</p>
    </div>

    <div class="summary-card">
      <div>
        <div class="summary-label">Total Orders</div>
        <div class="summary-number" id="totalOrders">0</div>
        <div class="summary-description">Your purchase history</div>
      </div>
      <div class="summary-icon"><i class="fa-solid fa-bag-shopping"></i></div>
    </div>

    <div class="section-heading">
      <h2>Order History</h2>
      <span class="section-count" id="orderCount">0 orders</span>
    </div>

    <div id="ordersList">
      <div class="state-box">
        <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
        <p>Loading your orders...</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a class="nav-item" href="dashboard.html#products"><i class="fa-solid fa-box"></i><span>Products</span></a>
    <a class="nav-item active" href="orders.html" aria-current="page"><i class="fa-solid fa-receipt"></i><span>Orders</span></a>
    <a class="nav-item" href="fund.html"><i class="fa-solid fa-wallet"></i><span>Fund</span></a>
    <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i><span>Menu</span></a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

let firebaseUser=null;
let currentOrders=[];
let toastTimer=null;
const THEME_KEY="gentle-acct-store-theme";

function getThemeKey(user){
  return "gentle-acct-store-theme-user-"+user.uid;
}

function readTheme(){
  try{
    if(firebaseUser){
      const personal=localStorage.getItem(getThemeKey(firebaseUser));
      if(["light","dark","blue"].includes(personal))return personal;
    }
    const shared=localStorage.getItem(THEME_KEY);
    if(["light","dark","blue"].includes(shared))return shared;
  }catch(e){}
  return "light";
}

function applyTheme(theme){
  if(!["light","dark","blue"].includes(theme))theme="light";
  document.documentElement.classList.toggle("dark-mode",theme==="dark");
  document.documentElement.classList.toggle("blue-mode",theme==="blue");
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=theme==="dark"?"#0B1120":theme==="blue"?"#1D4ED8":"#285B32";
}

function syncTheme(){
  applyTheme(readTheme());
}
window.addEventListener("storage",function(event){
  if(event.key===THEME_KEY || event.key===null ||
     (firebaseUser && event.key===getThemeKey(firebaseUser))){
    syncTheme();
  }
});
window.addEventListener("pageshow",syncTheme);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)syncTheme();
});
syncTheme();

document.getElementById("backButton").addEventListener("click",function(){
  window.location.href="dashboard.html";
});

firebaseAuth.onAuthStateChanged(async function(user){
  if(!user || !user.emailVerified){
    try{
      localStorage.removeItem("gentleLoggedIn");
      localStorage.removeItem("gentleCurrentUserId");
    }catch(e){}
    window.location.replace("login.html");
    return;
  }

  firebaseUser=user;
  try{
    localStorage.setItem("gentleLoggedIn","true");
    localStorage.setItem("gentleCurrentUserId",user.uid);
  }catch(e){}

  syncTheme();
  await loadFirestoreOrders();
});

async function loadFirestoreOrders(){
  const list=document.getElementById("ordersList");
  list.innerHTML=`
    <div class="state-box">
      <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
      <p>Loading your orders...</p>
    </div>`;

  try{
    if(typeof firebaseDB==="undefined")throw new Error("Firestore is not available. Please try again later.");
    if(!firebaseUser)throw new Error("You are not signed in.");

    const snapshot=await firebaseDB.collection("orders")
      .where("userId","==",firebaseUser.uid).get();

    const orders=[];
    snapshot.forEach(function(doc){
      const data=doc.data();
      orders.push({
        id:doc.id,
        productName:data.productName||"Digital Product",
        category:data.category||"Digital Product",
        amount:Number(data.amount??data.price??0),
        status:data.status||"completed",
        purchaseText:data.purchaseText||data.inventoryValue||"Purchase information unavailable.",
        createdAt:data.createdAt||null
      });
    });

    orders.sort(function(a,b){return getTime(b.createdAt)-getTime(a.createdAt);});
    currentOrders=orders;
    displayOrders(orders);
  }catch(error){
    console.error("Orders loading error:",error);
    list.innerHTML=`
      <div class="state-box">
        <div class="state-icon error"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h3>Unable to load orders</h3>
        <p>${escapeHtml(error.message||"Please check your connection and try again.")}</p>
        <button class="retry-btn" type="button" id="retryButton">
          <i class="fa-solid fa-rotate-right"></i> Try Again
        </button>
      </div>`;
    document.getElementById("retryButton").addEventListener("click",loadFirestoreOrders);
  }
}

function displayOrders(orders){
  const list=document.getElementById("ordersList");
  document.getElementById("totalOrders").textContent=orders.length;
  document.getElementById("orderCount").textContent=orders.length+(orders.length===1?" order":" orders");
  list.innerHTML="";

  if(orders.length===0){
    list.innerHTML=`
      <div class="state-box">
        <div class="state-icon"><i class="fa-solid fa-bag-shopping"></i></div>
        <h3>No orders yet</h3>
        <p>Your purchases will appear here after you complete an order.</p>
        <button class="shop-btn" type="button" id="startShoppingButton">
          <i class="fa-solid fa-store"></i> Start Shopping
        </button>
      </div>`;
    document.getElementById("startShoppingButton").addEventListener("click",function(){
      window.location.href="dashboard.html";
    });
    return;
  }

  orders.forEach(function(order,index){
    const status=String(order.status||"completed").toLowerCase();
    let statusClass="";
    let statusLabel="Completed";
    let statusIcon="fa-circle-check";

    if(["pending","processing","awaiting payment"].includes(status)){
      statusClass="pending";statusLabel="Pending";statusIcon="fa-clock";
    }else if(["failed","cancelled","canceled","refunded"].includes(status)){
      statusClass="failed";
      statusLabel=status.charAt(0).toUpperCase()+status.slice(1);
      statusIcon="fa-circle-xmark";
    }

    const card=document.createElement("article");
    card.className="order";
    card.innerHTML=`
      <div class="order-top">
        <div class="order-icon"><i class="fa-solid fa-box"></i></div>
        <div class="order-name">
          <h3>${escapeHtml(order.productName)}</h3>
          <span class="order-category">${escapeHtml(order.category)}</span>
        </div>
        <span class="status ${statusClass}">
          <i class="fa-solid ${statusIcon}"></i> ${escapeHtml(statusLabel)}
        </span>
      </div>
      <div class="order-meta">
        <div class="order-date">
          <div><i class="fa-regular fa-calendar"></i> ${escapeHtml(formatDate(order.createdAt))}</div>
          <div>Order #${escapeHtml(order.id.slice(0,8))}</div>
        </div>
        <div class="order-price">${formatMoney(order.amount)}</div>
      </div>
      <div class="purchase">
        <div class="purchase-heading">
          <span><i class="fa-solid fa-key"></i> Purchase Information</span>
        </div>
        <div class="purchase-text" id="purchase-${index}"></div>
        <button class="copy-btn" type="button" data-index="${index}">
          <i class="fa-regular fa-copy"></i> Copy Purchase Information
        </button>
      </div>`;

    card.querySelector(".purchase-text").textContent=order.purchaseText;
    list.appendChild(card);
  });

  list.querySelectorAll(".copy-btn").forEach(function(button){
    button.addEventListener("click",function(){
      copyText(Number(button.dataset.index),button);
    });
  });
}

async function copyText(index,button){
  const order=currentOrders[index];
  const text=order&&order.purchaseText?order.purchaseText:"";

  if(!text||text==="Purchase information unavailable."){
    showToast("No purchase information is available to copy.");
    return;
  }

  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const textarea=document.createElement("textarea");
      textarea.value=text;
      textarea.setAttribute("readonly","");
      textarea.style.position="fixed";
      textarea.style.left="-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      const copied=document.execCommand("copy");
      textarea.remove();
      if(!copied)throw new Error("Copy was not successful.");
    }

    showToast("Purchase information copied.");
    if(button){
      const oldHTML=button.innerHTML;
      button.innerHTML='<i class="fa-solid fa-check"></i> Copied';
      button.disabled=true;
      setTimeout(function(){
        if(button.isConnected){
          button.innerHTML=oldHTML;
          button.disabled=false;
        }
      },1800);
    }
  }catch(error){
    console.error("Copy error:",error);
    showToast("Unable to copy automatically. Press and hold the text to copy it.");
  }
}

function getTime(value){
  if(!value)return 0;
  try{
    if(typeof value.toDate==="function")return value.toDate().getTime();
    const date=new Date(value);
    return Number.isNaN(date.getTime())?0:date.getTime();
  }catch(e){return 0;}
}

function formatDate(value){
  const time=getTime(value);
  if(!time)return "Date unavailable";
  return new Date(time).toLocaleString("en-NG",{
    day:"numeric",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

function formatMoney(amount){
  return "₦"+Number(amount||0).toLocaleString("en-NG",{
    minimumFractionDigits:2,maximumFractionDigits:2
  });
}

function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("show");},2400);
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
