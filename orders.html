<script>
(function(){
  try {
    const t=localStorage.getItem("gentle-acct-store-theme");
    if(t==="dark")document.documentElement.classList.add("dark-mode");
    if(t==="blue")document.documentElement.classList.add("blue-mode");
  } catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<style>
:root{
  --blue:#285B32;
  --blue-dark:#194D28;
  --blue-light:#EAF4EC;
  --blue-soft:#F2F6F3;
  --white:#FFFFFF;
  --text:#171717;
  --muted:#858585;
  --border:#D9E9DC;
  --success:#15803D;
  --success-bg:#EAF4EC;
  --danger:#DC2626;
  --danger-bg:#FEF2F2;
  --shadow:0 4px 14px rgba(40,91,50,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Poppins",sans-serif;
  background:var(--blue-soft);
  color:var(--text);
  min-height:100vh;
  padding-bottom:78px;
  font-size:12px;
  transition:background .2s,color .2s;
}
button,input{font-family:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:600px;min-height:100vh;margin:0 auto}

header{
  height:54px;padding:0 12px;background:#fff;
  border-bottom:2px solid var(--blue);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.header-left{display:flex;align-items:center;gap:9px}
.back-btn,.header-icon{
  width:32px;height:32px;border:none;border-radius:10px;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.header-title{font-size:13px;font-weight:800;color:var(--blue-dark)}
main{padding:15px 11px 22px}
.page-heading{margin-bottom:13px}
.page-heading h1{font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--text);margin-bottom:4px}
.page-heading p{color:var(--muted);font-size:10px;line-height:1.7}

.summary-card{
  background:linear-gradient(135deg,#285B32,#194D28);
  color:white;border-radius:14px;padding:14px;
  margin-bottom:17px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:0 6px 15px rgba(40,91,50,.12);
}
.summary-label{font-size:10px;opacity:.85;margin-bottom:4px}
.summary-number{font-size:25px;font-weight:800;line-height:1.2}
.summary-description{font-size:9px;opacity:.8;margin-top:4px}
.summary-icon{
  width:39px;height:39px;border-radius:12px;
  background:rgba(255,255,255,.17);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.section-heading h2{font-size:12px;font-weight:800}
.section-count{background:var(--blue-light);color:var(--blue);padding:5px 8px;border-radius:7px;font-size:9px;font-weight:700}

.order{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:12px;margin-bottom:11px;box-shadow:var(--shadow);
}
.order-top{display:flex;align-items:center;gap:9px}
.order-icon{
  width:39px;height:39px;flex-shrink:0;border-radius:11px;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.order-name{flex:1;min-width:0}
.order-name h3{font-size:11px;font-weight:800;color:var(--text);margin-bottom:4px;overflow-wrap:anywhere}
.order-category{display:inline-block;background:#F1F5F2;color:#647568;font-size:8px;font-weight:600;padding:4px 7px;border-radius:6px}
.status{flex-shrink:0;border-radius:20px;padding:5px 7px;font-size:8px;font-weight:700;background:var(--success-bg);color:var(--success)}
.status.pending{background:#FFFBEB;color:#92400E}
.status.failed{background:var(--danger-bg);color:var(--danger)}

.order-meta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 0;margin-top:10px;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.order-date{color:var(--muted);font-size:9px;line-height:1.8}
.order-date i{color:var(--blue);margin-right:4px}
.order-price{color:var(--blue);font-size:12px;font-weight:800;white-space:nowrap}
.purchase{margin-top:11px}
.purchase-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.purchase-heading span{font-size:10px;font-weight:700}
.purchase-heading i{color:var(--blue);margin-right:4px}
.purchase-text{
  background:var(--blue-soft);border:1px solid var(--border);
  border-radius:9px;padding:10px;color:var(--text);
  font-size:10px;line-height:1.7;font-weight:500;
  overflow-wrap:anywhere;white-space:pre-wrap;
  user-select:text;-webkit-user-select:text;
}
.copy-btn{
  width:100%;border:1px solid #B5D7BC;background:#fff;color:var(--blue);
  border-radius:9px;padding:9px;margin-top:8px;font-size:9px;font-weight:700;
}
.copy-btn:hover{background:var(--blue-light)}
.copy-btn i{margin-right:5px}

.state-box{
  background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:28px 16px;text-align:center;box-shadow:var(--shadow);
}
.state-icon{
  width:48px;height:48px;border-radius:50%;
  background:var(--blue-light);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;margin:0 auto 11px;
}
.state-icon.error{background:var(--danger-bg);color:var(--danger)}
.state-box h3{font-size:13px;font-weight:800;margin-bottom:5px}
.state-box p{color:var(--muted);font-size:10px;line-height:1.8;overflow-wrap:anywhere}
.state-box .retry-btn,.shop-btn{
  border:none;background:var(--blue);color:white;
  padding:9px 14px;border-radius:9px;margin-top:12px;
  font-size:10px;font-weight:700;
}
.loading-spinner{color:var(--blue);font-size:21px;margin-bottom:10px}

.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:600px;height:62px;background:rgba(255,255,255,.98);
  border-top:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-around;z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  color:#89938A;font-size:8px;font-weight:600;
}
.nav-item i{font-size:15px}
.nav-item.active{color:var(--blue)}
.nav-item.active i{background:var(--blue-light);padding:6px 10px;border-radius:9px}

.toast{
  position:fixed;left:50%;bottom:75px;transform:translate(-50%,10px);
  background:#194D28;color:white;padding:10px 14px;border-radius:10px;
  font-size:10px;opacity:0;visibility:hidden;transition:.2s;z-index:200;
  width:max-content;max-width:calc(100% - 25px);text-align:center;overflow-wrap:anywhere;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}


/* CUSTOMER ORDERS: compact list + focused order detail */
.header-wallet{display:flex;align-items:center;gap:7px;background:var(--blue-light);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--blue-dark);font-size:11px;font-weight:800;white-space:nowrap}
.header-wallet i{font-size:12px}
.header-notice{width:32px;height:32px;border:1px solid var(--border);border-radius:10px;background:var(--blue-soft);color:var(--muted);display:flex;align-items:center;justify-content:center}
.header-actions{display:flex;align-items:center;gap:7px}
.orders-heading{margin:0 0 18px}
.orders-heading h1{font-size:20px;letter-spacing:-.5px}
.orders-heading p{font-size:11px}
.orders-list-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.order-row{width:100%;display:flex;align-items:center;gap:11px;padding:13px 11px;border:0;border-bottom:1px solid #E8EFE9;background:#fff;text-align:left;min-width:0;color:var(--text)}
.order-row:last-child{border-bottom:0}
.order-row:active{background:var(--blue-light)}
.order-row-icon{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px}
.order-row-main{flex:1;min-width:0}
.order-row-name{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.order-row-meta{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-row-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:43%}
.order-row-price{font-size:12px;font-weight:800;color:var(--blue-dark);white-space:nowrap}
.order-row .status{font-size:8px;padding:4px 7px;border:1px solid #B8DCC1}
.order-chevron{color:#A8ADA9;font-size:13px;margin-left:1px;flex:0 0 auto}
.detail-back{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--blue-dark);font-size:12px;font-weight:800;padding:3px 0;margin:2px 0 15px}
.detail-card{background:#fff;border:1px solid var(--border);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}
.detail-top{display:flex;align-items:center;gap:11px;padding:15px 13px;border-bottom:1px solid var(--border)}
.detail-top .order-icon{width:43px;height:43px}
.detail-title{flex:1;min-width:0}
.detail-title h2{font-size:14px;font-weight:800;overflow-wrap:anywhere;margin-bottom:3px}
.detail-title p{font-size:10px;color:var(--muted)}
.detail-content{padding:13px}
.detail-product{display:flex;align-items:center;gap:10px;background:var(--blue-light);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px}
.detail-product i{color:var(--blue);font-size:16px;flex:0 0 18px}
.detail-product-main{min-width:0;flex:1}
.detail-product-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.detail-product-meta{font-size:10px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.detail-totals{background:var(--blue-light);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:14px}
.total-line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;padding:5px 0}
.total-line span:first-child{color:var(--muted)}
.total-line strong{font-weight:700;white-space:nowrap}
.total-divider{height:1px;background:var(--border);margin:8px 0}
.total-line.grand{font-size:13px;font-weight:800;padding-top:7px}
.total-line.grand span:first-child,.total-line.grand strong{color:var(--blue-dark)}
.credentials-heading{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:800;margin:0 0 9px}
.credential-item{display:flex;align-items:flex-start;gap:8px;background:#F5FAF6;border:1px solid var(--border);border-radius:11px;padding:10px;margin-bottom:8px}
.credential-value{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;font-family:monospace;font-size:11px;line-height:1.7;color:var(--blue-dark)}
.credential-copy{border:1px solid #B8DCC1;background:var(--blue-light);color:var(--blue-dark);border-radius:8px;padding:7px 10px;font-size:10px;font-weight:800;flex:0 0 auto}
.all-orders-btn{width:100%;border:1px solid var(--border);background:var(--blue-light);color:var(--blue-dark);border-radius:11px;padding:12px;font-size:12px;font-weight:800;margin-top:5px}
.order-ref-line{font-size:10px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}
.hidden-view{display:none!important}
@media(max-width:370px){.order-row{gap:8px;padding:11px 8px}.order-row-icon{width:38px;height:38px;flex-basis:38px}.order-row-name{font-size:11px}.order-row-price{font-size:11px}.detail-content{padding:10px}}

/* DARK THEME */
html.dark-mode,html.dark-mode body{background:#0B1120;color:#E5EAF5}
html.dark-mode header,html.dark-mode .bottom-nav{background:rgba(15,23,42,.98);border-color:#31543A}
html.dark-mode .header-title,html.dark-mode .page-heading h1,
html.dark-mode .order-name h3,html.dark-mode .section-heading h2{color:#E5EAF5}
html.dark-mode .header-icon,html.dark-mode .back-btn{background:#203B29;color:#BDE5C5}
html.dark-mode .order,html.dark-mode .state-box{background:#151F33;border-color:#31543A}
html.dark-mode .order-icon,html.dark-mode .state-icon{background:#203B29;color:#BDE5C5}
html.dark-mode .order-category{background:#26334A;color:#CBD5E1}
html.dark-mode .order-meta{border-color:#2B3A54}
html.dark-mode .purchase-text{background:#0F172A;border-color:#344765;color:#E5EAF5}
html.dark-mode .copy-btn{background:#203B29;border-color:#31543A;color:#BDE5C5}
html.dark-mode .nav-item{color:#A5B4CC}
html.dark-mode .nav-item.active{color:#BDE5C5}
html.dark-mode .nav-item.active i{background:#203B29}
html.dark-mode .toast{background:#194D28}

/* BLUE THEME */
html.blue-mode:not(.dark-mode),html.blue-mode:not(.dark-mode) body{background:#EAF2FF;color:#172033}
html.blue-mode:not(.dark-mode) header,html.blue-mode:not(.dark-mode) .bottom-nav{background:rgba(239,246,255,.98)}
html.blue-mode:not(.dark-mode) .order,html.blue-mode:not(.dark-mode) .state-box{border-color:#C8DAFA}
html.blue-mode:not(.dark-mode) .purchase-text{background:#F2F6F3;border-color:#C8DAFA}
html.blue-mode:not(.dark-mode) .order-category{background:#EAF4EC;color:#285B32}

@media(min-width:700px){
  body{background:#EEF4FC}
  .page{background:var(--blue-soft);box-shadow:0 0 30px rgba(40,91,50,.04);padding-bottom:65px}
  html.dark-mode .page{background:#0B1120}
}
@media(max-width:370px){
  main{padding-left:9px;padding-right:9px}
  .order{padding:10px}
  .order-icon{width:35px;height:35px}
  .status{font-size:7px;padding:4px 5px}
  .order-name h3{font-size:10px}
}
</style>

<style id="gentlelogs-xtralogs-red-white-theme">
/* GentleLogs green and white theme. Original structure and scripts are preserved. */
:root {
  --green:#285B32 !important;
  --green-dark:#194D28 !important;
  --green-light:#EAF4EC !important;
  --green-soft:#F2F6F3 !important;
  --green-pale:#FFFFFF !important;
  --green-border:#D9E9DC !important;
  --light-green:#EAF4EC !important;
  --light:#EAF4EC !important;
  --pale:#F2F6F3 !important;
  --background:#FFFFFF !important;
  --bg:#FFFFFF !important;
  --page:#FFFFFF !important;
  --text:#171923 !important;
  --muted:#747985 !important;
  --border:#D9E9DC !important;
  --white:#FFFFFF !important;
  --card:#FFFFFF !important;
  --blue:#285B32 !important;
  --blue-dark:#194D28 !important;
  --blue-light:#EAF4EC !important;
  --shadow:0 8px 26px rgba(23,25,35,.06) !important;
}
html,body,button,input,textarea,select,option {
  font-family:"Space Grotesk",sans-serif !important;
}
html,body { background:#FFFFFF; color:#171923; }
/* White surfaces, subtle borders and restrained shadows */
.card,.auth-card,.product-card,.related-card,.stat-card,.floating-card,
.wallet-summary,.details-box,.notice,.purchase-card,.referral-premium,
.loading,.error-box,.security-badge,.main-icon,.transaction,.order,
.state-box,.empty,.loading,.link-box,.summary-card:not(.hero) {
  border-color:#D9E9DC;
}
.card,.auth-card,.product-card,.related-card,.stat-card,.floating-card,
.transaction,.order,.state-box,.empty,.loading,.purchase-card {
  background-color:#FFFFFF;
}
/* Brand, icons, links and prices */
h1,h2,h3,h4,.header-title,.brand-name,.brand-text h1,.section-heading,
.page-heading h1,.title h1,.heading h1,.intro h2,.logo,.logo-accent,
.heading,.tx-title,.order-name h3 { color:#171923; }
.brand-name span,.brand-accent,.header-title i,.section-heading:before,
.input-icon,.stat-icon,.heading-icon,.empty-icon,.back-login,.fund-link,
.related-price,.product-price,.amount,.detail-value,.wallet-summary strong,
.history-amount,.footer strong,.nav-item.active,.tx-amount,.order-price,
.page-heading h1 + span { color:#285B32; }
/* Red primary actions */
.reset-btn,.pay-btn,.primary-btn,.update-btn,.complete-btn,.btn-primary,
.copy-small,.related-buy,.wallet-btn:not(.secondary),.copy-btn,
.error-box button,.refresh,.retry,.retry-btn,.shop-btn,.success-btn.primary,
button.primary,.button.primary {
  background:linear-gradient(105deg,#285B32 0%,#285B32 100%) !important;
  color:#FFFFFF !important;
  border-color:transparent !important;
  box-shadow:0 7px 18px rgba(201,35,44,.16);
}
.reset-btn:hover,.pay-btn:hover,.primary-btn:hover,.update-btn:hover,
.complete-btn:hover,.btn-primary:hover,.copy-small:hover,.related-buy:hover,
.refresh:hover,.retry:hover,.retry-btn:hover {
  background:linear-gradient(105deg,#194D28 0%,#285B32 100%) !important;
}
.btn-secondary,.secondary-btn,.wallet-btn.secondary,.copy-small.secondary,
.back,.back-btn,.header-icon,.wallet-chip,.auth-tab.active {
  color:#194D28;
  background:#EAF4EC;
  border-color:#D9E9DC;
}
input,textarea,select,.form-control {
  color:#171923;
  border-color:#D9E9DC;
  background:#FFFFFF;
}
input:focus,textarea:focus,select:focus,.form-control:focus {
  border-color:#285B32 !important;
  box-shadow:0 0 0 3px rgba(201,35,44,.10) !important;
}
/* Red brand bars and highlighted surfaces */
header,.topbar,.top-header { border-bottom-color:#285B32; }
.logo-box,.brand-icon,.brand-mark,.main-icon,.heading-icon,.stat-icon,
.tx-icon,.order-icon,.state-icon,.step-number,.feature-icon {
  background:#EAF4EC;
  color:#285B32;
}
.hero,.wallet-card,.summary-card {
  background:linear-gradient(125deg,#194D28 0%,#285B32 58%,#285B32 100%) !important;
  color:#FFFFFF;
}
.hero h2,.hero p,.hero-label,.summary-card,.summary-card * { color:#FFFFFF; }
.notice,.details-box,.wallet-summary,.purchase-item,.purchase-text,
.reference,.link-box,.security-badge {
  background:#F2F6F3;
  border-color:#D9E9DC;
}
.status.approved,.status.success,.status.completed,
.message.success { background:#EAF7EF; color:#17663A; }
.status.rejected,.status.failed,.status.cancelled,
.message.error { background:#FEF2F2; color:#B91C1C; }
/* Maintain readable mobile controls and prevent iOS Safari focus zoom. */
@media(max-width:767px) {
  input,textarea,select,.form-control,.input-wrap input { font-size:16px !important; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

<body>
<div class="page">
  <header>
    <div class="header-left">
      <div class="header-title">Spencer Store</div>
    </div>
    <div class="header-actions">
      <button class="header-notice" type="button" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
      <div class="header-wallet"><i class="fa-solid fa-wallet"></i><strong id="headerBalance">₦0.00</strong></div>
    </div>
  </header>

  <main>
    <section id="ordersListView">
      <div class="page-heading orders-heading">
        <h1>My Orders</h1>
        <p><span id="totalOrders">0</span> orders total</p>
      </div>
      <div id="ordersList">
        <div class="state-box">
          <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
          <p>Loading your orders...</p>
        </div>
      </div>
    </section>

    <section id="orderDetailView" class="hidden-view">
      <button class="detail-back" type="button" id="detailBackButton"><i class="fa-solid fa-arrow-left"></i> Back to Orders</button>
      <div id="orderDetailContent"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="dashboard.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a class="nav-item" href="dashboard.html#products"><i class="fa-solid fa-box"></i><span>Products</span></a>
    <a class="nav-item active" href="orders.html" aria-current="page"><i class="fa-solid fa-bag-shopping"></i><span>Orders</span></a>
    <a class="nav-item" href="fund.html"><i class="fa-solid fa-wallet"></i><span>Fund</span></a>
    <a class="nav-item" href="profile.html"><i class="fa-solid fa-user"></i><span>Menu</span></a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

let firebaseUser=null;
let currentOrders=[];
let toastTimer=null;
const THEME_KEY="gentle-acct-store-theme";

function getThemeKey(user){
  return "gentle-acct-store-theme-user-"+user.uid;
}

function readTheme(){
  try{
    if(firebaseUser){
      const personal=localStorage.getItem(getThemeKey(firebaseUser));
      if(["light","dark","blue"].includes(personal))return personal;
    }
    const shared=localStorage.getItem(THEME_KEY);
    if(["light","dark","blue"].includes(shared))return shared;
  }catch(e){}
  return "light";
}

function applyTheme(theme){
  if(!["light","dark","blue"].includes(theme))theme="light";
  document.documentElement.classList.toggle("dark-mode",theme==="dark");
  document.documentElement.classList.toggle("blue-mode",theme==="blue");
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=theme==="dark"?"#0B1120":theme==="blue"?"#285B32":"#285B32";
}

function syncTheme(){
  applyTheme(readTheme());
}
window.addEventListener("storage",function(event){
  if(event.key===THEME_KEY || event.key===null ||
     (firebaseUser && event.key===getThemeKey(firebaseUser))){
    syncTheme();
  }
});
window.addEventListener("pageshow",syncTheme);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)syncTheme();
});
syncTheme();

document.getElementById("backButton").addEventListener("click",function(){
  window.location.href="dashboard.html";
});

firebaseAuth.onAuthStateChanged(async function(user){
  if(!user || !user.emailVerified){
    try{
      localStorage.removeItem("gentleLoggedIn");
      localStorage.removeItem("gentleCurrentUserId");
    }catch(e){}
    window.location.replace("login.html");
    return;
  }

  firebaseUser=user;
  try{
    localStorage.setItem("gentleLoggedIn","true");
    localStorage.setItem("gentleCurrentUserId",user.uid);
  }catch(e){}

  syncTheme();
  await loadFirestoreOrders();
});

async function loadFirestoreOrders(){
  const list=document.getElementById("ordersList");
  list.innerHTML=`<div class="state-box"><div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div><p>Loading your orders...</p></div>`;

  try{
    if(typeof firebaseDB==="undefined")throw new Error("Firestore is not available. Please try again later.");
    if(!firebaseUser)throw new Error("You are not signed in.");

    const snapshot=await firebaseDB.collection("orders").where("userId","==",firebaseUser.uid).get();
    const orders=[];
    snapshot.forEach(function(doc){
      const data=doc.data()||{};
      const delivered=data.deliveredItems||data.credentials||data.items||data.orderItems||data.purchaseText||data.inventoryValue||data.supplierResponse||"";
      orders.push({
        id:doc.id,
        orderNumber:data.orderNumber||data.orderNo||data.displayOrderId||data.orderCode||doc.id.slice(0,5).toUpperCase(),
        productName:data.productName||data.name||"Digital Product",
        category:data.category||"Digital Product",
        amount:Number(data.amount??data.totalPaid??data.total??data.price??0),
        subtotal:Number(data.subtotal??data.amount??data.totalPaid??data.total??data.price??0),
        quantity:Number(data.quantity??data.qty??1)||1,
        status:data.status||"completed",
        purchaseText:normalizeDelivery(delivered),
        reference:data.paymentReference||data.supplierOrderId||data.apiOrderId||data.reference||data.orderReference||"",
        paymentMethod:data.paymentMethod||data.paymentProvider||"",
        createdAt:data.createdAt||data.date||null,
        raw:data
      });
    });

    orders.sort(function(a,b){return getTime(b.createdAt)-getTime(a.createdAt);});
    currentOrders=orders;
    displayOrders(orders);
    await loadHeaderBalance();
  }catch(error){
    console.error("Orders loading error:",error);
    list.innerHTML=`<div class="state-box"><div class="state-icon error"><i class="fa-solid fa-triangle-exclamation"></i></div><h3>Unable to load orders</h3><p>${escapeHtml(error.message||"Please check your connection and try again.")}</p><button class="retry-btn" type="button" id="retryButton"><i class="fa-solid fa-rotate-right"></i> Try Again</button></div>`;
    document.getElementById("retryButton").addEventListener("click",loadFirestoreOrders);
  }
}

async function loadHeaderBalance(){
  try{
    if(!firebaseUser||typeof firebaseDB==="undefined")return;
    const snap=await firebaseDB.collection("wallets").doc(firebaseUser.uid).get();
    const balance=snap.exists?Number((snap.data()||{}).balance||0):0;
    document.getElementById("headerBalance").textContent=formatMoney(balance);
  }catch(error){console.warn("Header wallet balance unavailable:",error);}
}

function normalizeDelivery(value){
  if(value==null||value==="")return "Purchase information unavailable.";
  if(typeof value==="string")return value;
  if(Array.isArray(value))return value.map(function(item){
    if(typeof item==="string")return item;
    if(item&&typeof item==="object")return Object.entries(item).map(([k,v])=>k+": "+String(v)).join("\n");
    return String(item);
  }).join("\n\n");
  if(typeof value==="object"){
    if(value.credentials)return normalizeDelivery(value.credentials);
    if(value.delivered_items)return normalizeDelivery(value.delivered_items);
    if(value.items)return normalizeDelivery(value.items);
    return Object.entries(value).map(([k,v])=>k+": "+(typeof v==="object"?JSON.stringify(v):String(v))).join("\n");
  }
  return String(value);
}

function getOrderStatus(status){
  const value=String(status||"completed").toLowerCase();
  if(["pending","processing","awaiting payment","awaiting_payment"].includes(value))return {label:"Pending",className:"pending",icon:"fa-clock"};
  if(["failed","cancelled","canceled","refunded"].includes(value))return {label:value.charAt(0).toUpperCase()+value.slice(1),className:"failed",icon:"fa-circle-xmark"};
  return {label:"Completed",className:"",icon:"fa-circle-check"};
}

function displayOrders(orders){
  const list=document.getElementById("ordersList");
  document.getElementById("totalOrders").textContent=orders.length;
  list.innerHTML="";

  if(orders.length===0){
    list.innerHTML=`<div class="state-box"><div class="state-icon"><i class="fa-solid fa-bag-shopping"></i></div><h3>No orders yet</h3><p>Your purchases will appear here after you complete an order.</p><button class="shop-btn" type="button" id="startShoppingButton"><i class="fa-solid fa-store"></i> Start Shopping</button></div>`;
    document.getElementById("startShoppingButton").addEventListener("click",function(){window.location.href="dashboard.html";});
    return;
  }

  const wrapper=document.createElement("div");
  wrapper.className="orders-list-card";
  orders.forEach(function(order,index){
    const status=getOrderStatus(order.status);
    const row=document.createElement("button");
    row.type="button";row.className="order-row";row.setAttribute("aria-label","View order for "+order.productName);
    row.innerHTML=`<span class="order-row-icon"><i class="fa-solid fa-tag"></i></span><span class="order-row-main"><span class="order-row-name">${escapeHtml(order.productName)}</span><span class="order-row-meta">#${escapeHtml(String(order.orderNumber))} · ${escapeHtml(relativeDate(order.createdAt))}</span></span><span class="order-row-side"><strong class="order-row-price">${formatMoney(order.amount)}</strong><span class="status ${status.className}">${escapeHtml(status.label)}</span></span><i class="fa-solid fa-chevron-right order-chevron"></i>`;
    row.addEventListener("click",function(){showOrderDetails(index);});
    wrapper.appendChild(row);
  });
  list.appendChild(wrapper);
}

function showOrderDetails(index){
  const order=currentOrders[index];
  if(!order)return;
  const status=getOrderStatus(order.status);
  const detail=document.getElementById("orderDetailContent");
  const credentials=order.purchaseText&&order.purchaseText!=="Purchase information unavailable."?order.purchaseText:"Purchase information is not available yet.";
  const credentialLines=credentials.split(/\n\n/).filter(Boolean);
  const credentialHtml=credentialLines.map(function(line,i){
    return `<div class="credential-item"><div class="credential-value">${escapeHtml(line)}</div><button class="credential-copy" type="button" data-copy-index="${i}">Copy</button></div>`;
  }).join("");
  const reference=order.reference||String(order.orderNumber||order.id);
  detail.innerHTML=`<article class="detail-card">
    <div class="detail-top"><div class="order-icon"><i class="fa-solid fa-receipt"></i></div><div class="detail-title"><h2>Order #${escapeHtml(String(order.orderNumber))}</h2><p>${escapeHtml(formatDate(order.createdAt))}</p></div><span class="status ${status.className}">${escapeHtml(status.label)}</span></div>
    <div class="detail-content">
      <div class="detail-product"><i class="fa-solid fa-tag"></i><div class="detail-product-main"><div class="detail-product-name">${escapeHtml(order.productName)}</div><div class="detail-product-meta">Qty: ${escapeHtml(String(order.quantity))} · Ref: ${escapeHtml(String(reference))}</div></div></div>
      <div class="detail-totals"><div class="total-line"><span>Subtotal</span><strong>${formatMoney(order.subtotal)}</strong></div><div class="total-divider"></div><div class="total-line grand"><span>Total Paid</span><strong>${formatMoney(order.amount)}</strong></div></div>
      <h3 class="credentials-heading">ACCOUNT CREDENTIALS</h3>
      ${credentialHtml||`<div class="credential-item"><div class="credential-value">${escapeHtml(credentials)}</div></div>`}
      ${order.paymentMethod?`<p class="order-ref-line">Payment method: ${escapeHtml(order.paymentMethod)}</p>`:""}
      <button class="all-orders-btn" type="button" id="allOrdersButton"><i class="fa-solid fa-list"></i> &nbsp;All Orders</button>
    </div></article>`;
  document.getElementById("ordersListView").classList.add("hidden-view");
  document.getElementById("orderDetailView").classList.remove("hidden-view");
  window.scrollTo({top:0,behavior:"smooth"});
  detail.querySelectorAll("[data-copy-index]").forEach(function(button){
    button.addEventListener("click",function(){copyCredential(credentialLines[Number(button.dataset.copyIndex)]||credentials,button);});
  });
  document.getElementById("allOrdersButton").addEventListener("click",showOrdersList);
}

function showOrdersList(){
  document.getElementById("orderDetailView").classList.add("hidden-view");
  document.getElementById("ordersListView").classList.remove("hidden-view");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function copyCredential(text,button){
  if(!text||text==="Purchase information unavailable."){showToast("No account credentials are available to copy.");return;}
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
    else{
      const area=document.createElement("textarea");area.value=text;area.setAttribute("readonly","");area.style.position="fixed";area.style.left="-9999px";document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();if(!ok)throw new Error("Copy failed");
    }
    showToast("Copied successfully.");
    if(button){const old=button.textContent;button.textContent="Copied";button.disabled=true;setTimeout(function(){if(button.isConnected){button.textContent=old;button.disabled=false;}},1500);}
  }catch(error){console.error("Credential copy error:",error);showToast("Unable to copy. Press and hold the credential text to copy it.");}
}

document.getElementById("detailBackButton").addEventListener("click",showOrdersList);

function relativeDate(value){
  const time=getTime(value);if(!time)return "Date unavailable";
  const diff=Math.max(0,Date.now()-time),mins=Math.floor(diff/60000),hours=Math.floor(mins/60),days=Math.floor(hours/24);
  if(mins<1)return "Just now";if(mins<60)return mins+" min ago";if(hours<24)return hours+" hr ago";if(days<7)return days+" days ago";
  return new Date(time).toLocaleDateString("en-NG",{day:"2-digit",month:"short",year:"numeric"});
}

function getTime(value){
  if(!value)return 0;
  try{
    if(typeof value.toDate==="function")return value.toDate().getTime();
    const date=new Date(value);
    return Number.isNaN(date.getTime())?0:date.getTime();
  }catch(e){return 0;}
}

function formatDate(value){
  const time=getTime(value);
  if(!time)return "Date unavailable";
  return new Date(time).toLocaleString("en-NG",{
    day:"2-digit",month:"short",year:"numeric",
    hour:"numeric",minute:"2-digit"
  });
}

function formatMoney(amount){
  return "₦"+Number(amount||0).toLocaleString("en-NG",{
    minimumFractionDigits:2,maximumFractionDigits:2
  });
}

function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("show");},2400);
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>
</body>
</html>
