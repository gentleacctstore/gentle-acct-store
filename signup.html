
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29532A">
<meta name="description" content="Create your GentleLogs account.">
<title>Create Account | GentleLogs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --green:#147a48;
  --green-dark:#0b5631;
  --text:#15251c;
  --muted:#718077;
  --border:#e1eae4;
  --shadow:0 24px 70px rgba(27,72,46,.11)
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#f2f7f3;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;padding:25px 13px 32px;
  display:flex;justify-content:center;align-items:center;
  font-family:"Space Grotesk",sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 8% 7%,rgba(64,160,100,.16),transparent 34%),
  radial-gradient(ellipse at 92% 91%,rgba(34,124,75,.13),transparent 32%),
  linear-gradient(145deg,#f0f7f2,#f9fbf9 48%,#eaf4ed);
  overflow-x:hidden
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.page-wrapper{width:100%;max-width:470px;margin:auto}
.brand-header{text-align:center;margin-bottom:22px}
.brand-mark{
  width:56px;height:56px;margin:0 auto 10px;display:grid;place-items:center;
  color:white;font-size:25px;font-weight:800;letter-spacing:-2px;
  border-radius:18px;background:linear-gradient(145deg,#22975a,#07552f);
  box-shadow:0 12px 25px #147a483b
}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.8px;color:#123d28}
.brand-name span{color:var(--green)}
.brand-caption{margin-top:5px;font-size:12px;color:#718078}
.auth-card{
  background:rgba(255,255,255,.97);border:1px solid #dae9de;
  border-radius:24px;overflow:hidden;box-shadow:var(--shadow)
}
.card-top{height:5px;background:linear-gradient(90deg,#0b5631,#27a565,#8ad7a8)}
.auth-content{padding:27px 25px 25px}
.auth-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;
  background:#f0f5f1;border:1px solid #e7eee9;border-radius:13px;margin-bottom:23px
}
.auth-tab{
  min-height:43px;display:flex;justify-content:center;align-items:center;
  border-radius:9px;text-decoration:none;font-size:12px;font-weight:600;color:#77847b
}
.auth-tab.active{color:var(--green-dark);background:#fff;box-shadow:0 2px 9px #163f2717}
.heading{font-size:25px;font-weight:800;line-height:1.35;letter-spacing:-.8px;color:#16291d}
.subtitle{margin-top:7px;margin-bottom:22px;color:var(--muted);font-size:12px;line-height:1.8}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{min-width:0;margin-bottom:15px}
.form-group>label{
  display:block;margin-bottom:7px;color:#33473a;font-size:10px;
  font-weight:700;letter-spacing:.7px;text-transform:uppercase
}
.form-control{
  width:100%;height:48px;border:1px solid #dce7df;border-radius:11px;
  padding:0 12px;outline:none;background:#fbfdfb;color:#203629;font-size:13px;
  transition:.2s
}
.form-control:focus{background:#fff;border-color:#29975c;box-shadow:0 0 0 4px #29975c1a}
.form-control::placeholder{color:#a2aea6}
.password-wrap{position:relative}
.password-control{padding-right:60px}
.toggle-password{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  height:34px;min-width:42px;padding:0 6px;border:0;border-radius:8px;
  background:transparent;color:#718077;cursor:po"Space Grotesk";font-size:11px
}
.password-hint{margin-top:6px;font-size:10px;color:#89968d}
.terms-row{display:flex;align-items:flex-start;gap:9px;margin:3px 0 18px}
.terms-row input{width:16px;height:16px;flex-shrink:0;margin-top:3px;accent-color:var(--green)}
.terms-row label{color:#68776d;font-size:10.5px;line-height:1.8}
.terms-row a,.bottom-note a{color:var(--green);font-weight:700;text-decoration:none}
.primary-btn,.google-btn{
  width:100%;min-height:49px;border-radius:11px;display:flex;
  justify-content:center;align-items:center;gap:9px;font-size:12.5px;font-weight:700;cursor:po"Space Grotesk"
}
.primary-btn{
  border:0;background:linear-gradient(100deg,#0c6337,#16874c);
  color:white;box-shadow:0 8px 18px #12703d2b
}
.primary-btn:disabled,.google-btn:disabled{opacity:.65;cursor:wait}
.divider{
  display:flex;align-items:center;gap:12px;margin:21px 0;
  color:#97a39a;font-size:9px;font-weight:700;letter-spacing:.8px
}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#e8eee9}
.google-btn{background:white;color:#33443a;border:1px solid #dce6df}
.google-btn:hover{background:#f9fcfa;border-color:#b8d1c0}
.google-btn img{width:19px;height:19px}
.bottom-note{margin-top:20px;text-align:center;font-size:11px;line-height:1.8;color:#7b887f}
.security-note{margin-top:16px;text-align:center;color:#809087;font-size:10px}
.message{
  display:none;margin-bottom:15px;padding:12px;border-radius:10px;
  font-size:11px;line-height:1.7;overflow-wrap:anywhere
}
.message.show{display:block}
.message.error{color:#a32f28;background:#fff0ee;border:1px solid #f6d5d1}
.message.success{color:#17683d;background:#edf9f0;border:1px solid #cdebd5}
.message.info{color:#275c86;background:#eef7ff;border:1px solid #d2e7fa}
@media(max-width:390px){
  .auth-content{padding:22px 15px}
  .heading{font-size:23px}
  .form-row{gap:8px}
  .form-control{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<main class="page-wrapper">
  <header class="brand-header">
    <div class="brand-mark" aria-label="GentleLogs logo">G.</div>
    <div class="brand-name">Gentle<span>Logs</span></div>
    <p class="brand-caption">YOUR DIGITAL MARKETPLACE</p>
  </header>

  <section class="auth-card">
    <div class="card-top"></div>
    <div class="auth-content">
      <nav class="auth-tabs" aria-label="Account pages">
        <a class="auth-tab active" href="signup.html">Create Account</a>
        <a class="auth-tab" href="login.html">Sign In</a>
      </nav>

      <h1 class="heading">Create your account</h1>
      <p class="subtitle">Create your GentleLogs account and get started in just a few steps.</p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" id="username" type="text"
            placeholder="Choose a username" autocomplete="username"
            maxlength="30" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input class="form-control" id="firstName" type="text"
              placeholder="First name" autocomplete="given-name"
              maxlength="60" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input class="form-control" id="lastName" type="text"
              placeholder="Last name" autocomplete="family-name"
              maxlength="60" required>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input class="form-control" id="phone" type="tel"
            placeholder="e.g. 08012345678" autocomplete="tel"
            inputmode="tel" maxlength="20" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input class="form-control" id="email" type="email"
            placeholder="you@example.com" autocomplete="email"
            maxlength="254" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input class="form-control password-control" id="password"
              type="password" placeholder="Create a password"
              autocomplete="new-password" minlength="6" required>
            <button class="toggle-password" type="button"
              data-target="password" aria-label="Show password">Show</button>
          </div>
          <p class="password-hint">Use at least 6 characters.</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrap">
            <input class="form-control password-control" id="confirmPassword"
              type="password" placeholder="Enter password again"
              autocomplete="new-password" minlength="6" required>
            <button class="toggle-password" type="button"
              data-target="confirmPassword" aria-label="Show confirm password">Show</button>
          </div>
        </div>

        <div class="terms-row">
          <input id="acceptTerms" type="checkbox" required>
          <label for="acceptTerms">
            I agree to the
            <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a>
            and
            <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
          </label>
        </div>

        <button class="primary-btn" id="signupButton" type="submit">
          Create My Account
        </button>
      </form>

      <div class="divider">OR SIGN UP WITH</div>

      <button class="google-btn" id="googleSignup" type="button">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
        <span>Continue with Google</span>
      </button>

      <p class="bottom-note">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
      <div class="security-note">Your account information is handled securely.</div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);
const form = $("signupForm");
const signupButton = $("signupButton");
const googleButton = $("googleSignup");
const messageBox = $("message");

let auth = null;
let db = null;
let ready = false;
let busy = false;

function showMessage(text, type = "error") {
  messageBox.textContent = text;
  messageBox.className = "message show " + type;
}

function clearMessage() {
  messageBox.textContent = "";
  messageBox.className = "message";
}

function cleanText(value) {
  return String(value || "").trim().replace(/\s+/g, " ");
}

function cleanUsername(value) {
  return cleanText(value)
    .replace(/^@+/, "")
    .replace(/[^a-zA-Z0-9_.-]/g, "")
    .slice(0, 30);
}

function referralFromUrl() {
  return (new URLSearchParams(window.location.search).get("ref") || "").trim();
}

function friendlyError(error) {
  console.error("Signup error:", error);

  const code = error && error.code ? error.code : "";
  const raw = error && error.message ? error.message : "";

  const messages = {
    "auth/email-already-in-use":
      "This email already has an account. Please sign in instead.",
    "auth/invalid-email":
      "Please enter a valid email address.",
    "auth/weak-password":
      "Choose a password with at least 6 characters.",
    "auth/operation-not-allowed":
      "Enable email/password signup in Firebase Authentication.",
    "auth/unauthorized-domain":
      "Add this website domain to Firebase Authentication's authorized domains.",
    "auth/network-request-failed":
      "Network error. Check your connection and try again.",
    "auth/too-many-requests":
      "Too many attempts. Please wait and try again.",
    "auth/popup-closed-by-user":
      "The Google sign-in window was closed.",
    "auth/popup-blocked":
      "Your browser blocked the Google sign-in window.",
    "auth/account-exists-with-different-credential":
      "An account already exists with this email. Sign in using its original method."
  };

  if (messages[code]) return messages[code];

  if (/permission.*denied/i.test(raw) || code === "permission-denied") {
    return "Firestore rejected a database operation. Check the published Firestore rules.";
  }

  return raw || "Something went wrong. Please try again.";
}

function setBusy(value) {
  busy = value;
  signupButton.disabled = value;
  googleButton.disabled = value;
  signupButton.textContent = value ? "Please wait..." : "Create My Account";
  googleButton.querySelector("span").textContent =
    value ? "Please wait..." : "Continue with Google";
}

function saveLogin(user, profile) {
  try {
    localStorage.setItem("gentleLoggedIn", "true");
    localStorage.setItem("gentleCurrentUserId", user.uid);
    localStorage.setItem("gentleUser", JSON.stringify({
      uid: user.uid,
      email: user.email || "",
      username: profile.username || "",
      firstName: profile.firstName || "",
      lastName: profile.lastName || "",
      phone: profile.phone || ""
    }));

    if (typeof profile.balance === "number") {
      localStorage.setItem("gentleBalance", String(profile.balance));
    }
  } catch (error) {
    console.warn("Could not save local login details:", error);
  }
}

function validateForm() {
  const details = {
    username: cleanUsername($("username").value),
    firstName: cleanText($("firstName").value),
    lastName: cleanText($("lastName").value),
    phone: cleanText($("phone").value),
    email: cleanText($("email").value).toLowerCase(),
    password: $("password").value,
    confirmPassword: $("confirmPassword").value
  };

  if (details.username.length < 3) {
    showMessage("Username must contain at least 3 valid characters.");
    $("username").focus();
    return null;
  }

  if (!details.firstName || !details.lastName) {
    showMessage("Enter your first and last name.");
    return null;
  }

  if (details.phone.replace(/\D/g, "").length < 7) {
    showMessage("Enter a valid phone number.");
    $("phone").focus();
    return null;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(details.email)) {
    showMessage("Enter a valid email address.");
    $("email").focus();
    return null;
  }

  if (details.password.length < 6) {
    showMessage("Password must have at least 6 characters.");
    $("password").focus();
    return null;
  }

  if (details.password !== details.confirmPassword) {
    showMessage("Your passwords do not match.");
    $("confirmPassword").focus();
    return null;
  }

  if (!$("acceptTerms").checked) {
    showMessage("Please accept the Terms of Service and Privacy Policy.");
    return null;
  }

  return details;
}

/*
 * Save referral attribution.
 *
 * IMPORTANT FIX:
 * This transaction does not read customers/{referrerId}.
 * The Firestore rules must verify the referrer's existence using
 * exists(/databases/$(database)/documents/customers/{referrerId}).
 *
 * The customer can read their own customer profile and their own
 * referral document. Referral creation must still be allowed by rules.
 */
async function saveReferral(referredUid, referrerId) {
  if (!referredUid || !referrerId || referredUid === referrerId) {
    return;
  }

  const customerRef = db.collection("customers").doc(referredUid);
  const referralRef = db.collection("referrals").doc(referredUid);

  await db.runTransaction(async transaction => {
    const customerSnap = await transaction.get(customerRef);
    const referralSnap = await transaction.get(referralRef);

    if (!customerSnap.exists) {
      throw new Error("Customer profile does not exist.");
    }

    const customer = customerSnap.data() || {};

    if (customer.referrerId !== referrerId) {
      throw new Error("Saved referral attribution does not match the link.");
    }

    if (referralSnap.exists) {
      // Do not overwrite or duplicate an existing referral.
      return;
    }

    transaction.set(referralRef, {
      referrerId: referrerId,
      referredUserId: referredUid,
      status: "pending",
      rewardAmount: 500,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  });
}

/*
 * Create a new customer profile or update ordinary profile fields.
 * Existing customers' referrerId and balance are never overwritten.
 */
async function saveCustomer(user, details, method) {
  const customerRef = db.collection("customers").doc(user.uid);
  const customerSnap = await customerRef.get();
  const isNew = !customerSnap.exists;
  const old = isNew ? {} : (customerSnap.data() || {});
  const candidateReferrer = referralFromUrl();

  let referrerId = old.referrerId || "";

  if (isNew && candidateReferrer && candidateReferrer !== user.uid) {
    referrerId = candidateReferrer;
  }

  const email = user.email || details.email || old.email || "";
  const emailPrefix = cleanUsername(
    (email.split("@")[0] || "customer").slice(0, 20)
  ) || "customer";

  const profile = {
    uid: user.uid,
    email: email,
    username: old.username || details.username ||
      (emailPrefix + "_" + user.uid.slice(0, 5)),
    firstName: old.firstName || details.firstName || "",
    lastName: old.lastName || details.lastName || "",
    phone: old.phone || details.phone || "",
    signupMethod: old.signupMethod || method,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  if (isNew) {
    profile.balance = 0;
    profile.status = "Active";
    profile.createdAt = firebase.firestore.FieldValue.serverTimestamp();

    if (referrerId) {
      profile.referrerId = referrerId;
    }

    await customerRef.set(profile);
  } else {
    await customerRef.set({
      email: profile.email,
      username: profile.username,
      firstName: profile.firstName,
      lastName: profile.lastName,
      phone: profile.phone,
      signupMethod: profile.signupMethod,
      updatedAt: profile.updatedAt
    }, { merge: true });
  }

  /*
   * Referral saving is a separate operation. A referral error must
   * not be reported as if Firebase Authentication failed.
   */
  let referralFailed = false;

  if (isNew && referrerId) {
    try {
      await saveReferral(user.uid, referrerId);
    } catch (error) {
      referralFailed = true;
      console.error("Referral record could not be saved:", error);
    }
  }

  const savedSnap = await customerRef.get();
  const savedProfile = savedSnap.exists
    ? savedSnap.data()
    : profile;

  saveLogin(user, savedProfile);

  return {
    profile: savedProfile,
    referralFailed: referralFailed
  };
}

async function finishSignup(user, details, method) {
  let result;

  try {
    result = await saveCustomer(user, details, method);
  } catch (error) {
    console.error("Customer profile save failed:", error);

    showMessage(
      "Your authentication succeeded, but the customer profile could not be saved. Do not register again. " +
      friendlyError(error)
    );
    return false;
  }

  if (result.referralFailed) {
    showMessage(
      "Your account was created, but its referral record could not be saved. The referral needs to be checked and repaired. You can continue to your account.",
      "info"
    );

    setTimeout(() => {
      window.location.replace("dashboard.html");
    }, 2500);

    return true;
  }

  showMessage("Your account is ready. Redirecting...", "success");

  setTimeout(() => {
    window.location.replace("dashboard.html");
  }, 900);

  return true;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  clearMessage();

  if (busy) return;

  if (!ready) {
    showMessage("Firebase is not ready. Check that firebase.js loads correctly.");
    return;
  }

  const details = validateForm();
  if (!details) return;

  setBusy(true);

  let authenticatedUser = null;

  try {
    const credential = await auth.createUserWithEmailAndPassword(
      details.email,
      details.password
    );

    authenticatedUser = credential.user;

    await finishSignup(authenticatedUser, details, "email");
  } catch (error) {
    if (authenticatedUser) {
      showMessage(
        "Your account was created, but a later operation failed. Do not register again. " +
        friendlyError(error)
      );
    } else {
      showMessage(friendlyError(error));
    }
  } finally {
    setBusy(false);
  }
});

function googleNameParts(user) {
  const parts = cleanText(user.displayName).split(" ").filter(Boolean);

  return {
    firstName: parts[0] || "",
    lastName: parts.slice(1).join(" ")
  };
}

googleButton.addEventListener("click", async function() {
  clearMessage();

  if (busy) return;

  if (!ready) {
    showMessage("Firebase is not ready. Check that firebase.js loads correctly.");
    return;
  }

  if (!$("acceptTerms").checked) {
    showMessage("Please accept the Terms of Service and Privacy Policy.");
    return;
  }

  setBusy(true);

  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const credential = await auth.signInWithPopup(provider);
    const user = credential.user;

    if (!user) {
      throw new Error("Google sign-in did not return a user.");
    }

    const names = googleNameParts(user);
    const emailPrefix = cleanUsername(
      (user.email || "customer").split("@")[0]
    ) || "customer";

    const details = {
      username: cleanUsername($("username").value) ||
        (emailPrefix + "_" + user.uid.slice(0, 5)),
      firstName: cleanText($("firstName").value) || names.firstName,
      lastName: cleanText($("lastName").value) || names.lastName,
      phone: cleanText($("phone").value),
      email: user.email || ""
    };

    await finishSignup(user, details, "google");
  } catch (error) {
    showMessage(friendlyError(error));
  } finally {
    setBusy(false);
  }
});

document.querySelectorAll(".toggle-password").forEach(button => {
  button.addEventListener("click", function() {
    const input = $(this.dataset.target);
    const show = input.type === "password";

    input.type = show ? "text" : "password";
    this.textContent = show ? "Hide" : "Show";
    this.setAttribute(
      "aria-label",
      show ? "Hide password" : "Show password"
    );
  });
});

$("username").addEventListener("input", function() {
  this.value = cleanUsername(this.value);
});

try {
  if (
    typeof firebase === "undefined" ||
    !firebase.apps ||
    firebase.apps.length === 0
  ) {
    throw new Error("Firebase app has not been initialized.");
  }

  auth = window.firebaseAuth || firebase.auth();
  db = window.firebaseDB || firebase.firestore();

  if (!auth || !db) {
    throw new Error("Firebase Auth or Firestore is unavailable.");
  }

  ready = true;
} catch (error) {
  console.error("Firebase initialization error:", error);
  showMessage("Signup service could not start. Check your firebase.js configuration.");
}
})();
