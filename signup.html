<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Gentle Acct Store</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5f9ff;
  color:#10213b;
}

header{
  height:70px;
  background:white;
  border-bottom:1px solid #e3eaf3;
}

.nav{
  height:100%;
  max-width:1100px;
  margin:auto;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  color:#10213b;
  font-size:17px;
  font-weight:800;
  text-decoration:none;
}

.logo-box{
  width:38px;
  height:38px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1264e8;
  color:white;
  font-size:18px;
  font-weight:900;
}

.logo span{
  color:#1264e8;
}

.back{
  text-decoration:none;
  color:#1264e8;
  background:#f0f6ff;
  padding:9px 13px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}

.page{
  min-height:calc(100vh - 70px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:35px 16px;
}

.card{
  width:100%;
  max-width:450px;
  background:white;
  border:1px solid #e1e8f2;
  border-radius:22px;
  padding:32px 24px;
  box-shadow:0 18px 50px rgba(20,50,90,.08);
}

.icon{
  width:55px;
  height:55px;
  margin:0 auto 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eaf3ff;
  color:#1264e8;
  border-radius:16px;
  font-size:21px;
}

.title{
  text-align:center;
}

.title h1{
  font-size:27px;
  color:#0b1d35;
}

.title p{
  margin-top:9px;
  color:#718096;
  font-size:13px;
  line-height:1.6;
}

.test{
  margin-top:15px;
  padding:8px;
  text-align:center;
  border-radius:8px;
  background:#fff8df;
  border:1px solid #f0df9a;
  color:#725b00;
  font-size:10px;
  font-weight:800;
}

form{
  margin-top:25px;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  font-weight:800;
  color:#243650;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#7f91aa;
  font-size:13px;
}

input{
  width:100%;
  height:49px;
  border:1px solid #dbe4ef;
  border-radius:11px;
  padding:0 14px 0 40px;
  outline:none;
  font-size:14px;
  color:#10213b;
  background:#fbfdff;
}

input:focus{
  border-color:#1264e8;
  box-shadow:0 0 0 3px rgba(18,100,232,.08);
}

button{
  width:100%;
  height:50px;
  border:0;
  border-radius:11px;
  background:#1264e8;
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.65;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  font-size:12px;
  line-height:1.6;
  text-align:center;
  word-break:break-word;
}

.error{
  display:block;
  background:#fff0f0;
  border:1px solid #f3d1d1;
  color:#c53030;
}

.success{
  display:block;
  background:#effaf3;
  border:1px solid #ccebd7;
  color:#237a43;
}

.bottom{
  text-align:center;
  margin-top:22px;
  color:#718096;
  font-size:12px;
}

.bottom a{
  color:#1264e8;
  font-weight:800;
  text-decoration:none;
}

@media(max-width:450px){
  .card{
    padding:29px 19px;
  }
}
</style>
</head>

<body>

<header>
<nav class="nav">

<a href="index.html" class="logo">
  <div class="logo-box">G</div>
  Gentle <span>Acct</span> Store
</a>

<a href="login.html" class="back">
  <i class="fa-solid fa-arrow-left"></i>
  Sign In
</a>

</nav>
</header>

<main class="page">

<div class="card">

<div class="title">

<div class="icon">
<i class="fa-solid fa-user-plus"></i>
</div>

<h1>Create Account</h1>

<p>
Create your Gentle Acct Store customer account.
</p>

</div>

<div class="test">
SIGNUP CONNECTION TEST — VERSION 2
</div>

<form id="signupForm">

<div class="field">

<label>Full Name</label>

<div class="input-wrap">

<i class="fa-solid fa-user input-icon"></i>

<input
id="fullName"
type="text"
placeholder="Enter your full name"
required
>

</div>
</div>

<div class="field">

<label>Email Address</label>

<div class="input-wrap">

<i class="fa-solid fa-envelope input-icon"></i>

<input
id="email"
type="email"
placeholder="Enter your email"
required
>

</div>
</div>

<div class="field">

<label>Password</label>

<div class="input-wrap">

<i class="fa-solid fa-lock input-icon"></i>

<input
id="password"
type="password"
placeholder="Create a password"
minlength="6"
required
>

</div>
</div>

<div class="field">

<label>Confirm Password</label>

<div class="input-wrap">

<i class="fa-solid fa-lock input-icon"></i>

<input
id="confirmPassword"
type="password"
placeholder="Confirm your password"
minlength="6"
required
>

</div>
</div>

<button type="submit" id="signupBtn">
<i class="fa-solid fa-user-plus"></i>
Create Account
</button>

<div id="message" class="message"></div>

</form>

<div class="bottom">
Already have an account?
<a href="login.html">Sign In</a>
</div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://fbeibzungcyhcgmidpw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_6eVFrykVcHc6OQOcPhH3Fg_WQbAe7u3";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form =
document.getElementById("signupForm");

const button =
document.getElementById("signupBtn");

const message =
document.getElementById("message");

function showMessage(text,type){

  message.className =
  "message " + type;

  message.style.display =
  "block";

  message.innerHTML =
  text;

}

form.addEventListener("submit",async function(e){

  e.preventDefault();

  const name =
  document.getElementById("fullName").value.trim();

  const email =
  document.getElementById("email").value.trim().toLowerCase();

  const password =
  document.getElementById("password").value;

  const confirm =
  document.getElementById("confirmPassword").value;

  if(password !== confirm){

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }

  button.disabled = true;

  button.innerHTML =
  '<i class="fa-solid fa-spinner fa-spin"></i> Testing Connection...';

  showMessage(
    "Connecting to Supabase...",
    "success"
  );

  try{

    const result =
    await client.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          full_name:name
        },

        emailRedirectTo:
        window.location.origin +
        "/gentle-acct-store/login.html"
      }

    });

    console.log("SUPABASE RESULT:",result);

    if(result.error){

      throw result.error;

    }

    showMessage(
      '<i class="fa-solid fa-circle-check"></i> ' +
      'Account request successful. Check your email to confirm your account.',
      "success"
    );

    form.reset();

  }

  catch(error){

    console.error(
      "SIGNUP ERROR:",
      error
    );

    showMessage(
      '<strong>SUPABASE ERROR</strong><br>' +
      (error.message || String(error)),
      "error"
    );

  }

  finally{

    button.disabled = false;

    button.innerHTML =
    '<i class="fa-solid fa-user-plus"></i> Create Account';

  }

});

</script>

</body>
</html>
