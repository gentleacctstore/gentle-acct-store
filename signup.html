
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E87535">
<meta name="description" content="Create your Gentle acct store account and access our digital marketplace.">

<title>Create Account | Gentle acct store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --orange: #E87535;
  --orange-dark: #C96532;
  --orange-light: #FFF1E8;
  --orange-border: #F0DED2;
  --text: #252A30;
  --muted: #85817E;
  --white: #FFFFFF;
  --background: #FFFCFA;
  --green: #27834B;
  --green-light: #EAF5EC;
  --red: #B42318;
  --red-light: #FFF0EE;
  --shadow: 0 22px 60px rgba(92,52,29,.09);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
  background: var(--background);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  padding: 30px 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  font-family: "Space Grotesk", sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 8% 8%, rgba(232,117,53,.12), transparent 36%),
    radial-gradient(ellipse at 92% 92%, rgba(201,101,50,.09), transparent 34%),
    linear-gradient(145deg,#FFF8F3,#FFFFFF 52%,#FFF5EF);
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

.page-wrapper {
  width: 100%;
  max-width: 455px;
  margin: auto;
  animation: pageEnter .5s ease both;
}

@keyframes pageEnter {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* BRAND */

.brand-header {
  text-align: center;
  margin-bottom: 23px;
}

.brand-mark {
  width: 52px;
  height: 52px;
  margin: 0 auto 10px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  color: #FFFFFF;
  font-size: 23px;
  font-weight: 700;
  letter-spacing: -2px;
  background: linear-gradient(145deg,#F08A4B,#C96532);
  box-shadow: 0 10px 24px rgba(232,117,53,.22);
}

.brand-name {
  color: #252A30;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -1px;
}

.brand-name span {
  color: var(--orange);
}

.brand-caption {
  margin-top: 5px;
  color: #96908A;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.8px;
}

/* AUTH CARD */

.auth-card {
  overflow: hidden;
  border: 1px solid var(--orange-border);
  border-radius: 21px;
  background: #FFFFFF;
  box-shadow: var(--shadow);
}

.card-top {
  height: 4px;
  background: linear-gradient(90deg,#C96532,#E87535,#F5B080);
}

.auth-content {
  padding: 26px 25px 25px;
}

/* TABS */

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 5px;
  margin-bottom: 25px;
  border: 1px solid #F4E5DB;
  border-radius: 12px;
  background: #FFF6F0;
}

.auth-tab {
  min-height: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  color: #85817E;
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  transition: .2s ease;
}

.auth-tab:hover {
  color: var(--orange-dark);
}

.auth-tab.active {
  color: var(--orange-dark);
  background: #FFFFFF;
  box-shadow: 0 2px 8px rgba(201,101,50,.10);
}

/* HEADING */

.heading {
  color: var(--text);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -.8px;
}

.subtitle {
  margin-top: 8px;
  margin-bottom: 23px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.75;
}

/* FORM */

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.form-group {
  min-width: 0;
  margin-bottom: 16px;
}

.form-group > label {
  display: block;
  margin-bottom: 7px;
  color: #45413E;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .65px;
  text-transform: uppercase;
}

.form-control {
  width: 100%;
  height: 49px;
  padding: 0 13px;
  border: 1px solid #E9E1DC;
  border-radius: 11px;
  outline: none;
  background: #FFFEFD;
  color: #252A30;
  font-size: 14px;
  transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

.form-control::placeholder {
  color: #AAA29C;
}

.form-control:focus {
  border-color: var(--orange);
  background: #FFFFFF;
  box-shadow: 0 0 0 4px rgba(232,117,53,.12);
}

.password-wrap {
  position: relative;
}

.password-control {
  padding-right: 65px;
}

.toggle-password {
  position: absolute;
  top: 50%;
  right: 6px;
  min-width: 45px;
  height: 34px;
  padding: 0 7px;
  transform: translateY(-50%);
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #85817E;
  font-size: 11px;
  font-weight: 700;
  transition: .2s ease;
}

.toggle-password:hover {
  background: var(--orange-light);
  color: var(--orange-dark);
}

.password-hint {
  margin-top: 7px;
  color: #96908A;
  font-size: 10px;
}

/* TERMS */

.terms-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 3px 0 19px;
}

.terms-row input {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 3px;
  accent-color: var(--orange);
  cursor: pointer;
}

.terms-row label {
  color: #77716C;
  font-size: 10.5px;
  line-height: 1.8;
}

.terms-row a,
.bottom-note a {
  color: var(--orange-dark);
  font-weight: 700;
  text-decoration: none;
}

.terms-row a:hover,
.bottom-note a:hover {
  text-decoration: underline;
}

/* BUTTONS */

.primary-btn,
.google-btn {
  width: 100%;
  min-height: 49px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 11px;
  font-size: 12.5px;
  font-weight: 700;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.primary-btn {
  border: 0;
  color: #FFFFFF;
  background: linear-gradient(105deg,#C96532,#E87535 65%,#F08A4B);
  box-shadow: 0 9px 22px rgba(201,101,50,.20);
}

.primary-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  background: linear-gradient(105deg,#B4552A,#D96B34 65%,#E87535);
  box-shadow: 0 12px 26px rgba(201,101,50,.25);
}

.primary-btn:active:not(:disabled) {
  transform: translateY(0);
}

.primary-btn:disabled,
.google-btn:disabled {
  opacity: .65;
  cursor: wait;
  transform: none;
  box-shadow: none;
}

.google-btn {
  border: 1px solid #E9E1DC;
  color: #37332F;
  background: #FFFFFF;
}

.google-btn:hover:not(:disabled) {
  border-color: #E8B99C;
  background: #FFFAF6;
}

.google-btn img {
  width: 19px;
  height: 19px;
}

/* DIVIDER */

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0 17px;
  color: #A39A93;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .9px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #EFE7E1;
}

/* FOOTER */

.bottom-note {
  margin-top: 21px;
  color: #85817E;
  text-align: center;
  font-size: 11px;
  line-height: 1.8;
}

.security-note {
  margin-top: 15px;
  color: #96908A;
  text-align: center;
  font-size: 10px;
}

/* TOAST NOTIFICATIONS */

.toast-container {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  right: 18px;
  z-index: 99999;
  width: min(370px, calc(100% - 36px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  overflow: hidden;
  border: 1px solid #F0DED2;
  border-radius: 14px;
  background: #FFFFFF;
  box-shadow: 0 12px 35px rgba(45,35,27,.13);
  pointer-events: auto;
  animation: toastIn .35s ease both;
}

.toast-icon {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #EAF5EC;
  color: #27834B;
  font-size: 19px;
  font-weight: 700;
}

.toast.error .toast-icon {
  background: #FFF0EE;
  color: #B42318;
}

.toast.info .toast-icon {
  background: #FFF1E8;
  color: #C96532;
}

.toast-content {
  flex: 1;
  min-width: 0;
}

.toast-title {
  color: #252A30;
  font-size: 12px;
  font-weight: 700;
}

.toast-description {
  margin-top: 4px;
  color: #85817E;
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.toast-close {
  width: 27px;
  height: 27px;
  flex-shrink: 0;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #999999;
  font-size: 19px;
  line-height: 1;
}

.toast-close:hover {
  background: #FFF1E8;
  color: #C96532;
}

.toast-progress {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 3px;
  background: #E87535;
  transform-origin: left;
  animation: toastProgress 4s linear forwards;
}

.toast.error .toast-progress {
  background: #D64545;
}

.toast.info .toast-progress {
  background: #E87535;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateX(25px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes toastOut {
  to {
    opacity: 0;
    transform: translateX(25px);
  }
}

@keyframes toastProgress {
  to {
    transform: scaleX(0);
  }
}

/* RESPONSIVE */

@media(max-width:600px) {
  body {
    padding: 24px 14px;
  }

  .brand-header {
    margin-bottom: 20px;
  }

  .auth-content {
    padding: 23px 20px 22px;
  }

  .heading {
    font-size: 24px;
  }

  .toast-container {
    top: max(12px, env(safe-area-inset-top));
    right: 12px;
    width: calc(100% - 24px);
  }
}

@media(max-width:390px) {
  body {
    padding: 19px 11px;
  }

  .brand-header {
    margin-bottom: 17px;
  }

  .auth-content {
    padding: 21px 16px 20px;
  }

  .auth-card {
    border-radius: 17px;
  }

  .form-row {
    gap: 8px;
  }

  .heading {
    font-size: 23px;
  }
}

/* iOS INPUT ZOOM PREVENTION */

@media(max-width:767px) {
  input,
  textarea,
  select,
  .form-control {
    font-size: 16px !important;
  }
}

/* ACCESSIBILITY */

:focus-visible {
  outline: 3px solid rgba(232,117,53,.28);
  outline-offset: 3px;
}

@media(prefers-reduced-motion:reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- GLOBAL TOAST CONTAINER -->

<div
  class="toast-container"
  id="toastContainer"
  aria-live="polite"
  aria-atomic="false"
></div>

<main class="page-wrapper">

  <header class="brand-header">
    <div class="brand-mark" aria-label="Gentle acct store logo">G.</div>
    <div class="brand-name">Gentle<span>Logs</span></div>
    <p class="brand-caption">SOCIAL MEDIA LOGS MARKETPLACE</p>
  </header>

  <section class="auth-card">

    <div class="card-top"></div>

    <div class="auth-content">

      <nav class="auth-tabs" aria-label="Account pages">
        <a class="auth-tab active" href="signup.html" aria-current="page">
          Create Account
        </a>

        <a class="auth-tab" href="login.html">
          Sign In
        </a>
      </nav>

      <h1 class="heading">Create your account</h1>

      <p class="subtitle">
        Join Gentle acct store and get started in just a few simple steps.
      </p>

      <form id="signupForm" novalidate>

        <div class="form-group">
          <label for="username">Username</label>

          <input
            class="form-control"
            id="username"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            maxlength="30"
            required
          >
        </div>

        <div class="form-row">

          <div class="form-group">
            <label for="firstName">First Name</label>

            <input
              class="form-control"
              id="firstName"
              type="text"
              placeholder="First name"
              autocomplete="given-name"
              maxlength="60"
              required
            >
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>

            <input
              class="form-control"
              id="lastName"
              type="text"
              placeholder="Last name"
              autocomplete="family-name"
              maxlength="60"
              required
            >
          </div>

        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>

          <input
            class="form-control"
            id="phone"
            type="tel"
            placeholder="e.g. 08012345678"
            autocomplete="tel"
            inputmode="tel"
            maxlength="20"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            class="form-control"
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              class="form-control password-control"
              id="password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              class="toggle-password"
              type="button"
              data-target="password"
              aria-label="Show password"
            >
              Show
            </button>
          </div>

          <p class="password-hint">
            Use at least 6 characters.
          </p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="password-wrap">
            <input
              class="form-control password-control"
              id="confirmPassword"
              type="password"
              placeholder="Enter password again"
              autocomplete="new-password"
              minlength="6"
              required
            >

            <button
              class="toggle-password"
              type="button"
              data-target="confirmPassword"
              aria-label="Show confirm password"
            >
              Show
            </button>
          </div>
        </div>

        <div class="terms-row">

          <input
            id="acceptTerms"
            type="checkbox"
            required
          >

          <label for="acceptTerms">
            I agree to the
            <a href="terms.html" target="_blank" rel="noopener">
              Terms of Service
            </a>
            and
            <a href="privacy.html" target="_blank" rel="noopener">
              Privacy Policy
            </a>.
          </label>

        </div>

        <button
          class="primary-btn"
          id="signupButton"
          type="submit"
        >
          Create My Account
        </button>

      </form>

      <div class="divider">OR SIGN UP WITH</div>

      <button
        class="google-btn"
        id="googleSignup"
        type="button"
      >
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt=""
        >
        <span>Continue with Google</span>
      </button>

      <p class="bottom-note">
        Already have an account?
        <a href="login.html">Sign in here</a>
      </p>

      <div class="security-note">
        Your account information is handled securely.
      </div>

    </div>
  </section>

</main>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script>
(function() {
"use strict";

const $ = id => document.getElementById(id);

const form = $("signupForm");
const signupButton = $("signupButton");
const googleButton = $("googleSignup");

let auth = null;
let db = null;
let ready = false;
let busy = false;

/* =========================================
   GENTLELOGS TOAST NOTIFICATION SYSTEM
   ========================================= */

function showToast(title, description, type = "success", duration = 4000) {

  const container = $("toastContainer");

  if (!container) return;

  const toast = document.createElement("div");
  toast.className = "toast " + type;

  const iconBox = document.createElement("div");
  iconBox.className = "toast-icon";

  iconBox.textContent =
    type === "success" ? "✓" :
    type === "error" ? "!" : "i";

  const content = document.createElement("div");
  content.className = "toast-content";

  const heading = document.createElement("div");
  heading.className = "toast-title";
  heading.textContent = title;

  const descriptionBox = document.createElement("div");
  descriptionBox.className = "toast-description";
  descriptionBox.textContent = description;

  content.append(heading, descriptionBox);

  const close = document.createElement("button");
  close.className = "toast-close";
  close.type = "button";
  close.textContent = "×";
  close.setAttribute("aria-label", "Close notification");

  const progress = document.createElement("div");
  progress.className = "toast-progress";

  toast.append(iconBox, content, close, progress);
  container.appendChild(toast);

  let removed = false;

  const timer = setTimeout(removeToast, duration);

  function removeToast() {

    if (removed) return;

    removed = true;
    clearTimeout(timer);

    toast.style.animation = "toastOut .25s ease forwards";

    setTimeout(() => {
      toast.remove();
    }, 260);
  }

  close.addEventListener("click", removeToast);

  return removeToast;
}

/* All signup feedback uses the top notification system. */

function showMessage(text, type = "error") {

  const title =
    type === "success" ? "Success!" :
    type === "info" ? "Please note" :
    "Something needs attention";

  showToast(title, text, type);
}

function clearMessage() {
  // Toasts disappear automatically or can be closed manually.
}

/* TEXT CLEANUP */

function cleanText(value) {
  return String(value || "")
    .trim()
    .replace(/\s+/g, " ");
}

function cleanUsername(value) {
  return cleanText(value)
    .replace(/^@+/, "")
    .replace(/[^a-zA-Z0-9_.-]/g, "")
    .slice(0, 30);
}

function referralFromUrl() {
  return (
    new URLSearchParams(window.location.search).get("ref") || ""
  ).trim();
}

/* FIREBASE ERROR MESSAGES */

function friendlyError(error) {

  console.error("Signup error:", error);

  const code = error && error.code ? error.code : "";
  const raw = error && error.message ? error.message : "";

  const messages = {

    "auth/email-already-in-use":
      "This email already has an account. Please sign in instead.",

    "auth/invalid-email":
      "Please enter a valid email address.",

    "auth/weak-password":
      "Choose a password with at least 6 characters.",

    "auth/operation-not-allowed":
      "Enable email/password signup in Firebase Authentication.",

    "auth/unauthorized-domain":
      "Add this website domain to Firebase Authentication's authorized domains.",

    "auth/network-request-failed":
      "Network error. Check your connection and try again.",

    "auth/too-many-requests":
      "Too many attempts. Please wait and try again.",

    "auth/popup-closed-by-user":
      "The Google sign-in window was closed.",

    "auth/popup-blocked":
      "Your browser blocked the Google sign-in window.",

    "auth/account-exists-with-different-credential":
      "An account already exists with this email. Sign in using its original method."

  };

  if (messages[code]) {
    return messages[code];
  }

  if (
    /permission.*denied/i.test(raw) ||
    code === "permission-denied"
  ) {
    return "Firestore rejected a database operation. Check the published Firestore rules.";
  }

  return raw || "Something went wrong. Please try again.";
}

/* BUTTON LOADING STATES */

function setBusy(value) {

  busy = value;

  signupButton.disabled = value;
  googleButton.disabled = value;

  signupButton.textContent = value
    ? "Please wait..."
    : "Create My Account";

  googleButton.querySelector("span").textContent = value
    ? "Please wait..."
    : "Continue with Google";
}

/* SAVE CUSTOMER SESSION */

function saveLogin(user, profile) {

  try {

    localStorage.setItem("gentleLoggedIn", "true");

    localStorage.setItem(
      "gentleCurrentUserId",
      user.uid
    );

    localStorage.setItem(
      "gentleUser",
      JSON.stringify({
        uid: user.uid,
        email: user.email || "",
        username: profile.username || "",
        firstName: profile.firstName || "",
        lastName: profile.lastName || "",
        phone: profile.phone || ""
      })
    );

    if (typeof profile.balance === "number") {

      localStorage.setItem(
        "gentleBalance",
        String(profile.balance)
      );

    }

  } catch (error) {

    console.warn(
      "Could not save local login details:",
      error
    );

  }
}

/* FORM VALIDATION */

function validateForm() {

  const details = {

    username: cleanUsername($("username").value),

    firstName: cleanText($("firstName").value),

    lastName: cleanText($("lastName").value),

    phone: cleanText($("phone").value),

    email: cleanText($("email").value).toLowerCase(),

    password: $("password").value,

    confirmPassword: $("confirmPassword").value

  };

  if (details.username.length < 3) {

    showMessage(
      "Username must contain at least 3 valid characters."
    );

    $("username").focus();
    return null;
  }

  if (!details.firstName || !details.lastName) {

    showMessage("Enter your first and last name.");
    return null;
  }

  if (details.phone.replace(/\D/g, "").length < 7) {

    showMessage("Enter a valid phone number.");

    $("phone").focus();
    return null;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(details.email)) {

    showMessage("Enter a valid email address.");

    $("email").focus();
    return null;
  }

  if (details.password.length < 6) {

    showMessage(
      "Password must have at least 6 characters."
    );

    $("password").focus();
    return null;
  }

  if (details.password !== details.confirmPassword) {

    showMessage("Your passwords do not match.");

    $("confirmPassword").focus();
    return null;
  }

  if (!$("acceptTerms").checked) {

    showMessage(
      "Please accept the Terms of Service and Privacy Policy."
    );

    return null;
  }

  return details;
}

/* REFERRAL ATTRIBUTION */

async function saveReferral(referredUid, referrerId) {

  if (
    !referredUid ||
    !referrerId ||
    referredUid === referrerId
  ) {
    return;
  }

  const customerRef = db
    .collection("customers")
    .doc(referredUid);

  const referralRef = db
    .collection("referrals")
    .doc(referredUid);

  await db.runTransaction(async transaction => {

    const customerSnap = await transaction.get(customerRef);

    const referralSnap = await transaction.get(referralRef);

    if (!customerSnap.exists) {

      throw new Error(
        "Customer profile does not exist."
      );

    }

    const customer = customerSnap.data() || {};

    if (customer.referrerId !== referrerId) {

      throw new Error(
        "Saved referral attribution does not match the link."
      );

    }

    if (referralSnap.exists) {
      return;
    }

    transaction.set(referralRef, {

      referrerId: referrerId,

      referredUserId: referredUid,

      status: "pending",

      rewardAmount: 500,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  });

}

/* CREATE OR UPDATE CUSTOMER PROFILE */

async function saveCustomer(user, details, method) {

  const customerRef = db
    .collection("customers")
    .doc(user.uid);

  const customerSnap = await customerRef.get();

  const isNew = !customerSnap.exists;

  const old = isNew
    ? {}
    : (customerSnap.data() || {});

  const candidateReferrer = referralFromUrl();

  let referrerId = old.referrerId || "";

  if (
    isNew &&
    candidateReferrer &&
    candidateReferrer !== user.uid
  ) {

    referrerId = candidateReferrer;

  }

  const email =
    user.email ||
    details.email ||
    old.email ||
    "";

  const emailPrefix = cleanUsername(
    (email.split("@")[0] || "customer").slice(0, 20)
  ) || "customer";

  const profile = {

    uid: user.uid,

    email: email,

    username:
      old.username ||
      details.username ||
      (emailPrefix + "_" + user.uid.slice(0, 5)),

    firstName:
      old.firstName ||
      details.firstName ||
      "",

    lastName:
      old.lastName ||
      details.lastName ||
      "",

    phone:
      old.phone ||
      details.phone ||
      "",

    signupMethod:
      old.signupMethod ||
      method,

    updatedAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };

  if (isNew) {

    profile.balance = 0;

    profile.status = "Active";

    profile.createdAt =
      firebase.firestore.FieldValue.serverTimestamp();

    if (referrerId) {
      profile.referrerId = referrerId;
    }

    await customerRef.set(profile);

  } else {

    await customerRef.set({

      email: profile.email,

      username: profile.username,

      firstName: profile.firstName,

      lastName: profile.lastName,

      phone: profile.phone,

      signupMethod: profile.signupMethod,

      updatedAt: profile.updatedAt

    }, {
      merge: true
    });

  }

  let referralFailed = false;

  if (isNew && referrerId) {

    try {

      await saveReferral(user.uid, referrerId);

    } catch (error) {

      referralFailed = true;

      console.error(
        "Referral record could not be saved:",
        error
      );

    }

  }

  const savedSnap = await customerRef.get();

  const savedProfile = savedSnap.exists
    ? savedSnap.data()
    : profile;

  saveLogin(user, savedProfile);

  return {
    profile: savedProfile,
    referralFailed: referralFailed
  };

}

/* FINISH SIGNUP */

async function finishSignup(user, details, method) {

  let result;

  try {

    result = await saveCustomer(
      user,
      details,
      method
    );

  } catch (error) {

    console.error(
      "Customer profile save failed:",
      error
    );

    showMessage(
      "Your authentication succeeded, but the customer profile could not be saved. Do not register again. " +
      friendlyError(error)
    );

    return false;
  }

  if (result.referralFailed) {

    showToast(
      "Account created successfully!",
      "Welcome to Gentle acct store. Your referral record needs attention.",
      "info",
      5000
    );

    setTimeout(() => {

      window.location.replace("dashboard.html");

    }, 2500);

    return true;
  }

  showToast(
    "Account created successfully!",
    "Welcome to Gentle acct store. Your account is ready.",
    "success",
    4000
  );

  setTimeout(() => {

    window.location.replace("dashboard.html");

  }, 1500);

  return true;
}

/* EMAIL AND PASSWORD SIGNUP */

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  clearMessage();

  if (busy) return;

  if (!ready) {

    showMessage(
      "Firebase is not ready. Check that firebase.js loads correctly."
    );

    return;
  }

  const details = validateForm();

  if (!details) return;

  setBusy(true);

  let authenticatedUser = null;

  try {

    const credential =
      await auth.createUserWithEmailAndPassword(
        details.email,
        details.password
      );

    authenticatedUser = credential.user;

    await finishSignup(
      authenticatedUser,
      details,
      "email"
    );

  } catch (error) {

    if (authenticatedUser) {

      showMessage(
        "Your account was created, but a later operation failed. Do not register again. " +
        friendlyError(error)
      );

    } else {

      showMessage(friendlyError(error));

    }

  } finally {

    setBusy(false);

  }

});

/* GOOGLE SIGNUP */

function googleNameParts(user) {

  const parts = cleanText(user.displayName)
    .split(" ")
    .filter(Boolean);

  return {
    firstName: parts[0] || "",
    lastName: parts.slice(1).join(" ")
  };

}

googleButton.addEventListener("click", async function() {

  clearMessage();

  if (busy) return;

  if (!ready) {

    showMessage(
      "Firebase is not ready. Check that firebase.js loads correctly."
    );

    return;
  }

  if (!$("acceptTerms").checked) {

    showMessage(
      "Please accept the Terms of Service and Privacy Policy."
    );

    return;
  }

  setBusy(true);

  try {

    const provider =
      new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });

    const credential =
      await auth.signInWithPopup(provider);

    const user = credential.user;

    if (!user) {

      throw new Error(
        "Google sign-in did not return a user."
      );

    }

    const names = googleNameParts(user);

    const emailPrefix = cleanUsername(
      (user.email || "customer").split("@")[0]
    ) || "customer";

    const details = {

      username:
        cleanUsername($("username").value) ||
        (emailPrefix + "_" + user.uid.slice(0, 5)),

      firstName:
        cleanText($("firstName").value) ||
        names.firstName,

      lastName:
        cleanText($("lastName").value) ||
        names.lastName,

      phone:
        cleanText($("phone").value),

      email:
        user.email || ""

    };

    await finishSignup(
      user,
      details,
      "google"
    );

  } catch (error) {

    showMessage(friendlyError(error));

  } finally {

    setBusy(false);

  }

});

/* SHOW AND HIDE PASSWORD */

document.querySelectorAll(".toggle-password")
  .forEach(button => {

    button.addEventListener("click", function() {

      const input = $(this.dataset.target);

      const show = input.type === "password";

      input.type = show ? "text" : "password";

      this.textContent = show ? "Hide" : "Show";

      this.setAttribute(
        "aria-label",
        show ? "Hide password" : "Show password"
      );

    });

  });

/* CLEAN USERNAME WHILE TYPING */

$("username").addEventListener("input", function() {

  const cleaned = cleanUsername(this.value);

  if (this.value !== cleaned) {
    this.value = cleaned;
  }

});

/* FIREBASE INITIALIZATION */

try {

  if (
    typeof firebase === "undefined" ||
    !firebase.apps ||
    firebase.apps.length === 0
  ) {

    throw new Error(
      "Firebase app has not been initialized."
    );

  }

  auth =
    window.firebaseAuth ||
    firebase.auth();

  db =
    window.firebaseDB ||
    firebase.firestore();

  if (!auth || !db) {

    throw new Error(
      "Firebase Auth or Firestore is unavailable."
    );

  }

  ready = true;

} catch (error) {

  console.error(
    "Firebase initialization error:",
    error
  );

  showMessage(
    "Signup service could not start. Check your firebase.js configuration."
  );

}

})();
